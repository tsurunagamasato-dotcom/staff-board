<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナカシマ 工場現況モニター</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #222535;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8eaf0;
    --text2: #8b90a8;
    --accent: #4f8ef7;
    --accent2: #3a6fd8;
    --green: #2ec97d;
    --amber: #f5a623;
    --red: #e85555;
    --radius: 10px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  .header-title { font-size: 16px; font-weight: 600; letter-spacing: 0.3px; }
  .header-sub { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .tab-bar {
    display: flex;
    gap: 4px;
    padding: 12px 24px 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 9px 20px;
    border-radius: var(--radius) var(--radius) 0 0;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    background: transparent; color: var(--text2);
    border: 1px solid transparent; border-bottom: none;
    transition: all 0.18s;
    position: relative; bottom: -1px;
    display: flex; align-items: center; gap: 8px;
  }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { color: var(--text); background: var(--bg); border-color: var(--border); border-bottom-color: var(--bg); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .tab.tab-history .dot { background: var(--text2); }

  main { display: flex; height: calc(100vh - 101px); }

  .sidebar {
    width: 290px; min-width: 290px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto; overflow-x: hidden;
  }
  .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-label {
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--text2); margin-bottom: 10px;
  }

  .input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .field-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text); font-size: 13px;
    outline: none; width: 100%;
  }
  .field-input:focus { border-color: var(--accent); }
  .field-input.token-field { font-family: monospace; font-size: 11px; letter-spacing: 0.5px; }
  .field-hint { font-size: 11px; color: var(--text2); line-height: 1.7; margin-top: 4px; }

  .token-status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 3px 8px;
    border-radius: 20px; margin-top: 6px;
  }
  .token-status.ok { background: rgba(46,201,125,0.15); color: var(--green); }
  .token-status.ng { background: rgba(232,85,85,0.15); color: var(--red); }
  .token-status.none { background: rgba(139,144,168,0.15); color: var(--text2); }

  .site-select-group { display: flex; flex-direction: column; gap: 6px; }
  .site-option {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--border); transition: all 0.15s; font-size: 13px;
  }
  .site-option:hover { border-color: var(--border2); background: var(--bg3); }
  .site-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.1); }
  .site-option input[type=radio] { display: none; }
  .site-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .site-dot.honsha { background: var(--accent); }
  .site-dot.nezaki { background: var(--green); }

  .slide-controls { display: flex; flex-direction: column; gap: 10px; }
  .control-row { display: flex; align-items: center; gap: 10px; }
  .control-label { font-size: 12px; color: var(--text2); white-space: nowrap; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text);
    transition: all 0.15s; white-space: nowrap;
  }
  .btn:hover { background: var(--bg2); border-color: var(--text2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent2); }
  .btn-row { display: flex; gap: 8px; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
  }
  .status-badge.playing { background: rgba(46,201,125,0.15); color: var(--green); }
  .status-badge.paused { background: rgba(245,166,35,0.15); color: var(--amber); }
  .status-badge .blink { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .history-list { flex: 1; overflow-y: auto; padding: 8px; }
  .history-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius);
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s; margin-bottom: 4px;
  }
  .history-item:hover { background: var(--bg3); border-color: var(--border); }
  .history-item.active { background: rgba(79,142,247,0.1); border-color: var(--accent); }
  .history-thumb {
    width: 40px; height: 50px; background: var(--bg3);
    border-radius: 4px; border: 1px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .history-site {
    display: inline-block; padding: 1px 6px;
    border-radius: 4px; font-size: 10px; font-weight: 600; margin-top: 3px;
  }
  .history-site.honsha { background: rgba(79,142,247,0.2); color: #7aacf9; }
  .history-site.nezaki { background: rgba(46,201,125,0.2); color: #6ed8a8; }

  .viewer { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .viewer-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--bg2);
    border-bottom: 1px solid var(--border); min-height: 52px;
  }
  .viewer-info { display: flex; align-items: center; gap: 12px; }
  .viewer-title { font-size: 14px; font-weight: 600; }
  .viewer-date { font-size: 12px; color: var(--text2); }
  .viewer-nav { display: flex; align-items: center; gap: 8px; }
  .nav-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--border2); background: var(--bg3); color: var(--text);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.15s;
  }
  .nav-btn:hover { border-color: var(--text2); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .slide-counter { font-size: 13px; color: var(--text2); min-width: 60px; text-align: center; }

  .progress-bar { height: 2px; background: var(--border); position: relative; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.1s linear; width: 0%; }

  .pdf-container {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: auto; background: #1e2130; position: relative; padding: 24px;
  }
  #pdf-canvas {
    max-width: 100%; max-height: 100%;
    box-shadow: 0 4px 40px rgba(0,0,0,0.5);
    border-radius: 4px; display: block;
  }
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; color: var(--text2); text-align: center; pointer-events: none;
  }
  .empty-icon { font-size: 56px; opacity: 0.3; }
  .empty-title { font-size: 18px; font-weight: 500; color: var(--text); opacity: 0.5; }
  .empty-sub { font-size: 14px; opacity: 0.7; }

  .loading-overlay {
    display: none; position: absolute; inset: 0;
    background: rgba(15,17,23,0.8);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; z-index: 10;
  }
  .loading-overlay.show { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text2); }

  body.monitor-mode header,
  body.monitor-mode .tab-bar,
  body.monitor-mode .sidebar { display: none; }
  body.monitor-mode main { height: 100vh; }
  .monitor-exit { display: none; position: fixed; top: 12px; right: 12px; z-index: 999; }
  body.monitor-mode .monitor-exit { display: flex; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 12px 18px;
    font-size: 14px; z-index: 300;
    display: flex; align-items: center; gap: 10px;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s; max-width: 360px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid var(--green); }
  .toast.error { border-left: 3px solid var(--red); }
  .toast.info { border-left: 3px solid var(--accent); }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>
<body>

<button class="btn monitor-exit" onclick="exitMonitorMode()">✕ 通常表示</button>
<div class="toast" id="toast"></div>

<header>
  <div class="header-left">
    <div class="logo-mark">NIM</div>
    <div>
      <div class="header-title">工場現況モニター</div>
      <div class="header-sub" id="clock">--</div>
    </div>
  </div>
  <div class="header-right">
    <div id="slide-status" class="status-badge paused"><span class="blink"></span>停止中</div>
    <button class="btn" onclick="enterMonitorMode()">🖥 モニター表示</button>
  </div>
</header>

<div class="tab-bar">
  <button class="tab active" id="tab-viewer" onclick="switchTab('viewer')">
    <span class="dot"></span>現在の状況
  </button>
  <button class="tab tab-history" id="tab-history" onclick="switchTab('history')">
    <span class="dot"></span>履歴
  </button>
</div>

<main>
  <div class="sidebar" id="sidebar">

    <!-- Box トークン設定 -->
    <div class="sidebar-section">
      <div class="sidebar-label">Box 接続設定</div>
      <div class="field-hint" style="margin-bottom:8px;">開発者トークンを貼り付けてください（有効期限1時間）</div>
      <div class="input-row">
        <input class="field-input token-field" id="box-token" type="password" placeholder="開発者トークンを貼り付け">
        <button class="btn" onclick="saveToken()" style="padding:7px 10px;">保存</button>
      </div>
      <div id="token-status" class="token-status none">● 未設定</div>
      <div class="field-hint" style="margin-top:8px;">
        トークン切れの場合は
        <a href="https://nakashima-mfg.app.box.com/developers/console/app/2596119/configuration" target="_blank" style="color:var(--accent);">Developer Console</a>
        で再生成 → Copyして貼り直し
      </div>
    </div>

    <!-- 拠点選択 -->
    <div class="sidebar-section" id="section-site">
      <div class="sidebar-label">表示拠点</div>
      <div class="site-select-group">
        <label class="site-option selected" id="site-honsha">
          <input type="radio" name="site" value="honsha" checked onchange="siteChanged('honsha')">
          <span class="site-dot honsha"></span>本社工場
        </label>
        <label class="site-option" id="site-nezaki">
          <input type="radio" name="site" value="nezaki" onchange="siteChanged('nezaki')">
          <span class="site-dot nezaki"></span>根崎第2工場
        </label>
        <label class="site-option" id="site-all">
          <input type="radio" name="site" value="all" onchange="siteChanged('all')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;"></span>両拠点（交互）
        </label>
      </div>
    </div>

    <!-- スライドショー -->
    <div class="sidebar-section" id="section-slide">
      <div class="sidebar-label">スライドショー</div>
      <div class="slide-controls">
        <div class="control-row">
          <span class="control-label">切換え間隔</span>
          <input class="field-input" type="number" id="interval-input" value="10" min="3" max="300" style="width:70px;">
          <span class="control-label">秒</span>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="play-btn" onclick="toggleSlideshow()">▶ 開始</button>
          <button class="btn" onclick="loadBoxFiles()">↻ 更新</button>
        </div>
      </div>
    </div>

    <!-- 履歴パネル -->
    <div id="history-panel" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <div class="sidebar-section" style="border:none; padding-bottom:4px;">
        <div class="sidebar-label">過去の記録</div>
      </div>
      <div class="history-list" id="history-list">
        <div style="text-align:center;padding:24px;color:var(--text2);font-size:13px;">
          Boxから取得した履歴がここに表示されます
        </div>
      </div>
    </div>

  </div>

  <!-- Viewer -->
  <div class="viewer">
    <div class="viewer-toolbar">
      <div class="viewer-info">
        <div class="viewer-title" id="viewer-title">トークンを設定してください</div>
        <div class="viewer-date" id="viewer-date"></div>
      </div>
      <div class="viewer-nav">
        <button class="nav-btn" id="prev-btn" onclick="navigate(-1)" disabled>‹</button>
        <span class="slide-counter" id="slide-counter">—</span>
        <button class="nav-btn" id="next-btn" onclick="navigate(1)" disabled>›</button>
      </div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="pdf-container" id="pdf-container">
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loading-text">PDFを読み込み中...</div>
      </div>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📋</div>
        <div class="empty-title">工場現況PDFが未登録です</div>
        <div class="empty-sub">左側にBoxの開発者トークンを入力し<br>↻ 更新ボタンを押してください</div>
      </div>
      <canvas id="pdf-canvas" style="display:none;"></canvas>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ===== CONFIG =====
const CONFIG_KEY = 'nim_factory_config';
const FOLDER_ID  = '365908983743'; // 工場レイアウト管理フォルダ

let cfg = { token: '', interval: 10, site: 'honsha' };
let allFiles = [];
let currentFiles = [];
let currentIndex = 0;
let isPlaying = false;
let slideshowTimer = null;
let activeTab = 'viewer';

// ===== BOOT =====
document.addEventListener('DOMContentLoaded', () => {
  loadCfg();
  updateClock();
  setInterval(updateClock, 1000);
  if (cfg.token) {
    updateTokenStatus('checking');
    loadBoxFiles();
  }
});

function loadCfg() {
  try {
    const s = localStorage.getItem(CONFIG_KEY);
    if (s) cfg = { ...cfg, ...JSON.parse(s) };
  } catch(e) {}
  if (cfg.token) {
    document.getElementById('box-token').value = cfg.token;
    updateTokenStatus('ok');
  }
  document.getElementById('interval-input').value = cfg.interval || 10;
  siteChanged(cfg.site || 'honsha', false);
}
function saveCfg() { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }

function saveToken() {
  const t = document.getElementById('box-token').value.trim();
  if (!t) { showToast('トークンを入力してください', 'error'); return; }
  cfg.token = t;
  saveCfg();
  updateTokenStatus('checking');
  loadBoxFiles();
}

function updateTokenStatus(state) {
  const el = document.getElementById('token-status');
  if (state === 'ok')       { el.className = 'token-status ok';   el.textContent = '● 接続OK'; }
  else if (state === 'ng')  { el.className = 'token-status ng';   el.textContent = '● トークンエラー（期限切れ？）'; }
  else if (state === 'checking') { el.className = 'token-status none'; el.textContent = '● 確認中...'; }
  else                      { el.className = 'token-status none'; el.textContent = '● 未設定'; }
}

// ===== CLOCK =====
function updateClock() {
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'})
    + ' ' + n.toLocaleTimeString('ja-JP');
}

// ===== TAB =====
function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-viewer').classList.toggle('active', tab === 'viewer');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
  document.getElementById('history-panel').style.display = tab === 'history' ? 'flex' : 'none';
  ['section-site','section-slide'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = tab === 'history' ? 'none' : '';
  });
  if (tab === 'history') renderHistoryList();
}

// ===== SITE =====
function siteChanged(val, doLoad = true) {
  cfg.site = val;
  saveCfg();
  ['honsha','nezaki','all'].forEach(s =>
    document.getElementById(`site-${s}`)?.classList.toggle('selected', s === val));
  if (doLoad) filterAndDisplay();
}

// ===== BOX API =====
const BOX_API = 'https://api.box.com/2.0';

async function boxGet(path) {
  const res = await fetch(`${BOX_API}${path}`, {
    headers: { 'Authorization': `Bearer ${cfg.token}` }
  });
  if (res.status === 401) throw new Error('AUTH');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadBoxFiles() {
  if (!cfg.token) { showToast('トークンを設定してください', 'error'); return; }
  showLoading('Boxからファイル一覧を取得中...');

  try {
    // ルートフォルダのファイルを取得
    const data = await boxGet(`/folders/${FOLDER_ID}/items?fields=id,name,type,modified_at,size&limit=100`);
    const files = (data.entries || []).filter(e => e.type === 'file' && e.name.endsWith('.pdf'));

    // サブフォルダ（本社・根崎第2工場）の中身も取得
    const folders = (data.entries || []).filter(e => e.type === 'folder');
    for (const folder of folders) {
      try {
        const sub = await boxGet(`/folders/${folder.id}/items?fields=id,name,type,modified_at,size&limit=100`);
        const subFiles = (sub.entries || []).filter(e => e.type === 'file' && e.name.endsWith('.pdf'));
        files.push(...subFiles);
      } catch(e) {}
    }

    allFiles = files.map(f => ({
      id: f.id,
      name: f.name,
      site: detectSite(f.name),
      modified: f.modified_at,
    })).sort((a,b) => new Date(b.modified) - new Date(a.modified));

    hideLoading();
    updateTokenStatus('ok');
    filterAndDisplay();
    renderHistoryList();
    showToast(`${allFiles.length}件のPDFを取得しました`, 'success');

  } catch(e) {
    hideLoading();
    if (e.message === 'AUTH') {
      updateTokenStatus('ng');
      showToast('トークンエラー：期限切れかもしれません', 'error');
    } else {
      showToast('取得エラー：' + e.message, 'error');
    }
  }
}

function detectSite(name) {
  if (/本社/i.test(name)) return 'honsha';
  if (/根崎/i.test(name)) return 'nezaki';
  return 'other';
}

// ===== DISPLAY =====
function filterAndDisplay() {
  if (cfg.site === 'all') {
    currentFiles = [...allFiles];
  } else {
    currentFiles = allFiles.filter(f => f.site === cfg.site);
  }
  if (currentFiles.length === 0) { showEmpty(); return; }
  currentIndex = 0;
  showFile(currentFiles[0]);
  updateNav();
}

async function showFile(file) {
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('pdf-canvas').style.display = 'none';
  showLoading('PDFを読み込み中...');

  document.getElementById('viewer-title').textContent = file.name;
  const d = new Date(file.modified);
  const site = file.site === 'honsha' ? '本社工場' : file.site === 'nezaki' ? '根崎第2工場' : '';
  document.getElementById('viewer-date').textContent =
    d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}) + (site ? '  ' + site : '');

  try {
    // Box APIでダウンロードURLを取得
    const res = await fetch(`${BOX_API}/files/${file.id}/content`, {
      headers: { 'Authorization': `Bearer ${cfg.token}` },
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('download failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const container = document.getElementById('pdf-container');
    const scale = Math.min(
      (container.clientWidth - 48) / page.getViewport({scale:1}).width,
      (container.clientHeight - 48) / page.getViewport({scale:1}).height,
      2.0
    );
    const vp = page.getViewport({scale});
    const canvas = document.getElementById('pdf-canvas');
    canvas.width = vp.width;
    canvas.height = vp.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport: vp}).promise;

    URL.revokeObjectURL(url);
    hideLoading();
    canvas.style.display = 'block';

  } catch(e) {
    hideLoading();
    showToast('PDF読み込みエラー：' + e.message, 'error');
    document.getElementById('empty-state').style.display = 'flex';
  }
}

function showEmpty() {
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('pdf-canvas').style.display = 'none';
  document.getElementById('viewer-title').textContent = 'PDFが見つかりません';
  document.getElementById('viewer-date').textContent = '';
  document.getElementById('slide-counter').textContent = '—';
}

// ===== NAVIGATION =====
function navigate(dir) {
  currentIndex = Math.max(0, Math.min(currentFiles.length - 1, currentIndex + dir));
  showFile(currentFiles[currentIndex]);
  updateNav();
  if (isPlaying) resetProgress();
}
function updateNav() {
  const n = currentFiles.length;
  document.getElementById('prev-btn').disabled = currentIndex <= 0;
  document.getElementById('next-btn').disabled = currentIndex >= n - 1;
  document.getElementById('slide-counter').textContent = n > 0 ? `${currentIndex+1} / ${n}` : '—';
}

// ===== SLIDESHOW =====
function toggleSlideshow() {
  isPlaying ? stopSlideshow() : startSlideshow();
}
function startSlideshow() {
  if (currentFiles.length === 0) { showToast('表示するファイルがありません', 'error'); return; }
  isPlaying = true;
  cfg.interval = parseInt(document.getElementById('interval-input').value) || 10;
  saveCfg();
  document.getElementById('play-btn').textContent = '⏸ 停止';
  document.getElementById('slide-status').className = 'status-badge playing';
  document.getElementById('slide-status').innerHTML = '<span class="blink"></span>スライド中';
  resetProgress();
  scheduleNext();
}
function stopSlideshow() {
  isPlaying = false;
  clearTimeout(slideshowTimer);
  document.getElementById('play-btn').textContent = '▶ 開始';
  document.getElementById('slide-status').className = 'status-badge paused';
  document.getElementById('slide-status').innerHTML = '<span class="blink"></span>停止中';
  document.getElementById('progress-fill').style.width = '0%';
}
function scheduleNext() {
  slideshowTimer = setTimeout(() => {
    if (!isPlaying) return;
    currentIndex = (currentIndex + 1) % currentFiles.length;
    showFile(currentFiles[currentIndex]);
    updateNav();
    resetProgress();
    scheduleNext();
  }, cfg.interval * 1000);
}
function resetProgress() {
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none'; fill.style.width = '0%';
  setTimeout(() => {
    fill.style.transition = `width ${cfg.interval}s linear`;
    fill.style.width = '100%';
  }, 50);
}

// ===== HISTORY =====
function renderHistoryList() {
  const list = document.getElementById('history-list');
  if (allFiles.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px;">履歴はありません</div>';
    return;
  }
  list.innerHTML = allFiles.map((f, i) => {
    const d = new Date(f.modified);
    const dateStr = d.toLocaleDateString('ja-JP',{month:'2-digit',day:'2-digit'});
    const site = f.site === 'honsha' ? '本社' : f.site === 'nezaki' ? '根崎第2' : '—';
    const cls = f.site === 'honsha' ? 'honsha' : 'nezaki';
    return `<div class="history-item" onclick="openHistory(${i})">
      <div class="history-thumb">📄</div>
      <div class="history-info">
        <div class="history-name">${f.name}</div>
        <div class="history-meta">${dateStr}</div>
        <span class="history-site ${cls}">${site}</span>
      </div>
    </div>`;
  }).join('');
}
function openHistory(idx) {
  switchTab('viewer');
  setTimeout(() => {
    currentFiles = [allFiles[idx]];
    currentIndex = 0;
    showFile(allFiles[idx]);
    updateNav();
  }, 50);
}

// ===== MONITOR MODE =====
function enterMonitorMode() {
  document.body.classList.add('monitor-mode');
  if (!isPlaying && currentFiles.length > 0) startSlideshow();
}
function exitMonitorMode() { document.body.classList.remove('monitor-mode'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') exitMonitorMode();
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === ' ') { e.preventDefault(); toggleSlideshow(); }
});

// ===== LOADING =====
function showLoading(msg) {
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}

// ===== TOAST =====
let toastTimer;
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
</script>
</body>
