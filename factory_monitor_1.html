<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ナカシマ 工場現況モニター</title>
<style>
  :root {
    --bg:#0f1117; --bg2:#1a1d27; --bg3:#222535;
    --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.15);
    --text:#e8eaf0; --text2:#8b90a8;
    --accent:#4f8ef7; --accent2:#3a6fd8;
    --green:#2ec97d; --amber:#f5a623; --red:#e85555;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
  .hd-left{display:flex;align-items:center;gap:12px;}
  .hd-title{font-size:16px;font-weight:600;}
  .hd-sub{font-size:12px;color:var(--text2);margin-top:1px;}
  .hd-right{display:flex;align-items:center;gap:10px;}

  .tabbar{display:flex;gap:4px;padding:12px 24px 0;background:var(--bg2);border-bottom:1px solid var(--border);}
  .maintab{padding:9px 20px;border-radius:var(--r) var(--r) 0 0;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--text2);border:1px solid transparent;border-bottom:none;transition:all .18s;position:relative;bottom:-1px;display:flex;align-items:center;gap:8px;}
  .maintab:hover{color:var(--text);background:var(--bg3);}
  .maintab.active{color:var(--text);background:var(--bg);border-color:var(--border);border-bottom-color:var(--bg);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;}

  main{display:flex;height:calc(100vh - 101px);}

  .sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
  .sb-sec{padding:14px 16px;border-bottom:1px solid var(--border);}
  .sb-lbl{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:10px;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;}
  .badge.playing{background:rgba(46,201,125,.15);color:var(--green);}
  .badge.paused{background:rgba(245,166,35,.15);color:var(--amber);}
  .badge .blink{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  .conn{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;}
  .conn.ok{background:rgba(46,201,125,.15);color:var(--green);}
  .conn.ng{background:rgba(232,85,85,.15);color:var(--red);}
  .conn.chk{background:rgba(139,144,168,.15);color:var(--text2);}

  .site-grp{display:flex;flex-direction:column;gap:6px;}
  .site-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;border:1px solid var(--border);transition:all .15s;font-size:13px;}
  .site-opt:hover{border-color:var(--border2);background:var(--bg3);}
  .site-opt.sel{border-color:var(--accent);background:rgba(79,142,247,.1);}
  .site-opt input{display:none;}
  .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .sdot.h{background:var(--accent);}
  .sdot.n{background:var(--green);}

  .inp{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;width:100%;}
  .inp:focus{border-color:var(--accent);}

  .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text);transition:all .15s;white-space:nowrap;}
  .btn:hover{background:var(--bg2);border-color:var(--text2);}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.pri:hover{background:var(--accent2);}
  .btn-row{display:flex;gap:8px;}

  .htabs{display:flex;gap:4px;margin-bottom:8px;}
  .htab{flex:1;padding:6px 4px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r);cursor:pointer;text-align:center;transition:all .15s;}
  .htab.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .hlist{flex:1;overflow-y:auto;padding:8px;}
  .hitem{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:4px;}
  .hitem:hover{background:var(--bg3);border-color:var(--border);}
  .hinfo{flex:1;min-width:0;}
  .hname{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hmeta{font-size:11px;color:var(--text2);margin-top:2px;}
  .newbadge{font-size:10px;background:rgba(46,201,125,.2);color:#6ed8a8;padding:1px 5px;border-radius:4px;margin-left:4px;}

  .viewer{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .vtoolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--border);min-height:52px;}
  .vinfo{display:flex;align-items:center;gap:12px;}
  .vtitle{font-size:14px;font-weight:600;}
  .vdate{font-size:12px;color:var(--text2);}
  .vnav{display:flex;align-items:center;gap:8px;}
  .nbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;}
  .nbtn:hover{border-color:var(--text2);}
  .nbtn:disabled{opacity:.3;cursor:default;}
  .scnt{font-size:13px;color:var(--text2);min-width:60px;text-align:center;}

  .pbar{height:2px;background:var(--border);}
  .pfill{height:100%;background:var(--accent);width:0%;}

  .pdfcont{flex:1;display:flex;align-items:stretch;overflow:hidden;background:#1e2130;position:relative;padding:0;}

  /* 凡例サイドバー */
  .legend {
    width: 240px;
    min-width: 240px;
    background: rgba(15,17,23,0.95);
    border-left: 1px solid rgba(255,255,255,0.12);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    z-index: 20;
  }
  .legend-col { display: flex; flex-direction: column; gap: 10px; }
  .legend-row { display: flex; flex-direction: column; gap: 10px; }
  .legend-title { font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.45); margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; display:flex; align-items:center; justify-content:space-between; }
  .leg-toggle { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: rgba(79,142,247,0.25); color: #7aacf9; cursor: pointer; transition: all .15s; white-space:nowrap; flex-shrink:0; }
  .leg-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .leg-toggle.off { background: rgba(232,85,85,0.2); border-color: rgba(232,85,85,0.4); color: #e85555; }
  .legend-item { display: flex; align-items: center; gap: 12px; font-size: 20px; color: rgba(255,255,255,0.92); white-space: nowrap; }
  .lbox { width: 30px; height: 30px; border-radius: 5px; flex-shrink: 0; }
  .lbox-border { width: 30px; height: 30px; border-radius: 5px; flex-shrink: 0; border: 5px solid; background: transparent; }
  .legend-divider { height: 1px; background: rgba(255,255,255,0.12); margin: 0; }

  #pdf-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  #pdfwrap{opacity:0;display:none;}
  @keyframes kenburns{
    0%  {transform:scale(1.0) translate(0,0);}
    50% {transform:scale(1.06) translate(-1%,-1%);}
    100%{transform:scale(1.0) translate(0,0);}
  }
  #pdfwrap.kb{animation:kenburns 12s ease-in-out infinite;}

  #pdfcanvas{display:block;}

  .empty{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--text2);text-align:center;}
  .empty-icon{font-size:56px;opacity:.3;}
  .empty-title{font-size:18px;font-weight:500;color:var(--text);opacity:.5;}
  .empty-sub{font-size:14px;opacity:.7;}

  .ldov{display:none;position:absolute;inset:0;background:rgba(15,17,23,.8);align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:10;}
  .ldov.show{display:flex;}
  .spin{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ldtxt{font-size:14px;color:var(--text2);}

  body.mon header,body.mon .tabbar,body.mon .sidebar{display:none;}
  body.mon main{height:100vh;}
  .monexit{display:none;position:fixed;top:12px;right:12px;z-index:999;}
  body.mon .monexit{display:flex;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:12px 18px;font-size:14px;z-index:300;display:flex;align-items:center;gap:10px;transform:translateY(80px);opacity:0;transition:all .3s;max-width:400px;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success{border-left:3px solid var(--green);}
  .toast.error{border-left:3px solid var(--red);}
  .toast.info{border-left:3px solid var(--accent);}

  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
</style>
</head>
<body>
<button class="btn monexit" onclick="exitMon()">✕ 通常表示</button>
<div class="toast" id="toast"></div>

<header>
  <div class="hd-left">
    <div>
      <div class="hd-title">工場現況モニター</div>
      <div class="hd-sub" id="clock">--</div>
    </div>
  </div>
  <div class="hd-right">
    <div id="slidebadge" class="badge paused"><span class="blink"></span>停止中</div>
    <button class="btn" onclick="enterMon()">🖥 モニター表示</button>
  </div>
</header>

<div class="tabbar">
  <button class="maintab active" id="mtab-viewer" onclick="showTab('viewer')"><span class="dot"></span>現在の状況</button>
  <button class="maintab" id="mtab-history" onclick="showTab('history')"><span class="dot" style="background:var(--text2)"></span>履歴</button>
</div>

<main>
  <div class="sidebar">

    <div class="sb-sec">
      <div class="sb-lbl">Box 接続状態</div>
      <div id="connbadge" class="conn chk">● 確認中...</div>
    </div>

    <div class="sb-sec" id="sec-site">
      <div class="sb-lbl">表示拠点</div>
      <div class="site-grp">
        <label class="site-opt sel" id="sopt-honsha">
          <input type="radio" name="site" value="honsha" checked onchange="setSite('honsha')">
          <span class="sdot h"></span>本社工場
        </label>
        <label class="site-opt" id="sopt-nezaki">
          <input type="radio" name="site" value="nezaki" onchange="setSite('nezaki')">
          <span class="sdot n"></span>根崎第2工場
        </label>
        <label class="site-opt" id="sopt-all">
          <input type="radio" name="site" value="all" onchange="setSite('all')">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--amber);flex-shrink:0;"></span>両拠点（交互）
        </label>
      </div>
    </div>

    <div class="sb-sec" id="sec-slide">
      <div class="sb-lbl">スライドショー</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:12px;color:var(--text2);white-space:nowrap;">切換え間隔</span>
          <input class="inp" type="number" id="interval" value="10" min="3" max="300" style="width:70px;">
          <span style="font-size:12px;color:var(--text2);">秒</span>
        </div>
        <div class="btn-row">
          <button class="btn pri" id="playbtn" onclick="toggleSlide()">▶ 開始</button>
          <button class="btn" onclick="loadFiles()">↻ 更新</button>
        </div>
      </div>
    </div>

    <div id="sec-history" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
      <div class="sb-sec" style="border:none;padding-bottom:8px;">
        <div class="sb-lbl" style="margin-bottom:8px;">過去の記録</div>
        <div class="htabs">
          <button class="htab active" id="htab-h" onclick="setHistTab('honsha')">本社</button>
          <button class="htab" id="htab-n" onclick="setHistTab('nezaki')">根崎第2</button>
        </div>
      </div>
      <div class="hlist" id="hlist"></div>
    </div>

  </div>

  <div class="viewer">
    <div class="vtoolbar">
      <div class="vinfo">
        <div class="vtitle" id="vtitle">読み込み中...</div>
        <div class="vdate" id="vdate"></div>
      </div>
      <div class="vnav">
        <button class="nbtn" id="prevbtn" onclick="nav(-1)" disabled>‹</button>
        <span class="scnt" id="scnt">—</span>
        <button class="nbtn" id="nextbtn" onclick="nav(1)" disabled>›</button>
      </div>
    </div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
    <div class="pdfcont" id="pdfcont">
      <div id="pdf-area">
        <div class="ldov" id="ldov"><div class="spin"></div><div class="ldtxt" id="ldtxt">読み込み中...</div></div>
        <div class="empty" id="empty">
          <div class="empty-icon">📋</div>
          <div class="empty-title">PDFが見つかりません</div>
          <div class="empty-sub">↻ 更新ボタンを押してください</div>
        </div>
        <div id="pdfwrap"><canvas id="pdfcanvas"></canvas></div>
      </div>

      <!-- 凡例 -->
      <div class="legend" id="legend">
        <div class="legend-col">
          <div class="legend-title" id="tog-border-label" onclick="toggleLegend('border')" style="cursor:pointer;user-select:none;">&#9656; 外枠（仕入先）</div>
          <div id="leg-border" class="legend-row" style="display:none;">
            <div class="legend-item"><div class="lbox-border" style="border-color:#4fc3f7;"></div>アイシン国内</div>
            <div class="legend-item"><div class="lbox-border" style="border-color:#2e7d32;"></div>アイシン海外</div>
            <div class="legend-item"><div class="lbox-border" style="border-color:#ce93d8;"></div>トヨタ紡織</div>
            <div class="legend-item"><div class="lbox-border" style="border-color:#b0bec5;"></div>その他</div>
            <div class="legend-item"><div class="lbox" style="background:#111;border:1px solid #555;"></div>トライワーク</div>
          </div>
        </div>
        <div class="legend-divider"></div>
        <div class="legend-col">
          <div class="legend-title" id="tog-inner-label" onclick="toggleLegend('inner')" style="cursor:pointer;user-select:none;">&#9662; 内側（納期）</div>
          <div id="leg-inner" class="legend-row">
            <div class="legend-item"><div class="lbox" style="background:#a5d6a7;"></div>3ヶ月以上</div>
            <div class="legend-item"><div class="lbox" style="background:#fff176;"></div>2ヶ月以内</div>
            <div class="legend-item"><div class="lbox" style="background:#ffb74d;"></div>1ヶ月以内</div>
            <div class="legend-item"><div class="lbox" style="background:#ff0000;"></div>2週間以内</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
function toggleLegend(type) {
  var row   = document.getElementById('leg-' + type);
  var label = document.getElementById('tog-' + type + '-label');
  var name  = type === 'border' ? '外枠（仕入先）' : '内側（納期）';
  var isHidden = row.style.display === 'none';
  row.style.display = isHidden ? 'flex' : 'none';
  label.innerHTML = (isHidden ? '&#9662; ' : '&#9656; ') + name;
}
</script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const GAS = 'https://script.google.com/macros/s/AKfycbzlGZJ7WSEh0MRfG1vPNSHOQPQE-FPosTLw8LGq5li1YaJbxGLFpWWE2oyQ5vBa8AwF/exec';
const CFGK = 'nim_fac3';

let cfg = {interval:10, site:'nezaki'};
let allFiles = [], curFiles = [], curIdx = 0;
let playing = false, slideTimer = null;
const cache = {};
let histTab = 'honsha';
let curMainTab = 'viewer';

// BOOT
document.addEventListener('DOMContentLoaded', () => {
  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFGK)||'{}')); } catch(e){}
  document.getElementById('interval').value = cfg.interval || 10;
  setSite(cfg.site || 'nezaki', false);
  updateClock();
  setInterval(updateClock, 1000);
  loadFiles();
});
function saveCfg(){ try{localStorage.setItem(CFGK,JSON.stringify(cfg));}catch(e){} }

// CLOCK
function updateClock(){
  const n = new Date();
  document.getElementById('clock').textContent =
    n.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'})
    + ' ' + n.toLocaleTimeString('ja-JP');
}

// MAIN TAB
function showTab(tab){
  curMainTab = tab;
  document.getElementById('mtab-viewer').classList.toggle('active', tab==='viewer');
  document.getElementById('mtab-history').classList.toggle('active', tab==='history');
  document.getElementById('sec-history').style.display = tab==='history' ? 'flex' : 'none';
  document.getElementById('sec-site').style.display   = tab==='history' ? 'none' : '';
  document.getElementById('sec-slide').style.display  = tab==='history' ? 'none' : '';
  if(tab==='history') renderHist();
}

// SITE
function setSite(val, doLoad){
  cfg.site = val; saveCfg();
  ['honsha','nezaki','all'].forEach(function(s){
    document.getElementById('sopt-'+s).classList.toggle('sel', s===val);
  });
  if(doLoad !== false) filterAndShow();
}

// LOAD FILES
async function loadFiles(){
  setConn('chk');
  showLd('Boxからファイル一覧を取得中...');
  try {
    const res  = await fetch(GAS + '?action=listFiles');
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    allFiles = (data.files||[]).map(function(f){
      return {id:f.id, name:f.name, site:detectSite(f.name), modified:f.modified};
    });
    hideLd();
    setConn('ok');
    filterAndShow();
    toast(allFiles.length + '件のPDFを取得しました', 'success');
  } catch(e){
    hideLd();
    setConn('ng');
    toast('取得エラー：' + e.message, 'error');
    showEmpty();
  }
}

function detectSite(n){ return /本社/i.test(n)?'honsha':/根崎/i.test(n)?'nezaki':'other'; }

function setConn(s){
  const el = document.getElementById('connbadge');
  if(s==='ok'){el.className='conn ok';el.textContent='● 接続OK';}
  else if(s==='ng'){el.className='conn ng';el.textContent='● 接続エラー';}
  else{el.className='conn chk';el.textContent='● 確認中...';}
}

// FILTER
function filterAndShow(){
  if(cfg.site === 'all'){
    const h = allFiles.filter(function(f){return f.site==='honsha';})[0];
    const n = allFiles.filter(function(f){return f.site==='nezaki';})[0];
    curFiles = [h,n].filter(Boolean);
  } else {
    curFiles = allFiles.filter(function(f){return f.site===cfg.site;});
  }
  if(!curFiles.length){ showEmpty(); return; }
  curIdx = 0;
  showPDF(curFiles[0]);
  updateNav();
  setTimeout(prefetch, 3000);
}

// SHOW PDF
async function showPDF(file){
  const wrap  = document.getElementById('pdfwrap');
  const empty = document.getElementById('empty');
  wrap.style.transition = 'none';
  wrap.style.opacity = '0';
  wrap.classList.remove('kb');
  empty.style.display = 'none';

  document.getElementById('vtitle').textContent = file.name;
  const d = new Date(file.modified);
  const sl = file.site==='honsha'?'本社工場':file.site==='nezaki'?'根崎第2工場':'';
  document.getElementById('vdate').textContent =
    d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}) + (sl?' '+sl:'');

  try {
    let url = cache[file.id];
    if(!url){
      showLd('PDFを読み込み中...');
      const res  = await fetch(GAS + '?action=getFile&fileId=' + file.id);
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      const bin = atob(data.base64);
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      url = URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
      cache[file.id] = url;
    }
    const pdf  = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const cont = document.getElementById('pdf-area');
    const vp1  = page.getViewport({scale:1});
    const sc   = Math.min(cont.clientWidth/vp1.width, cont.clientHeight/vp1.height);
    const vp   = page.getViewport({scale:sc});
    const cv   = document.getElementById('pdfcanvas');
    cv.width   = vp.width;
    cv.height  = vp.height;
    await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    hideLd();
    wrap.style.display = 'block';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        wrap.style.transition = 'opacity 0.7s ease';
        wrap.style.opacity = '1';
        if(playing && cfg.site !== 'all') wrap.classList.add('kb');
      });
    });
  } catch(e){
    hideLd();
    showEmpty();
    toast('PDF読み込みエラー：' + e.message, 'error');
  }
}

// PREFETCH
async function prefetch(){
  const ni = curIdx + 1;
  if(ni >= curFiles.length) return;
  const f = curFiles[ni];
  if(cache[f.id]) return;
  try{
    const res  = await fetch(GAS + '?action=getFile&fileId=' + f.id);
    const data = await res.json();
    if(data.error) return;
    const bin = atob(data.base64);
    const buf = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    cache[f.id] = URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));
  }catch(e){}
}

function showEmpty(){
  document.getElementById('empty').style.display='flex';
  document.getElementById('pdfwrap').style.display='none';
  document.getElementById('vtitle').textContent='PDFが見つかりません';
  document.getElementById('vdate').textContent='';
  document.getElementById('scnt').textContent='—';
}

// NAV
function nav(dir){
  curIdx = Math.max(0, Math.min(curFiles.length-1, curIdx+dir));
  showPDF(curFiles[curIdx]);
  updateNav();
  if(playing) resetProg();
}
function updateNav(){
  const n = curFiles.length;
  document.getElementById('prevbtn').disabled = curIdx<=0;
  document.getElementById('nextbtn').disabled = curIdx>=n-1;
  document.getElementById('scnt').textContent = n>0 ? (curIdx+1)+' / '+n : '—';
}

// SLIDESHOW
function toggleSlide(){ playing ? stopSlide() : startSlide(); }
function startSlide(){
  if(!curFiles.length){ toast('ファイルがありません','error'); return; }
  playing = true;
  cfg.interval = parseInt(document.getElementById('interval').value)||10;
  saveCfg();
  document.getElementById('playbtn').textContent = '⏸ 停止';
  document.getElementById('slidebadge').className = 'badge playing';
  document.getElementById('slidebadge').innerHTML = '<span class="blink"></span>スライド中';
  if(cfg.site !== 'all') document.getElementById('pdfwrap').classList.add('kb');
  resetProg();
  schedNext();
}
function stopSlide(){
  playing = false;
  clearTimeout(slideTimer);
  document.getElementById('playbtn').textContent = '▶ 開始';
  document.getElementById('slidebadge').className = 'badge paused';
  document.getElementById('slidebadge').innerHTML = '<span class="blink"></span>停止中';
  document.getElementById('pdfwrap').classList.remove('kb');
  const pf = document.getElementById('pfill');
  pf.style.transition='none'; pf.style.width='0%';
}
function schedNext(){
  slideTimer = setTimeout(function(){
    if(!playing) return;
    curIdx = (curIdx+1) % curFiles.length;
    showPDF(curFiles[curIdx]);
    updateNav();
    resetProg();
    schedNext();
    setTimeout(prefetch, 2000);
  }, cfg.interval * 1000);
}
function resetProg(){
  const pf = document.getElementById('pfill');
  pf.style.transition='none'; pf.style.width='0%';
  setTimeout(function(){
    pf.style.transition = 'width '+cfg.interval+'s linear';
    pf.style.width='100%';
  }, 50);
}

// HISTORY
function setHistTab(tab){
  histTab = tab;
  document.getElementById('htab-h').classList.toggle('active', tab==='honsha');
  document.getElementById('htab-n').classList.toggle('active', tab==='nezaki');
  renderHist();
}
function renderHist(){
  const list = document.getElementById('hlist');
  const files = allFiles.filter(function(f){ return f.site===histTab; });
  if(!files.length){
    list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text2);font-size:13px;">履歴はありません</div>';
    return;
  }
  list.innerHTML = files.map(function(f, i){
    const d  = new Date(f.modified);
    const ds = d.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'});
    const nb = i===0 ? '<span class="newbadge">最新</span>' : '';
    return '<div class="hitem" onclick="openHistFile(\'' + f.id + '\')">'
         + '<div style="font-size:20px;flex-shrink:0">📄</div>'
         + '<div class="hinfo">'
         + '<div class="hname">' + f.name + nb + '</div>'
         + '<div class="hmeta">' + ds + '</div>'
         + '</div></div>';
  }).join('');
}
function openHistFile(id){
  const f = allFiles.find(function(x){ return x.id===id; });
  if(!f) return;
  showTab('viewer');
  setTimeout(function(){
    curFiles = [f]; curIdx = 0;
    showPDF(f); updateNav();
  }, 50);
}

// MONITOR
function enterMon(){
  document.body.classList.add('mon');
  if(!playing && curFiles.length) startSlide();
}
function exitMon(){ document.body.classList.remove('mon'); }
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') exitMon();
  if(e.key==='ArrowRight') nav(1);
  if(e.key==='ArrowLeft')  nav(-1);
  if(e.key===' '){ e.preventDefault(); toggleSlide(); }
});

// LOADING
function showLd(msg){ document.getElementById('ldtxt').textContent=msg||''; document.getElementById('ldov').classList.add('show'); }
function hideLd(){ document.getElementById('ldov').classList.remove('show'); }

// LEGEND TOGGLE
function toggleLegend(type) {
  const row   = document.getElementById('leg-' + type);
  const label = document.getElementById('tog-' + type + '-label');
  const name  = type === 'border' ? '外枠（仕入先）' : '内側（納期）';
  const isHidden = row.style.display === 'none';
  row.style.display  = isHidden ? 'flex' : 'none';
  label.textContent  = isHidden ? '▼ ' + name : '▶ ' + name;
  label.style.color  = isHidden ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.25)';
}

// TOAST
let tt;
function toast(msg, type){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+(type||'info')+' show';
  clearTimeout(tt);
  tt = setTimeout(function(){ el.classList.remove('show'); }, 4000);
}
</script>
