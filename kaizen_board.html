<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>業務改善ボード｜ナカシマ</title>
<style>
/* ===== リセット・基本 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Hiragino Sans","Meiryo",sans-serif;font-size:14px;background:#f0f2f5;color:#1a2332;display:flex;flex-direction:column}

/* ===== CSS変数 ===== */
:root{
  --bg:#f0f2f5;--surface:#fff;--surface2:#f7f8fa;--border:#e2e6ea;
  --primary:#1a3a5c;--pl:#2563a8;--accent:#e8a020;
  --sub:#6b7a8d;--text:#1a2332;
  --s0:#94a3b8;--s1:#3b82f6;--s2:#22c55e;--s3:#8b5cf6;--red:#ef4444;
  --sh:0 1px 4px rgba(0,0,0,.08);--shm:0 4px 16px rgba(0,0,0,.12);
}

/* ===== ヘッダー ===== */
#hdr{background:var(--primary);color:#fff;height:50px;display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;box-shadow:var(--shm);z-index:100}
.hdr-logo{font-size:17px;font-weight:700;letter-spacing:.04em}
.hdr-sub{font-size:12px;opacity:.65;flex:1}
.hdr-tabs{display:flex;gap:4px}
.htab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);border:none;background:none;transition:all .2s}
.htab:hover{background:rgba(255,255,255,.12);color:#fff}
.htab.on{background:rgba(255,255,255,.2);color:#fff}
.sync-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px}
.sdot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0}
.sdot.off{background:#f87171}

/* ===== GASバナー ===== */
#gasBanner{background:#fff3cd;border-bottom:1px solid #ffc107;padding:8px 16px;font-size:12px;color:#856404;display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
#gasBanner input{padding:4px 8px;border:1px solid #ffc107;border-radius:5px;font-size:12px;width:320px}

/* ===== メイン（伸縮） ===== */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ===== ダッシュボード ===== */
#dashPane{flex:1;overflow-y:auto;padding:16px;display:none}
#dashPane.on{display:block}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.sc{background:var(--surface);border-radius:9px;padding:12px;box-shadow:var(--sh)}
.sl{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sv{font-size:24px;font-weight:800;color:var(--primary);line-height:1}
.ss{font-size:11px;color:var(--sub);margin-top:2px}
.sb{height:3px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
.sbf{height:100%;background:linear-gradient(90deg,var(--pl),var(--accent));border-radius:2px}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dc{background:var(--surface);border-radius:9px;padding:12px 14px;box-shadow:var(--sh)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.dn{font-weight:700;font-size:13px;color:var(--primary)}
.dp{font-size:16px;font-weight:800;color:var(--pl)}
.db{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px}
.dbf{height:100%;background:linear-gradient(90deg,var(--pl),var(--accent))}
.dbs{display:flex;gap:5px;flex-wrap:wrap}
.dbg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600}
.b0{background:#f1f5f9;color:var(--s0)}.b1{background:#eff6ff;color:var(--s1)}.b2{background:#f0fdf4;color:var(--s2)}.b3{background:#faf5ff;color:var(--s3)}.bx{background:#fefce8;color:#ca8a04}

/* ===== 2カラムボード ===== */
#boardPane{flex:1;overflow:hidden;display:flex}
#boardPane.hide{display:none}

/* ===== 左ペイン ===== */
#leftPane{width:400px;min-width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:2px solid var(--border);background:var(--surface);overflow:hidden}

/* アジェンダ */
#agendaSec{background:linear-gradient(135deg,#fffbeb,#fff8e1);border-bottom:2px solid var(--accent);flex-shrink:0}
.agh{display:flex;align-items:center;padding:8px 12px 6px;gap:7px;cursor:pointer;user-select:none}
.agt{font-size:11px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.06em;flex:1}
.agc{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.agarr{font-size:13px;color:#b45309;transition:transform .2s}
.agarr.open{transform:rotate(90deg)}
#agendaBody{display:block}
.aglist{padding:4px 8px 6px;display:flex;flex-direction:column;gap:3px}
.agitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.6);transition:background .15s}
.agitem:hover{background:rgba(255,255,255,.9)}
.agitem.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);border-left:3px solid var(--accent)}
.agnum{font-size:10px;font-weight:700;color:#fff;background:var(--accent);width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.agname{font-size:12px;font-weight:600;color:#78350f;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agdept{font-size:9px;color:#b45309;background:rgba(234,160,32,.15);padding:1px 6px;border-radius:20px;flex-shrink:0}
.agfooter{padding:4px 10px 8px;display:flex;justify-content:flex-end}
.mtendbtn{background:#dc2626;color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}
.mtendbtn:hover{opacity:.85}
.agempty{padding:8px 12px 10px;font-size:12px;color:#b45309;opacity:.6}

/* フィルタバー */
#leftTop{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;align-items:center;flex-shrink:0;background:var(--surface2);flex-wrap:wrap}
#leftTop select,#leftTop input{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);background:#fff;outline:none}
#leftTop input{width:90px}
.ftbtn{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}

/* 改善項目スクロールエリア */
#leftScroll{flex:1;overflow-y:auto;padding:8px}

/* 改善項目ブロック */
.iblock{border-radius:7px;margin-bottom:5px;overflow:hidden;border:1px solid var(--border);transition:border-color .2s;background:var(--surface)}
.iblock.sel{border-color:var(--pl);box-shadow:0 0 0 2px rgba(37,99,168,.15)}
.iblock.agenda{border-color:var(--accent);background:linear-gradient(135deg,#fffbeb,#fff)}
.iblock.agenda .inum{background:var(--accent)}
.iblock.prevmt{border-color:#c084fc;background:linear-gradient(135deg,#f5f3ff,#fff)}
.prevbadge{font-size:9px;font-weight:700;color:#fff;background:#9333ea;padding:2px 7px;border-radius:20px;flex-shrink:0;white-space:nowrap}
/* 前回MT振り返りパネル */
.rvpanel{background:linear-gradient(135deg,#faf5ff,#fff);border:1.5px solid #c084fc;border-radius:8px;margin-bottom:8px;overflow:hidden}
.rvhdr{display:flex;align-items:center;gap:7px;padding:8px 10px;cursor:pointer;user-select:none;font-size:12px;font-weight:800;color:#7e22ce}
.rvcnt{background:#9333ea;color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px}
.rvarr{margin-left:auto;color:#9333ea;transition:transform .2s;font-size:13px}
.rvarr.open{transform:rotate(90deg)}
.rvchips{display:flex;gap:5px;flex-wrap:wrap;padding:2px 0 8px}
.rvchip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid #c084fc;background:#fff;color:#7e22ce;cursor:pointer;white-space:nowrap}
.rvchip.on{background:#9333ea;color:#fff;border-color:#9333ea}
.rvitem{padding:7px 10px;border-top:1px dashed #e9d5ff;cursor:pointer}
.rvitem:hover{background:#faf5ff}
.rvname{font-size:12px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.rvnum{background:#9333ea;color:#fff;font-size:10px;font-weight:700;min-width:20px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.rvdept{font-size:9px;color:#7e22ce;background:#f3e8ff;padding:1px 6px;border-radius:20px}
.rvnote{font-size:11px;color:#555;line-height:1.5;padding:2px 0 2px 10px;white-space:pre-wrap}
.rvnote b{color:var(--primary);font-weight:600}
.rvempty{font-size:11px;color:var(--sub);padding:4px 0 2px 10px}
/* タスク議事録の履歴表示 */
#mtHistory{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.mh-title{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.mh-entry{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 9px}
.mh-entry.mh-prev{background:#faf5ff;border-color:#c084fc}
.mh-date{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--sub);padding:1px 7px;border-radius:20px;margin-bottom:3px}
.mh-entry.mh-prev .mh-date{background:#9333ea}
.mh-text{font-size:12px;color:var(--text);line-height:1.5;white-space:pre-wrap}
.mh-empty{font-size:11px;color:var(--sub);padding:2px 0}
.mh-newlbl{font-size:10px;font-weight:700;color:var(--pl);margin-bottom:3px}
.mh-erow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mh-editbtn{background:none;border:none;cursor:pointer;font-size:12px;opacity:.5;padding:0 2px;line-height:1}
.mh-editbtn:hover{opacity:1}
.mh-edit{width:100%;min-height:64px;padding:6px 8px;border:1px solid var(--pl);border-radius:6px;font-size:12px;font-family:inherit;line-height:1.5;resize:vertical;outline:none;margin-top:4px}
.mh-ebtns{display:flex;gap:6px;justify-content:flex-end;margin-top:5px}
.mh-b{font-size:11px;font-weight:700;padding:3px 11px;border-radius:5px;border:1px solid var(--border);background:#fff;color:var(--sub);cursor:pointer}
.mh-b.save{background:var(--primary);color:#fff;border:none}
.mh-b.del{background:#dc2626;color:#fff;border:none;margin-right:auto}
.ihdr{display:flex;align-items:center;padding:8px 10px;cursor:pointer;gap:7px;transition:background .15s;user-select:none}
.ihdr:hover{background:#f0f4ff}
.iblock.sel .ihdr{background:#eff6ff}
.agchk{width:16px;height:16px;border:2px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;background:#fff;transition:all .15s;flex-shrink:0;cursor:pointer}
.agchk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.inum{width:22px;height:22px;background:var(--primary);color:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.iblock.sel .inum{background:var(--pl)}
.dpill{font-size:10px;padding:1px 6px;background:var(--primary);color:#fff;border-radius:20px;font-weight:600;opacity:.75;flex-shrink:0}
.itwrap{flex:1;min-width:0}
.ititle{font-weight:700;font-size:13px;color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.igoal{font-size:10px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iright{display:flex;align-items:center;gap:5px;flex-shrink:0}
.ipct{font-size:11px;font-weight:700;color:var(--pl);width:26px;text-align:right}
.ibar{width:44px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.ibarf{height:100%;background:linear-gradient(90deg,var(--pl),var(--accent));border-radius:2px}
.ichev{color:var(--sub);transition:transform .2s;font-size:14px;line-height:1}
.ichev.open{transform:rotate(90deg)}
.tlist{border-top:1px solid var(--border);display:none}
.iblock.exp .tlist{display:block}
.trow{display:flex;align-items:center;padding:6px 10px 6px 32px;gap:7px;border-bottom:1px solid var(--surface2);cursor:pointer;transition:background .1s}
.trow:hover{background:#f8f9ff}
.trow:last-child{border-bottom:none}
.tdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.d0{background:var(--s0)}.d1{background:var(--s1);animation:pulse 2s infinite}.d2{background:var(--s2)}.d3{background:var(--s3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.ttxt{flex:1;font-size:12px;line-height:1.3}
.ttxt.done{text-decoration:line-through;color:var(--sub)}
.ttantou{font-size:10px;color:var(--sub);background:var(--surface2);padding:1px 5px;border-radius:20px;flex-shrink:0}
.tdate{font-size:10px;color:var(--sub);flex-shrink:0}
.tdate.ov{color:var(--red);font-weight:700}
.addtrow{padding:5px 10px 7px 32px}
.addtbtn{width:100%;text-align:left;background:none;border:1px dashed var(--border);border-radius:6px;padding:4px 9px;font-size:11px;color:var(--sub);cursor:pointer}
.addtbtn:hover{border-color:var(--pl);color:var(--pl);background:var(--surface2)}
.depthdr{padding:5px 8px 3px;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.07em;margin-top:3px}

/* ===== 右ペイン ===== */
#rightPane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#noSel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:10px}
#noSel .icon{font-size:46px;opacity:.35}
#rightContent{display:none;flex:1;flex-direction:column;overflow:hidden}
#selBanner{background:#eff6ff;border-bottom:2px solid var(--pl);padding:9px 16px;display:flex;align-items:center;gap:9px;flex-shrink:0}
#selBanner .snum{width:26px;height:26px;background:var(--pl);color:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
#selTitle{font-weight:700;font-size:14px;color:var(--primary)}
#selDept{font-size:11px;color:var(--sub)}
#rightScroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* カード */
.card{background:var(--surface);border-radius:9px;box-shadow:var(--sh);padding:14px 15px}
.card.ai-card{border:2px solid var(--pl)}
.clbl{font-size:10px;font-weight:700;color:var(--sub);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}

/* 議事録入力 */
.mtop{display:flex;gap:7px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.mta{width:100%;min-height:130px;padding:9px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.7;background:var(--surface2)}
.mta:focus{border-color:var(--pl);background:#fff}
.mta::placeholder{color:#bbc}
.airow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.aibtn{background:linear-gradient(135deg,var(--primary),var(--pl));color:#fff;border:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.aibtn:hover{opacity:.88}

/* AI解析中 */
.analyzing{text-align:center;padding:24px}
.spini{font-size:34px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pbar{height:3px;background:var(--border);border-radius:2px;margin:10px auto;width:160px;overflow:hidden}
.pbarf{height:100%;background:linear-gradient(90deg,var(--pl),var(--accent));animation:prog 1.8s ease-in-out infinite}
@keyframes prog{0%{width:0}70%{width:85%}100%{width:95%}}

/* AI要点 */
.aisum{background:#fffbeb;border-left:3px solid var(--accent);padding:8px 11px;border-radius:0 7px 7px 0;font-size:12px;color:#78350f;line-height:1.7;margin-bottom:10px}
.aisum strong{display:block;color:#92400e;margin-bottom:3px}

/* AIブロックヘッダー */
.ablk{margin-bottom:8px}
.abhdr{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:7px 7px 0 0;border:1.5px solid;border-bottom:none;font-size:12px;font-weight:700}
.abhdr-g{background:#f0fdf4;border-color:#86efac;color:#15803d}
.abhdr-b{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}
.abicon{font-size:13px}
.abtitle{font-size:13px;font-weight:700}
.abcount{font-size:11px;opacity:.8;margin-left:4px}
.abchkall{font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;margin-left:auto}
.ablist{border:1.5px solid var(--border);border-top:none;border-radius:0 0 7px 7px;overflow:hidden}

/* 更新行 */
.urow{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--surface2);cursor:pointer;transition:background .1s}
.urow:hover{background:#f8fff8}
.urow:last-child{border-bottom:none}
.urow.on{background:#f0fdf4}
.uchk{width:15px;height:15px;border:2px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;transition:all .15s}
.urow.on .uchk{background:var(--s2);border-color:var(--s2);color:#fff}
.utask{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uarrow{display:flex;align-items:center;gap:4px;font-size:11px;flex-shrink:0}
.sfrom{padding:2px 7px;border-radius:20px;font-weight:600;background:#f1f5f9;color:var(--s0)}
.sto{padding:2px 7px;border-radius:20px;font-weight:600}
.sto.s1{background:#eff6ff;color:var(--s1)}.sto.s2{background:#f0fdf4;color:var(--s2)}.sto.s3{background:#faf5ff;color:var(--s3)}.sto.s0{background:#f1f5f9;color:var(--s0)}

/* 候補行 */
.crow{display:flex;align-items:flex-start;gap:7px;padding:8px 11px;border-bottom:1px solid var(--surface2);cursor:pointer;transition:background .1s}
.crow:hover{background:#f0f4ff}
.crow:last-child{border-bottom:none}
.crow.on{background:#eff6ff}
.cchk{width:15px;height:15px;border:2px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:2px;transition:all .15s}
.crow.on .cchk{background:var(--pl);border-color:var(--pl);color:#fff}
.cbody{flex:1;min-width:0}
.cinput{width:100%;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--text);font-family:inherit;outline:none;padding:0}
.crow.on .cinput{color:var(--primary)}
.cmeta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center}
.cmi{padding:3px 7px;border:1px solid var(--border);border-radius:5px;font-size:11px;color:var(--sub);background:#fff;outline:none;font-family:inherit}
.pp{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;flex-shrink:0}
.ph{background:#fee2e2;color:#dc2626}.pm{background:#fef9c3;color:#b45309}.pl_{background:#f0fdf4;color:#16a34a}
.creason{font-size:10px;color:var(--sub);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 登録ボタン */
.regrow{display:flex;gap:7px;justify-content:flex-end;padding:8px 0 2px}

/* タスクバナー（タスク議事録モード） */
#taskBanner{background:#f0fdf4;border-bottom:2px solid var(--s2);padding:9px 16px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.extrow.task-selected{background:#f0fdf4;border-left:3px solid var(--s2);padding-left:9px}

/* 保存ボタン */
#saveMemoBtn{background:var(--primary);color:#fff}
#saveMemoBtn:hover{background:var(--pl)}

/* タスク議事録モード時のテキストエリア */
.mta.task-mode{border-color:var(--s2)}
.extrow:last-child{border-bottom:none}
.extrow:hover{background:var(--surface2);margin:0 -4px;padding:6px 4px;border-radius:4px}

/* ===== 共通ボタン ===== */
.btn{padding:6px 13px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s}
.btn-p{background:var(--primary);color:#fff}.btn-p:hover{background:var(--pl)}
.btn-a{background:var(--accent);color:#fff}.btn-a:hover{background:#d18c15}
.btn-g{background:transparent;color:var(--sub);border:1px solid var(--border)}.btn-g:hover{background:var(--surface2)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-r{background:#dc2626;color:#fff}.btn-r:hover{opacity:.88}

/* ===== モーダル ===== */
.movl{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:11px;width:100%;max-width:500px;box-shadow:var(--shm);overflow:hidden;max-height:90vh;display:flex;flex-direction:column}
.mhdr{padding:13px 16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between}
.mtitle{font-weight:700;font-size:14px}
.mclose{background:none;border:none;color:rgba(255,255,255,.7);font-size:20px;cursor:pointer;line-height:1}
.mbody{padding:14px 16px;overflow-y:auto;flex:1}
.mfoot{padding:9px 16px;border-top:1px solid var(--border);display:flex;gap:7px;justify-content:flex-end;background:var(--surface2)}
.fg{margin-bottom:11px}
.fl{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:4px;display:block}
.fi{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:var(--surface);outline:none;font-family:inherit}
.fi:focus{border-color:var(--pl)}
.fta{min-height:60px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ssel{display:flex;gap:5px;flex-wrap:wrap}
.sbtn{padding:4px 11px;border-radius:20px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;font-weight:600}
.sbtn[data-s="未着手"].on{border-color:var(--s0);background:#f1f5f9;color:var(--s0)}
.sbtn[data-s="実行中"].on{border-color:var(--s1);background:#eff6ff;color:var(--s1)}
.sbtn[data-s="完了"].on{border-color:var(--s2);background:#f0fdf4;color:var(--s2)}
.sbtn[data-s="完了(継続)"].on{border-color:var(--s3);background:#faf5ff;color:var(--s3)}

/* ===== トースト ===== */
#toast{position:fixed;bottom:16px;right:16px;background:var(--primary);color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;box-shadow:var(--shm)}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{background:#dc2626}
#toast.ok{background:#16a34a}

@media(max-width:680px){
  #leftPane{width:100%;border-right:none;border-bottom:2px solid var(--border);max-height:50vh}
  #boardPane{flex-direction:column}
  #rightPane{min-height:50vh}
}
</style>

// ===== ユーティリティ（先に定義） =====
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

// ===== 状態 =====
let GAS = localStorage.getItem('kg') || 'https://script.google.com/macros/s/AKfycbwoXAo_hWf7djODlP-3jZ-0n_lWkoy4sZ3AA4XeqzQMYUvSZafTdQaVA6yeGut2ZfUanQ/exec';
let items = JSON.parse(localStorage.getItem('ki') || 'null') || deepCopy(INIT_ITEMS);
let tasks = JSON.parse(localStorage.getItem('kt') || 'null') || deepCopy(INIT_TASKS);
let agenda = new Set(JSON.parse(localStorage.getItem('ka') || '[]'));
let selId = null;
let hideDone = true;
let onlyKeiz = false;

const td = () => new Date().toISOString().slice(0,10);
const esc = s => {
  let r = String(s||'');
  r = r.replace(/&/g, '&amp;');
  r = r.replace(/>/g, '&gt;');
  r = r.replace(/"/g, '&quot;');
  r = r.replace(String.fromCharCode(60), '&lt;').replace(new RegExp(String.fromCharCode(60), 'g'), '&lt;');
  return r;
};
const saveAll = () => {
  localStorage.setItem('ki', JSON.stringify(items));
  localStorage.setItem('kt', JSON.stringify(tasks));
  localStorage.setItem('ka', JSON.stringify([...agenda]));
};

// ===== 初期化 =====
window.addEventListener('DOMContentLoaded', () => {
  if (GAS) document.getElementById('gasIn').value = GAS;
  document.getElementById('mtDate').value = td();
  DEPTS.forEach(d => {
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    document.getElementById('fDept').appendChild(o);
  });
  updateFBtns();
  computeAgenda();
  computePrevMt();
  renderLeft();
  renderAgenda();
  renderDash();
  // GAS URLが設定済みなら自動同期
  if (GAS) syncData();
});

// ===== GAS =====
function saveGas(){
  GAS = document.getElementById('gasIn').value.trim();
  localStorage.setItem('kg', GAS);
  hideGas();
  toast('GAS URLを設定しました','ok');
}
function hideGas(){ document.getElementById('gasBanner').style.display='none'; }
async function syncData(){
  if(!GAS){ toast('GAS URLが未設定です'); return; }
  setSt('load');
  try {
    const r = await fetch(GAS+'?action=getAll');
    const d = await r.json();
    if(d.success){ items=d.items; tasks=d.tasks; saveAll(); computeAgenda(); computePrevMt(); renderLeft(); renderDash(); setSt('ok'); toast('同期完了','ok'); }
    else{ setSt('off'); toast('同期エラー','err'); }
  } catch{ setSt('off'); toast('接続エラー','err'); }
}
async function gp(action,payload){
  if(!GAS) return {success:true};
  try{
    const params = new URLSearchParams({action, data: JSON.stringify(payload)});
    const r = await (await fetch(GAS+'?'+params.toString())).json();
    if(r && r.success===false){ setSt('off'); toast('保存に失敗（未同期）。通信を確認して再度操作してください','err'); }
    return r;
  }
  catch{ setSt('off'); toast('通信エラー（未同期）。再度操作してください','err'); return {success:false}; }
}
function setSt(s){
  const d=document.getElementById('sdot'), l=document.getElementById('slbl');
  if(s==='ok'){d.className='sdot';l.textContent='同期済み';}
  else if(s==='off'){d.className='sdot off';l.textContent='オフライン';}
  else{d.style.background='#fbbf24';l.textContent='同期中...';}
}

// ===== ビュー =====
function setView(v){
  document.getElementById('boardPane').style.display = v==='board' ? 'flex' : 'none';
  document.getElementById('dashPane').style.display  = v==='dash'  ? 'block' : 'none';
  document.querySelectorAll('.htab').forEach((t,i)=>t.classList.toggle('on',['board','dash'][i]===v));
}

// ===== フィルタ =====
function toggleHide(){ hideDone=!hideDone; if(hideDone) onlyKeiz=false; updateFBtns(); renderLeft(); }
function toggleKeiz(){ onlyKeiz=!onlyKeiz; if(onlyKeiz) hideDone=false; updateFBtns(); renderLeft(); }
function updateFBtns(){
  const b1=document.getElementById('btnHide'), b2=document.getElementById('btnKeiz');
  b1.style.cssText = hideDone
    ? 'padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--primary);color:#fff;border:none'
    : 'padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:#f1f5f9;color:var(--sub);border:1px solid var(--border)';
  b2.style.cssText = onlyKeiz
    ? 'padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--s3);color:#fff;border:none'
    : 'padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:#faf5ff;color:var(--s3);border:1px solid var(--s3)';
}

// ===== 前回MTハイライト =====
let highlightPrev=true, prevMtDate='', prevItems=new Set(), reviewOpen=true, mtDates=[];
function computePrevMt(){
  const re=/\[(\d{4}-\d{2}-\d{2})\]/g;
  const set=new Set();
  tasks.forEach(t=>{ if(!t.memo) return; let m; re.lastIndex=0; while((m=re.exec(t.memo))) set.add(m[1]); });
  mtDates=[...set].sort().reverse();   // 新しい順
  if(!prevMtDate || mtDates.indexOf(prevMtDate)<0) prevMtDate=mtDates[0]||''; // 既定は最新MT
  applyReviewDate();
}
function applyReviewDate(){
  prevItems=new Set();
  if(prevMtDate) tasks.forEach(t=>{ if(t.memo && t.memo.indexOf('['+prevMtDate+']')>=0) prevItems.add(t.item_id); });
  updatePrevBtn();
}
function setReviewDate(d){
  prevMtDate=d; applyReviewDate(); renderLeft();
  if(mtMode==='task' && selTaskId) renderTaskMemo(selTaskId);
}
function updatePrevBtn(){
  const b=document.getElementById('btnPrev'); if(!b) return;
  b.textContent='🔆 振り返り';
  b.style.cssText='padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;'+(highlightPrev?'background:#9333ea;color:#fff;border:none':'background:#faf5ff;color:#9333ea;border:1px solid #c084fc');
}
function togglePrev(){ highlightPrev=!highlightPrev; updatePrevBtn(); renderLeft(); }
function toggleReview(){ reviewOpen=!reviewOpen; renderLeft(); }
function prevNote(memo){
  if(!memo||!prevMtDate) return '';
  const re=new RegExp('\\['+prevMtDate+'\\]\\s*([\\s\\S]*?)(?=\\s*/\\s*\\[\\d{4}-\\d{2}-\\d{2}\\]|$)');
  const m=memo.match(re);
  return m?m[1].trim():'';
}

// ===== 左ペイン =====
function renderLeft(){
  const fd=document.getElementById('fDept').value;
  const fk=document.getElementById('fKey').value.toLowerCase();
  const today=td();
  let html='', lastDept=null;

  const fi = items.filter(it=>{
    if(fd && it.dept!==fd) return false;
    const at = tasks.filter(t=>t.item_id===it.item_id);
    if(at.length===0) return !onlyKeiz;
    // ステータスが設定されているタスクのみで完了判定
    const withStatus = at.filter(t=>t.status&&t.status.trim()!=='');
    if(withStatus.length===0) return !onlyKeiz; // 全員未設定は非表示対象外
    const hk = withStatus.some(t=>t.status==='完了(継続)');
    const ad = withStatus.every(t=>t.status==='完了'||t.status==='完了(継続)');
    if(hideDone && ad && !hk) return false;
    if(onlyKeiz && !hk) return false;
    return true;
  });

  fi.forEach(item=>{
    let it = tasks.filter(t=>t.item_id===item.item_id);
    if(fk) it=it.filter(t=>(t.task_content||'').toLowerCase().includes(fk)||(t.tantou||'').toLowerCase().includes(fk));
    if(fk && !it.length) return;
    if(item.dept!==lastDept){ html+=`<div class="depthdr">【${item.dept}】<\/div>`; lastDept=item.dept; }
    const at=tasks.filter(t=>t.item_id===item.item_id);
    const done=at.filter(t=>t.status==='完了'||t.status==='完了(継続)').length;
    const pct=at.length?Math.round(done/at.length*100):0;
    const isSel=selId===item.item_id, isAg=agenda.has(item.item_id), isExp=isSel, isPrev=highlightPrev&&prevItems.has(item.item_id);
    const trows=it.map(t=>{
      const dc=['未着手','実行中','完了','完了(継続)'].indexOf(t.status);
      const cls=['d0','d1','d2','d3','d0'][dc<0?4:dc];
      const dn=t.status==='完了'||t.status==='完了(継続)';
      const ov=t.yotei_date&&t.yotei_date<today&&!dn;
      return `<div class="trow" onclick="openEdit('${t.task_id}')">
        <div class="tdot ${cls}"><\/div>
        <div class="ttxt ${dn?'done':''}">${esc(t.task_content)}<\/div>
        ${t.tantou?`<span class="ttantou">${esc(t.tantou)}<\/span>`:''}
        ${t.yotei_date?`<span class="tdate ${ov?'ov':''}">${t.yotei_date}<\/span>`:''}
      <\/div>`;
    }).join('');
    html+=`<div class="iblock ${isSel?'sel':''} ${isAg?'agenda':''} ${isExp?'exp':''} ${isPrev?'prevmt':''}" id="ib-${item.item_id}">
      <div class="ihdr" onclick="clickItem('${item.item_id}')">
        <div class="agchk ${isAg?'on':''}" onclick="event.stopPropagation();toggleAg('${item.item_id}')">${isAg?'📌':''}<\/div>
        <div class="inum">${item.item_num}<\/div>
        <span class="dpill">${item.dept}<\/span>
        ${isPrev?'<span class="prevbadge">前回MT<\/span>':''}
        <div class="itwrap">
          <div class="ititle">${esc(item.item_name)}<\/div>
          ${item.goal?`<div class="igoal">▶ ${esc(item.goal)}<\/div>`:''}
        <\/div>
        <div class="iright">
          <div class="ipct">${pct}%<\/div>
          <div class="ibar"><div class="ibarf" style="width:${pct}%"><\/div><\/div>
          <div class="ichev ${isExp?'open':''}"  >›<\/div>
        <\/div>
      <\/div>
      <div class="tlist">${trows}
        <div class="addtrow"><button class="addtbtn" onclick="event.stopPropagation();openAdd('${item.item_id}')">＋ タスクを追加<\/button><\/div>
      <\/div>
    <\/div>`;
  });
  let reviewHtml='';
  if(highlightPrev && mtDates.length){
    const pis=items.filter(it=>prevItems.has(it.item_id));
    const chips=mtDates.map(d=>`<button class="rvchip ${d===prevMtDate?'on':''}" onclick="event.stopPropagation();setReviewDate('${d}')">${d}<\/button>`).join('');
    let body='';
    pis.forEach(it=>{
      const nts=tasks.filter(t=>t.item_id===it.item_id).map(t=>{const nt=prevNote(t.memo);return nt?`<div class="rvnote">・<b>${esc(t.task_content)}<\/b>：${esc(nt)}<\/div>`:'';}).join('');
      body+=`<div class="rvitem" onclick="clickItem('${it.item_id}')"><div class="rvname"><span class="rvnum">${it.item_num}<\/span><span class="rvdept">${it.dept}<\/span>${esc(it.item_name)}<\/div>${nts||'<div class="rvempty">（この項目のタスクにこの日のメモなし）<\/div>'}<\/div>`;
    });
    if(!pis.length) body='<div class="rvempty" style="padding:8px 10px">この日の議事録はありません<\/div>';
    reviewHtml=`<div class="rvpanel"><div class="rvhdr" onclick="toggleReview()"><span>🔆 MT議事録の振り返り<\/span><span class="rvcnt">${pis.length}<\/span><span class="rvarr ${reviewOpen?'open':''}">›<\/span><\/div><div class="rvbody" ${reviewOpen?'':'style="display:none"'}><div class="rvchips">${chips}<\/div>${body}<\/div><\/div>`;
  }
  document.getElementById('leftScroll').innerHTML=reviewHtml+(html||'<div style="text-align:center;padding:30px;color:var(--sub);font-size:13px">該当なし<\/div>');
}

function renderExt(id){
  const ts=tasks.filter(t=>t.item_id===id);

    const dc=['未着手','実行中','完了','完了(継続)'].indexOf(t.status);
    const cls=['d0','d1','d2','d3','d0'][dc<0?4:dc];

// ===== アジェンダ（スプレッドシートで全員共有） =====
function computeAgenda(){
  agenda = new Set(items.filter(it=>String(it.agenda||'')==='1').map(it=>it.item_id));
}
function toggleAg(id){
  const it=items.find(i=>i.item_id===id); if(!it) return;
  const on=!agenda.has(id);
  it.agenda = on ? '1' : '';
  if(on) agenda.add(id); else agenda.delete(id);

function renderAgenda(){

function toggleAgPane(){
  const b=document.getElementById('agendaBody'), a=document.getElementById('agarr');
  const isOpen=b.style.display!=='none';
  b.style.display=isOpen?'none':'block';
  a.classList.toggle('open',!isOpen);
}
function resetAgenda(){
  if(!agenda.size){toast('アジェンダは空です');return;}
  if(!confirm(`アジェンダ${agenda.size}件をリセットします。\n※全員のアジェンダが対象です。よろしいですか？`)) return;
  const ids=[...agenda];
  ids.forEach(id=>{ const it=items.find(i=>i.item_id===id); if(it) it.agenda=''; });
  agenda.clear(); saveAll();
  ids.forEach(id=> gp('updateItem',{item_id:id, agenda:''}));

}

function saveInlineTask(){

function clearMt(){
  document.getElementById('mtText').value='';
}

// 議事録を会議日ごとのエントリに分解
function parseMemo(memo){
  if(!memo) return [];
  const re=/\[(\d{4}-\d{2}-\d{2})\]\s*([\s\S]*?)(?=\s*\/\s*\[\d{4}-\d{2}-\d{2}\]|$)/g;
  const out=[]; let m;
  while((m=re.exec(memo))){ out.push({date:m[1], text:m[2].trim()}); }
  if(!out.length && memo.trim()) out.push({date:'', text:memo.trim()});
  return out;
}
// これまでの議事録（履歴）を表示（各行を編集・削除可能）
let editingEntryIdx=-1;
function renderTaskMemo(taskId){
  const box=document.getElementById('mtHistory');
  if(!box) return;
  const t=tasks.find(x=>x.task_id===taskId);
  const entries=t?parseMemo(t.memo||''):[];
  box.style.display='block';
  if(!entries.length){ editingEntryIdx=-1; box.innerHTML='<div class="mh-empty">これまでの議事録はありません<\/div>'; return; }
  box.innerHTML='<div class="mh-title">これまでの議事録<\/div>'+entries.map((e,i)=>{
    const isPrev=e.date&&e.date===prevMtDate;
    if(i===editingEntryIdx){
      return `<div class="mh-entry ${isPrev?'mh-prev':''}"><span class="mh-date">${e.date||'日付なし'}<\/span><textarea class="mh-edit" id="mhEdit${i}">${esc(e.text)}<\/textarea><div class="mh-ebtns"><button class="mh-b del" onclick="deleteEntry(${i})">🗑 削除<\/button><button class="mh-b" onclick="cancelEditEntry()">取消<\/button><button class="mh-b save" onclick="saveEntry(${i})">保存<\/button><\/div><\/div>`;
    }
    return `<div class="mh-entry ${isPrev?'mh-prev':''}"><div class="mh-erow"><span class="mh-date">${e.date||'日付なし'}<\/span><button class="mh-editbtn" onclick="editEntry(${i})" title="この議事録を編集">✏️<\/button><\/div><div class="mh-text">${esc(e.text)}<\/div><\/div>`;
  }).join('');
}
function editEntry(i){ editingEntryIdx=i; renderTaskMemo(selTaskId); }
function cancelEditEntry(){ editingEntryIdx=-1; renderTaskMemo(selTaskId); }
function rebuildMemo(entries){ return entries.filter(e=>e.text&&e.text.trim()).map(e=>e.date?('['+e.date+'] '+e.text.trim()):e.text.trim()).join(' / '); }
function saveEntry(i){
  const ta=document.getElementById('mhEdit'+i); if(!ta) return;
  const idx=tasks.findIndex(x=>x.task_id===selTaskId); if(idx<0) return;
  const entries=parseMemo(tasks[idx].memo||'');
  if(i<0 || i>=entries.length) return;
  entries[i].text=ta.value.trim();
  const newMemo=rebuildMemo(entries);
  tasks[idx].memo=newMemo; saveAll(); editingEntryIdx=-1;
  computePrevMt(); renderTaskMemo(selTaskId); renderExt(selId); renderLeft();
  toast('議事録を更新しました','ok');
  gp('updateTask',{task_id:selTaskId, memo:newMemo});
}
function deleteEntry(i){
  const idx=tasks.findIndex(x=>x.task_id===selTaskId); if(idx<0) return;
  const entries=parseMemo(tasks[idx].memo||'');
  if(i<0 || i>=entries.length) return;
  if(!confirm('この議事録（'+(entries[i].date||'日付なし')+'）を削除しますか？')) return;
  entries.splice(i,1);
  const newMemo=rebuildMemo(entries);
  tasks[idx].memo=newMemo; saveAll(); editingEntryIdx=-1;
  computePrevMt(); renderTaskMemo(selTaskId); renderExt(selId); renderLeft();
  toast('議事録を削除しました','ok');
  gp('updateTask',{task_id:selTaskId, memo:newMemo});
}

function saveMemo(){
  if(mtMode!=='task' || !selTaskId) return;
  const note=document.getElementById('mtText').value.trim();
  if(!note){ toast('今回の議事録が空です'); return; }
  const d=document.getElementById('mtDate').value||td();
  const entry='['+d+'] '+note;
  const idx=tasks.findIndex(t=>t.task_id===selTaskId);
  if(idx<0) return;
  const base=(tasks[idx].memo||'').trim();
  const newMemo=base ? base+' / '+entry : entry;
  // 楽観更新：先に画面へ即反映（保存待ちなし＝速い）
  tasks[idx].memo=newMemo; saveAll();
  document.getElementById('mtText').value='';
  computePrevMt(); renderTaskMemo(selTaskId); renderExt(selId); renderLeft();
  toast('議事録を追記しました','ok');
  // 背景でクラウド保存（失敗時は gp() がオフライン表示＋通知）
  gp('updateTask',{task_id:selTaskId, memo:newMemo});
}


// ===== タスク編集 =====
function openEdit(tid){
  const t=tasks.find(t=>t.task_id===tid);
  if(!t) return;
  document.getElementById('mTitle').textContent='タスク編集';
  document.getElementById('eId').value=tid;
  document.getElementById('eItemId').value='';
  document.getElementById('eContent').value=t.task_content||'';
  document.getElementById('eGoal').value=t.goal||'';
  document.getElementById('eTantou').value=t.tantou||'';
  document.getElementById('eHanan').value=t.hanan_date||'';
  document.getElementById('eYotei').value=t.yotei_date||'';
  document.getElementById('eKanryo').value=t.kanryo_date||'';
  document.getElementById('eMemo').value=t.memo||'';
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('on',b.dataset.s===(t.status||'未着手')));
  document.getElementById('taskDelBtn').style.display='inline-flex';
  document.getElementById('taskMo').style.display='flex';
}
function openAdd(iid){
  document.getElementById('mTitle').textContent='タスク追加';
  document.getElementById('eId').value='';
  document.getElementById('eItemId').value=iid;
  ['eContent','eGoal','eTantou','eYotei','eKanryo','eMemo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('eHanan').value=td();
  document.querySelectorAll('.sbtn').forEach(b=>b.classList.toggle('on',b.dataset.s==='未着手'));
  document.getElementById('taskDelBtn').style.display='none';
  document.getElementById('taskMo').style.display='flex';
}
function selS(btn){document.querySelectorAll('.sbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
async function saveTask(){
  const tid=document.getElementById('eId').value;
  const status=document.querySelector('.sbtn.on')?.dataset.s||'未着手';
  const payload={task_content:document.getElementById('eContent').value,goal:document.getElementById('eGoal').value,tantou:document.getElementById('eTantou').value,status,hanan_date:document.getElementById('eHanan').value,yotei_date:document.getElementById('eYotei').value,kanryo_date:document.getElementById('eKanryo').value,memo:document.getElementById('eMemo').value};
  if(tid){
    payload.task_id=tid;
    const idx=tasks.findIndex(t=>t.task_id===tid);
    if(idx>=0) Object.assign(tasks[idx],payload);
    gp('updateTask',payload);
    toast('更新しました','ok');
  } else {
    const iid=document.getElementById('eItemId').value;
    const mx=tasks.reduce((m,t)=>{const n=parseInt((t.task_id||'').replace('TASK-',''));return isNaN(n)?m:Math.max(m,n);},0);
    const nid='TASK-'+String(mx+1).padStart(4,'0');
    tasks.push({task_id:nid,item_id:iid,...payload});
    gp('addTask',{item_id:iid,...payload});
    toast('追加しました','ok');
  }
  saveAll(); renderLeft();
  if(selId) renderExt(selId);
  closeM('taskMo');
}

// ===== 改善項目追加 =====
function openAddItem(){
  document.getElementById('niName').value='';
  document.getElementById('niGoal').value='';
  document.getElementById('addItemMo').style.display='flex';
  setTimeout(()=>document.getElementById('niName').focus(),80);
}
function saveNewItem(){
  const name=document.getElementById('niName').value.trim();
  if(!name){toast('項目名を入力してください','err');return;}
  const dept=document.getElementById('niDept').value;
  const goal=document.getElementById('niGoal').value.trim();
  const mx=items.reduce((m,it)=>Math.max(m,it.item_num||0),0);
  const nid='ITEM-'+String(mx+1).padStart(3,'0');
  items.push({item_id:nid,item_num:mx+1,dept,item_name:name,goal});
  agenda.add(nid);
  saveAll();
  gp('addItem',{dept,item_name:name,goal});
  renderLeft(); renderAgenda();
  closeM('addItemMo');
  clickItem(nid);
  toast(`📌「${name}」をアジェンダに追加しました`,'ok');
}

// ===== タスク削除 =====
function deleteTask(tid){
  if(!tid) return;
  const t=tasks.find(x=>x.task_id===tid);
  if(!t) return;
  if(!confirm(`タスク「${t.task_content}」を削除します。\nこの操作は元に戻せません。よろしいですか？`)) return;
  tasks=tasks.filter(x=>x.task_id!==tid);
  saveAll();
  gp('deleteTask',{task_id:tid});
  closeM('taskMo');
  if(selTaskId===tid) switchToItemMode();
  renderLeft(); if(selId) renderExt(selId); renderAgenda(); renderDash();
  toast('タスクを削除しました','ok');
}

// ===== 改善項目の編集（部署変更など） =====
function openEditItem(){
  if(!selId) return;
  const it=items.find(i=>i.item_id===selId);
  if(!it) return;
  document.getElementById('eiItemId').value=it.item_id;
  document.getElementById('eiDept').value=it.dept;
  document.getElementById('eiName').value=it.item_name||'';
  document.getElementById('eiGoal').value=it.goal||'';
  document.getElementById('editItemMo').style.display='flex';
}
function saveEditItem(){
  const id=document.getElementById('eiItemId').value;
  const idx=items.findIndex(i=>i.item_id===id);
  if(idx<0) return;
  const dept=document.getElementById('eiDept').value;
  const name=document.getElementById('eiName').value.trim();
  const goal=document.getElementById('eiGoal').value.trim();
  if(!name){ toast('項目名を入力してください','err'); return; }
  items[idx].dept=dept; items[idx].item_name=name; items[idx].goal=goal;
  saveAll();
  gp('updateItem',{item_id:id,dept,item_name:name,goal});
  document.getElementById('selTitle').textContent=name;
  document.getElementById('selDept').textContent=`部署：${dept}　ゴール：${goal||'—'}`;
  closeM('editItemMo');
  renderLeft(); renderAgenda();
  toast('改善項目を更新しました','ok');
}
function deleteCurrentItem(){
  const id=document.getElementById('eiItemId').value||selId;
  if(!id) return;
  const it=items.find(i=>i.item_id===id);
  if(!it) return;
  const n=tasks.filter(t=>t.item_id===id).length;
  if(!confirm(`改善項目「${it.item_name}」を削除します。\n紐づくタスク${n}件も一緒に削除されます。\nこの操作は元に戻せません。よろしいですか？`)) return;
  items=items.filter(i=>i.item_id!==id);
  tasks=tasks.filter(t=>t.item_id!==id);
  agenda.delete(id); localStorage.setItem('ka',JSON.stringify([...agenda]));
  saveAll();
  gp('deleteItem',{item_id:id});
  closeM('editItemMo');
  selId=null;
  document.getElementById('noSel').style.display='flex';
  document.getElementById('rightContent').style.display='none';
  renderLeft(); renderAgenda(); renderDash();
  toast('改善項目を削除しました','ok');
}

// ===== ダッシュボード =====
function renderDash(){
  const total=tasks.length;
  const kanryo=tasks.filter(t=>t.status==='完了'||t.status==='完了(継続)').length;
  const jikko=tasks.filter(t=>t.status==='実行中').length;
  const mi=tasks.filter(t=>t.status==='未着手').length;
  const pct=total?Math.round(kanryo/total*100):0;
  const today=td();
  const ov=tasks.filter(t=>t.yotei_date&&t.yotei_date<today&&t.status!=='完了'&&t.status!=='完了(継続)').length;
  const stats=[{l:'全タスク',v:total,s:'件',b:100,c:''},{l:'完了',v:kanryo,s:`件(${pct}%)`,b:pct,c:'#22c55e'},{l:'実行中',v:jikko,s:'件',b:Math.round(jikko/total*100)||0,c:'#3b82f6'},{l:'未着手',v:mi,s:'件',b:Math.round(mi/total*100)||0,c:'#94a3b8'},{l:'期限超過',v:ov,s:'件',b:Math.round(ov/total*100)||0,c:'#ef4444'},{l:'改善項目',v:items.length,s:'件',b:100,c:''}];
  document.getElementById('statsGrid').innerHTML=stats.map(s=>`<div class="sc"><div class="sl">${s.l}<\/div><div class="sv" ${s.c?`style="color:${s.c}"`:''}>${s.v}<\/div><div class="ss">${s.s}<\/div><div class="sb"><div class="sbf" style="width:${s.b}%;${s.c?`background:${s.c}`:''}">&nbsp;<\/div><\/div><\/div>`).join('');
  document.getElementById('deptGrid').innerHTML=DEPTS.map(dept=>{
    const di=items.filter(it=>it.dept===dept);
    const ids=di.map(it=>it.item_id);
    const dt=tasks.filter(t=>ids.includes(t.item_id));
    if(!dt.length) return '';
    const dn=dt.filter(t=>t.status==='完了'||t.status==='完了(継続)').length;
    const dp=Math.round(dn/dt.length*100);
    const sc={};dt.forEach(t=>{const s=t.status||'未定';sc[s]=(sc[s]||0)+1;});
    return `<div class="dc"><div class="dh"><div class="dn">【${dept}】<\/div><div class="dp">${dp}%<\/div><\/div><div class="db"><div class="dbf" style="width:${dp}%"><\/div><\/div><div class="dbs">${Object.entries(sc).map(([s,c])=>`<span class="dbg ${{未着手:'b0',実行中:'b1',完了:'b2','完了(継続)':'b3'}[s]||'bx'}">${s}: ${c}<\/span>`).join('')}<\/div><\/div>`;
  }).join('');
}

// ===== ユーティリティ =====
function closeM(id){document.getElementById(id).style.display='none';}
function closeIf(e,id){if(e.target.classList.contains('movl'))closeM(id);}
function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=type?type:'';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
