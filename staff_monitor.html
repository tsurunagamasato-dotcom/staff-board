<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員所在地ボード — モニター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width:100%; height:100%; font-family:'Noto Sans JP',sans-serif; background:#f0eeea; overflow:hidden; }

  .slide-wrap { width:100%; height:100%; position:relative; }

  .slide {
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transition:opacity 0.6s ease; pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:auto; }

  /* HEADER */
  .slide-header {
    padding: 24px 48px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0;
  }
  .slide-location { display:flex; align-items:center; gap:14px; }
  .location-dot { width:18px; height:18px; border-radius:50%; flex-shrink:0; }
  .location-name { font-size:48px; font-weight:900; letter-spacing:-1px; line-height:1; }
  .location-subtitle { font-size:16px; opacity:0.5; margin-top:4px; font-weight:400; }
  .location-count { font-size:24px; font-weight:500; opacity:0.55; margin-left:6px; color:#333; }
  .slide-meta { text-align:right; }
  .slide-company { font-size:12px; font-weight:500; opacity:0.5; color:#333; }
  .slide-clock { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

  /* PROGRESS */
  .progress-bar {
    height:3px; flex-shrink:0; margin:8px 48px 10px;
    border-radius:999px; overflow:hidden; background:rgba(0,0,0,0.1);
  }
  .progress-fill { height:100%; border-radius:999px; width:0%; transition:width linear; }

  /* GRID */
  .slide-body { flex:1; overflow:hidden; padding:0 48px 20px; }

  .staff-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:10px;
    align-content:start;
  }

  .staff-card {
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:12px;
    padding:14px 16px;
    position:relative; overflow:hidden;
  }
  .staff-card.non-default {
    background:rgba(255,255,255,0.75);
    border-color:rgba(186,117,23,0.6);
  }
  .staff-card.non-default::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:4px; background:#BA7517; border-radius:10px 0 0 10px;
  }

  .card-name {
    font-size:22px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:4px; line-height:1.3;
  }
  .card-name.long {
    font-size:15px;
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
    line-height:1.25;
  }
  .card-dept { font-size:14px; opacity:0.6; color:#333; margin-bottom:3px; }
  .card-time { font-size:10px; opacity:0.45; color:#444; margin-top:3px; }

  .empty-msg { flex:1; display:flex; align-items:center; justify-content:center; font-size:18px; opacity:0.3; font-weight:500; }

  /* INDICATORS */
  .indicators {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:200;
  }
  .ind-dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(0,0,0,0.15); cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .ind-dot.active { background:rgba(0,0,0,0.6); transform:scale(1.3); }

  /* SYNC */
  .sync-badge {
    position:fixed; top:16px; right:16px;
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:999px;
    font-size:11px; z-index:200; backdrop-filter:blur(4px); color:#444;
  }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:#1D9E75; }
  .sync-dot.syncing { background:#BA7517; animation:pulse 1s infinite; }
  .sync-dot.error   { background:#E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .sync-text { font-size:11px; opacity:0.7; }

  /* CONTROLS */
  .controls { position:fixed; bottom:50px; right:20px; display:flex; flex-direction:column; gap:6px; z-index:200; }
  .ctrl-btn {
    width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.1); border:1px solid rgba(0,0,0,0.15);
    color:rgba(0,0,0,0.6); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; font-family:inherit;
  }
  .ctrl-btn:hover { background:rgba(0,0,0,0.18); }
  .ctrl-btn.paused { background:rgba(186,117,23,0.2); color:#BA7517; }

  .interval-select {
    position:fixed; bottom:20px; right:20px;
    background:rgba(255,255,255,0.7); backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,0.15); border-radius:8px;
    color:rgba(0,0,0,0.6); font-size:12px; padding:4px 8px;
    font-family:inherit; cursor:pointer; z-index:200;
  }
  .interval-select option { background:#fff; color:#1a1a1a; }

  .loading-overlay {
    position:fixed; inset:0; z-index:400; background:#f0eeea;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  .loading-spinner {
    width:36px; height:36px; border:3px solid rgba(0,0,0,0.1); border-top-color:#1D9E75;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:rgba(255,255,255,0.4); }

  /* VIEW TOGGLE */
  .view-toggle {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 200;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(0,0,0,0.12); border-radius: 999px; padding: 4px;
  }
  .view-toggle-btn {
    padding: 6px 18px; border-radius: 999px; border: none;
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: transparent; color: rgba(0,0,0,0.5); transition: all .15s;
  }
  .view-toggle-btn.active { background: #1a1a1a; color: #fff; }

  /* 部署別カードのバッジ */
  .status-badge-sm {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 999px;
    font-size: 13px; font-weight: 700;
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">データを読み込んでいます...</div>
</div>

<div class="view-toggle">
  <button class="view-toggle-btn active" id="btnLocation" onclick="setViewMode('location')">📍 居場所別</button>
  <button class="view-toggle-btn" id="btnDept" onclick="setViewMode('dept')">🏢 部署別</button>
</div>
<div class="slide-wrap" id="slideWrap"></div>
<div class="indicators" id="indicators"></div>

<div class="sync-badge">
  <span class="sync-dot" id="syncDot"></span>
  <span class="sync-text" id="syncText">--</span>
</div>

<a href="staff_search.html" style="
  position:fixed; bottom:130px; right:20px; z-index:200;
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
  border:1px solid rgba(0,0,0,0.15); border-radius:999px;
  padding:8px 16px; text-decoration:none;
  color:#1a1a1a; font-size:13px; font-weight:700;
  font-family:inherit; transition:background .15s;
" onmouseover="this.style.background='rgba(255,255,255,1)'" onmouseout="this.style.background='rgba(255,255,255,0.85)'">
  🔍 個人検索
</a>
<div class="controls">
  <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" title="一時停止/再生">⏸</button>
  <button class="ctrl-btn" onclick="prevSlide()" title="前へ">‹</button>
  <button class="ctrl-btn" onclick="nextSlide()" title="次へ">›</button>
</div>

<select class="interval-select" id="intervalSelect" onchange="changeInterval(this.value)">
  <option value="5000">5秒</option>
  <option value="8000" selected>8秒</option>
  <option value="10000">10秒</option>
  <option value="15000">15秒</option>
  <option value="20000">20秒</option>
</select>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwT7aSD1CmIOp_TlVa3yzUZr99b-yzMd5h_--kgweBABdyW8SnRMscd3cdWlTp6GsQzUQ/exec';
const FETCH_INTERVAL = 15000;

// STAFF_MASTERはGASから動的取得（起動時に読み込み）
let STAFF_MASTER = [];

// state
let state = {};

function initState() {
  state = {};
  STAFF_MASTER.forEach(s => { state[s.id] = { status: s.base, updated: '', memo: '', leaveStart: '', leaveEnd: '' }; });
}

// スライド定義
const SLIDE_DEFS = [
  { label:'本社事務所①', subtitle:'社長・役員・総務部・営業部',
    color:'#1D9E75', bg:'linear-gradient(135deg,#c8ede3,#d8f4ec)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha1' },
  { label:'本社事務所②', subtitle:'設計課・第一製造部',
    color:'#1D9E75', bg:'linear-gradient(135deg,#b8e8d8,#caeee3)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha2' },
  { label:'本社事務所③', subtitle:'電気課・購買課',
    color:'#1D9E75', bg:'linear-gradient(135deg,#a8e0ce,#beeadb)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha3' },
  { label:'本社工場', subtitle:'',
    color:'#0e7fa8', bg:'linear-gradient(135deg,#c0e8f4,#d0f0fa)',
    filter: m => state[m.id] && state[m.id].status==='honsha_factory' },
  { label:'根崎', subtitle:'加工課',
    color:'#185FA5', bg:'linear-gradient(135deg,#c4d8f0,#d4e6f8)',
    filter: m => state[m.id] && state[m.id].status==='nezaki' },
  { label:'根崎第2', subtitle:'組付課・購買課',
    color:'#534AB7', bg:'linear-gradient(135deg,#d0cef4,#dddcfa)',
    filter: m => state[m.id] && state[m.id].status==='nezaki2' },
  { label:'外出/出張', subtitle:'',
    color:'#BA7517', bg:'linear-gradient(135deg,#f8e4c0,#faeece)',
    filter: m => state[m.id] && state[m.id].status==='gaishutsu' },
  { label:'在宅', subtitle:'',
    color:'#639922', bg:'linear-gradient(135deg,#d4edb8,#e0f4c8)',
    filter: m => state[m.id] && state[m.id].status==='zaitaku' },
  { label:'休み', subtitle:'',
    color:'#888780', bg:'linear-gradient(135deg,#e4e2da,#eceae2)',
    filter: m => state[m.id] && state[m.id].status==='yasumi' },
];

// 部署別スライド定義
const DEPT_SLIDE_DEFS = [
  { label:'社長・役員',  depts:['社長','役員'],     color:'#534AB7', bg:'linear-gradient(135deg,#d0cef4,#dddcfa)' },
  { label:'総務部',      depts:['総務部'],           color:'#1D9E75', bg:'linear-gradient(135deg,#c8ede3,#d8f4ec)' },
  { label:'営業部',      depts:['営業部'],           color:'#1D9E75', bg:'linear-gradient(135deg,#b8e8d8,#caeee3)' },
  { label:'購買課',      depts:['購買課'],           color:'#0e7fa8', bg:'linear-gradient(135deg,#c0e8f4,#d0f0fa)' },
  { label:'設計課・第一製造部', depts:['設計課','第一製造部'], color:'#185FA5', bg:'linear-gradient(135deg,#c4d8f0,#d4e6f8)' },

  { label:'電気課',      depts:['電気課'],           color:'#185FA5', bg:'linear-gradient(135deg,#b8d0ec,#c8e0f4)' },
  { label:'加工課',      depts:['加工課'],           color:'#BA7517', bg:'linear-gradient(135deg,#f8e4c0,#faeece)' },
  { label:'組付課',      depts:['組付課'],           color:'#639922', bg:'linear-gradient(135deg,#d4edb8,#e0f4c8)' },
];

const STATUS_BADGE_MAP = {
  honsha_office:  { label:'本社事務所', bg:'#e8f5f0', fg:'#0f6e56', dot:'#1D9E75' },
  honsha_factory: { label:'本社工場',   bg:'#e0f4fa', fg:'#084f6a', dot:'#0e7fa8' },
  nezaki:         { label:'根崎',       bg:'#e6f1fb', fg:'#0c447c', dot:'#185FA5' },
  nezaki2:        { label:'根崎第2',    bg:'#eeedfe', fg:'#3c3489', dot:'#534AB7' },
  gaishutsu:      { label:'外出/出張',  bg:'#faeeda', fg:'#633806', dot:'#BA7517' },
  zaitaku:        { label:'在宅',       bg:'#eaf3de', fg:'#27500a', dot:'#639922' },
  yasumi:         { label:'休み',       bg:'#f1efe8', fg:'#444441', dot:'#888780' },
};

let viewMode = 'location'; // 'location' or 'dept'
let currentIndex = 0;
let slideInterval = 8000;
let isPaused = false;
let slideTimer = null;
let progressTimer = null;
let slideKeys = [];

function updateClock() {
  const now = new Date();
  const str = now.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}) + ' ' +
    now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.slide-clock').forEach(el => el.textContent = str);
}
updateClock();
setInterval(updateClock, 10000);

function setSyncStatus(st, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (st==='syncing'?' syncing':st==='error'?' error':'');
  document.getElementById('syncText').textContent = msg;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return (d.getMonth()+1) + '/' + d.getDate();
}

async function loadStaffMaster() {
  try {
    const res = await fetch(GAS_URL + '?action=getStaff&t=' + Date.now());
    const json = await res.json();
    if (json.ok && json.staff && json.staff.length > 0) {
      STAFF_MASTER = json.staff.map(s => ({
        id: parseInt(s.id),
        name: s.name,
        dept: s.dept,
        base: s.defaultPlace || 'honsha_office',
        slide: s.slide || 'honsha1'
      }));
      initState();
    }
  } catch(e) {
    console.log('staffマスタ取得失敗:', e);
  }
}

async function fetchAll(silent=false) {
  if (!silent) setSyncStatus('syncing','取得中...');
  try {
    const res = await fetch(GAS_URL + '?t=' + Date.now());
    const json = await res.json();
    if (!json.ok) throw new Error();
    json.data.forEach(row => {
      const id = parseInt(row.id);
      if (!isNaN(id) && state[id]!==undefined && row.status) {
        state[id] = { status: row.status, updated: row.updated||'', memo: row.memo||'', leaveStart: row.leaveStart||'', leaveEnd: row.leaveEnd||'' };
      }
    });
    const t = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok', t+' 更新');
    if (viewMode==='location') rebuildSlides(); else rebuildDeptSlides();
  } catch(e) { setSyncStatus('error','通信エラー'); }
}

function rebuildSlides() {
  // 0名スライドはスキップ（本社工場・外出・在宅・休みのみ）
  slideKeys = SLIDE_DEFS
    .map((def,idx) => idx)
    .filter(idx => {
      const members = STAFF_MASTER.filter(SLIDE_DEFS[idx].filter);
      // 本社①②③は常に表示、その他は0名ならスキップ
      if (idx <= 2) return true;
      return members.length > 0;
    });

  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  slideKeys.forEach((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    const members = STAFF_MASTER.filter(def.filter);

    const slide = document.createElement('div');
    slide.className = 'slide' + (idx===currentIndex?' active':'');
    slide.id = 'slide-' + idx;
    slide.style.background = def.bg;
    slide.style.color = '#1a1a1a';

    const cardsHtml = members.length > 0
      ? `<div class="staff-grid">${members.map(m => {
          const isNonDefault = state[m.id].status !== m.base;
          return `<div class="staff-card ${isNonDefault?'non-default':''}">
            <div class="card-name ${m.name.length > 12 ? 'long' : ''}">${m.name}</div>
            <div class="card-dept">${m.dept}</div>
            ${state[m.id].memo?`<div class="card-time" style="color:#1a0a00;font-size:15px;font-weight:900;margin-top:4px;">📍 ${state[m.id].memo}</div>`:''}
            ${(state[m.id].leaveStart && state[m.id].leaveEnd) ? `<div class="card-time" style="color:#00132a;font-size:15px;font-weight:900;margin-top:4px;">📅 ${formatDate(state[m.id].leaveStart)}〜${formatDate(state[m.id].leaveEnd)}</div>` : ''}
            ${state[m.id].updated?`<div class="card-time" style="color:#333;font-size:13px;">${state[m.id].updated}</div>`:''}
          </div>`;
        }).join('')}</div>`
      : `<div class="empty-msg">現在この場所にいる社員はいません</div>`;

    slide.innerHTML = `
      <div class="slide-header">
        <div class="slide-location">
          <div class="location-dot" style="background:${def.color};"></div>
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${def.label}</span>
              <span class="location-count">${members.length}名</span>
            </div>
            ${def.subtitle?`<div class="location-subtitle">${def.subtitle}</div>`:''}
          </div>
        </div>
        <div class="slide-meta">
          <div class="slide-company">Nakashima Manufacturing</div>
          <div class="slide-clock"></div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-${idx}" style="background:${def.color};"></div>
      </div>
      <div class="slide-body">${cardsHtml}</div>
    `;
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}"
      style="${idx===currentIndex?`background:${def.color};`:''}"
      onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  if (currentIndex >= slideKeys.length) currentIndex = 0;
  showSlide(currentIndex, false);
}

function showSlide(idx, animate=true) {
  currentIndex = idx;
  document.querySelectorAll('.slide').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.ind-dot').forEach((el,i) => {
    const def = SLIDE_DEFS[slideKeys[i]];
    el.classList.toggle('active', i===idx);
    el.style.background = i===idx ? def.color : '';
  });
  startProgress(idx);
}

function startProgress(idx) {
  clearInterval(progressTimer);
  const fill = document.getElementById('progress-'+idx);
  if (!fill) return;
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${slideInterval}ms linear`;
    fill.style.width = '100%';
  }));
}

function nextSlide() { showSlide((currentIndex+1)%slideKeys.length); resetTimer(); }
function prevSlide() { showSlide((currentIndex-1+slideKeys.length)%slideKeys.length); resetTimer(); }
function goSlide(idx) { showSlide(idx); resetTimer(); }

function resetTimer() {
  clearInterval(slideTimer);
  if (!isPaused) slideTimer = setInterval(nextSlide, slideInterval);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = isPaused ? '▶' : '⏸';
  btn.classList.toggle('paused', isPaused);
  if (isPaused) {
    clearInterval(slideTimer);
    const fill = document.getElementById('progress-'+currentIndex);
    if (fill) { const w = getComputedStyle(fill).width; fill.style.transition='none'; fill.style.width=w; }
  } else { resetTimer(); startProgress(currentIndex); }
}

function changeInterval(val) { slideInterval=parseInt(val); resetTimer(); startProgress(currentIndex); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prevSlide();
  if (e.key===' ') { e.preventDefault(); togglePause(); }
  if (e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.();
});

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btnLocation').classList.toggle('active', mode==='location');
  document.getElementById('btnDept').classList.toggle('active', mode==='dept');
  currentIndex = 0;
  clearInterval(slideTimer);
  if (mode==='location') rebuildSlides();
  else rebuildDeptSlides();
  slideTimer = setInterval(nextSlide, slideInterval);
}

function rebuildDeptSlides() {
  slideKeys = DEPT_SLIDE_DEFS.map((_,idx) => idx);
  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  slideKeys.forEach((defIdx, idx) => {
    const def = DEPT_SLIDE_DEFS[defIdx];
    const members = STAFF_MASTER.filter(m => def.depts.includes(m.dept));

    const slide = document.createElement('div');
    slide.className = 'slide' + (idx===currentIndex?' active':'');
    slide.id = 'slide-' + idx;
    slide.style.background = def.bg;
    slide.style.color = '#1a1a1a';

    const cardsHtml = members.length > 0
      ? `<div class="staff-grid">${members.map(m => {
          const st = state[m.id];
          const badge = STATUS_BADGE_MAP[st.status] || STATUS_BADGE_MAP['honsha_office'];
          const isNonDefault = st.status !== m.base;
          // 本社系は①②③で表示
          const slideLabel = {
            'honsha1': '本社①', 'honsha2': '本社②', 'honsha3': '本社③',
            'nezaki': '根崎', 'nezaki2': '根崎第2'
          };
          let displayLabel = badge.label;
          if (st.status === 'honsha_office' && m.slide) {
            displayLabel = slideLabel[m.slide] || badge.label;
          }
          return `<div class="staff-card ${isNonDefault?'non-default':''}">
            <div class="card-name ${m.name.length > 12 ? 'long' : ''}">${m.name}</div>
            <span class="status-badge-sm" style="background:${badge.bg};color:${badge.fg};">
              <span style="width:5px;height:5px;border-radius:50%;background:${badge.dot};display:inline-block;"></span>
              ${displayLabel}
            </span>
            ${st.memo?`<div class="card-time" style="color:#3d1f00;font-size:12px;font-weight:700;margin-top:2px;">📍 ${st.memo}</div>`:''}
            ${st.updated?`<div class="card-time" style="color:#333;font-size:13px;">${st.updated}</div>`:''}
          </div>`;
        }).join('')}</div>`
      : `<div class="empty-msg">メンバーがいません</div>`;

    slide.innerHTML = `
      <div class="slide-header">
        <div class="slide-location">
          <div class="location-dot" style="background:${def.color};"></div>
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${def.label}</span>
              <span class="location-count">${members.length}名</span>
            </div>
          </div>
        </div>
        <div class="slide-meta">
          <div class="slide-company">Nakashima Manufacturing</div>
          <div class="slide-clock"></div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-${idx}" style="background:${def.color};"></div>
      </div>
      <div class="slide-body">${cardsHtml}</div>
    `;
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = DEPT_SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}"
      style="${idx===currentIndex?`background:${def.color};`:''}"
      onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  showSlide(currentIndex, false);
}

async function init() {
  await loadStaffMaster();
  rebuildSlides();
  await fetchAll(false);
  document.getElementById('loadingOverlay').style.display = 'none';
  slideTimer = setInterval(nextSlide, slideInterval);
  setInterval(() => fetchAll(true), FETCH_INTERVAL);
}

init();
</script>
</body>
</html>
