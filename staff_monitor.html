<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員所在地ボード — モニター</title>
<style>
  /* ===== 最適化①: 2ウェイト(400,700) + display=swap ===== */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width:100%; height:100%; font-family:'Noto Sans JP',sans-serif; background:#f0eeea; overflow:hidden; }

  .slide-wrap { width:100%; height:100%; position:relative; }

  .slide {
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transition:opacity 0.6s ease; pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:auto; }

  /* HEADER */
  .slide-header {
    padding: 24px 48px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0;
  }
  .slide-location { display:flex; align-items:center; gap:14px; }
  .location-dot { width:18px; height:18px; border-radius:50%; flex-shrink:0; }
  .location-name { font-size:48px; font-weight:700; letter-spacing:-1px; line-height:1; }
  .location-subtitle { font-size:16px; opacity:0.5; margin-top:4px; font-weight:400; }
  .location-count { font-size:24px; font-weight:400; opacity:0.55; margin-left:6px; color:#333; }
  .slide-meta { text-align:right; }
  .slide-company { font-size:12px; font-weight:400; opacity:0.5; color:#333; }
  .slide-clock { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

  /* PROGRESS */
  .progress-bar {
    height:3px; flex-shrink:0; margin:8px 48px 10px;
    border-radius:999px; overflow:hidden; background:rgba(0,0,0,0.1);
  }
  .progress-fill { height:100%; border-radius:999px; width:0%; transition:width linear; }

  /* GRID */
  .slide-body { flex:1; overflow:hidden; padding:0 48px 20px; }

  :root { --card-min-width: 200px; --card-name-size: 22px; --card-name-long-size: 15px; }
  .staff-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
    gap:10px;
    align-content:start;
  }
  .card-name:not(.long) { font-size: var(--card-name-size) !important; }
  .card-name.long { font-size: var(--card-name-long-size) !important; }

  .staff-card {
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:12px;
    padding:14px 16px;
    position:relative; overflow:hidden;
    transition: opacity .3s, filter .3s;
  }
  .staff-card.non-default {
    background:rgba(255,255,255,0.75);
    border-color:rgba(186,117,23,0.6);
  }
  .staff-card.non-default::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:4px; background:#BA7517; border-radius:10px 0 0 10px;
  }
  .staff-card.yasumi-card {
    background:rgba(255,80,80,0.18);
    border:2px solid rgba(220,50,50,0.5);
  }
  .staff-card.yasumi-card .card-name { color:#b71c1c; }

  /* 出退勤ステータス表示 */
  .staff-card.att-working::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:4px; background:#1D9E75; border-radius:10px 0 0 10px;
  }
  .staff-card.att-left {
    opacity:0.35; filter:grayscale(0.8);
    background:rgba(240,238,234,0.7) !important;
    border-color:rgba(0,0,0,0.06) !important;
  }
  .staff-card.att-left::before { display:none !important; }
  .staff-card.att-off { /* 薄くしない */ }
  .staff-card.att-none {
    border:2px dashed rgba(0,0,0,0.15);
    background:rgba(255,255,255,0.3);
  }
  .att-badge {
    display:inline-flex; align-items:center; gap:3px;
    padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700;
    margin-top:4px;
  }
  .att-badge.working { background:#e8f5f0; color:#0f6e56; }
  .att-badge.left    { background:#f1efe8; color:#666; }
  .att-badge.off     { background:#fdecea; color:#b71c1c; }
  .att-badge.none    { background:#f4f4f2; color:#999; }

  /* 🎂 本日が誕生日の社員を目立たせる（出退勤の薄表示よりも優先） */
  .staff-card.birthday-card {
    background:linear-gradient(135deg,rgba(255,247,224,0.95),rgba(255,233,186,0.9)) !important;
    box-shadow:0 0 0 2px #f0b429, 0 3px 14px rgba(240,180,41,0.45) !important;
    border-color:#f0b429 !important;
    opacity:1 !important; filter:none !important;
  }
  .staff-card.birthday-card::before { display:none !important; }
  .staff-card.birthday-card .card-name { color:#a85d00; }
  .bday-cake {
    position:absolute; top:8px; right:10px; font-size:24px; line-height:1;
    transform-origin:bottom center; animation:bdayBounce 1.6s ease-in-out infinite;
  }
  @keyframes bdayBounce { 0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-4px) rotate(6deg);} }
  .bday-badge {
    display:inline-flex; align-items:center; gap:3px; margin-top:4px;
    padding:2px 9px; border-radius:999px; font-size:11px; font-weight:700;
    background:#fff3d6; color:#a85d00; border:1px solid #f0b429;
  }

  .card-name {
    font-size:var(--card-name-size,22px); font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:4px; line-height:1.3;
  }
  .card-name.long {
    font-size:var(--card-name-long-size,15px);
    white-space:normal; overflow:visible; text-overflow:unset; line-height:1.25;
  }
  .card-dept { font-size:14px; opacity:0.6; color:#333; margin-bottom:3px; }
  .card-time { font-size:10px; opacity:0.45; color:#444; margin-top:3px; }

  .empty-msg { flex:1; display:flex; align-items:center; justify-content:center; font-size:18px; opacity:0.3; font-weight:400; }

  /* INDICATORS */
  .indicators {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:200;
  }
  .ind-dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(0,0,0,0.15); cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .ind-dot.active { background:rgba(0,0,0,0.6); transform:scale(1.3); }

  /* SYNC */
  .sync-badge {
    position:fixed; top:16px; right:16px;
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:999px;
    font-size:11px; z-index:200; backdrop-filter:blur(4px); color:#444;
  }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:#1D9E75; }
  .sync-dot.syncing { background:#BA7517; animation:pulse 1s infinite; }
  .sync-dot.error   { background:#E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .sync-text { font-size:11px; opacity:0.7; }

  /* CONTROLS */
  .controls { position:fixed; bottom:50px; right:20px; display:flex; flex-direction:column; gap:6px; z-index:200; }
  .ctrl-btn {
    width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.1); border:1px solid rgba(0,0,0,0.15);
    color:rgba(0,0,0,0.6); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; font-family:inherit;
  }
  .ctrl-btn:hover { background:rgba(0,0,0,0.18); }
  .ctrl-btn.paused { background:rgba(186,117,23,0.2); color:#BA7517; }

  .interval-select {
    position:fixed; bottom:20px; right:20px;
    background:rgba(255,255,255,0.7); backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,0.15); border-radius:8px;
    color:rgba(0,0,0,0.6); font-size:12px; padding:4px 8px;
    font-family:inherit; cursor:pointer; z-index:200;
  }
  .interval-select option { background:#fff; color:#1a1a1a; }

  .loading-overlay {
    position:fixed; inset:0; z-index:400; background:#f0eeea;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  .loading-spinner {
    width:36px; height:36px; border:3px solid rgba(0,0,0,0.1); border-top-color:#1D9E75;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:rgba(255,255,255,0.4); }

  /* VIEW TOGGLE */
  .view-toggle {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 200;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(0,0,0,0.12); border-radius: 999px; padding: 4px;
  }
  .view-toggle-btn {
    padding: 6px 18px; border-radius: 999px; border: none;
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: transparent; color: rgba(0,0,0,0.5); transition: all .15s;
  }
  .view-toggle-btn.active { background: #1a1a1a; color: #fff; }

  .dept-nav {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; z-index: 200; flex-wrap: nowrap;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(0,0,0,0.1); border-radius: 999px; padding: 4px;
  }
  .dept-nav-btn {
    padding: 7px 16px; border-radius: 999px; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: transparent; color: rgba(0,0,0,0.5); transition: all .15s; white-space: nowrap;
  }
  .dept-nav-btn:hover { background: rgba(0,0,0,0.08); color: #1a1a1a; }
  .dept-nav-btn.active { background: #1a1a1a; color: #fff; }

  .status-badge-sm {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 32px; font-weight: 700;
  }

  .size-btns {
    position:fixed; bottom:220px; right:20px; z-index:200;
    display:flex; flex-direction:column; gap:6px;
  }
  .size-btn {
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,0.15); border-radius:10px;
    padding:6px 12px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit; color:#1a1a1a;
    transition:.15s;
  }
  .size-btn.active { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
  .size-btn:hover:not(.active) { background:rgba(255,255,255,1); }

  /* 居場所登録モーダル */
  .reg-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:500; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .reg-overlay.hidden { display:none; }
  .reg-box {
    background:#fff; border-radius:20px; width:100%; max-width:440px;
    padding:28px; box-shadow:0 8px 40px rgba(0,0,0,.25);
  }
  .reg-title { font-size:18px; font-weight:700; margin-bottom:6px; }
  .reg-name { font-size:22px; font-weight:700; color:#1a1a2e; margin-bottom:20px; }
  .reg-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;
  }
  .reg-btn {
    padding:16px 10px; border-radius:14px; border:2px solid #e0e0e0;
    background:#fff; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:.15s; font-size:14px; font-weight:700;
  }
  .reg-btn:hover { border-color:#1a1a2e; background:#f0f0f0; }
  .reg-btn .reg-icon { font-size:26px; }
  .reg-btn.selected { border-color:#1a1a2e; background:#1a1a2e; color:#fff; }
  .reg-cancel {
    width:100%; padding:12px; border-radius:12px; border:1.5px solid #e0e0e0;
    background:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .reg-submit {
    width:100%; padding:14px; border-radius:12px; border:none;
    background:#1a1a2e; color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; font-family:inherit; margin-bottom:8px;
  }
  .reg-submit:disabled { background:#999; cursor:not-allowed; }
  .staff-card.clickable { cursor:pointer; }
  .staff-card.clickable:hover { opacity:.85; transform:scale(1.02); transition:.15s; }
  .staff-card.clickable:active { transform:scale(0.98); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">データを読み込んでいます...</div>
</div>

<div class="view-toggle">
  <button class="view-toggle-btn active" id="btnLocation" onclick="setViewMode('location')">📍 居場所別</button>
  <button class="view-toggle-btn" id="btnDept" onclick="setViewMode('dept')">🏢 部署別</button>
</div>

<div class="dept-nav" id="deptNav">
  <button class="dept-nav-btn" onclick="jumpToDept(0)">役員</button>
  <button class="dept-nav-btn" onclick="jumpToDept(1)">総務</button>
  <button class="dept-nav-btn" onclick="jumpToDept(2)">営業</button>
  <button class="dept-nav-btn" onclick="jumpToDept(3)">購買</button>
  <button class="dept-nav-btn" onclick="jumpToDept(4)">設計</button>
  <button class="dept-nav-btn" onclick="jumpToDept(5)">電気</button>
  <button class="dept-nav-btn" onclick="jumpToDept(6)">加工</button>
  <button class="dept-nav-btn" onclick="jumpToDept(7)">組付</button>
</div>

<button id="bigPauseBtn" onclick="togglePause()" style="
  position:fixed; top:14px; right:200px; z-index:300;
  background:rgba(255,255,255,0.9); backdrop-filter:blur(4px);
  border:2px solid rgba(0,0,0,0.15); border-radius:50px;
  padding:8px 20px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; color:#1a1a1a;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1); transition:.15s;
">⏸ 一時停止</button>
<div class="slide-wrap" id="slideWrap"></div>
<div class="indicators" id="indicators"></div>

<div class="sync-badge">
  <span class="sync-dot" id="syncDot"></span>
  <span class="sync-text" id="syncText">--</span>
</div>

<div class="size-btns">
  <button class="size-btn" onclick="setCardSize('small')">小</button>
  <button class="size-btn active" onclick="setCardSize('medium')">中</button>
  <button class="size-btn" onclick="setCardSize('large')">大</button>
</div>

<!-- 居場所登録モーダル -->
<div class="reg-overlay hidden" id="regOverlay">
  <div class="reg-box">
    <div class="reg-title">居場所を登録</div>
    <div class="reg-name" id="regName"></div>
    <div class="reg-grid" id="regGrid"></div>
    <div id="regMemoBox" style="display:none;margin-bottom:10px;background:#f8f8f8;border-radius:12px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:8px;">行先・メモ（任意）</div>
      <input id="regMemoInput" type="text" placeholder="例：豊田市役所、東京出張など" style="width:100%;padding:9px 10px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;box-sizing:border-box;">
    </div>
    <div id="regPeriodBox" style="display:none;margin-bottom:14px;background:#f8f8f8;border-radius:12px;padding:14px;">
      <div style="font-size:12px;font-weight:700;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;">📅 期間</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <input type="date" id="regStart" style="flex:1;padding:9px 10px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;">
        <span id="regRangeLabel" style="font-size:13px;color:#888;flex-shrink:0;">〜</span>
        <input type="date" id="regEnd" style="flex:1;padding:9px 10px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;">
      </div>
      <div style="margin-top:8px;font-size:12px;color:#aaa;">※ 1日のみの場合は開始日だけ入力してください</div>
    </div>
    <button class="reg-submit" id="regSubmit" onclick="doRegister()" disabled>登録する</button>
    <button class="reg-cancel" onclick="closeRegModal()">キャンセル</button>
  </div>
</div>

<a href="staff_search.html" style="
  position:fixed; bottom:130px; right:20px; z-index:200;
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
  border:1px solid rgba(0,0,0,0.15); border-radius:999px;
  padding:8px 16px; text-decoration:none;
  color:#1a1a1a; font-size:13px; font-weight:700;
  font-family:inherit; transition:background .15s;
" onmouseover="this.style.background='rgba(255,255,255,1)'" onmouseout="this.style.background='rgba(255,255,255,0.85)'">
  🔍 個人検索
</a>
<div class="controls">
  <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" title="一時停止/再生">⏸</button>
  <button class="ctrl-btn" onclick="prevSlide()" title="前へ">‹</button>
  <button class="ctrl-btn" onclick="nextSlide()" title="次へ">›</button>
</div>

<select class="interval-select" id="intervalSelect" onchange="changeInterval(this.value)">
  <option value="5000">5秒</option>
  <option value="8000" selected>8秒</option>
  <option value="10000">10秒</option>
  <option value="15000">15秒</option>
  <option value="20000">20秒</option>
</select>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwo73GwwjA1kVVOkq-XKIovxhTjaZSnM_GgMVpOUC_D-39NnvzjQENqABWL-7Tybk0RyQ/exec';
const FETCH_INTERVAL = 15000;

let STAFF_MASTER = [];
const EMP_GAS_URL = 'https://script.google.com/macros/s/AKfycbwFE4wAC6cdFT8H2JmwW2XONgJz0j1rCI4xE2C9x1tKdMaib5aRgUKXE2N3hkQ034hu/exec';
const EMP_LS_KEY = 'employee_master_cache';

async function loadStaffMaster() {
  try {
    const cached = localStorage.getItem(EMP_LS_KEY);
    if (cached) { const p = JSON.parse(cached); if (p.length > 0) _applyEmployees(p); }
    const res = await fetch(EMP_GAS_URL + '?action=getEmployees&t=' + Date.now());
    const json = await res.json();
    if (json.ok && json.employees && json.employees.length > 0) {
      const active = json.employees.filter(e => e.active !== '退職');
      localStorage.setItem(EMP_LS_KEY, JSON.stringify(active));
      _applyEmployees(active);
    }
  } catch(e) { console.log('従業員マスタ取得失敗:', e); }
}

function _applyEmployees(emps) {
  STAFF_MASTER = emps.filter(e => e.showLocation !== '0').map(e => ({
    id: e.empNo || e.id, name: String(e.name), dept: String(e.dept),
    base: e.defaultPlace || 'honsha_office', slide: e.slide || 'honsha1',
    empNo: e.empNo || '', category: e.category || '社員', location: e.place || '',
    birthday: e.birthday || '', showBirthday: e.showBirthday
  }));
  STAFF_MASTER.forEach(s => {
    if (!state[s.id]) state[s.id] = { status: s.base, updated: '', memo: '', leaveStart: '', leaveEnd: '' };
  });
}

let state = {};

// 出退勤 localStorage
const ATTENDANCE_KEY = 'nakashima_attendance';
function getTodayStr() { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getAttLocal(id) {
  try { const all = JSON.parse(localStorage.getItem(ATTENDANCE_KEY)||'{}'); const r = all[id]; return (r && r.date === getTodayStr()) ? r : null; } catch(e) { return null; }
}
function setAttLocal(id, data) {
  try { const all = JSON.parse(localStorage.getItem(ATTENDANCE_KEY)||'{}'); all[id] = {...data, date:getTodayStr()}; localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(all)); } catch(e) {}
}
function nowTimeStr() { const d = new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function initState() { state = {}; STAFF_MASTER.forEach(s => { state[s.id] = { status:s.base, updated:'', memo:'', leaveStart:'', leaveEnd:'' }; }); }

// 本社事務所を選んだ人を①②③に振り分ける。本人の座席(slide)に従う：
// honsha2→本社②、honsha3→本社③、それ以外（根崎系nezaki/nezaki2・honsha1・空）は本社①。
function honshaLabelSlide(m){
  return (m.slide === 'honsha2' || m.slide === 'honsha3') ? m.slide : 'honsha1';
}

// スライド定義
const SLIDE_DEFS = [
  { label:'本社事務所①', subtitle:'社長・役員・総務部・営業部・購買課・組付課・加工課', color:'#1D9E75', bg:'linear-gradient(135deg,#c8ede3,#d8f4ec)', filter: m => { const s=getDisplayStatus(m); return s==='honsha_office' && honshaLabelSlide(m)==='honsha1'; } },

// 出退勤状態判定
function getDisplayStatus(m) {
  const st = state[m.id]; if (!st) return m.base;
  const activeStatus = isActiveToday(m.id, st.status) ? st.status : m.base;
  return (activeStatus === 'taikin') ? m.base : activeStatus;
}

function getAttendanceClass(m) {
  const st = state[m.id]; if (!st) return 'none';
  const activeStatus = isActiveToday(m.id, st.status) ? st.status : m.base;
  if (activeStatus === 'taikin') return 'left';
  if (activeStatus === 'yasumi') return 'off';
  if (st.updated && st.updated !== '') return 'working';
  if (activeStatus !== m.base) return 'working';
  return 'none';
}

function getAttendanceBadgeHtml(m) {
  const cls = getAttendanceClass(m);
  switch(cls) {
    case 'working': return '<span class="att-badge working">🟢 出勤中</span>';
    case 'left':    return '<span class="att-badge left">⏹ 退勤済</span>';
    case 'off':     return '';
    case 'none':    return '<span class="att-badge none">未打刻</span>';
    default:        return '';
  }
}

function getTodayJST() { return getTodayStr(); }

function isActiveToday(id, status) {
  const st = state[id]; if (!st || st.status !== status) return false;
  const today = getTodayJST();
  if (st.leaveStart) {
    const ls = normalizeStateDate(st.leaveStart);
    const le = st.leaveEnd ? normalizeStateDate(st.leaveEnd) : '';
    if (ls > today) return false;
    if (le && le < today) return false;
  }
  return true;
}

function normalizeStateDate(val) {
  if (!val) return '';
  const s = String(val).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{4}\/\d{2}\/\d{2}$/.test(s)) return s.replace(/\//g,'-');
  try { const d = new Date(s); if (!isNaN(d)) return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } catch(e) {}
  return s;
}

// ===== 最適化③: カードハッシュで差分検出 =====
function cardHash(m) {
  const st = state[m.id];
  if (!st) return m.id + ':default';
  return m.id + ':' + st.status + ':' + st.updated + ':' + st.memo + ':' + st.leaveStart + ':' + st.leaveEnd;
}

// ===== 最適化④: rAFベースのスライドタイマー =====
let rafId = null;
let slideStartTime = 0;

function startRAFTimer() {
  slideStartTime = performance.now();
  cancelAnimationFrame(rafId);
  function tick(now) {
    if (isPaused) return;
    const elapsed = now - slideStartTime;
    // プログレスバー更新（CSS transitionに任せるので不要だが、念のため）
    if (elapsed >= slideInterval) {
      nextSlide();
      return; // nextSlide→resetTimer→startRAFTimer で再帰
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopRAFTimer() {
  cancelAnimationFrame(rafId);
  rafId = null;
}

function resetTimer() {
  stopRAFTimer();
  if (!isPaused) startRAFTimer();
}

function updateClock() {
  const now = new Date();
  const str = now.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}) + ' ' +
    now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.slide-clock').forEach(el => el.textContent = str);
}
updateClock();
setInterval(updateClock, 30000); // 10秒→30秒に緩和

function setSyncStatus(st, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (st==='syncing'?' syncing':st==='error'?' error':'');
  document.getElementById('syncText').textContent = msg;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return (d.getMonth()+1) + '/' + d.getDate();
}

// ===== 最適化③: fetchAll - 差分更新 =====
async function fetchAll(silent=false) {
  if (!silent) setSyncStatus('syncing','取得中...');
  try {
    const res = await fetch(GAS_URL + '?t=' + Date.now());
    const json = await res.json();
    if (!json.ok) throw new Error();

    let changed = false;
    json.data.forEach(row => {
      const id = row.id;
      if (id && state[id] !== undefined && row.status) {
        const old = state[id];
        const newSt = { status:row.status, updated:row.updated||'', memo:row.memo||'', leaveStart:row.leaveStart||'', leaveEnd:row.leaveEnd||'' };
        if (old.status !== newSt.status || old.updated !== newSt.updated || old.memo !== newSt.memo || old.leaveStart !== newSt.leaveStart || old.leaveEnd !== newSt.leaveEnd) {
          state[id] = newSt;
          changed = true;
        }
      }
    });
    const t = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok', t+' 更新');

    if (changed) {
      // データ変更があった場合のみスライド更新
      const deptParam = new URLSearchParams(location.search).get('dept');
      const savedIndex = currentIndex;
      const savedPaused = isPaused;
      if (deptParam) rebuildDeptSlides(deptParam);
      else if (viewMode==='location') updateSlidesInPlace();
      else rebuildDeptSlides();
      if (savedIndex > 0 && savedIndex < slideKeys.length) {
        showSlide(savedIndex);
        if (savedPaused && !isPaused) togglePause();
        else if (!savedPaused && isPaused) togglePause();
      }
    }
  } catch(e) { setSyncStatus('error','通信エラー'); }
}

// 本日が誕生日か判定（birthday形式: YYYY-MM-DD / 1900-MM-DD / M/D / Date文字列 に対応）
function isBirthdayToday(bday) {
  if (!bday) return false;
  const s = String(bday).trim();
  let mm, dd;
  let mt = s.match(/^\d{4}-(\d{2})-(\d{2})$/);
  if (mt) { mm = parseInt(mt[1]); dd = parseInt(mt[2]); }
  else {
    mt = s.match(/^(\d{1,2})\/(\d{1,2})$/);
    if (mt) { mm = parseInt(mt[1]); dd = parseInt(mt[2]); }
    else {
      const d = new Date(s);
      if (isNaN(d.getTime())) return false;
      mm = d.getMonth() + 1; dd = d.getDate();
    }
  }
  const now = new Date();
  return (now.getMonth() + 1) === mm && now.getDate() === dd;
}

// ===== カード生成 =====
function buildCardHtml(m, showBadge) {
  const st = state[m.id];
  const rawStatus = isActiveToday(m.id, st.status) ? st.status : m.base;
  const displayStatus = (rawStatus === 'taikin') ? m.base : rawStatus;
  const isNonDefault = displayStatus !== m.base && rawStatus !== 'taikin';
  const attClass = getAttendanceClass(m);
  const isBday = (m.showBirthday !== '0') && isBirthdayToday(m.birthday);

  let classes = 'staff-card clickable';
  if (isNonDefault) classes += ' non-default';
  if (rawStatus === 'yasumi') classes += ' yasumi-card';
  classes += ' att-' + attClass;
  if (isBday) classes += ' birthday-card';

  const dispSt = {...st, status: displayStatus};

  let badgeHtml = '';
  if (showBadge) {
    const badge = STATUS_BADGE_MAP[rawStatus] || STATUS_BADGE_MAP['honsha_office'];
    const slideLabel = { 'honsha1':'本社①','honsha2':'本社②','honsha3':'本社③' };
    let displayLabel = badge.label;
    if (displayStatus === 'honsha_office') { const hs = honshaLabelSlide(m); displayLabel = hs ? slideLabel[hs] : badge.label; }
    badgeHtml = `<span class="status-badge-sm" style="background:${badge.bg};color:${badge.fg};"><span style="width:5px;height:5px;border-radius:50%;background:${badge.dot};display:inline-block;"></span>${displayLabel}</span>`;
  }

  return `<div class="${classes}" data-id="${m.id}" onclick="openRegModal('${m.id}')">
    ${isBday ? '<span class="bday-cake">🎂</span>' : ''}
    <div class="card-name ${m.name.length > 12 ? 'long' : ''}">${m.name}</div>
    ${showBadge ? badgeHtml : `<div class="card-dept">${m.dept}</div>`}
    ${isBday ? '<div class="bday-badge">🎂 お誕生日おめでとう！</div>' : ''}
    ${getAttendanceBadgeHtml(m)}
    ${(isNonDefault && rawStatus !== 'yasumi' && dispSt.memo)?`<div class="card-time" style="color:#1a0a00;font-size:15px;font-weight:700;margin-top:4px;">📍 ${dispSt.memo}</div>`:''}
    ${(dispSt.leaveStart && isActiveToday(m.id, st.status)) ? `<div class="card-time" style="color:#00132a;font-size:15px;font-weight:700;margin-top:4px;">📅 ${dispSt.leaveStart===dispSt.leaveEnd ? formatDate(dispSt.leaveStart) : formatDate(dispSt.leaveStart)+'〜'+formatDate(dispSt.leaveEnd)}</div>` : ''}
    ${isNonDefault && dispSt.updated?`<div class="card-time" style="color:#333;font-size:13px;">${dispSt.updated}</div>`:''}
  </div>`;
}

function filterWithChairman(def, m) {
  if (m.dept === '会長') {
    return def.filter(m) && state[m.id] && state[m.id].status === 'honsha_office' && state[m.id].updated !== '';
  }
  return state[m.id] && def.filter(m);
}

function buildSlideHtml(def, idx, members, showBadge=false) {
  return `
    <div class="slide-header">
      <div class="slide-location">
        <div class="location-dot" style="background:${def.color};"></div>
        <div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="location-name">${def.label}</span>
            <span class="location-count">${members.length}名</span>
          </div>
          ${def.subtitle?`<div class="location-subtitle">${def.subtitle}</div>`:''}
        </div>
      </div>
      <div class="slide-meta">
        <div class="slide-company">Nakashima Manufacturing</div>
        <div class="slide-clock"></div>
      </div>
    </div>

// placeFilter単独ビューに plusDept（部署）を合成したメンバーを算出。
// 本社事務所にいる該当部署の人（座席がどこでも）を、そのスライドに追加する。
function slideMembers(def) {
  let members = STAFF_MASTER.filter(m => filterWithChairman(def, m));
  if (placeFilter && plusDept) {
    const ids = new Set(members.map(m => m.id));
    const extra = STAFF_MASTER.filter(m => m.dept === plusDept && getDisplayStatus(m) === 'honsha_office' && !ids.has(m.id));
    members = members.concat(extra);
  }
  return members;
}

// ===== 最適化②: 遅延レンダリング付きrebuildSlides =====
function rebuildSlides() {
  slideKeys = SLIDE_DEFS.map((_,idx) => idx).filter(idx => {
    if (placeFilter) return SLIDE_DEFS[idx].label === PLACE_LABEL[placeFilter];
    const members = STAFF_MASTER.filter(m => filterWithChairman(SLIDE_DEFS[idx], m));
    if (idx <= 2) return true;
    return members.length > 0;
  });

  slideDataCache = slideKeys.map(defIdx => {
    let def = SLIDE_DEFS[defIdx];
    if (placeFilter && plusDept) def = { ...def, label: def.label + '＋' + plusDept, subtitle: '' };
    return { def, members: slideMembers(SLIDE_DEFS[defIdx]), rendered: false };
  });

  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  // 全スライドのフレーム（空）を作成、activeスライドだけ中身を入れる
  slideKeys.forEach((defIdx, idx) => {
    const data = slideDataCache[idx];
    const slide = document.createElement('div');
    slide.className = 'slide' + (idx === currentIndex ? ' active' : '');
    slide.id = 'slide-' + idx;
    slide.style.background = data.def.bg;
    slide.style.color = '#1a1a1a';

    if (idx === currentIndex || idx === (currentIndex + 1) % slideKeys.length) {
      slide.innerHTML = buildSlideHtml(data.def, idx, data.members);
      data.rendered = true;
    }
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}" style="${idx===currentIndex?`background:${def.color};`:''}" onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  if (currentIndex >= slideKeys.length) currentIndex = 0;
  showSlide(currentIndex, false);
}

// ===== 最適化③: 差分更新（フル再構築せずカードだけ更新） =====
function updateSlidesInPlace() {
  if (slideDataCache.length === 0) { rebuildSlides(); return; }

  const newSlideKeys = SLIDE_DEFS.map((_,idx) => idx).filter(idx => {
    if (placeFilter) return SLIDE_DEFS[idx].label === PLACE_LABEL[placeFilter];
    const members = STAFF_MASTER.filter(m => filterWithChairman(SLIDE_DEFS[idx], m));
    if (idx <= 2) return true;
    return members.length > 0;
  });

  // スライド構成が変わったらフル再構築
  if (JSON.stringify(newSlideKeys) !== JSON.stringify(slideKeys)) {
    rebuildSlides();
    return;
  }

  // スライドごとにメンバーを再計算し、変更があったスライドだけ更新
  slideKeys.forEach((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    const newMembers = slideMembers(def);
    const oldData = slideDataCache[idx];

    // メンバー数やハッシュが変わったか判定
    const newHashes = newMembers.map(m => cardHash(m)).join('|');
    const oldHashes = oldData.members.map(m => cardHash(m)).join('|');

    if (newHashes !== oldHashes) {
      oldData.members = newMembers;
      const slide = document.getElementById('slide-' + idx);
      if (slide && oldData.rendered) {
        // ヘッダーの人数を更新
        const countEl = slide.querySelector('.location-count');
        if (countEl) countEl.textContent = newMembers.length + '名';
        // カードグリッドだけ差し替え
        const body = slide.querySelector('.slide-body');
        if (body) {
          body.innerHTML = newMembers.length > 0
            ? `<div class="staff-grid">${newMembers.map(m => buildCardHtml(m, false)).join('')}</div>`
            : `<div class="empty-msg">現在この場所にいる社員はいません</div>`;
        }
      }
    }
  });
}

// ===== 最適化②: showSlide - 遅延レンダリング =====
function showSlide(idx, animate=true) {
  currentIndex = idx;
  document.querySelectorAll('.slide').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.ind-dot').forEach((el,i) => {
    const def = SLIDE_DEFS[slideKeys[i]];
    el.classList.toggle('active', i===idx);
    el.style.background = i===idx ? (def ? def.color : '') : '';
  });

  // 遅延レンダリング：次のスライドを事前描画
  const nextIdx = (idx + 1) % slideKeys.length;
  [idx, nextIdx].forEach(i => {
    if (slideDataCache[i] && !slideDataCache[i].rendered) {
      const slide = document.getElementById('slide-' + i);
      if (slide) {
        slide.innerHTML = buildSlideHtml(slideDataCache[i].def, i, slideDataCache[i].members, viewMode === 'dept');
        slideDataCache[i].rendered = true;
        updateClock();
      }
    }
  });

  // 遠いスライドのDOMを解放（メモリ節約）
  slideDataCache.forEach((data, i) => {
    if (data.rendered && i !== idx && i !== nextIdx && i !== (idx - 1 + slideKeys.length) % slideKeys.length) {
      const slide = document.getElementById('slide-' + i);
      if (slide) { slide.innerHTML = ''; data.rendered = false; }
    }
  });

  startProgress(idx);
}

function startProgress(idx) {
  const fill = document.getElementById('progress-'+idx);
  if (!fill) return;
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${slideInterval}ms linear`;
    fill.style.width = '100%';
  }));
}

function jumpToDept(deptIdx) {
  if (viewMode !== 'dept') setViewMode('dept');
  const targetSlideIdx = slideKeys.indexOf(deptIdx);
  if (targetSlideIdx >= 0) showSlide(targetSlideIdx);
  if (!isPaused) togglePause();
  document.querySelectorAll('.dept-nav-btn').forEach((b, i) => b.classList.toggle('active', i === deptIdx));
}

function nextSlide() { showSlide((currentIndex+1)%slideKeys.length); resetTimer(); }
function prevSlide() { showSlide((currentIndex-1+slideKeys.length)%slideKeys.length); resetTimer(); }
function goSlide(idx) { showSlide(idx); resetTimer(); }

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = isPaused ? '▶' : '⏸';
  btn.classList.toggle('paused', isPaused);
  const bigBtn = document.getElementById('bigPauseBtn');
  if (bigBtn) {
    bigBtn.textContent = isPaused ? '▶ 再生' : '⏸ 一時停止';
    bigBtn.style.background = isPaused ? 'rgba(186,117,23,0.9)' : 'rgba(255,255,255,0.9)';
    bigBtn.style.color = isPaused ? '#fff' : '#1a1a1a';
  }
  if (isPaused) {
    stopRAFTimer();
    const fill = document.getElementById('progress-'+currentIndex);
    if (fill) { const w = getComputedStyle(fill).width; fill.style.transition='none'; fill.style.width=w; }
  } else { resetTimer(); startProgress(currentIndex); }
}

function changeInterval(val) { slideInterval=parseInt(val); resetTimer(); startProgress(currentIndex); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prevSlide();
  if (e.key===' ') { e.preventDefault(); togglePause(); }
  if (e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.();
});

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btnLocation').classList.toggle('active', mode==='location');
  document.getElementById('btnDept').classList.toggle('active', mode==='dept');
  currentIndex = 0;
  stopRAFTimer();
  if (mode==='location') rebuildSlides();
  else rebuildDeptSlides();
  startRAFTimer();
}

function rebuildDeptSlides(filterDept) {
  let defs = DEPT_SLIDE_DEFS;
  if (filterDept) {
    defs = DEPT_SLIDE_DEFS.filter(def => def.depts.some(d => d === filterDept));
    if (defs.length === 0) defs = [{ label:filterDept, depts:[filterDept], color:'#185FA5', bg:'linear-gradient(135deg,#c4d8f0,#d4e6f8)' }];
  }

  slideKeys = defs.map((_,idx) => idx);
  slideDataCache = slideKeys.map(defIdx => ({
    def: defs[defIdx],
    members: STAFF_MASTER.filter(m => defs[defIdx].depts.includes(m.dept)),
    rendered: false
  }));

  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  slideKeys.forEach((defIdx, idx) => {
    const data = slideDataCache[idx];
    const slide = document.createElement('div');
    slide.className = 'slide' + (idx===currentIndex?' active':'');
    slide.id = 'slide-' + idx;
    slide.style.background = data.def.bg;
    slide.style.color = '#1a1a1a';

    if (idx === currentIndex || idx === (currentIndex + 1) % slideKeys.length) {
      const cardsHtml = data.members.length > 0
        ? `<div class="staff-grid">${data.members.map(m => buildCardHtml(m, true)).join('')}</div>`
        : `<div class="empty-msg">メンバーがいません</div>`;
      slide.innerHTML = `
        <div class="slide-header">
          <div class="slide-location">
            <div class="location-dot" style="background:${data.def.color};"></div>
            <div><div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${data.def.label}</span>
              <span class="location-count">${data.members.length}名</span>
            </div></div>
          </div>
          <div class="slide-meta">
            <div class="slide-company">Nakashima Manufacturing</div>
            <div class="slide-clock"></div>
          </div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-${idx}" style="background:${data.def.color};"></div></div>
        <div class="slide-body">${cardsHtml}</div>`;
      data.rendered = true;
    }
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = DEPT_SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}" style="${idx===currentIndex?`background:${def?def.color:'#999'};`:''}" onclick="goSlide(${idx})" title="${def?def.label:''}"></div>`;
  }).join('');

  updateClock();
  showSlide(currentIndex, false);
}

async function init() {
  const urlParams = new URLSearchParams(location.search);
  const deptParam = urlParams.get('dept');
  const placeParam = urlParams.get('place');
  if (placeParam && PLACE_LABEL[placeParam]) placeFilter = placeParam;
  const plusParam = urlParams.get('plus');
  if (placeFilter && plusParam) plusDept = plusParam;

  try {
    const cached = localStorage.getItem(EMP_LS_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.length > 0) {
        STAFF_MASTER = parsed.filter(e => e.showLocation !== '0').map(e => ({
          id: e.empNo || e.id, name: String(e.name), dept: String(e.dept),
          base: e.defaultPlace || 'honsha_office', slide: e.slide || 'honsha1',
          empNo: e.empNo || '', category: e.category || '社員', location: e.place || '',
          birthday: e.birthday || '', showBirthday: e.showBirthday
        }));
        initState();
        if (deptParam) rebuildDeptSlides(deptParam);
        else rebuildSlides();
      }
    }
  } catch(e) {}

  if (deptParam) {
    document.querySelectorAll('.mode-btn').forEach(el => el.style.display = 'none');
    document.title = deptParam + ' — 所在地ボード';
  } else if (placeFilter) {
    document.querySelectorAll('.mode-btn').forEach(el => el.style.display = 'none');
    document.title = PLACE_LABEL[placeFilter] + (plusDept ? '＋' + plusDept : '') + ' — 所在地ボード';
  }

  document.getElementById('loadingOverlay').style.display = 'none';

  await loadStaffMaster();
  await fetchAll(false);

  if (deptParam) rebuildDeptSlides(deptParam);
  else rebuildSlides();

  startRAFTimer();
  setInterval(async () => { await fetchAll(true); }, FETCH_INTERVAL);

  const savedSize = localStorage.getItem('monitor_card_size') || 'medium';
  setCardSize(savedSize);
}

// カードサイズ切替
const CARD_SIZES = {
  small:  { minWidth:'140px', nameSize:'16px', longSize:'12px' },
  medium: { minWidth:'200px', nameSize:'22px', longSize:'15px' },
  large:  { minWidth:'260px', nameSize:'28px', longSize:'18px' },
};
let currentSize = 'medium';

function setCardSize(size) {
  currentSize = size;
  const s = CARD_SIZES[size];
  document.documentElement.style.setProperty('--card-min-width', s.minWidth);
  document.documentElement.style.setProperty('--card-name-size', s.nameSize);
  document.documentElement.style.setProperty('--card-name-long-size', s.longSize);
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === {small:'小',medium:'中',large:'大'}[size]);
  });
  localStorage.setItem('monitor_card_size', size);
}

// 居場所登録モーダル
const STATUSES_REG = [
  { key:'honsha_office', label:'本社事務所', icon:'🏢' },
  { key:'honsha_factory', label:'本社工場', icon:'🏭' },
  { key:'nezaki', label:'根崎', icon:'🔧' },
  { key:'nezaki2', label:'根崎第2', icon:'🔩' },
  { key:'gaishutsu', label:'外出/出張', icon:'🚗' },
  { key:'zaitaku', label:'在宅', icon:'🏠' },
  { key:'yasumi', label:'休み', icon:'😴' },
  { key:'risseki', label:'離席/会議等', icon:'🚶' },
  { key:'taikin', label:'退勤', icon:'⏹' },
];

let regStaff = null;
let regStatus = null;
let wasPausedBeforeModal = false;

function openRegModal(id) {
  regStaff = STAFF_MASTER.find(m => m.id === id);
  if (!regStaff) return;
  regStatus = null;
  const isChairman = regStaff.dept === '会長';
  const statuses = isChairman ? [{ key:'honsha_office', label:'出勤', icon:'🏢' }] : STATUSES_REG;

  document.getElementById('regName').textContent = regStaff.name;
  document.getElementById('regGrid').innerHTML = statuses.map(s =>
    `<button class="reg-btn" onclick="selectRegStatus('${s.key}')" id="regbtn-${s.key}"><span class="reg-icon">${s.icon}</span><span>${s.label}</span></button>`
  ).join('');
  document.getElementById('regSubmit').disabled = true;

  const cur = state[id]?.status;
  if (cur) {
    const curBtn = document.getElementById('regbtn-' + cur);
    if (curBtn) { curBtn.classList.add('selected'); regStatus = cur; document.getElementById('regSubmit').disabled = false; }
  }

  document.getElementById('regOverlay').classList.remove('hidden');
  document.getElementById('regPeriodBox').style.display = 'none';
  document.getElementById('regStart').value = '';
  document.getElementById('regEnd').value = '';
  const memoBox = document.getElementById('regMemoBox');
  if (memoBox) { memoBox.style.display = 'none'; document.getElementById('regMemoInput').value = ''; }
  wasPausedBeforeModal = isPaused;
  if (!isPaused) togglePause();
}

function selectRegStatus(key) {
  regStatus = key;
  document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('regbtn-' + key)?.classList.add('selected');
  document.getElementById('regSubmit').disabled = false;
  const needsPeriod = ['gaishutsu','zaitaku','yasumi'].includes(key);
  document.getElementById('regPeriodBox').style.display = needsPeriod ? 'block' : 'none';
  const memoBox = document.getElementById('regMemoBox');
  if (memoBox) memoBox.style.display = (key === 'gaishutsu' || key === 'risseki') ? 'block' : 'none';
  if (needsPeriod) {
    const todayJST = getTodayStr();
    if (!document.getElementById('regStart').value) document.getElementById('regStart').value = todayJST;
  }
}

function closeRegModal() {
  document.getElementById('regOverlay').classList.add('hidden');
  regStaff = null; regStatus = null;
  if (!wasPausedBeforeModal && isPaused) togglePause();
}

async function doRegister() {
  if (!regStaff || !regStatus) return;
  const btn = document.getElementById('regSubmit');
  btn.disabled = true; btn.textContent = '登録中...';

  const now = new Date();
  const updated = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+'更新';

  const needsPeriod = ['gaishutsu','zaitaku','yasumi'].includes(regStatus);
  const startVal = document.getElementById('regStart').value;
  const endVal = document.getElementById('regEnd').value;
  const leaveStart = needsPeriod && startVal ? startVal : '';
  const leaveEnd = needsPeriod && endVal && endVal !== startVal ? endVal : leaveStart;
  const memoInput = document.getElementById('regMemoInput');
  const memo = memoInput ? memoInput.value.trim() : '';

  const payload = { id:regStaff.id, name:regStaff.name, dept:regStaff.dept, status:regStatus, updated, memo, leaveStart, leaveEnd };

  try {
    const res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) });
    const json = await res.json();
    if (json.ok) {
      state[regStaff.id] = { status:regStatus, updated, memo:memo||'', leaveStart, leaveEnd };

      if (regStatus === 'taikin') {
        const att = getAttLocal(regStaff.id);
        const clockIn = (att && att.clockIn) ? att.clockIn : nowTimeStr();
        setAttLocal(regStaff.id, { clockIn, clockOut: nowTimeStr() });
      } else if (regStatus !== 'yasumi') {
        const att = getAttLocal(regStaff.id);
        if (!att || !att.clockIn) setAttLocal(regStaff.id, { clockIn:nowTimeStr(), clockOut:'' });
      }
      closeRegModal();
      const dp = new URLSearchParams(location.search).get('dept');
      if (dp) rebuildDeptSlides(dp);
      else if (viewMode === 'location') rebuildSlides(); else rebuildDeptSlides();
      btn.textContent = '登録する';
    } else { throw new Error(); }
  } catch(e) {
    btn.textContent = '✗ エラー';
    setTimeout(() => { btn.textContent = '登録する'; btn.disabled = false; }, 2000);
  }
}

document.getElementById('regOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('regOverlay')) closeRegModal();
});

init();
</script>
