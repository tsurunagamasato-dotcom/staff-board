<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員所在地ボード — モニター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width:100%; height:100%; font-family:'Noto Sans JP',sans-serif; background:#f0eeea; overflow:hidden; }

  .slide-wrap { width:100%; height:100%; position:relative; }

  .slide {
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transition:opacity 0.6s ease; pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:auto; }

  /* HEADER */
  .slide-header {
    padding: 24px 48px 12px;
    display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0;
  }
  .slide-location { display:flex; align-items:center; gap:14px; }
  .location-dot { width:18px; height:18px; border-radius:50%; flex-shrink:0; }
  .location-name { font-size:48px; font-weight:900; letter-spacing:-1px; line-height:1; }
  .location-subtitle { font-size:16px; opacity:0.5; margin-top:4px; font-weight:400; }
  .location-count { font-size:24px; font-weight:500; opacity:0.55; margin-left:6px; color:#333; }
  .slide-meta { text-align:right; }
  .slide-company { font-size:12px; font-weight:500; opacity:0.5; color:#333; }
  .slide-clock { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

  /* PROGRESS */
  .progress-bar {
    height:3px; flex-shrink:0; margin:8px 48px 10px;
    border-radius:999px; overflow:hidden; background:rgba(0,0,0,0.1);
  }
  .progress-fill { height:100%; border-radius:999px; width:0%; transition:width linear; }

  /* GRID */
  .slide-body { flex:1; overflow:hidden; padding:0 48px 20px; }

  .staff-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:10px;
    align-content:start;
  }

  .staff-card {
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:12px;
    padding:14px 16px;
    position:relative; overflow:hidden;
  }
  .staff-card.non-default {
    background:rgba(255,255,255,0.75);
    border-color:rgba(186,117,23,0.6);
  }
  .staff-card.non-default::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:4px; background:#BA7517; border-radius:10px 0 0 10px;
  }
  /* 休みカード：全体を赤く */
  .staff-card.yasumi-card {
    background:rgba(255,80,80,0.18);
    border:2px solid rgba(220,50,50,0.5);
  }
  .staff-card.yasumi-card .card-name {
    color:#b71c1c;
  }

  .card-name {
    font-size:22px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:4px; line-height:1.3;
  }
  .card-name.long {
    font-size:15px;
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
    line-height:1.25;
  }
  .card-dept { font-size:14px; opacity:0.6; color:#333; margin-bottom:3px; }
  .card-time { font-size:10px; opacity:0.45; color:#444; margin-top:3px; }

  .empty-msg { flex:1; display:flex; align-items:center; justify-content:center; font-size:18px; opacity:0.3; font-weight:500; }

  /* INDICATORS */
  .indicators {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:200;
  }
  .ind-dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(0,0,0,0.15); cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .ind-dot.active { background:rgba(0,0,0,0.6); transform:scale(1.3); }

  /* SYNC */
  .sync-badge {
    position:fixed; top:16px; right:16px;
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.7); padding:5px 10px; border-radius:999px;
    font-size:11px; z-index:200; backdrop-filter:blur(4px); color:#444;
  }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:#1D9E75; }
  .sync-dot.syncing { background:#BA7517; animation:pulse 1s infinite; }
  .sync-dot.error   { background:#E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .sync-text { font-size:11px; opacity:0.7; }

  /* CONTROLS */
  .controls { position:fixed; bottom:50px; right:20px; display:flex; flex-direction:column; gap:6px; z-index:200; }
  .ctrl-btn {
    width:38px; height:38px; border-radius:50%;
    background:rgba(0,0,0,0.1); border:1px solid rgba(0,0,0,0.15);
    color:rgba(0,0,0,0.6); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; font-family:inherit;
  }
  .ctrl-btn:hover { background:rgba(0,0,0,0.18); }
  .ctrl-btn.paused { background:rgba(186,117,23,0.2); color:#BA7517; }

  .interval-select {
    position:fixed; bottom:20px; right:20px;
    background:rgba(255,255,255,0.7); backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,0.15); border-radius:8px;
    color:rgba(0,0,0,0.6); font-size:12px; padding:4px 8px;
    font-family:inherit; cursor:pointer; z-index:200;
  }
  .interval-select option { background:#fff; color:#1a1a1a; }

  .loading-overlay {
    position:fixed; inset:0; z-index:400; background:#f0eeea;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  .loading-spinner {
    width:36px; height:36px; border:3px solid rgba(0,0,0,0.1); border-top-color:#1D9E75;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:rgba(255,255,255,0.4); }

  /* VIEW TOGGLE */
  .view-toggle {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 200;
    background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
    border: 1px solid rgba(0,0,0,0.12); border-radius: 999px; padding: 4px;
  }
  .view-toggle-btn {
    padding: 6px 18px; border-radius: 999px; border: none;
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    background: transparent; color: rgba(0,0,0,0.5); transition: all .15s;
  }
  .view-toggle-btn.active { background: #1a1a1a; color: #fff; }

  /* 部署別カードのバッジ */
  .status-badge-sm {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 16px; font-weight: 700;
  }

  /* カードサイズ切替ボタン */
  .size-btns {
    position:fixed; bottom:80px; right:20px; z-index:200;
    display:flex; flex-direction:column; gap:6px;
  }
  .size-btn {
    background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
    border:1px solid rgba(0,0,0,0.15); border-radius:10px;
    padding:6px 12px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit; color:#1a1a1a;
    transition:.15s;
  }
  .size-btn.active { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
  .size-btn:hover:not(.active) { background:rgba(255,255,255,1); }

  /* 居場所登録モーダル */
  .reg-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:500; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .reg-overlay.hidden { display:none; }
  .reg-box {
    background:#fff; border-radius:20px; width:100%; max-width:440px;
    padding:28px; box-shadow:0 8px 40px rgba(0,0,0,.25);
  }
  .reg-title { font-size:18px; font-weight:800; margin-bottom:6px; }
  .reg-name { font-size:22px; font-weight:700; color:#1a1a2e; margin-bottom:20px; }
  .reg-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;
  }
  .reg-btn {
    padding:16px 10px; border-radius:14px; border:2px solid #e0e0e0;
    background:#fff; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:.15s; font-size:14px; font-weight:700;
  }
  .reg-btn:hover { border-color:#1a1a2e; background:#f0f0f0; }
  .reg-btn .reg-icon { font-size:26px; }
  .reg-btn.selected { border-color:#1a1a2e; background:#1a1a2e; color:#fff; }
  .reg-cancel {
    width:100%; padding:12px; border-radius:12px; border:1.5px solid #e0e0e0;
    background:#fff; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .reg-submit {
    width:100%; padding:14px; border-radius:12px; border:none;
    background:#1a1a2e; color:#fff; font-size:15px; font-weight:800;
    cursor:pointer; font-family:inherit; margin-bottom:8px;
  }
  .reg-submit:disabled { background:#999; cursor:not-allowed; }
  .staff-card.clickable { cursor:pointer; }
  .staff-card.clickable:hover { opacity:.85; transform:scale(1.02); transition:.15s; }
  .staff-card.clickable:active { transform:scale(0.98); }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">データを読み込んでいます...</div>
</div>

<div class="view-toggle">
  <button class="view-toggle-btn active" id="btnLocation" onclick="setViewMode('location')">📍 居場所別</button>
  <button class="view-toggle-btn" id="btnDept" onclick="setViewMode('dept')">🏢 部署別</button>
</div>
<div class="slide-wrap" id="slideWrap"></div>
<div class="indicators" id="indicators"></div>

<div class="sync-badge">
  <span class="sync-dot" id="syncDot"></span>
  <span class="sync-text" id="syncText">--</span>
</div>

<!-- カードサイズ切替 -->
<div class="size-btns">
  <button class="size-btn" onclick="setCardSize('small')">小</button>
  <button class="size-btn active" onclick="setCardSize('medium')">中</button>
  <button class="size-btn" onclick="setCardSize('large')">大</button>
</div>

<!-- 居場所登録モーダル -->
<div class="reg-overlay hidden" id="regOverlay">
  <div class="reg-box">
    <div class="reg-title">居場所を登録</div>
    <div class="reg-name" id="regName"></div>
    <div class="reg-grid" id="regGrid"></div>
    <button class="reg-submit" id="regSubmit" onclick="doRegister()" disabled>登録する</button>
    <button class="reg-cancel" onclick="closeRegModal()">キャンセル</button>
  </div>
</div>

<a href="staff_search.html" style="
  position:fixed; bottom:130px; right:20px; z-index:200;
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
  border:1px solid rgba(0,0,0,0.15); border-radius:999px;
  padding:8px 16px; text-decoration:none;
  color:#1a1a1a; font-size:13px; font-weight:700;
  font-family:inherit; transition:background .15s;
" onmouseover="this.style.background='rgba(255,255,255,1)'" onmouseout="this.style.background='rgba(255,255,255,0.85)'">
  🔍 個人検索
</a>
<div class="controls">
  <button class="ctrl-btn" id="pauseBtn" onclick="togglePause()" title="一時停止/再生">⏸</button>
  <button class="ctrl-btn" onclick="prevSlide()" title="前へ">‹</button>
  <button class="ctrl-btn" onclick="nextSlide()" title="次へ">›</button>
</div>

<select class="interval-select" id="intervalSelect" onchange="changeInterval(this.value)">
  <option value="5000">5秒</option>
  <option value="8000" selected>8秒</option>
  <option value="10000">10秒</option>
  <option value="15000">15秒</option>
  <option value="20000">20秒</option>
</select>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwT7aSD1CmIOp_TlVa3yzUZr99b-yzMd5h_--kgweBABdyW8SnRMscd3cdWlTp6GsQzUQ/exec';
const FETCH_INTERVAL = 15000;

// STAFF_MASTERはGASから動的取得（起動時に読み込み）
let STAFF_MASTER = [];

// state
let state = {};

function initState() {
  state = {};
  STAFF_MASTER.forEach(s => { state[s.id] = { status: s.base, updated: '', memo: '', leaveStart: '', leaveEnd: '' }; });
}

// スライド定義
const SLIDE_DEFS = [
  { label:'本社事務所①', subtitle:'社長・役員・総務部・営業部',
    color:'#1D9E75', bg:'linear-gradient(135deg,#c8ede3,#d8f4ec)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha1' },
  { label:'本社事務所②', subtitle:'設計課・第一製造部',
    color:'#1D9E75', bg:'linear-gradient(135deg,#b8e8d8,#caeee3)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha2' },
  { label:'本社事務所③', subtitle:'電気課・購買課',
    color:'#1D9E75', bg:'linear-gradient(135deg,#a8e0ce,#beeadb)',
    filter: m => state[m.id] && state[m.id].status==='honsha_office' && m.slide==='honsha3' },
  { label:'本社工場', subtitle:'',
    color:'#0e7fa8', bg:'linear-gradient(135deg,#c0e8f4,#d0f0fa)',
    filter: m => state[m.id] && state[m.id].status==='honsha_factory' },
  { label:'根崎', subtitle:'加工課',
    color:'#185FA5', bg:'linear-gradient(135deg,#c4d8f0,#d4e6f8)',
    filter: m => state[m.id] && state[m.id].status==='nezaki' },
  { label:'根崎第2', subtitle:'組付課・購買課',
    color:'#534AB7', bg:'linear-gradient(135deg,#d0cef4,#dddcfa)',
    filter: m => state[m.id] && state[m.id].status==='nezaki2' },
  { label:'外出/出張', subtitle:'',
    color:'#BA7517', bg:'linear-gradient(135deg,#f8e4c0,#faeece)',
    filter: m => state[m.id] && state[m.id].status==='gaishutsu' },
  { label:'在宅', subtitle:'',
    color:'#639922', bg:'linear-gradient(135deg,#d4edb8,#e0f4c8)',
    filter: m => state[m.id] && state[m.id].status==='zaitaku' },
  { label:'休み', subtitle:'',
    color:'#888780', bg:'linear-gradient(135deg,#e4e2da,#eceae2)',
    filter: m => state[m.id] && state[m.id].status==='yasumi' },
];

// 部署別スライド定義
const DEPT_SLIDE_DEFS = [
  { label:'社長・役員',  depts:['社長','役員'],     color:'#534AB7', bg:'linear-gradient(135deg,#d0cef4,#dddcfa)' },
  { label:'総務部',      depts:['総務部'],           color:'#1D9E75', bg:'linear-gradient(135deg,#c8ede3,#d8f4ec)' },
  { label:'営業部',      depts:['営業部'],           color:'#1D9E75', bg:'linear-gradient(135deg,#b8e8d8,#caeee3)' },
  { label:'購買課',      depts:['購買課'],           color:'#0e7fa8', bg:'linear-gradient(135deg,#c0e8f4,#d0f0fa)' },
  { label:'設計課・第一製造部', depts:['設計課','第一製造部'], color:'#185FA5', bg:'linear-gradient(135deg,#c4d8f0,#d4e6f8)' },

  { label:'電気課',      depts:['電気課'],           color:'#185FA5', bg:'linear-gradient(135deg,#b8d0ec,#c8e0f4)' },
  { label:'加工課',      depts:['加工課'],           color:'#BA7517', bg:'linear-gradient(135deg,#f8e4c0,#faeece)' },
  { label:'組付課',      depts:['組付課'],           color:'#639922', bg:'linear-gradient(135deg,#d4edb8,#e0f4c8)' },
];

const STATUS_BADGE_MAP = {
  honsha_office:  { label:'本社事務所', bg:'#e8f5f0', fg:'#0f6e56', dot:'#1D9E75' },
  honsha_factory: { label:'本社工場',   bg:'#e0f4fa', fg:'#084f6a', dot:'#0e7fa8' },
  nezaki:         { label:'根崎',       bg:'#e6f1fb', fg:'#0c447c', dot:'#185FA5' },
  nezaki2:        { label:'根崎第2',    bg:'#eeedfe', fg:'#3c3489', dot:'#534AB7' },
  gaishutsu:      { label:'外出/出張',  bg:'#faeeda', fg:'#633806', dot:'#BA7517' },
  zaitaku:        { label:'在宅',       bg:'#eaf3de', fg:'#27500a', dot:'#639922' },
  yasumi:         { label:'休み',       bg:'#f1efe8', fg:'#444441', dot:'#888780' },
};

let viewMode = 'location'; // 'location' or 'dept'
let currentIndex = 0;
let slideInterval = 8000;
let isPaused = false;
let slideTimer = null;
let progressTimer = null;
let slideKeys = [];

function updateClock() {
  const now = new Date();
  const str = now.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}) + ' ' +
    now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.slide-clock').forEach(el => el.textContent = str);
}
updateClock();
setInterval(updateClock, 10000);

function setSyncStatus(st, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (st==='syncing'?' syncing':st==='error'?' error':'');
  document.getElementById('syncText').textContent = msg;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return (d.getMonth()+1) + '/' + d.getDate();
}

const STAFF_LSKEY = 'staff_master_cache';

async function loadStaffMaster() {
  try {
    const res = await fetch(GAS_URL + '?action=getStaff&t=' + Date.now());
    const json = await res.json();
    if (json.ok && json.staff && json.staff.length > 0) {
      STAFF_MASTER = json.staff.map(s => ({
        id: parseInt(s.id),
        name: s.name,
        dept: s.dept,
        base: s.defaultPlace || 'honsha_office',
        slide: s.slide || 'honsha1'
      }));
      initState();
      localStorage.setItem(STAFF_LSKEY, JSON.stringify(STAFF_MASTER));
    }
  } catch(e) {
    console.log('staffマスタ取得失敗:', e);
  }
}

async function fetchAll(silent=false) {
  if (!silent) setSyncStatus('syncing','取得中...');
  try {
    const res = await fetch(GAS_URL + '?t=' + Date.now());
    const json = await res.json();
    if (!json.ok) throw new Error();
    json.data.forEach(row => {
      const id = parseInt(row.id);
      if (!isNaN(id) && state[id]!==undefined && row.status) {
        state[id] = { status: row.status, updated: row.updated||'', memo: row.memo||'', leaveStart: row.leaveStart||'', leaveEnd: row.leaveEnd||'' };
      }
    });
    const t = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok', t+' 更新');
    const deptParam = new URLSearchParams(location.search).get('dept');
    if (deptParam) rebuildDeptSlides(deptParam);
    else if (viewMode==='location') rebuildSlides();
    else rebuildDeptSlides();
  } catch(e) { setSyncStatus('error','通信エラー'); }
}

function rebuildSlides() {
  // 中島節雄さんは出勤（honsha_office）登録時のみ表示するフィルター
  function filterWithChairman(def, m) {
    if (m.dept === '会長') {
      // 会長は「出勤登録済み（updatedが空でない）」かつ「honsha_office」の時のみ表示
      return def.filter(m)
        && state[m.id]
        && state[m.id].status === 'honsha_office'
        && state[m.id].updated !== '';
    }
    return state[m.id] && def.filter(m);
  }

  // 0名スライドはスキップ（本社工場・外出・在宅・休みのみ）
  slideKeys = SLIDE_DEFS
    .map((def,idx) => idx)
    .filter(idx => {
      const members = STAFF_MASTER.filter(m => filterWithChairman(SLIDE_DEFS[idx], m));
      // 本社①②③は常に表示、その他は0名ならスキップ
      if (idx <= 2) return true;
      return members.length > 0;
    });

  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  slideKeys.forEach((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    const members = STAFF_MASTER.filter(m => filterWithChairman(def, m));

    const slide = document.createElement('div');
    slide.className = 'slide' + (idx===currentIndex?' active':'');
    slide.id = 'slide-' + idx;
    slide.style.background = def.bg;
    slide.style.color = '#1a1a1a';

    const cardsHtml = members.length > 0
      ? `<div class="staff-grid">${members.map(m => {
          const st = state[m.id];
          const isNonDefault = st.status !== m.base;
          return `<div class="staff-card ${isNonDefault?'non-default':''} ${st.status==='yasumi'?'yasumi-card':''} clickable" onclick="openRegModal(${m.id})">
            <div class="card-name ${m.name.length > 12 ? 'long' : ''}">${m.name}</div>
            <div class="card-dept">${m.dept}</div>
            ${(st.status !== 'yasumi' && st.memo)?`<div class="card-time" style="color:#1a0a00;font-size:15px;font-weight:900;margin-top:4px;">📍 ${st.memo}</div>`:''}
            ${(st.leaveStart && st.leaveEnd) ? `<div class="card-time" style="color:#00132a;font-size:15px;font-weight:900;margin-top:4px;">📅 ${st.leaveStart===st.leaveEnd ? formatDate(st.leaveStart) : formatDate(st.leaveStart)+'〜'+formatDate(st.leaveEnd)}</div>` : ''}
            ${st.updated?`<div class="card-time" style="color:#333;font-size:13px;">${st.updated}</div>`:''}
          </div>`;
        }).join('')}</div>`
      : `<div class="empty-msg">現在この場所にいる社員はいません</div>`;

    slide.innerHTML = `
      <div class="slide-header">
        <div class="slide-location">
          <div class="location-dot" style="background:${def.color};"></div>
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${def.label}</span>
              <span class="location-count">${members.length}名</span>
            </div>
            ${def.subtitle?`<div class="location-subtitle">${def.subtitle}</div>`:''}
          </div>
        </div>
        <div class="slide-meta">
          <div class="slide-company">Nakashima Manufacturing</div>
          <div class="slide-clock"></div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-${idx}" style="background:${def.color};"></div>
      </div>
      <div class="slide-body">${cardsHtml}</div>
    `;
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}"
      style="${idx===currentIndex?`background:${def.color};`:''}"
      onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  if (currentIndex >= slideKeys.length) currentIndex = 0;
  showSlide(currentIndex, false);
}

function showSlide(idx, animate=true) {
  currentIndex = idx;
  document.querySelectorAll('.slide').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.ind-dot').forEach((el,i) => {
    const def = SLIDE_DEFS[slideKeys[i]];
    el.classList.toggle('active', i===idx);
    el.style.background = i===idx ? def.color : '';
  });
  startProgress(idx);
}

function startProgress(idx) {
  clearInterval(progressTimer);
  const fill = document.getElementById('progress-'+idx);
  if (!fill) return;
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${slideInterval}ms linear`;
    fill.style.width = '100%';
  }));
}

function nextSlide() { showSlide((currentIndex+1)%slideKeys.length); resetTimer(); }
function prevSlide() { showSlide((currentIndex-1+slideKeys.length)%slideKeys.length); resetTimer(); }
function goSlide(idx) { showSlide(idx); resetTimer(); }

function resetTimer() {
  clearInterval(slideTimer);
  if (!isPaused) slideTimer = setInterval(nextSlide, slideInterval);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = isPaused ? '▶' : '⏸';
  btn.classList.toggle('paused', isPaused);
  if (isPaused) {
    clearInterval(slideTimer);
    const fill = document.getElementById('progress-'+currentIndex);
    if (fill) { const w = getComputedStyle(fill).width; fill.style.transition='none'; fill.style.width=w; }
  } else { resetTimer(); startProgress(currentIndex); }
}

function changeInterval(val) { slideInterval=parseInt(val); resetTimer(); startProgress(currentIndex); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prevSlide();
  if (e.key===' ') { e.preventDefault(); togglePause(); }
  if (e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.();
});

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('btnLocation').classList.toggle('active', mode==='location');
  document.getElementById('btnDept').classList.toggle('active', mode==='dept');
  currentIndex = 0;
  clearInterval(slideTimer);
  if (mode==='location') rebuildSlides();
  else rebuildDeptSlides();
  slideTimer = setInterval(nextSlide, slideInterval);
}

function rebuildDeptSlides(filterDept) {
  // filterDeptが指定された場合はその部署のみ表示
  let defs = DEPT_SLIDE_DEFS;
  if (filterDept) {
    defs = DEPT_SLIDE_DEFS.filter(def => def.depts.some(d => d === filterDept));
    // 該当がなければ部署名で直接生成
    if (defs.length === 0) {
      defs = [{ label: filterDept, depts: [filterDept], color: '#185FA5', bg: 'linear-gradient(135deg,#c4d8f0,#d4e6f8)' }];
    }
  }

  slideKeys = defs.map((_,idx) => idx);
  const wrap = document.getElementById('slideWrap');
  wrap.innerHTML = '';

  slideKeys.forEach((defIdx, idx) => {
    const def = defs[defIdx];
    const members = STAFF_MASTER.filter(m => def.depts.includes(m.dept));

    const slide = document.createElement('div');
    slide.className = 'slide' + (idx===currentIndex?' active':'');
    slide.id = 'slide-' + idx;
    slide.style.background = def.bg;
    slide.style.color = '#1a1a1a';

    const cardsHtml = members.length > 0
      ? `<div class="staff-grid">${members.map(m => {
          const st = state[m.id];
          const badge = STATUS_BADGE_MAP[st.status] || STATUS_BADGE_MAP['honsha_office'];
          const isNonDefault = st.status !== m.base;
          // 本社系は①②③で表示
          const slideLabel = {
            'honsha1': '本社①', 'honsha2': '本社②', 'honsha3': '本社③',
            'nezaki': '根崎', 'nezaki2': '根崎第2'
          };
          let displayLabel = badge.label;
          if (st.status === 'honsha_office' && m.slide) {
            displayLabel = slideLabel[m.slide] || badge.label;
          }
          return `<div class="staff-card ${isNonDefault?'non-default':''} ${st.status==='yasumi'?'yasumi-card':''} clickable" onclick="openRegModal(${m.id})">
            <div class="card-name ${m.name.length > 12 ? 'long' : ''}">${m.name}</div>
            <span class="status-badge-sm" style="background:${badge.bg};color:${badge.fg};">
              <span style="width:5px;height:5px;border-radius:50%;background:${badge.dot};display:inline-block;"></span>
              ${displayLabel}
            </span>
            ${(st.status !== 'yasumi' && st.memo)?`<div class="card-time" style="color:#3d1f00;font-size:12px;font-weight:700;margin-top:2px;">📍 ${st.memo}</div>`:''}
            ${(st.leaveStart && st.leaveEnd)?`<div class="card-time" style="color:#00132a;font-size:12px;font-weight:700;margin-top:2px;">📅 ${st.leaveStart===st.leaveEnd ? formatDate(st.leaveStart) : formatDate(st.leaveStart)+'〜'+formatDate(st.leaveEnd)}</div>`:''}
            ${st.updated?`<div class="card-time" style="color:#333;font-size:13px;">${st.updated}</div>`:''}
          </div>`;
        }).join('')}</div>`
      : `<div class="empty-msg">メンバーがいません</div>`;

    slide.innerHTML = `
      <div class="slide-header">
        <div class="slide-location">
          <div class="location-dot" style="background:${def.color};"></div>
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${def.label}</span>
              <span class="location-count">${members.length}名</span>
            </div>
          </div>
        </div>
        <div class="slide-meta">
          <div class="slide-company">Nakashima Manufacturing</div>
          <div class="slide-clock"></div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-${idx}" style="background:${def.color};"></div>
      </div>
      <div class="slide-body">${cardsHtml}</div>
    `;
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = DEPT_SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}"
      style="${idx===currentIndex?`background:${def.color};`:''}"
      onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  showSlide(currentIndex, false);
}

async function init() {
  // URLパラメータで部署固定モードを判定
  const urlParams = new URLSearchParams(location.search);
  const deptParam = urlParams.get('dept');

  // localStorageキャッシュで即座に表示
  try {
    const cached = localStorage.getItem(STAFF_LSKEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.length > 0) {
        STAFF_MASTER = parsed;
        initState();
        if (deptParam) rebuildDeptSlides(deptParam);
        else rebuildSlides();
      }
    }
  } catch(e) {}

  // 部署固定モードの場合はUIを調整
  if (deptParam) {
    document.querySelectorAll('.mode-btn').forEach(el => el.style.display = 'none');
    document.title = deptParam + ' — 所在地ボード';
  }

  document.getElementById('loadingOverlay').style.display = 'none';

  // staffマスタ取得 → state初期化 → 状態取得の順に実行
  await loadStaffMaster();
  await fetchAll(false);

  if (deptParam) rebuildDeptSlides(deptParam);
  else rebuildSlides();

  slideTimer = setInterval(nextSlide, slideInterval);
  setInterval(async () => {
    await fetchAll(true);
  }, FETCH_INTERVAL);

  // カードサイズをlocalStorageから復元
  const savedSize = localStorage.getItem('monitor_card_size') || 'medium';
  setCardSize(savedSize);
}

// ===== カードサイズ切替 =====
const CARD_SIZES = {
  small:  { minWidth:'140px', nameSize:'16px', longSize:'12px' },
  medium: { minWidth:'200px', nameSize:'22px', longSize:'15px' },
  large:  { minWidth:'260px', nameSize:'28px', longSize:'18px' },
};
let currentSize = 'medium';

function setCardSize(size) {
  currentSize = size;
  const s = CARD_SIZES[size];
  // グリッドのminWidth更新
  document.querySelectorAll('.staff-grid').forEach(el => {
    el.style.gridTemplateColumns = `repeat(auto-fill, minmax(${s.minWidth}, 1fr))`;
  });
  // 名前フォントサイズ更新
  document.querySelectorAll('.card-name:not(.long)').forEach(el => {
    el.style.fontSize = s.nameSize;
  });
  document.querySelectorAll('.card-name.long').forEach(el => {
    el.style.fontSize = s.longSize;
  });
  // ボタンのactive状態更新
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === {small:'小',medium:'中',large:'大'}[size]);
  });
  // localStorageに保存
  localStorage.setItem('monitor_card_size', size);
}

// ===== 居場所登録モーダル =====
const STATUSES_REG = [
  { key:'honsha_office',  label:'本社事務所', icon:'🏢' },
  { key:'honsha_factory', label:'本社工場',   icon:'🏭' },
  { key:'nezaki',         label:'根崎',       icon:'🔧' },
  { key:'nezaki2',        label:'根崎第2',    icon:'🔩' },
  { key:'gaishutsu',      label:'外出/出張',  icon:'🚗' },
  { key:'zaitaku',        label:'在宅',       icon:'🏠' },
  { key:'yasumi',         label:'休み',       icon:'😴' },
];

let regStaff = null;
let regStatus = null;

function openRegModal(id) {
  regStaff = STAFF_MASTER.find(m => m.id === id);
  if (!regStaff) return;
  regStatus = null;

  // 会長は出勤のみ
  const isChairman = regStaff.dept === '会長';
  const statuses = isChairman
    ? [{ key:'honsha_office', label:'出勤', icon:'🏢' }]
    : STATUSES_REG;

  document.getElementById('regName').textContent = regStaff.name;
  document.getElementById('regGrid').innerHTML = statuses.map(s =>
    `<button class="reg-btn" onclick="selectRegStatus('${s.key}')" id="regbtn-${s.key}">
      <span class="reg-icon">${s.icon}</span>
      <span>${s.label}</span>
    </button>`
  ).join('');
  document.getElementById('regSubmit').disabled = true;

  // 現在のステータスをハイライト
  const cur = state[id]?.status;
  if (cur) {
    const curBtn = document.getElementById('regbtn-' + cur);
    if (curBtn) { curBtn.classList.add('selected'); regStatus = cur; document.getElementById('regSubmit').disabled = false; }
  }

  document.getElementById('regOverlay').classList.remove('hidden');
  // スライドを一時停止
  if (!isPaused) togglePause();
}

function selectRegStatus(key) {
  regStatus = key;
  document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('regbtn-' + key)?.classList.add('selected');
  document.getElementById('regSubmit').disabled = false;
}

function closeRegModal() {
  document.getElementById('regOverlay').classList.add('hidden');
  regStaff = null; regStatus = null;
  // スライド再開
  if (isPaused) togglePause();
}

async function doRegister() {
  if (!regStaff || !regStatus) return;
  const btn = document.getElementById('regSubmit');
  btn.disabled = true;
  btn.textContent = '登録中...';

  const now = new Date();
  const updated = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + '更新';
  const payload = {
    id: regStaff.id, name: regStaff.name, dept: regStaff.dept,
    status: regStatus, updated,
    memo: '', leaveStart: '', leaveEnd: ''
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.ok) {
      state[regStaff.id] = { status: regStatus, updated, memo: '', leaveStart: '', leaveEnd: '' };
      closeRegModal();
      if (viewMode === 'location') rebuildSlides(); else rebuildDeptSlides();
      btn.textContent = '登録する';
    } else { throw new Error(); }
  } catch(e) {
    btn.textContent = '✗ エラー';
    setTimeout(() => { btn.textContent = '登録する'; btn.disabled = false; }, 2000);
  }
}

// モーダル外クリックで閉じる
document.getElementById('regOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('regOverlay')) closeRegModal();
});
</script>
