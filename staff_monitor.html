<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社員所在地ボード — モニター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width:100%; height:100%; font-family:'Noto Sans JP',sans-serif; background:#1a1a1a; overflow:hidden; }

  .slide-wrap { width:100%; height:100%; position:relative; }

  .slide {
    position:absolute; inset:0; display:flex; flex-direction:column;
    opacity:0; transition:opacity 0.6s ease; pointer-events:none;
  }
  .slide.active { opacity:1; pointer-events:auto; }

  /* HEADER */
  .slide-header {
    padding: 20px 48px 10px;
    display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0;
  }
  .slide-location { display:flex; align-items:center; gap:14px; }
  .location-dot { width:18px; height:18px; border-radius:50%; flex-shrink:0; }
  .location-name { font-size:36px; font-weight:900; letter-spacing:-1px; line-height:1; }
  .location-subtitle { font-size:13px; opacity:0.45; margin-top:3px; font-weight:400; }
  .location-count { font-size:18px; font-weight:500; opacity:0.5; margin-left:4px; }
  .slide-meta { text-align:right; }
  .slide-company { font-size:12px; font-weight:500; opacity:0.45; }
  .slide-clock { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

  /* PROGRESS */
  .progress-bar {
    height:3px; flex-shrink:0; margin:8px 48px 10px;
    border-radius:999px; overflow:hidden; background:rgba(255,255,255,0.12);
  }
  .progress-fill { height:100%; border-radius:999px; width:0%; transition:width linear; }

  /* GRID */
  .slide-body { flex:1; overflow:hidden; padding:0 48px 20px; }

  .staff-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap:7px;
    align-content:start;
  }

  .staff-card {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:10px;
    padding:9px 12px;
    position:relative; overflow:hidden;
  }
  .staff-card.non-default {
    background:rgba(255,255,255,0.13);
    border-color:rgba(255,160,40,0.55);
  }
  .staff-card.non-default::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:4px; background:#FFA028; border-radius:10px 0 0 10px;
  }

  .card-name {
    font-size:17px; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    margin-bottom:2px; line-height:1.3;
  }
  .card-name.long {
    font-size:12px;
    white-space:normal;
    overflow:visible;
    text-overflow:unset;
    line-height:1.25;
  }
  .card-dept { font-size:11px; opacity:0.45; margin-bottom:0; }
  .card-time { font-size:10px; opacity:0.3; margin-top:3px; }

  .empty-msg { flex:1; display:flex; align-items:center; justify-content:center; font-size:18px; opacity:0.3; font-weight:500; }

  /* INDICATORS */
  .indicators {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; z-index:200;
  }
  .ind-dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,0.25); cursor:pointer;
    transition:background .2s, transform .2s;
  }
  .ind-dot.active { background:rgba(255,255,255,0.9); transform:scale(1.3); }

  /* SYNC */
  .sync-badge {
    position:fixed; top:16px; right:16px;
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,0.4); padding:5px 10px; border-radius:999px;
    font-size:11px; z-index:200; backdrop-filter:blur(4px);
  }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:#1D9E75; }
  .sync-dot.syncing { background:#BA7517; animation:pulse 1s infinite; }
  .sync-dot.error   { background:#E24B4A; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .sync-text { font-size:11px; opacity:0.7; }

  /* CONTROLS */
  .controls { position:fixed; bottom:50px; right:20px; display:flex; flex-direction:column; gap:6px; z-index:200; }
  .ctrl-btn {
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15);
    color:rgba(255,255,255,0.7); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s; font-family:inherit;
  }
  .ctrl-btn:hover { background:rgba(255,255,255,0.22); }
  .ctrl-btn.paused { background:rgba(255,200,0,0.2); color:#ffd000; }

  .interval-select {
    position:fixed; bottom:20px; right:20px;
    background:rgba(0,0,0,0.4); backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.15); border-radius:8px;
    color:rgba(255,255,255,0.7); font-size:12px; padding:4px 8px;
    font-family:inherit; cursor:pointer; z-index:200;
  }
  .interval-select option { background:#2a2a2a; color:#fff; }

  .loading-overlay {
    position:fixed; inset:0; z-index:400; background:#1a1a1a;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px;
  }
  .loading-spinner {
    width:36px; height:36px; border:3px solid rgba(255,255,255,0.15); border-top-color:#1D9E75;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:rgba(255,255,255,0.4); }
</style>
</head>
<body>

function updateClock() {
  const now = new Date();
  const str = now.toLocaleDateString('ja-JP',{month:'short',day:'numeric',weekday:'short'}) + ' ' +
    now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('.slide-clock').forEach(el => el.textContent = str);
}

setInterval(updateClock, 10000);

function setSyncStatus(st, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (st==='syncing'?' syncing':st==='error'?' error':'');
  document.getElementById('syncText').textContent = msg;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return (d.getMonth()+1) + '/' + d.getDate();
}

async function fetchAll(silent=false) {
  if (!silent) setSyncStatus('syncing','取得中...');
  try {
    const res = await fetch(GAS_URL + '?t=' + Date.now());
    const json = await res.json();
    if (!json.ok) throw new Error();
    json.data.forEach(row => {
      const id = parseInt(row.id);
      if (!isNaN(id) && state[id]!==undefined && row.status) {
        state[id] = { status: row.status, updated: row.updated||'', memo: row.memo||'', leaveStart: row.leaveStart||'', leaveEnd: row.leaveEnd||'' };
      }
    });
    const t = new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    setSyncStatus('ok', t+' 更新');
    rebuildSlides();
  } catch(e) { setSyncStatus('error','通信エラー'); }
}

      return members.length > 0;

          </div>`;
        }).join('')}</div>`
      : `<div class="empty-msg">現在この場所にいる社員はいません</div>`;

    slide.innerHTML = `
      <div class="slide-header">
        <div class="slide-location">
          <div class="location-dot" style="background:${def.color};"></div>
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span class="location-name">${def.label}</span>
              <span class="location-count">${members.length}名</span>
            </div>
            ${def.subtitle?`<div class="location-subtitle">${def.subtitle}</div>`:''}
          </div>
        </div>
        <div class="slide-meta">
          <div class="slide-company">Nakashima Manufacturing</div>
          <div class="slide-clock"></div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-${idx}" style="background:${def.color};"></div>
      </div>
      <div class="slide-body">${cardsHtml}</div>
    `;
    wrap.appendChild(slide);
  });

  const indWrap = document.getElementById('indicators');
  indWrap.innerHTML = slideKeys.map((defIdx, idx) => {
    const def = SLIDE_DEFS[defIdx];
    return `<div class="ind-dot ${idx===currentIndex?'active':''}"
      style="${idx===currentIndex?`background:${def.color};`:''}"
      onclick="goSlide(${idx})" title="${def.label}"></div>`;
  }).join('');

  updateClock();
  if (currentIndex >= slideKeys.length) currentIndex = 0;
  showSlide(currentIndex, false);
}

function showSlide(idx, animate=true) {
  currentIndex = idx;
  document.querySelectorAll('.slide').forEach((el,i) => el.classList.toggle('active', i===idx));
  document.querySelectorAll('.ind-dot').forEach((el,i) => {
    const def = SLIDE_DEFS[slideKeys[i]];
    el.classList.toggle('active', i===idx);
    el.style.background = i===idx ? def.color : '';
  });
  startProgress(idx);
}

function startProgress(idx) {
  clearInterval(progressTimer);
  const fill = document.getElementById('progress-'+idx);
  if (!fill) return;
  fill.style.transition = 'none'; fill.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${slideInterval}ms linear`;
    fill.style.width = '100%';
  }));
}

function nextSlide() { showSlide((currentIndex+1)%slideKeys.length); resetTimer(); }
function prevSlide() { showSlide((currentIndex-1+slideKeys.length)%slideKeys.length); resetTimer(); }
function goSlide(idx) { showSlide(idx); resetTimer(); }

function resetTimer() {
  clearInterval(slideTimer);
  if (!isPaused) slideTimer = setInterval(nextSlide, slideInterval);
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = isPaused ? '▶' : '⏸';
  btn.classList.toggle('paused', isPaused);
  if (isPaused) {
    clearInterval(slideTimer);
    const fill = document.getElementById('progress-'+currentIndex);
    if (fill) { const w = getComputedStyle(fill).width; fill.style.transition='none'; fill.style.width=w; }
  } else { resetTimer(); startProgress(currentIndex); }
}

function changeInterval(val) { slideInterval=parseInt(val); resetTimer(); startProgress(currentIndex); }

document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') nextSlide();
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') prevSlide();
  if (e.key===' ') { e.preventDefault(); togglePause(); }
  if (e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.();
});

async function init() {
  rebuildSlides();
  await fetchAll(false);
  document.getElementById('loadingOverlay').style.display = 'none';
  slideTimer = setInterval(nextSlide, slideInterval);
  setInterval(() => fetchAll(true), FETCH_INTERVAL);
}

init();
</script>
</body>
</html>
