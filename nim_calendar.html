<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件スケジュール管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
    --text:#e2e4ef;--text-dim:#7880a4;--accent:#4f7fff;--success:#3ecf8e;
    --c1:#4f7fff;--c1-bg:rgba(79,127,255,.18);
    --c2:#ff6b6b;--c2-bg:rgba(255,107,107,.18);
    --c3:#3ecf8e;--c3-bg:rgba(62,207,142,.18);
    --c4:#f7b731;--c4-bg:rgba(247,183,49,.18);
    --c5:#c678dd;--c5-bg:rgba(198,120,221,.18);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* HEADER */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.05em;}
  .nav-tabs{display:flex;gap:4px;}
  .nav-tab{padding:6px 18px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-dim);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .2s;}
  .nav-tab.active{background:var(--accent);color:#fff;font-weight:500;}
  .nav-tab:not(.active):hover{border-color:var(--border);color:var(--text);}

  /* VIEWS */
  .view{display:none;padding:20px 24px;}
  .view.active{display:block;}

  /* BUTTONS */
  .btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#6b90ff;border-color:#6b90ff;color:#fff;}
  .btn-sm{padding:3px 10px;font-size:11px;}
  .btn-toggle{font-size:12px;padding:5px 12px;}
  .btn-toggle.active{background:var(--surface2);border-color:var(--accent);color:var(--accent);font-weight:600;}
  .btn-danger{color:#ff6b6b;border-color:rgba(255,107,107,.3);}
  .btn-danger:hover{background:rgba(255,107,107,.1);border-color:#ff6b6b;color:#ff6b6b;}

  /* TOOLBAR */
  .cal-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-toolbar h2{font-size:17px;font-weight:500;flex:1;min-width:160px;}
  .toolbar-group{display:flex;gap:6px;align-items:center;}

  /* MEMBER FILTER */
  .member-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .member-chip{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;transition:all .15s;user-select:none;}
  .member-chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .member-chip.active{border-color:currentColor;}
  .member-chip:not(.active){opacity:.35;}

  /* ===== LAYOUT（左：サイドパネル、右：カレンダー、下：集計） ===== */
  .layout-wrap{display:flex;gap:14px;align-items:flex-start;}
  .left-col{width:190px;flex-shrink:0;}
  .cal-and-summary{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}

  /* ===== SIDE PANEL（案件一覧） ===== */
  .side-panel-title{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
  .project-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;}

  /* 案件アイテム本体 */
  .side-proj-item{border-radius:6px;border:1px solid var(--border);background:var(--surface);overflow:hidden;transition:border-color .15s;}
  .side-proj-item:hover{border-color:var(--accent);}
  .side-proj-header{padding:6px 9px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;}
  .side-proj-name{font-size:11px;font-weight:500;color:var(--text);line-height:1.3;}
  .side-proj-arrow{font-size:9px;color:var(--text-dim);transition:transform .2s;flex-shrink:0;}
  .side-proj-item.open .side-proj-arrow{transform:rotate(180deg);}

  /* 担当者リスト（展開時） */
  .side-member-list{display:none;border-top:1px solid var(--border);padding:4px;}
  .side-proj-item.open .side-member-list{display:flex;flex-direction:column;gap:2px;}
  .side-member-chip{
    display:flex;align-items:center;gap:6px;padding:4px 7px;border-radius:4px;
    font-size:10px;cursor:grab;user-select:none;transition:background .1s;
  }
  .side-member-chip:hover{background:rgba(255,255,255,.05);}
  .side-member-chip:active{cursor:grabbing;}
  .side-member-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .side-member-name{font-weight:500;}
  .drag-hint{font-size:9px;color:var(--text-dim);padding:4px 7px;font-style:italic;}

  /* ===== 月次集計パネル（カレンダー下・横並び） ===== */
  .summary-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;}
  .summary-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .summary-title{font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;font-family:'IBM Plex Mono',monospace;}
  .summary-month-label{font-size:13px;color:var(--accent);font-weight:700;font-family:'IBM Plex Mono',monospace;}
  /* 担当者カードを横一列に */
  .summary-members{display:flex;gap:12px;flex-wrap:wrap;}
  .summary-row{
    flex:1;min-width:140px;
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;
  }
  .summary-member-name{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .summary-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .summary-kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
  .summary-kpi-card{background:var(--surface);border-radius:5px;padding:6px 8px;text-align:center;}
  .summary-kpi-label{font-size:9px;color:var(--text-dim);margin-bottom:3px;letter-spacing:.04em;}
  .summary-kpi-val{font-size:20px;font-weight:700;font-family:'IBM Plex Mono',monospace;line-height:1;}
  .summary-bar-wrap{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:3px;}
  .summary-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
  .summary-pct{font-size:10px;font-family:'IBM Plex Mono',monospace;text-align:right;}
  .summary-empty{font-size:11px;color:var(--text-dim);font-style:italic;}

  /* CALENDAR */
  .months-wrap{display:flex;flex-direction:column;gap:14px;flex:1;overflow-x:auto;}
  .months-row{display:grid;gap:14px;}
  .months-row.view-1{grid-template-columns:1fr;}
  .months-row.view-3{grid-template-columns:1fr 1fr 1fr;}
  .month-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:0;}
  .month-header{background:var(--surface2);padding:8px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;color:var(--accent);}
  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);}
  .dow-cell{text-align:center;padding:4px 2px;font-size:10px;color:var(--text-dim);font-weight:500;}
  .dow-cell:first-child{color:#ff6b6b;}
  .dow-cell:last-child{color:#4f7fff;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 2px;position:relative;transition:background .1s;}
  .view-1 .cal-cell{min-height:96px;}
  .view-3 .cal-cell{min-height:68px;}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.empty{background:rgba(0,0,0,.15);}
  .cal-cell.today{background:rgba(79,127,255,.06);}
  .date-num{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--text-dim);margin-bottom:2px;display:block;}
  .cal-cell.today .date-num{color:var(--accent);font-weight:700;}
  .cal-cell:nth-child(7n+1) .date-num{color:#ff6b6b;}
  .cal-cell:nth-child(7n) .date-num{color:#4f7fff;}

  /* HALF-DAY SLOTS */
  .half-slots{display:flex;flex-direction:column;gap:2px;}
  .slot-group{margin-bottom:1px;}
  .slot-group-label{font-size:7px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;padding-left:2px;margin-bottom:1px;line-height:1;}
  .slot-entries{display:flex;flex-direction:column;gap:1px;}
  .slot-entry{border-radius:3px;border:1px solid transparent;font-size:8px;position:relative;transition:all .1s;overflow:hidden;cursor:pointer;}
  .slot-entry:hover{filter:brightness(1.12);}
  .slot-entry.slot-drop-over{outline:2px solid var(--accent);outline-offset:-1px;}
  .slot-bar{display:flex;flex-direction:column;width:100%;}
  .slot-bar-plan{display:flex;align-items:center;padding:2px 4px;gap:3px;min-height:18px;}
  .slot-bar-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;line-height:1.2;font-size:8px;flex:1;}
  .view-3 .slot-bar-text{font-size:7px;}
  .slot-bar-sub{font-size:7px;opacity:.75;white-space:nowrap;overflow:hidden;}
  .slot-bar-result{margin-top:1px;padding:0 4px 2px;font-size:7px;font-family:'IBM Plex Mono',monospace;color:#3ecf8e;line-height:1.3;}
  .slot-bar-result .result-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-bottom:1px;}
  .slot-bar-result .result-fill{height:100%;border-radius:2px;background:#3ecf8e;}
  .slot-empty{border:1px dashed rgba(79,127,255,.25);border-radius:3px;min-height:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;opacity:.6;}
  .slot-empty:hover{opacity:1;border-color:var(--accent);background:rgba(79,127,255,.06);}
  .slot-empty.slot-drop-over{border-color:var(--accent);background:rgba(79,127,255,.15);opacity:1;}
  .slot-empty-label{font-size:8px;color:var(--text-dim);}

  /* ===== MASTER VIEW ===== */
  .master-cols{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;align-items:start;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
  .card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;}
  .form-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;}
  .form-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;padding:7px 10px;outline:none;transition:border .15s;}
  .form-input:focus{border-color:var(--accent);}
  .data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  .data-table th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text-dim);font-weight:500;font-size:10px;}
  .data-table td{padding:6px 8px;border-bottom:1px solid rgba(46,51,80,.4);vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .del-btn{padding:2px 8px;border-radius:4px;border:1px solid rgba(255,107,107,.3);background:transparent;color:#ff6b6b;font-size:11px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
  .del-btn:hover{background:rgba(255,107,107,.1);}
  .color-swatch{display:inline-flex;gap:6px;align-items:center;}
  .swatch{width:17px;height:17px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .1s;flex-shrink:0;}
  .swatch.selected{border-color:#fff;transform:scale(1.25);}

  /* ===== MODALS ===== */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px;width:400px;max-width:95vw;}
  .modal-title{font-size:15px;font-weight:700;margin-bottom:4px;font-family:'IBM Plex Mono',monospace;color:var(--accent);}
  .modal-sub{font-size:12px;color:var(--text-dim);margin-bottom:18px;}
  .modal-row{margin-bottom:14px;}
  .modal-label{font-size:10px;color:var(--text-dim);font-weight:600;margin-bottom:5px;letter-spacing:.03em;}
  .modal-info{background:var(--surface2);border-radius:6px;padding:7px 10px;font-size:13px;border:1px solid var(--border);}
  .modal-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;padding:8px 10px;outline:none;transition:border .15s;}
  .modal-select:focus{border-color:var(--accent);}
  .modal-select option{background:var(--surface2);}
  .modal-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;padding:8px 10px;outline:none;transition:border .15s;}
  .modal-input:focus{border-color:var(--accent);}
  .modal-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;border-radius:3px;background:var(--success);transition:width .3s;}
  .ratio-label{font-size:12px;color:var(--text-dim);margin-top:4px;font-family:'IBM Plex Mono',monospace;}

  /* GAS連携バー */
  .gas-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;flex-wrap:wrap;}
  .btn-save{background:var(--accent);border-color:var(--accent);color:#fff;font-size:12px;padding:5px 14px;}
  .btn-save:hover{background:#6b90ff;color:#fff;}
  .btn-save:disabled{opacity:.5;cursor:not-allowed;}
  .btn-load{background:var(--surface2);border-color:var(--border);color:var(--text);font-size:12px;padding:5px 14px;}
  .btn-load:disabled{opacity:.5;cursor:not-allowed;}
  .gas-status{font-size:11px;font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .gas-status.ok{color:#3ecf8e;}
  .gas-status.err{color:#ff6b6b;}
  .gas-status.loading{color:var(--text-dim);}

  /* 工程マスタ */
  .process-member-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
  .process-tab{padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all .15s;}
  .process-tab.active{color:#fff;font-weight:600;}
  .process-list{display:flex;flex-direction:column;gap:4px;margin-top:6px;}
  .process-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:var(--surface2);border-radius:5px;font-size:12px;}

  /* ===== 集計ビュー ===== */
  .report-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .rep-date-input{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;padding:6px 10px;outline:none;}
  .rep-date-input:focus{border-color:var(--accent);}
  .rep-select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;padding:6px 10px;outline:none;}
  .report-member-section{margin-bottom:24px;}
  .report-member-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border);}
  .report-member-name{font-size:16px;font-weight:700;}
  .report-member-summary{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .report-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
  .report-table th{text-align:left;padding:7px 10px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:600;}
  .report-table td{padding:7px 10px;border:1px solid var(--border);vertical-align:middle;}
  .report-table tr:hover td{background:rgba(255,255,255,.02);}
  .report-bar-cell{width:120px;}
  .report-mini-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:3px;}
  .report-mini-fill{height:100%;border-radius:3px;}
  .report-shortfall{font-size:11px;color:#f7b731;margin-top:2px;}
  .report-empty{padding:40px;text-align:center;color:var(--text-dim);font-size:13px;}
  /* 未達欄 */
  .shortfall-hint{font-size:11px;color:var(--text-dim);margin-bottom:6px;}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="logo">◈ SCHEDULE MGR</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('calendar')">📅 カレンダー</button>
    <button class="nav-tab" onclick="switchView('master')">⚙ マスタ管理</button>
    <button class="nav-tab" onclick="switchView('report')">📊 集計</button>
  </div>
</header>

<!-- ======= カレンダービュー ======= -->
<div id="view-calendar" class="view active">
  <div class="cal-toolbar">
    <button class="btn" onclick="shiftMonths(-1)">◀ 前へ</button>
    <h2 id="cal-range-label"></h2>
    <button class="btn" onclick="shiftMonths(1)">次へ ▶</button>
    <div class="toolbar-group">
      <button class="btn btn-toggle active" id="btn-view-1" onclick="setViewMode(1)">1ヶ月</button>
      <button class="btn btn-toggle" id="btn-view-3" onclick="setViewMode(3)">3ヶ月</button>
    </div>
    <button class="btn btn-primary" onclick="switchView('master')">⚙ マスタ管理</button>
  </div>
  <!-- GAS連携バー -->
  <!-- 同期ステータス表示 -->
  <div class="gas-bar">
    <span class="gas-status" id="gas-status"></span>
  </div>
  <div id="member-filter-wrap" class="member-filter"></div>
  <div class="layout-wrap">
    <!-- 左カラム：案件一覧のみ -->
    <div class="left-col">
      <div class="side-panel-title">📋 案件一覧</div>
      <div id="project-list" class="project-list"></div>
    </div>
    <!-- 右エリア：カレンダー＋集計 -->
    <div class="cal-and-summary">
      <div style="overflow-x:auto;">
        <div id="months-wrap" class="months-wrap">
          <div id="months-row" class="months-row view-1"></div>
        </div>
      </div>
      <!-- 月次集計（カレンダー下・横並び） -->
      <div class="summary-panel">
        <div class="summary-header">
          <div class="summary-title">📊 月次集計</div>
          <div class="summary-month-label" id="summary-month-label"></div>
        </div>
        <div id="summary-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- ======= マスタ管理ビュー ======= -->
<div id="view-master" class="view">
  <div class="master-cols">
    <!-- 担当者マスタ -->
    <div class="card">
      <div class="card-title">👤 担当者マスタ</div>
      <div class="form-row">
        <input class="form-input" id="member-name-input" placeholder="担当者名を入力" maxlength="20">
        <div class="color-swatch" id="member-color-pick">
          <div class="swatch selected" style="background:var(--c1);" onclick="selectColor(1,this)"></div>
          <div class="swatch" style="background:var(--c2);" onclick="selectColor(2,this)"></div>
          <div class="swatch" style="background:var(--c3);" onclick="selectColor(3,this)"></div>
          <div class="swatch" style="background:var(--c4);" onclick="selectColor(4,this)"></div>
          <div class="swatch" style="background:var(--c5);" onclick="selectColor(5,this)"></div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addMember()">追加</button>
      </div>
      <table class="data-table" id="member-table">
        <thead><tr><th>名前</th><th>色</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- 案件マスタ -->
    <div class="card">
      <div class="card-title">📋 案件マスタ</div>
      <div class="form-row">
        <input class="form-input" id="proj-name-input" placeholder="案件名を入力" maxlength="40">
        <button class="btn btn-primary btn-sm" onclick="addProject()">追加</button>
      </div>
      <table class="data-table" id="proj-table">
        <thead><tr><th>案件名</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- 工程マスタ -->
    <div class="card" id="process-master-card">
      <div class="card-title">🔧 工程マスタ</div>
      <div class="process-member-tabs" id="process-member-tabs"></div>
      <div class="form-row">
        <input class="form-input" id="process-name-input" placeholder="工程名を入力" maxlength="20">
        <button class="btn btn-primary btn-sm" onclick="addProcess()">追加</button>
      </div>
      <div class="process-list" id="process-list"></div>

    <!-- 使い方 -->
    <div class="card">
      <div class="card-title">💡 使い方</div>
      <div style="font-size:12px;color:var(--text-dim);line-height:2;">
        <div>① 担当者・案件をマスタ登録</div>
        <div>② 左パネルの案件名をクリック</div>
        <div>　→ 担当者が下に展開</div>
        <div>③ 担当者をドラッグして</div>
        <div>　カレンダーの日付にドロップ</div>
        <div>④ 配置済みバーをクリックで実績入力</div>
        <div style="margin-top:8px;padding:8px;background:var(--surface2);border-radius:6px;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
            <div style="width:20px;height:4px;border-radius:2px;background:#3ecf8e;"></div>
            <span style="font-size:11px;">緑バー＝実績達成率</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ======= 集計ビュー ======= -->
<div id="view-report" class="view">
  <div class="report-toolbar">
    <div class="toolbar-group">
      <button class="btn btn-toggle active" id="rep-mode-month" onclick="setReportMode('month')">月選択</button>
      <button class="btn btn-toggle" id="rep-mode-range" onclick="setReportMode('range')">期間指定</button>
    </div>
    <!-- 月選択 -->
    <div id="rep-month-ctrl" style="display:flex;align-items:center;gap:8px;">

      <input type="date" class="rep-date-input" id="rep-start">

    <select class="rep-select" id="rep-member-filter" onchange="renderReport()">
      <option value="">全員</option>
    </select>
  </div>
  <div id="report-body"></div>
</div>

<!-- ======= 実績入力モーダル ======= -->
<div class="modal-overlay" id="actual-modal">
  <div class="modal">
    <div class="modal-title">📝 実績入力</div>
    <div class="modal-row">
      <div class="modal-label">案件名</div>
      <div class="modal-info" id="modal-proj-name">-</div>
    </div>
    <div class="modal-row">
      <div class="modal-label">担当者</div>
      <div class="modal-info" id="modal-member-name">-</div>
    </div>
    <div class="modal-row">
      <div class="modal-label">日付 / スロット</div>
      <div class="modal-info" id="modal-date-slot">-</div>
    </div>
    <div class="modal-row">
      <div class="modal-label">実績時間 (H) ※ 最大4H</div>
      <input class="modal-input" id="modal-actual-h" type="number" min="0" max="4" step="0.5" placeholder="0">
    </div>
    <div class="modal-row">
      <div class="modal-label">工程名</div>
      <select class="modal-select" id="modal-process">
        <option value="">選択してください</option>
      </select>
    </div>
    <div class="modal-row" id="ratio-row" style="display:none;">
      <div class="modal-label">予定 4H に対する実績</div>
      <div class="progress-bar"><div class="progress-fill" id="modal-prog" style="width:0%"></div></div>
      <div class="ratio-label" id="modal-ratio-label"></div>
    </div>
    <!-- 未達時：残り時間の作業内容 -->
    <div class="modal-row" id="shortfall-row" style="display:none;">
      <div class="modal-label" style="color:#f7b731;">⚠ 残り時間の作業内容（必須）</div>
      <div class="shortfall-hint" id="shortfall-hint"></div>
      <select class="modal-select" id="modal-shortfall-process">
        <option value="">工程を選択してください</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" id="actual-modal-remove-btn" style="margin-right:auto;" onclick="removeFromSlot()">🗑 スロットから削除</button>
      <button class="btn" onclick="closeActualModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveActual()">保存</button>
    </div>
  </div>
</div>

<script>
// =====================================================
//  CONSTANTS
// =====================================================
const SLOT_H = 4;
const COLORS = {
  1:{bg:'rgba(79,127,255,.2)',fg:'#4f7fff'},
  2:{bg:'rgba(255,107,107,.2)',fg:'#ff6b6b'},
  3:{bg:'rgba(62,207,142,.2)',fg:'#3ecf8e'},
  4:{bg:'rgba(247,183,49,.2)',fg:'#f7b731'},
  5:{bg:'rgba(198,120,221,.2)',fg:'#c678dd'},
};

// デフォルト担当者
const DEFAULT_MEMBERS = [
  {name:'宍倉', color:1, processes:[]},
  {name:'福島', color:2, processes:["打合せ(社内・客先)", "総組付け", "出荷準備", "段取り作業", "Unit組付け", "塗装", "配管", "BKT製作取付", "カバー製作取付", "運転調整", "現地工事", "立会い", "不具合対応/修正", "納品", "引き取り", "非定常作業", "測定"]},
  {name:'貴美', color:3, processes:[]},
  {name:'中村', color:4, processes:["打合せ(社内・客先)", "総組付け", "出荷準備", "段取り作業", "Unit組付け", "塗装", "配管", "BKT製作取付", "カバー製作取付", "運転調整", "現地工事", "立会い", "不具合対応/修正", "納品", "引き取り", "非定常作業", "測定"]},
  {name:'井口', color:5, processes:["外注打合せ", "客先打合せ", "社内打合せ", "ソフト設計", "ハード図設計・機器構成確認", "各個動作確認", "部品手配", "盤内配線工事", "外部配線工事", "自動運転調整", "段取り作業", "現地運転調整", "立会い", "出荷準備", "取扱説明書作成", "画面作画", "外注管理", "見積資料作成", "現地配線工事", "機器立上作業", "ロボットプログラム設計", "ロボット運転調整", "不具合対応/修正"]},
];

// =====================================================
//  STATE
// =====================================================
let state = loadState() || null;
if(!state){
  // 初回：デフォルト担当者（工程込み）で初期化
  state = {
    members: DEFAULT_MEMBERS.map((m,i)=>({
      id:'m'+i, name:m.name, color:m.color, processes:m.processes||[]
    })),
    projects: [],
    slots: [],
    baseMonth: null,
    filterMembers: [],
  };
}
// マイグレーション：processesが未設定の担当者に補完
state.members.forEach((m,i)=>{
  if(!Array.isArray(m.processes)){
    const def=DEFAULT_MEMBERS.find(d=>d.name===m.name);
    m.processes=(def&&Array.isArray(def.processes))?def.processes:[];
  }
});
if(!state.slots) state.slots=[];
if(!state.filterMembers) state.filterMembers=[];
if(!state.baseMonth){
  const n=new Date();
  state.baseMonth=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;
}

let viewMode    = 1;
let dragData    = null;  // {projId, memberId} or {slotId}
let actualTarget= null;
let selectedColor = 1;
let openProjId  = null;  // 展開中の案件ID

// =====================================================
//  PERSIST
// =====================================================
function saveState(){localStorage.setItem('sched_v6',JSON.stringify(state));}
function loadState(){try{return JSON.parse(localStorage.getItem('sched_v6'));}catch{return null;}}

// =====================================================
//  UTILS
// =====================================================
function uid(){return Math.random().toString(36).slice(2,10);}
function parseYM(ym){const[y,m]=ym.split('-').map(Number);return{y,m};}
function addMonths(ym,n){let{y,m}=parseYM(ym);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return`${y}-${String(m).padStart(2,'0')}`;}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function dateKey(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function getMember(id){return state.members.find(m=>m.id===id);}
function getProject(id){return state.projects.find(p=>p.id===id);}
function colorOf(memberId){const m=getMember(memberId);return m?COLORS[m.color]:COLORS[1];}
function isVisible(memberId){return state.filterMembers.length===0||state.filterMembers.includes(memberId);}
function getSlotsAt(date,slot){return state.slots.filter(s=>s.date===date&&s.slot===slot&&isVisible(s.memberId));}

// =====================================================
//  VIEW SWITCH
// =====================================================
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  const idx={calendar:0,master:1,report:2}[v]||0;
  document.querySelectorAll('.nav-tab')[idx].classList.add('active');
  if(v==='calendar')renderCalendar();
  if(v==='master')renderMaster();
  if(v==='report')initReport();
}
function setViewMode(n){
  viewMode=n;
  document.getElementById('btn-view-1').classList.toggle('active',n===1);
  document.getElementById('btn-view-3').classList.toggle('active',n===3);
  renderCalendar();
}

// =====================================================
//  CALENDAR RENDER
// =====================================================
function shiftMonths(n){state.baseMonth=addMonths(state.baseMonth,n);saveState();scheduleSave();renderCalendar();}

function renderCalendar(){
  const months=viewMode===1?[state.baseMonth]:[state.baseMonth,addMonths(state.baseMonth,1),addMonths(state.baseMonth,2)];
  const{y:y0,m:m0}=parseYM(months[0]);
  const last=months[months.length-1];const{y:yL,m:mL}=parseYM(last);
  document.getElementById('cal-range-label').textContent=
    viewMode===1?`${y0}年 ${m0}月`:`${y0}年${m0}月 〜 ${yL}年${mL}月`;
  renderMemberFilter();
  renderSidePanel();
  renderSummary();
  const row=document.getElementById('months-row');
  row.className='months-row view-'+viewMode;
  row.innerHTML='';
  months.forEach(ym=>row.appendChild(buildMonthBlock(ym)));
}

// =====================================================
//  MEMBER FILTER
// =====================================================
function renderMemberFilter(){
  const wrap=document.getElementById('member-filter-wrap');
  wrap.innerHTML='';
  state.members.forEach(mem=>{
    const c=COLORS[mem.color];
    const active=state.filterMembers.length===0||state.filterMembers.includes(mem.id);
    const chip=document.createElement('div');
    chip.className='member-chip'+(active?' active':'');
    chip.style.color=c.fg;
    chip.innerHTML=`<span class="dot" style="background:${c.fg}"></span>${mem.name}`;
    chip.onclick=()=>{
      if(state.filterMembers.includes(mem.id))state.filterMembers=state.filterMembers.filter(x=>x!==mem.id);
      else state.filterMembers.push(mem.id);
      saveState();scheduleSave();renderCalendar();
    };
    wrap.appendChild(chip);
  });
}

// =====================================================
//  SIDE PANEL（案件クリック→担当者展開→ドラッグ）
// =====================================================
function renderSidePanel(){
  const list=document.getElementById('project-list');
  list.innerHTML='';
  if(!state.projects.length){
    list.innerHTML='<div style="font-size:11px;color:var(--text-dim);padding:4px 2px;">案件がありません<br><small>マスタ管理で登録してください</small></div>';
    return;
  }
  state.projects.forEach(proj=>{
    const isOpen=openProjId===proj.id;
    const item=document.createElement('div');
    item.className='side-proj-item'+(isOpen?' open':'');
    item.dataset.projId=proj.id;

    // ヘッダ（クリックで開閉）
    const hdr=document.createElement('div');
    hdr.className='side-proj-header';
    hdr.innerHTML=`<span class="side-proj-name">${proj.name}</span><span class="side-proj-arrow">▼</span>`;
    hdr.onclick=()=>{
      openProjId=(openProjId===proj.id)?null:proj.id;
      renderSidePanel();
    };
    item.appendChild(hdr);

    // 担当者リスト
    const mlist=document.createElement('div');
    mlist.className='side-member-list';
    if(isOpen){
      if(!state.members.length){
        const hint=document.createElement('div');
        hint.className='drag-hint';
        hint.textContent='担当者がいません';
        mlist.appendChild(hint);
      } else {
        const hint=document.createElement('div');
        hint.className='drag-hint';
        hint.textContent='↓ ドラッグしてカレンダーへ';
        mlist.appendChild(hint);
        state.members.forEach(mem=>{
          if(!isVisible(mem.id))return;
          const c=COLORS[mem.color];
          const chip=document.createElement('div');
          chip.className='side-member-chip';
          chip.draggable=true;
          chip.innerHTML=`<span class="side-member-dot" style="background:${c.fg}"></span><span class="side-member-name">${mem.name}</span>`;
          chip.addEventListener('dragstart',e=>{
            dragData={projId:proj.id, memberId:mem.id};
            e.dataTransfer.effectAllowed='copy';
          });
          mlist.appendChild(chip);
        });
      }
    }
    item.appendChild(mlist);
    list.appendChild(item);
  });
}

// =====================================================
//  月次集計
// =====================================================
function renderSummary(){
  const{y,m}=parseYM(state.baseMonth);
  document.getElementById('summary-month-label').textContent=`${y}年${m}月`;
  const body=document.getElementById('summary-body');
  body.innerHTML='';

  // その月のスロット絞り込み
  const prefix=`${y}-${String(m).padStart(2,'0')}-`;
  const monthSlots=state.slots.filter(s=>s.date.startsWith(prefix));

  if(!monthSlots.length){
    body.innerHTML='<div class="summary-empty">配置データなし</div>';return;
  }

  // 担当者ごとに集計
  const byMember={};
  monthSlots.forEach(s=>{
    if(!byMember[s.memberId])byMember[s.memberId]={planH:0,actualH:0};
    byMember[s.memberId].planH+=SLOT_H;
    byMember[s.memberId].actualH+=(s.actualH||0);
  });

  // 横並びコンテナ
  const membersWrap=document.createElement('div');
  membersWrap.className='summary-members';

  state.members.forEach(mem=>{
    const d=byMember[mem.id];
    if(!d)return;
    const c=COLORS[mem.color];
    const pct=d.planH>0?Math.round(d.actualH/d.planH*100):0;
    const barColor=pct>=100?'#3ecf8e':pct>=70?'#f7b731':'#4f7fff';
    const row=document.createElement('div');
    row.className='summary-row';
    row.innerHTML=`
      <div class="summary-member-name">
        <span class="summary-dot" style="background:${c.fg}"></span>${mem.name}
      </div>
      <div class="summary-kpi">
        <div class="summary-kpi-card">
          <div class="summary-kpi-label">予　定</div>
          <div class="summary-kpi-val" style="color:${c.fg}">${d.planH}<small style="font-size:11px;font-weight:400;">H</small></div>
        </div>
        <div class="summary-kpi-card">
          <div class="summary-kpi-label">実　績</div>
          <div class="summary-kpi-val" style="color:#3ecf8e">${d.actualH}<small style="font-size:11px;font-weight:400;">H</small></div>
        </div>
      </div>
      <div class="summary-bar-wrap">
        <div class="summary-bar-fill" style="width:${Math.min(pct,100)}%;background:${barColor};"></div>
      </div>
      <div class="summary-pct" style="color:${barColor}">${pct}%</div>`;
    membersWrap.appendChild(row);
  });
  body.appendChild(membersWrap);
}

// =====================================================
//  MONTH BLOCK
// =====================================================
function buildMonthBlock(ym){
  const{y,m}=parseYM(ym);
  const days=daysInMonth(y,m);
  const firstDow=new Date(y,m-1,1).getDay();
  const today=new Date();
  const todayKey=dateKey(today.getFullYear(),today.getMonth()+1,today.getDate());

  const block=document.createElement('div');
  block.className='month-block';
  block.innerHTML=`<div class="month-header">${y}年 ${m}月</div>
    <div class="dow-row">
      <div class="dow-cell">日</div><div class="dow-cell">月</div>
      <div class="dow-cell">火</div><div class="dow-cell">水</div>
      <div class="dow-cell">木</div><div class="dow-cell">金</div>
      <div class="dow-cell">土</div>
    </div>`;
  const grid=document.createElement('div');
  grid.className='cal-grid';
  for(let i=0;i<firstDow;i++){const e=document.createElement('div');e.className='cal-cell empty';grid.appendChild(e);}

  for(let d=1;d<=days;d++){
    const key=dateKey(y,m,d);
    const cell=document.createElement('div');
    cell.className='cal-cell'+(key===todayKey?' today':'');
    cell.innerHTML=`<span class="date-num">${d}</span>`;
    const halfSlots=document.createElement('div');
    halfSlots.className='half-slots';

    ['AM','PM'].forEach(slot=>{
      const group=document.createElement('div');
      group.className='slot-group';
      const lbl=document.createElement('div');
      lbl.className='slot-group-label';lbl.textContent=slot;
      group.appendChild(lbl);
      const entries=document.createElement('div');
      entries.className='slot-entries';

      getSlotsAt(key,slot).forEach(s=>{entries.appendChild(buildSlotEntry(s,key,slot));});

      // 空ドロップゾーン
      const empty=document.createElement('div');
      empty.className='slot-empty';
      empty.innerHTML='<span class="slot-empty-label">＋</span>';
      setupDropZone(empty,key,slot);
      entries.appendChild(empty);

      group.appendChild(entries);
      halfSlots.appendChild(group);
    });
    cell.appendChild(halfSlots);
    grid.appendChild(cell);
  }
  block.appendChild(grid);
  return block;
}

// =====================================================
//  SLOT ENTRY BUILDER
// =====================================================
function buildSlotEntry(s,date,slot){
  const proj=getProject(s.projId);
  const mem=getMember(s.memberId);
  const c=colorOf(s.memberId);
  const actualH=s.actualH||0;
  const hasActual=actualH>0;
  const pct=Math.round(actualH/SLOT_H*100);

  const el=document.createElement('div');
  el.className='slot-entry';
  el.style.borderColor=c.fg+'66';
  el.style.background=c.bg;
  el.style.color=c.fg;
  el.draggable=true;
  el.innerHTML=`
    <div class="slot-bar">
      <div class="slot-bar-plan">
        <span class="slot-bar-text" title="${proj?proj.name:''}">${proj?proj.name:'?'}</span>
        ${mem?`<span class="slot-bar-sub">${mem.name}</span>`:''}
      </div>
      ${hasActual?`
      <div class="slot-bar-result">
        <div class="result-bar"><div class="result-fill" style="width:${Math.min(pct,100)}%"></div></div>
        実績 ${actualH}H / 4H = ${pct}%
      </div>`:''}
    </div>`;
  el.addEventListener('click',e=>{e.stopPropagation();openActualModal(s.id);});
  // 右クリックで削除
  el.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    if(confirm('「'+(proj?proj.name:'この予定')+'」をスロットから削除しますか？')){
      state.slots=state.slots.filter(x=>x.id!==s.id);
      saveState();scheduleSave();renderCalendar();
    }
  });
  el.addEventListener('dragstart',e=>{
    dragData={slotId:s.id};
    e.dataTransfer.effectAllowed='move';
  });
  setupDropZone(el,date,slot);
  return el;
}

// =====================================================
//  DROP ZONE
// =====================================================
function setupDropZone(el,toDate,toSlot){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('slot-drop-over');});
  el.addEventListener('dragleave',()=>el.classList.remove('slot-drop-over'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('slot-drop-over');
    if(!dragData)return;
    if(dragData.slotId){
      // 移動
      const s=state.slots.find(x=>x.id===dragData.slotId);
      if(s){s.date=toDate;s.slot=toSlot;}
    } else if(dragData.projId&&dragData.memberId){
      // 新規配置（案件＋担当者が確定済み）
      state.slots.push({
        id:uid(),projId:dragData.projId,memberId:dragData.memberId,
        date:toDate,slot:toSlot,actualH:0,comment:''
      });
    }
    dragData=null;
    saveState();scheduleSave();renderCalendar();
  });
}

// =====================================================
//  ACTUAL MODAL
// =====================================================
function openActualModal(slotId){
  try{
    const s=state.slots.find(x=>x.id===slotId);
    if(!s)return;
    actualTarget=slotId;
    const proj=getProject(s.projId);
    const mem=getMember(s.memberId);
    document.getElementById('modal-proj-name').textContent=proj?proj.name:'-';
    document.getElementById('modal-member-name').textContent=mem?mem.name:'-';
    document.getElementById('modal-date-slot').textContent=s.date+'　'+s.slot;
    document.getElementById('modal-actual-h').value=s.actualH||'';
    // 工程ドロップダウンを担当者の工程リストで構築
    const procSel=document.getElementById('modal-process');
    procSel.innerHTML='<option value="">選択してください</option>';
    const processes=(mem&&Array.isArray(mem.processes))?mem.processes:[];
    processes.forEach(p=>{
      const opt=document.createElement('option');
      opt.value=p;opt.textContent=p;
      if(p===s.process)opt.selected=true;
      procSel.appendChild(opt);
    });
    if(s.process&&!processes.includes(s.process)){
      const opt=document.createElement('option');
      opt.value=s.process;opt.textContent=s.process+'（削除済み）';opt.selected=true;
      procSel.appendChild(opt);
    }
    updateRatio();
    // 残り時間工程ドロップダウンも同じ工程リストで構築
    const sfSel=document.getElementById('modal-shortfall-process');
    sfSel.innerHTML='<option value="">工程を選択してください</option>';
    processes.forEach(p=>{
      const opt=document.createElement('option');
      opt.value=p;opt.textContent=p;
      if(p===s.shortfallProcess)opt.selected=true;
      sfSel.appendChild(opt);
    });
    document.getElementById('actual-modal').classList.add('open');
  }catch(err){
    console.error('openActualModal error:',err);
    alert('実績入力画面を開けませんでした: '+err.message);
  }
}
function closeActualModal(){document.getElementById('actual-modal').classList.remove('open');actualTarget=null;}
function updateRatio(){
  const actualH=parseFloat(document.getElementById('modal-actual-h').value)||0;
  const row=document.getElementById('ratio-row');
  const shortRow=document.getElementById('shortfall-row');
  if(actualH>0){
    row.style.display='';
    const pct=Math.round(actualH/SLOT_H*100);
    const fill=document.getElementById('modal-prog');
    fill.style.width=Math.min(pct,100)+'%';
    fill.style.background=pct>=100?'#3ecf8e':pct>=75?'#f7b731':'#4f7fff';
    document.getElementById('modal-ratio-label').textContent='実績 '+actualH+'H / 予定 '+SLOT_H+'H = '+pct+'%';
    // 未達の場合：残り時間欄を表示
    if(actualH<SLOT_H){
      const diff=(SLOT_H-actualH).toFixed(1);
      document.getElementById('shortfall-hint').textContent='残り'+diff+'Hに何をしていたか選択してください';
      shortRow.style.display='';
    }else{
      shortRow.style.display='none';
    }
  }else{
    row.style.display='none';
    shortRow.style.display='none';
  }
}
document.getElementById('modal-actual-h').addEventListener('input',updateRatio);
function saveActual(){
  if(!actualTarget)return;
  const s=state.slots.find(x=>x.id===actualTarget);
  if(!s)return;
  s.actualH=parseFloat(document.getElementById('modal-actual-h').value)||0;
  s.process=document.getElementById('modal-process').value;
  s.shortfallProcess=document.getElementById('modal-shortfall-process').value;
  saveState();scheduleSave();closeActualModal();renderCalendar();
}
function removeFromSlot(){
  if(!actualTarget)return;
  if(!confirm('このスロットの配置を削除しますか？'))return;
  state.slots=state.slots.filter(x=>x.id!==actualTarget);
  saveState();scheduleSave();closeActualModal();renderCalendar();
}

// =====================================================
//  MASTER
// =====================================================
let activeProcessMemberId = null;

function renderMaster(){
  renderMemberTable();
  renderProjTable();
  renderProcessMaster();
}

function renderProcessMaster(){
  const tabs=document.getElementById('process-member-tabs');
  const list=document.getElementById('process-list');
  tabs.innerHTML='';
  list.innerHTML='';
  if(!state.members.length){
    list.innerHTML='<div style="font-size:11px;color:var(--text-dim);">担当者を先に登録してください</div>';
    return;
  }
  // activeProcessMemberIdが未設定なら最初の担当者に
  if(!activeProcessMemberId||!state.members.find(m=>m.id===activeProcessMemberId)){
    activeProcessMemberId=state.members[0].id;
  }
  // タブ
  state.members.forEach(m=>{
    const c=COLORS[m.color];
    const tab=document.createElement('button');
    tab.className='process-tab'+(m.id===activeProcessMemberId?' active':'');
    tab.textContent=m.name;
    if(m.id===activeProcessMemberId){tab.style.background=c.fg;tab.style.borderColor=c.fg;}
    tab.onclick=()=>{activeProcessMemberId=m.id;renderProcessMaster();};
    tabs.appendChild(tab);
  });
  // 選択中担当者の工程リスト
  const mem=getMember(activeProcessMemberId);
  if(!mem)return;
  const processes=mem.processes||[];
  if(!processes.length){
    list.innerHTML='<div style="font-size:11px;color:var(--text-dim);padding:4px;">工程がありません</div>';
    return;
  }
  processes.forEach((p,i)=>{
    const c=COLORS[mem.color];
    const item=document.createElement('div');
    item.className='process-item';
    item.innerHTML=`
      <span style="font-size:12px;">${p}</span>
      <button class="del-btn" onclick="deleteProcess('${mem.id}',${i})">削除</button>`;
    list.appendChild(item);
  });
}

function addProcess(){
  const name=document.getElementById('process-name-input').value.trim();
  if(!name){alert('工程名を入力してください');return;}
  if(!activeProcessMemberId){alert('担当者タブを選択してください');return;}
  const mem=getMember(activeProcessMemberId);
  if(!mem)return;
  if(!mem.processes)mem.processes=[];
  if(mem.processes.includes(name)){alert('同じ工程名が既にあります');return;}
  mem.processes.push(name);
  document.getElementById('process-name-input').value='';
  saveState();scheduleSave();renderProcessMaster();
}

function deleteProcess(memberId,index){
  const mem=getMember(memberId);
  if(!mem||!mem.processes)return;
  mem.processes.splice(index,1);
  saveState();scheduleSave();renderProcessMaster();
}
function renderMemberTable(){
  const tbody=document.querySelector('#member-table tbody');
  tbody.innerHTML='';
  state.members.forEach(m=>{
    const c=COLORS[m.color];
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.name}</td>
      <td><span style="background:${c.fg};width:12px;height:12px;display:inline-block;border-radius:50%;vertical-align:middle;"></span></td>
      <td><button class="del-btn" onclick="deleteMember('${m.id}')">削除</button></td>`;
    tbody.appendChild(tr);
  });
}
function renderProjTable(){
  const tbody=document.querySelector('#proj-table tbody');
  tbody.innerHTML='';
  state.projects.forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${p.name}</td>
      <td><button class="del-btn" onclick="deleteProject('${p.id}')">削除</button></td>`;
    tbody.appendChild(tr);
  });
}
function selectColor(n,el){
  selectedColor=n;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
  el.classList.add('selected');
}
function addMember(){
  const name=document.getElementById('member-name-input').value.trim();
  if(!name){alert('担当者名を入力してください');return;}
  if(state.members.length>=5){alert('担当者は最大5名です');return;}
  state.members.push({id:uid(),name,color:selectedColor});
  document.getElementById('member-name-input').value='';
  saveState();scheduleSave();renderMaster();
}
function deleteMember(id){
  if(!confirm('担当者を削除しますか？'))return;
  state.members=state.members.filter(m=>m.id!==id);
  saveState();scheduleSave();renderMaster();
}
function addProject(){
  const name=document.getElementById('proj-name-input').value.trim();
  if(!name){alert('案件名を入力してください');return;}
  state.projects.push({id:uid(),name});
  document.getElementById('proj-name-input').value='';
  saveState();scheduleSave();renderMaster();
}
function deleteProject(id){
  if(!confirm('案件を削除しますか？（配置済みのスロットも全て削除されます）'))return;
  state.projects=state.projects.filter(p=>p.id!==id);
  state.slots=state.slots.filter(s=>s.projId!==id);
  saveState();scheduleSave();renderMaster();
}

// =====================================================
//  集計ビュー
// =====================================================
let reportMode  = 'month';
let reportMonth = null;

function initReport(){
  if(!reportMonth){
    reportMonth=state.baseMonth||getCurrentYM();
  }
  // 担当者フィルタ更新
  const sel=document.getElementById('rep-member-filter');
  const prev=sel.value;
  sel.innerHTML='<option value="">全員</option>';
  state.members.forEach(m=>{sel.innerHTML+=`<option value="${m.id}">${m.name}</option>`;});
  if(prev)sel.value=prev;
  updateReportMonthLabel();
  renderReport();
}

function getCurrentYM(){
  const n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
}

function setReportMode(mode){
  reportMode=mode;
  document.getElementById('rep-mode-month').classList.toggle('active',mode==='month');
  document.getElementById('rep-mode-range').classList.toggle('active',mode==='range');
  document.getElementById('rep-month-ctrl').style.display=mode==='month'?'flex':'none';
  document.getElementById('rep-range-ctrl').style.display=mode==='range'?'flex':'none';
  if(mode==='month')renderReport();
}

function shiftReportMonth(n){
  reportMonth=addMonths(reportMonth,n);
  updateReportMonthLabel();
  renderReport();
}

function updateReportMonthLabel(){
  const{y,m}=parseYM(reportMonth);
  document.getElementById('rep-month-label').textContent=y+'年'+m+'月';
}

function renderReport(){
  const body=document.getElementById('report-body');
  body.innerHTML='';
  const filterMid=document.getElementById('rep-member-filter').value;

  // 対象スロットを絞り込む
  let slots=state.slots;
  if(reportMode==='month'){
    const prefix=reportMonth+'-';
    slots=slots.filter(s=>s.date.startsWith(prefix));
  } else {
    const start=document.getElementById('rep-start').value;
    const end=document.getElementById('rep-end').value;
    if(!start||!end){body.innerHTML='<div class="report-empty">開始日と終了日を選択してください</div>';return;}
    slots=slots.filter(s=>s.date>=start&&s.date<=end);
  }
  if(filterMid) slots=slots.filter(s=>s.memberId===filterMid);

  if(!slots.length){
    body.innerHTML='<div class="report-empty">該当するデータがありません</div>';return;
  }

  // 担当者ごとに集計
  const targets=filterMid?state.members.filter(m=>m.id===filterMid):state.members;
  targets.forEach(mem=>{
    const memSlots=slots.filter(s=>s.memberId===mem.id);
    if(!memSlots.length)return;
    const c=COLORS[mem.color];

    // 工程別集計
    const byProcess={};
    let totalPlan=0,totalActual=0;
    memSlots.forEach(s=>{
      const proc=s.process||'（未設定）';
      if(!byProcess[proc])byProcess[proc]={planH:0,actualH:0,shortfalls:[]};
      byProcess[proc].planH+=SLOT_H;
      byProcess[proc].actualH+=(s.actualH||0);
      if((s.actualH||0)<SLOT_H&&s.shortfallProcess){
        byProcess[proc].shortfalls.push({date:s.date,slot:s.slot,diff:SLOT_H-(s.actualH||0),proc:s.shortfallProcess});
      }
      totalPlan+=SLOT_H;
      totalActual+=(s.actualH||0);
    });

    const sec=document.createElement('div');
    sec.className='report-member-section';
    const totalPct=totalPlan>0?Math.round(totalActual/totalPlan*100):0;
    const barColor=totalPct>=100?'#3ecf8e':totalPct>=70?'#f7b731':'#4f7fff';
    sec.innerHTML=`
      <div class="report-member-header">
        <span style="width:10px;height:10px;border-radius:50%;background:${c.fg};display:inline-block;flex-shrink:0;"></span>
        <span class="report-member-name" style="color:${c.fg}">${mem.name}</span>
        <span class="report-member-summary">予定 ${totalPlan}H　実績 ${totalActual}H　達成率 ${totalPct}%</span>
      </div>
      <table class="report-table">
        <thead><tr>
          <th>工程名</th>
          <th style="text-align:right;">予定H</th>
          <th style="text-align:right;">実績H</th>
          <th style="text-align:right;">差異H</th>
          <th class="report-bar-cell">達成率</th>
          <th>未達時の作業</th>
        </tr></thead>
        <tbody id="rep-tbody-${mem.id}"></tbody>
      </table>`;
    body.appendChild(sec);

    const tbody=document.getElementById('rep-tbody-'+mem.id);
    Object.entries(byProcess).sort((a,b)=>a[0].localeCompare(b[0],'ja')).forEach(([proc,d])=>{
      const pct=d.planH>0?Math.round(d.actualH/d.planH*100):0;
      const diff=d.actualH-d.planH;
      const diffColor=diff>=0?'#3ecf8e':'#ff6b6b';
      const bc=pct>=100?'#3ecf8e':pct>=70?'#f7b731':'#4f7fff';
      const sfText=d.shortfalls.length?d.shortfalls.map(x=>x.date+' '+x.slot+': '+x.proc+'('+x.diff+'H)').join('<br>'):'';
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${proc}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;">${d.planH}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;">${d.actualH}</td>
        <td style="text-align:right;font-family:'IBM Plex Mono',monospace;color:${diffColor}">${diff>=0?'+':''}${diff}</td>
        <td class="report-bar-cell">
          <div>${pct}%</div>
          <div class="report-mini-bar"><div class="report-mini-fill" style="width:${Math.min(pct,100)}%;background:${bc};"></div></div>
        </td>
        <td><div class="report-shortfall">${sfText}</div></td>`;
      tbody.appendChild(tr);
    });
  });
}

// =====================================================
//  GAS 連携（自動保存・自動読込）
// =====================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzk1g8s5ZVXZHLaUKwZ22jmroha7fo8iH-WSTjy7f4jjoCscVrCNZvK0hUo1PybA8Yf/exec';
let isSyncing = false;
let saveTimer = null;

function setGasStatus(msg, type) {
  const el = document.getElementById('gas-status');
  el.textContent = msg;
  el.className = 'gas-status ' + type;
}

// データ変更時に呼ぶ：0.8秒後に自動保存（連続操作をまとめる）
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => autoSaveToGAS(), 800);
}

async function autoSaveToGAS() {
  if (isSyncing) return;
  isSyncing = true;
  setGasStatus('⟳ 同期中...', 'loading');
  try {
    const payload = {
      members:  state.members,
      projects: state.projects,
      slots:    state.slots,
    };
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (json.status === 'ok') {
      setGasStatus('✓ 同期済み ' + new Date().toLocaleTimeString('ja-JP'), 'ok');
    } else {
      setGasStatus('✗ 保存失敗', 'err');
    }
  } catch(e) {
    setGasStatus('✗ 通信エラー', 'err');
  }
  isSyncing = false;
}

async function autoLoadFromGAS() {
  setGasStatus('⟳ 読込中...', 'loading');
  try {
    const res = await fetch(GAS_URL);
    const json = await res.json();
    if (json.status === 'ok' && json.data) {
      const d = json.data;
      if (d.members  && d.members.length)  state.members  = d.members;
      if (d.projects && d.projects.length) state.projects = d.projects;
      // slotsは空でも必ず反映（古いデータを残さない）
      state.slots = d.slots || [];
      // processesマイグレーション（配列でない場合も補完）
      state.members.forEach(m=>{
        if(!Array.isArray(m.processes)){
          const def=DEFAULT_MEMBERS.find(d=>d.name===m.name);
          m.processes=(def&&Array.isArray(def.processes))?def.processes:[];
        }
      });
      saveState();
      renderCalendar();
      setGasStatus('✓ 同期済み ' + new Date().toLocaleTimeString('ja-JP'), 'ok');
    } else {
      setGasStatus('✓ データなし（新規）', 'ok');
    }
  } catch(e) {
    setGasStatus('✗ 通信エラー（オフライン？）', 'err');
  }
}

// =====================================================
//  INIT：まずlocalStorageで即表示 → バックグラウンドでGAS同期
// =====================================================
// ① localStorageのデータで即座にカレンダーを表示（待ち時間ゼロ）
renderCalendar();
// ② 裏でGASから最新データを取得して静かに更新
autoLoadFromGAS();
</script>
