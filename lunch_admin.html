<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昼食注文 管理画面</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f4f2; --surface: #fff; --border: #e2e0db;
    --text: #1a1a1a; --text-sub: #6b6965; --text-hint: #a09d99;
    --green: #1D9E75; --green-bg: #e8f5f0; --green-fg: #0f6e56;
    --red: #E24B4A; --red-bg: #fdecea; --red-fg: #8b1a19;
    --blue: #185FA5; --blue-bg: #e6f1fb; --blue-fg: #0c447c;
    --orange: #BA7517; --orange-bg: #faeeda; --orange-fg: #633806;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo { width: 32px; height: 32px; border-radius: 8px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; }
  .header-logo svg { width: 16px; height: 16px; fill: #fff; }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: var(--text-sub); }
  .header-right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  .icon-btn { display: flex; align-items: center; gap: 5px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text); font-family: inherit; transition: background .1s; white-space: nowrap; }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .icon-btn.primary:hover { background: #333; }

  .main { padding: 20px 24px; max-width: 1000px; margin: 0 auto; }

  .tabs { display: flex; gap: 3px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 20px; width: fit-content; }
  .tab-btn { padding: 7px 18px; border-radius: 7px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; background: transparent; color: var(--text-sub); transition: all .15s; }
  .tab-btn.active { background: var(--surface); color: var(--text); }

  .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .date-input { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface); outline: none; }

  /* SUMMARY - 本社・根崎別 */
  .location-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .loc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .loc-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .loc-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .loc-stat { text-align: center; flex: 1; min-width: 60px; }
  .loc-stat .s-label { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
  .loc-stat .s-num { font-size: 22px; font-weight: 900; }
  .loc-stat.s-futsuu .s-num { color: var(--green); }
  .loc-stat.s-oomori .s-num { color: var(--blue); }
  .loc-stat.s-total  .s-num { color: var(--text); }
  .loc-stat.s-pending .s-num { color: var(--orange); }
  .loc-stat.s-nashi .s-num { color: var(--text-sub); }

  /* VISITOR SUMMARY */
  .visitor-summary { background: var(--orange-bg); border: 1px solid #f0c060; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }
  .visitor-summary-title { font-weight: 700; color: var(--orange-fg); margin-bottom: 6px; }

  /* DEPT TABLE */
  .dept-section { margin-bottom: 20px; }
  .dept-label { font-size: 11px; font-weight: 700; color: var(--text-hint); letter-spacing: 0.8px; padding: 10px 0 6px; display: flex; align-items: center; gap: 8px; }
  .dept-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .order-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 6px; }
  .order-table th { background: #f8f8f6; font-size: 11px; color: var(--text-sub); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  .order-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .order-table tr:last-child td { border-bottom: none; }
  .order-table tr:hover td { background: #fafaf8; }

  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .badge-futsuu { background: var(--green-bg); color: var(--green-fg); }
  .badge-oomori  { background: var(--blue-bg); color: var(--blue-fg); }
  .badge-nashi   { background: var(--red-bg); color: var(--red-fg); }
  .badge-none    { background: var(--bg); color: var(--text-hint); }
  .badge-visitor { background: var(--orange-bg); color: var(--orange-fg); }

  /* SETTINGS */
  .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .settings-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; }
  .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .settings-label { font-size: 13px; color: var(--text-sub); width: 110px; flex-shrink: 0; }
  .settings-input { padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; background: var(--surface); }

  .ng-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .ng-table th { background: #f8f8f6; font-size: 11px; color: var(--text-sub); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  .ng-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ng-table tr:last-child td { border-bottom: none; }
  .toggle-btn { padding: 4px 12px; border-radius: 999px; border: 1.5px solid var(--border); font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s; }
  .toggle-btn.ng-on { background: var(--red-bg); color: var(--red-fg); border-color: var(--red); }
  .toggle-btn.ng-off { background: var(--bg); color: var(--text-hint); }

  /* MENU */
  .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: border-color .15s; background: var(--surface); }
  .upload-area:hover { border-color: #888; }
  .upload-area.dragover { border-color: var(--green); background: var(--green-bg); }
  .menu-list-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }

  .loading-overlay { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }

  /* Excel範囲指定モーダル */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.hidden { display: none !important; }
  .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 420px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
  .modal-section { margin-bottom: 18px; }
  .modal-section-title { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
  .range-type-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .range-type-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--text-sub); transition: all .15s; }
  .range-type-btn.active { border-color: var(--green); background: var(--green-bg); color: var(--green-fg); }
  .modal-date-row { display: flex; align-items: center; gap: 8px; }
  .modal-date-row input[type=date] { flex: 1; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal-date-row span { font-size: 13px; color: var(--text-sub); flex-shrink: 0; }
  .month-select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; }
  .modal-footer { display: flex; gap: 8px; margin-top: 20px; }
  .modal-cancel-btn { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .modal-export-btn { flex: 2; padding: 11px; border-radius: 10px; border: none; background: var(--green); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

  @media (max-width: 600px) {
    .location-summary { grid-template-columns: 1fr; }
    .header { padding: 10px 16px; }
    .main { padding: 16px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

<!-- Excel範囲指定モーダル -->
<div class="modal-overlay hidden" id="exportModal">
  <div class="modal-box">
    <div class="modal-title">📥 Excel出力 — 範囲指定</div>

    <div class="modal-section">
      <div class="modal-section-title">出力方法</div>
      <div class="range-type-tabs">
        <button class="range-type-btn active" id="rtDay" onclick="setRangeType('day')">1日</button>
        <button class="range-type-btn" id="rtRange" onclick="setRangeType('range')">期間指定</button>
        <button class="range-type-btn" id="rtMonth" onclick="setRangeType('month')">月指定</button>
      </div>
    </div>

    <!-- 1日 -->
    <div class="modal-section" id="rtDaySection">
      <div class="modal-section-title">日付</div>
      <input type="date" class="month-select" id="exportSingleDate">
    </div>

    <!-- 期間 -->
    <div class="modal-section hidden" id="rtRangeSection">
      <div class="modal-section-title">期間</div>
      <div class="modal-date-row">
        <input type="date" id="exportStartDate">
        <span>〜</span>
        <input type="date" id="exportEndDate">
      </div>
    </div>

    <!-- 月 -->
    <div class="modal-section hidden" id="rtMonthSection">
      <div class="modal-section-title">月</div>
      <input type="month" class="month-select" id="exportMonth">
    </div>

    <div class="modal-footer">
      <button class="modal-cancel-btn" onclick="closeExportModal()">キャンセル</button>
      <button class="modal-export-btn" onclick="doExport()">📥 出力する</button>
    </div>
  </div>
</div>

<header class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-2.56-1.36-3.78-5.01-4.35v-.64c0-.55-.45-1-1.01-1s-1.01.45-1.01 1v.64C5.36 11.21 4 12.43 4 14.99v4H1v2h18.03v-2h-3V14.99z"/></svg>
  </div>
  <div>
    <div class="header-title">昼食注文 管理画面</div>
    <div class="header-sub">Nakashima Manufacturing</div>
  </div>
  <div class="header-right">
    <button class="icon-btn primary" onclick="openExportModal()">📥 Excel出力</button>
    <button class="icon-btn" onclick="loadOrders()">🔄 更新</button>
  </div>
</header>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('orders')">注文集計</button>
    <button class="tab-btn" onclick="switchTab('settings')">設定</button>
    <button class="tab-btn" onclick="switchTab('menu')">メニュー管理</button>
    <button class="tab-btn" onclick="switchTab('topics')">お知らせ</button>
  </div>

  <!-- 注文集計 -->
  <div id="ordersTab">
    <div class="date-row">
      <input type="date" class="date-input" id="targetDate" onchange="loadOrders()">
      <span style="font-size:13px;color:var(--text-sub);" id="dateLabel"></span>
    </div>
    <div class="location-summary" id="locationSummary"></div>
    <div id="visitorSummary"></div>
    <div id="orderContent"></div>
  </div>

  <!-- 設定 -->
  <div id="settingsTab" class="hidden">
    <div class="settings-card">
      <div class="settings-title">⏰ 締切時刻</div>
      <div class="settings-row">
        <div class="settings-label">締切時刻</div>
        <input type="time" class="settings-input" id="deadlineInput" value="08:30">
        <button class="icon-btn primary" onclick="saveDeadline()">保存</button>
      </div>
    </div>
    <div class="settings-card">
      <div class="settings-title">× 永久×設定</div>
      <p style="font-size:13px;color:var(--text-sub);margin-bottom:14px;">ONにすると毎日デフォルトで×になります（本人が○に変更することも可能）</p>
      <table class="ng-table">
        <thead><tr><th>氏名</th><th>部署</th><th>永久×</th></tr></thead>
        <tbody id="ngTableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- お知らせ管理 -->
  <div id="topicsTab" class="hidden">
    <div class="settings-card">
      <div class="settings-title">📢 お知らせ管理（最大3件）</div>
      <div id="topicsAdminList"></div>
      <button class="icon-btn primary" onclick="saveTopicsAdmin()" style="margin-top:14px;">💾 保存・公開</button>
      <div id="topicStatus" style="margin-top:10px;font-size:13px;color:var(--text-sub);"></div>
    </div>
  </div>
    <div class="settings-card" id="topicPreview" style="display:none;">
      <div class="settings-title">現在のお知らせ</div>
      <div style="background:#fff8e8;border:1.5px solid #f0c060;border-radius:10px;padding:12px 16px;">
        <div style="font-size:11px;font-weight:700;color:#BA7517;margin-bottom:4px;">📢 お知らせ</div>
        <div id="topicPreviewText" style="font-size:14px;color:#3d2000;font-weight:500;line-height:1.6;"></div>
        <div id="topicPreviewExpiry" style="font-size:11px;color:#a09d99;margin-top:4px;"></div>
      </div>
    </div>
  </div>

  <!-- メニュー管理 -->
  <div id="menuTab" class="hidden">
    <div class="settings-card">
      <div class="settings-title">📄 メニューPDF管理</div>
      <div class="settings-row" style="margin-bottom:14px;">
        <div class="settings-label">対象月</div>
        <input type="month" class="settings-input" id="menuMonth">
      </div>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfInput').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div style="font-size:28px;margin-bottom:6px;">📄</div>
        <div style="font-size:14px;color:var(--text-sub);">PDFをここにドラッグ＆ドロップ</div>
        <div style="font-size:12px;color:var(--text-hint);margin-top:4px;">またはクリックしてファイルを選択</div>
      </div>
      <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="onFileSelect(event)">
      <div id="uploadStatus" style="margin-top:10px;font-size:13px;color:var(--text-sub);"></div>
    </div>
    <div class="settings-card">
      <div class="settings-title">登録済みメニュー</div>
      <div id="menuListAdmin"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- 編集ポップアップ -->
<div class="edit-popup-overlay hidden" id="editPopupOverlay">
  <div class="edit-popup">
    <div class="edit-popup-title" id="editPopupTitle"></div>
    <div class="edit-popup-sub" id="editPopupSub"></div>
    <div class="edit-popup-label">注文</div>
    <div class="edit-order-btns">
      <button class="edit-order-btn" id="pop-futsuu" onclick="selectEditOrder('x','futsuu')">○ 普通</button>
      <button class="edit-order-btn" id="pop-oomori" onclick="selectEditOrder('x','oomori')">○ 大盛</button>
      <button class="edit-order-btn" id="pop-nashi"  onclick="selectEditOrder('x','nashi')">× 食べない</button>
    </div>
    <div class="edit-popup-label">食べる場所</div>
    <div class="edit-place-btns">
      <button class="edit-place-btn" id="pop-honsha" onclick="selectEditPlace('x','honsha')">🏢 本社</button>
      <button class="edit-place-btn" id="pop-nezaki" onclick="selectEditPlace('x','nezaki')">🏭 根崎</button>
    </div>
    <div class="edit-popup-footer">
      <button class="edit-cancel-btn" onclick="closeEditPopup()">キャンセル</button>
      <button class="edit-save-btn" id="editSaveBtn" onclick="saveEditOrder()">💾 保存</button>
    </div>
  </div>
</div>

async function init() {
  const today = new Date();

  document.getElementById('menuMonth').value = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');

  // ローディング非表示（画面を即座に表示）
  document.getElementById('loadingOverlay').style.display = 'none';

  // getSettings・getStaff を先に実行（STAFF_MASTERを確定させる）
  const [settingsResult, staffResult] = await Promise.allSettled([
    fetch(GAS_URL+'?action=getSettings&t='+Date.now()).then(r=>r.json()),
    fetch(GAS_URL+'?action=getStaff&t='+Date.now()).then(r=>r.json())
  ]);

  // 社員マスタ反映（在籍者のみを集計・NG表に使用）
  if (staffResult && staffResult.status === 'fulfilled' && staffResult.value.ok
      && Array.isArray(staffResult.value.staff) && staffResult.value.staff.length) {
    ALL_STAFF = staffResult.value.staff.map(s => ({
      id: Number(s.id), name: s.name, dept: s.dept, location: s.location || '', active: s.active || '在籍'
    }));
    refreshActiveStaff();
  }

  // 設定反映
  if (settingsResult.status === 'fulfilled' && settingsResult.value.ok) {
    const json = settingsResult.value;
    const deadlineRaw = json.settings.deadline || '08:30';
    document.getElementById('deadlineInput').value = normalizeDeadline(deadlineRaw);
    Object.keys(json.settings).forEach(k => { if(k.startsWith('ng_')) permanentNG[k.replace('ng_','')] = json.settings[k]; });

  // ポップアップ外クリックで閉じる

function normalizeDeadline(val) {
  if (!val) return '08:30';
  const s = String(val).trim();
  // すでにHH:MM形式
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;
  // Excelシリアル値（小数）
  if (/^\d+(\.\d+)?$/.test(s)) {
    const frac = parseFloat(s) % 1;
    const totalMin = Math.round(frac * 24 * 60);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  }
  // ISO日付文字列（スプレッドシートがDate型に変換した場合）
  // UTC→JST（+9時間）に変換
  if (s.includes('T') || (s.includes('-') && s.length > 10)) {
    try {
      const d = new Date(s);
      if (!isNaN(d)) {
        const jstH = (d.getUTCHours() + 9) % 24;
        const jstM = d.getUTCMinutes();
        return String(jstH).padStart(2,'0') + ':' + String(jstM).padStart(2,'0');
      }
    } catch(e) {}
  }
  return s;
}

async function loadOrders() {
  const date = document.getElementById('targetDate').value;
  if (!date) return;
  const d = new Date(date);
  const days=['日','月','火','水','木','金','土'];
  document.getElementById('dateLabel').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
  try {
    const res = await fetch(GAS_URL+'?action=getOrders&date='+date+'&t='+Date.now());
    const json = await res.json();
    if (json.ok) {
      ordersData = json.orders.filter(o => !String(o.id).startsWith('visitor_'));
      visitorData = json.orders.filter(o => String(o.id).startsWith('visitor_'));
      if (json.permanentNG) permanentNG = json.permanentNG;
      renderLocationSummary();
      renderVisitorSummary();
      renderOrderTable();
    }
  } catch(e) { showToast('取得に失敗しました'); }
}

function normalizeId(id) {
  // "E-48" → "48"、"48" → "48" に統一
  return String(id).replace(/^E-/i, '');
}

function getEffectiveOrder(staff) {
  const staffId = normalizeId(staff.id);
  const found = ordersData.find(o => normalizeId(o.id) === staffId);
  if (found) return {order:found.order, place:found.place||getDefaultPlace(staff)};
  if (permanentNG[staff.id] === true || permanentNG[staff.id] === 'true' ||
      permanentNG[staffId]   === true || permanentNG[staffId]   === 'true') return {order:'nashi', place:getDefaultPlace(staff)};
  return {order:null, place:getDefaultPlace(staff)};
}

function renderLocationSummary() {
  const honsha = {futsuu:0, oomori:0, nashi:0, pending:0};
  const nezaki  = {futsuu:0, oomori:0, nashi:0, pending:0};

  STAFF_MASTER.forEach(s => {
    const {order, place} = getEffectiveOrder(s);
    const loc = place==='nezaki' ? nezaki : honsha;
    if (order==='futsuu') loc.futsuu++;
    else if (order==='oomori') loc.oomori++;
    else if (order==='nashi') loc.nashi++;
    else loc.pending++;
  });

  const card = (title, icon, data) => `
    <div class="loc-card">
      <div class="loc-title">${icon} ${title}</div>
      <div class="loc-row">
        <div class="loc-stat s-futsuu"><div class="s-label">○ 普通</div><div class="s-num">${data.futsuu}</div></div>
        <div class="loc-stat s-oomori"><div class="s-label">○ 大盛</div><div class="s-num">${data.oomori}</div></div>
        <div class="loc-stat s-total"><div class="s-label">合計</div><div class="s-num">${data.futsuu+data.oomori}</div></div>
        <div class="loc-stat s-nashi"><div class="s-label">× 食べない</div><div class="s-num">${data.nashi}</div></div>
        <div class="loc-stat s-pending"><div class="s-label">未回答</div><div class="s-num">${data.pending}</div></div>
      </div>
    </div>`;

  document.getElementById('locationSummary').innerHTML =
    card('本社','🏢',honsha) + card('根崎','🏭',nezaki);
}

function renderVisitorSummary() {
  if (visitorData.length===0) { document.getElementById('visitorSummary').innerHTML=''; return; }
  const rows = visitorData.map(v => {
    const count = v.count||1;
    const label = v.order==='futsuu'?'普通':'大盛';
    const place = v.place==='nezaki'?'根崎':'本社';
    return `<div>${v.name}：${label} ${count}名（${place}）</div>`;
  }).join('');
  document.getElementById('visitorSummary').innerHTML =
    `<div class="visitor-summary"><div class="visitor-summary-title">👤 来訪者注文</div>${rows}</div>`;
}

function renderOrderTable() {
  const container = document.getElementById('orderContent');
  const grouped = {};
  DEPT_ORDER.forEach(d => { grouped[d]=[]; });
  STAFF_MASTER.forEach(s => { if(grouped[s.dept]) grouped[s.dept].push(s); });
  const date = document.getElementById('targetDate').value;

  container.innerHTML = DEPT_ORDER.map(dept => {
    const members = grouped[dept];
    if (!members||members.length===0) return '';
    const rows = members.map(s => {
      const {order, place} = getEffectiveOrder(s);
      const badgeClass = order==='futsuu'?'badge-futsuu':order==='oomori'?'badge-oomori':order==='nashi'?'badge-nashi':'badge-none';
      const label = order==='futsuu'?'○ 普通':order==='oomori'?'○ 大盛':order==='nashi'?'× 食べない':'未回答';
      const placeLabel = place==='nezaki'?'根崎':'本社';
      const _id = String(s.id).replace(/'/g,"");
      const _name = String(s.name).replace(/'/g,"");
      const _dept = String(s.dept).replace(/'/g,"");
      const _order = String(order||'').replace(/'/g,"");
      const _place = String(place||'honsha').replace(/'/g,"");
      return `
        <tr class="order-row" onclick="openEditPopup('${_id}','${_name}','${_dept}','${_order}','${_place}','${date}')">
          <td>${s.name}</td>
          <td><span class="badge ${badgeClass}">${label}</span></td>
          <td style="font-size:12px;color:var(--text-sub);">${placeLabel}</td>
          <td style="font-size:11px;color:var(--text-hint);text-align:right;">✏️</td>
        </tr>`;
    }).join('');
    const futsuu = members.filter(s=>getEffectiveOrder(s).order==='futsuu').length;
    const oomori = members.filter(s=>getEffectiveOrder(s).order==='oomori').length;
    return `<div class="dept-section">
      <div class="dept-label">${dept} <span style="font-weight:400;color:var(--text-sub);">普通${futsuu} 大盛${oomori}</span></div>
      <table class="order-table">
        <thead><tr><th>氏名</th><th>注文</th><th>場所</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

const editState = { id:'', name:'', dept:'', date:'', order:'', place:'' };

function openEditPopup(id, name, dept, order, place, date) {
  editState.id=id; editState.name=name; editState.dept=dept;
  editState.date=date; editState.order=order; editState.place=place;

  document.getElementById('editPopupTitle').textContent = name + ' さんの注文を変更';
  document.getElementById('editPopupSub').textContent = date + ' ／ ' + dept;

  // 注文ボタン初期化
  ['futsuu','oomori','nashi'].forEach(o => {
    const btn = document.getElementById('pop-'+o);
    btn.className = 'edit-order-btn' + (order===o?' sel-'+o:'');
  });
  // 場所ボタン初期化
  ['honsha','nezaki'].forEach(p => {
    document.getElementById('pop-'+p).classList.toggle('active', place===p || (p==='honsha'&&place!=='nezaki'));
  });

  document.getElementById('editSaveBtn').onclick = () => saveEditOrder();
  document.getElementById('editPopupOverlay').classList.remove('hidden');
}

function closeEditPopup() {
  document.getElementById('editPopupOverlay').classList.add('hidden');
}

function selectEditOrder(_, order) {
  editState.order = order;
  ['futsuu','oomori','nashi'].forEach(o => {
    document.getElementById('pop-'+o).className = 'edit-order-btn' + (order===o?' sel-'+o:'');
  });
}

function selectEditPlace(_, place) {
  editState.place = place;
  ['honsha','nezaki'].forEach(p => {
    document.getElementById('pop-'+p).classList.toggle('active', place===p);
  });
}

async function saveEditOrder() {
  if (!editState.order) { showToast('注文を選択してください'); return; }
  const {id, name, dept, date, order, place} = editState;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action:'saveOrder', id, name, dept, date, order, place: place||'honsha', count:1 })
    });
    const json = await res.json();
    if (json.ok) {
      const existing = ordersData.find(o => normalizeId(o.id)===normalizeId(id) && o.date===date);
      if (existing) { existing.order=order; existing.place=place||'honsha'; }
      else ordersData.push({id, name, dept, date, order, place: place||'honsha'});
      closeEditPopup();
      showToast(name + ' の注文を更新しました');
      renderOrderTable();
      renderLocationSummary();
    } else { showToast('保存に失敗しました'); }
  } catch(e) { showToast('通信エラーが発生しました'); }
}

function setRangeType(type) {
  currentRangeType = type;
  ['day','range','month'].forEach(t => {
    document.getElementById('rt'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t===type);
    document.getElementById('rt'+t.charAt(0).toUpperCase()+t.slice(1)+'Section').classList.toggle('hidden', t!==type);

async function doExport() {
  let dates = [];
  if (currentRangeType === 'day') {
    const d = document.getElementById('exportSingleDate').value;
    if (!d) { showToast('日付を選択してください'); return; }
    dates = [d];
  } else if (currentRangeType === 'range') {
    const s = document.getElementById('exportStartDate').value;
    const e = document.getElementById('exportEndDate').value;
    if (!s || !e) { showToast('期間を選択してください'); return; }
    if (s > e) { showToast('開始日は終了日以前を選択してください'); return; }
    const cur = new Date(s);
    const end = new Date(e);
    while (cur <= end) {
      const dow = cur.getDay();
      if (dow !== 0 && dow !== 6) dates.push(cur.toISOString().slice(0,10));
      cur.setDate(cur.getDate()+1);
    }
    if (dates.length > 31) { showToast('出力範囲は31営業日以内にしてください'); return; }
  } else {
    const m = document.getElementById('exportMonth').value;
    if (!m) { showToast('月を選択してください'); return; }
    const [y, mo] = m.split('-').map(Number);
    const last = new Date(y, mo, 0).getDate();
    for (let i=1; i<=last; i++) {
      const d = new Date(y, mo-1, i);
      if (d.getDay()!==0 && d.getDay()!==6) dates.push(`${y}-${String(mo).padStart(2,'0')}-${String(i).padStart(2,'0')}`);
    }
  }

  closeExportModal();
  showToast('データ取得中...');

  // 複数日のデータをGASから取得
  const allOrders = {};
  for (const date of dates) {
    try {
      const res = await fetch(GAS_URL + '?action=getOrders&date=' + date);
      const json = await res.json();
      if (json.ok) allOrders[date] = json.orders || [];
    } catch(e) { allOrders[date] = []; }
  }

  exportRangeCSV(dates, allOrders);
}

function exportRangeCSV(dates, allOrders) {
  const BOM = '\uFEFF';
  const rows = [];

  // ヘッダー
  rows.push(['日付', '部署', '氏名', '注文', '場所']);

  const summaryRows = [];

  for (const date of dates) {
    const orders = allOrders[date] || [];
    const orderMap = {};
    orders.forEach(o => { orderMap[String(o.id)] = o; });

    const honsha = {futsuu:0, oomori:0};
    const nezaki  = {futsuu:0, oomori:0};

    // 社員明細
    DEPT_ORDER.forEach(dept => {
      STAFF_MASTER.filter(s => s.dept===dept).forEach(s => {
        const rec = orderMap[String(s.id)];
        const order = rec ? rec.order : (permanentNG[s.id] ? 'nashi' : '');
        const place = rec ? rec.place : getDefaultPlace(s);
        const label = order==='futsuu'?'普通': order==='oomori'?'大盛': order==='nashi'?'食べない':'未回答';
        const placeLabel = place==='nezaki'?'根崎':'本社';
        rows.push([date, dept, s.name, label, placeLabel]);
        if (order==='futsuu'||order==='oomori') {
          if (place==='nezaki') { if(order==='futsuu') nezaki.futsuu++; else nezaki.oomori++; }
          else { if(order==='futsuu') honsha.futsuu++; else honsha.oomori++; }
        }
      });
    });

    // 来訪者
    orders.filter(o => o.dept==='来訪者').forEach(v => {
      const label = v.order==='futsuu'?'普通':'大盛';
      const placeLabel = v.place==='nezaki'?'根崎':'本社';
      rows.push([date, '来訪者', v.name||'来訪者', label+'×'+(v.count||1), placeLabel]);
      const cnt = parseInt(v.count)||1;
      if (v.place==='nezaki') { if(v.order==='futsuu') nezaki.futsuu+=cnt; else nezaki.oomori+=cnt; }
      else { if(v.order==='futsuu') honsha.futsuu+=cnt; else honsha.oomori+=cnt; }
    });

    summaryRows.push([date, '本社', honsha.futsuu, honsha.oomori, honsha.futsuu+honsha.oomori, '根崎', nezaki.futsuu, nezaki.oomori, nezaki.futsuu+nezaki.oomori]);
  }

  // 集計セクション
  rows.push([]);
  rows.push(['【集計】']);
  rows.push(['日付', '本社_普通', '本社_大盛', '本社_合計', '根崎_普通', '根崎_大盛', '根崎_合計', '全体合計']);
  summaryRows.forEach(r => {
    const [date,,hF,hO,hT,,nF,nO,nT] = r;
    rows.push([date, hF, hO, hT, nF, nO, nT, hT+nT]);
  });

  // ファイル名
  let filename;
  if (dates.length === 1) filename = `昼食注文_${dates[0]}.csv`;
  else filename = `昼食注文_${dates[0]}_${dates[dates.length-1]}.csv`;

  const csv = BOM + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
  showToast('Excelファイルをダウンロードしました');
}

function exportCSV() {
  const date = document.getElementById('targetDate').value;
  if (!date) return;

  const honsha={futsuu:0,oomori:0}, nezaki={futsuu:0,oomori:0};
  const rows = [['日付','部署','氏名','注文','場所']];

  DEPT_ORDER.forEach(dept => {
    STAFF_MASTER.filter(s=>s.dept===dept).forEach(s => {
      const {order,place} = getEffectiveOrder(s);
      const label = order==='futsuu'?'普通':order==='oomori'?'大盛':order==='nashi'?'食べない':'未回答';
      const placeLabel = place==='nezaki'?'根崎':'本社';
      rows.push([date, dept, s.name, label, placeLabel]);
      if (place==='honsha') { if(order==='futsuu') honsha.futsuu++; else if(order==='oomori') honsha.oomori++; }
      else { if(order==='futsuu') nezaki.futsuu++; else if(order==='oomori') nezaki.oomori++; }
    });
  });

  // 来訪者
  visitorData.forEach(v => {
    const label = v.order==='futsuu'?'普通':'大盛';
    const placeLabel = v.place==='nezaki'?'根崎':'本社';
    rows.push([date, '来訪者', v.name, label+'×'+(v.count||1), placeLabel]);
  });

  // 集計行
  rows.push([]);
  rows.push(['【集計】']);
  rows.push(['本社', '普通', honsha.futsuu, '大盛', honsha.oomori, '合計', honsha.futsuu+honsha.oomori]);
  rows.push(['根崎', '普通', nezaki.futsuu, '大盛', nezaki.oomori, '合計', nezaki.futsuu+nezaki.oomori]);

  const BOM='\uFEFF';
  const csv=BOM+rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`昼食注文_${date}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}

function renderNGTable() {

    const isNG = permanentNG[s.id] === true || permanentNG[s.id] === 'true';
    return `<tr>
      <td>${s.name}</td>
      <td>${s.dept}</td>
      <td><button class="toggle-ng-btn ${isNG?'ng-on':'ng-off'}" onclick="toggleNG('${s.id}')">${isNG?'ON':'OFF'}</button></td>
    </tr>`;
  }).join('');
}

async function toggleNG(id) {
  const newVal = !permanentNG[id];
  try {
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'savePermanentNG',id,value:newVal})});
    const json = await res.json();
    if (json.ok) { permanentNG[id]=newVal; renderNGTable(); showToast(newVal?'永久×に設定':'永久×を解除'); }
  } catch(e) { showToast('保存に失敗しました'); }
}

// ===== 社員マスタ =====
let editingStaffId = null;
function escStaff(str){return String(str==null?'':str).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function refreshActiveStaff() {
  if (!ALL_STAFF.length) return;
  STAFF_MASTER = ALL_STAFF.filter(s => s.active !== '退職')
    .map(s => ({ id: s.id, name: s.name, dept: s.dept, location: s.location || '' }));
  renderNGTable();
}

function populateStaffDeptSelect(sel, selected) {
  if (!sel) return;
  sel.innerHTML = DEPT_ORDER.map(d => `<option value="${d}" ${d===selected?'selected':''}>${d}</option>`).join('');
}

const EMP_GAS_URL = 'https://script.google.com/macros/s/AKfycbwFE4wAC6cdFT8H2JmwW2XONgJz0j1rCI4xE2C9x1tKdMaib5aRgUKXE2N3hkQ034hu/exec';
const EMP_LS_KEY = 'employee_master_cache';

async function loadStaffAdmin() {
  populateStaffDeptSelect(document.getElementById('newStaffDept'), '');
  if (!ALL_STAFF.length) {
    try {
      // キャッシュ確認
      const cached = localStorage.getItem(EMP_LS_KEY);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed.length > 0) {
          ALL_STAFF = parsed.map(e => ({ id:e.id, empNo:e.empNo||'', name:String(e.name), dept:String(e.dept), category:e.category||'社員', location:e.place||'', active:e.active||'在籍' }));
          refreshActiveStaff();
          renderStaffMaster();
        }
      }
      // 統合マスタから最新取得
      const res = await fetch(EMP_GAS_URL+'?action=getEmployees&t='+Date.now());
      const json = await res.json();
      if (json.ok && Array.isArray(json.employees)) {
        ALL_STAFF = json.employees.map(e => ({ id:e.id, empNo:e.empNo||'', name:String(e.name), dept:String(e.dept), category:e.category||'社員', location:e.place||'', active:e.active||'在籍' }));
        localStorage.setItem(EMP_LS_KEY, JSON.stringify(json.employees));
        refreshActiveStaff();
      }
    } catch(e) { showToast('社員データの読み込みに失敗しました'); }
  }
  renderStaffMaster();
}

function renderStaffMaster() {
  const q = (document.getElementById('staffSearch').value || '').trim();
  const showRetired = document.getElementById('showRetired').checked;
  const deptIndex = d => { const i = DEPT_ORDER.indexOf(d); return i<0?999:i; };
  let list = ALL_STAFF.slice().sort((a,b)=> deptIndex(a.dept)-deptIndex(b.dept) || String(a.name).localeCompare(String(b.name),'ja'));
  let filtered = list.filter(s => showRetired || s.active!=='退職');
  if (q) filtered = filtered.filter(s => (s.name+' '+s.dept).indexOf(q) >= 0);
  const activeCount = ALL_STAFF.filter(s=>s.active!=='退職').length;
  const retiredCount = ALL_STAFF.length - activeCount;
  document.getElementById('staffCount').textContent =
    ALL_STAFF.length ? `在籍 ${activeCount}名 ／ 退職 ${retiredCount}名（表示 ${filtered.length}名）` : '';
  const tbody = document.getElementById('staffTableBody');
  if (!ALL_STAFF.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="color:var(--text-sub);padding:16px;line-height:1.7;">社員データがまだありません。<br>GASエディタで関数 <b>seedStaff</b> を一度だけ実行してください（初回セットアップ）。</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(s => {
    const retired = s.active==='退職';
    if (editingStaffId === s.id) {
      const deptOpts = DEPT_ORDER.map(d=>`<option value="${d}" ${d===s.dept?'selected':''}>${d}</option>`).join('');
      const locOpts = [['','自動'],['本社','本社'],['根崎','根崎']].map(([v,l])=>`<option value="${v}" ${v===(s.location||'')?'selected':''}>${l}</option>`).join('');
      return `<tr style="background:var(--green-bg);">
        <td><input type="text" id="edit-name-${s.id}" class="settings-input" value="${escStaff(s.name)}" style="width:100%;min-width:88px;"></td>
        <td><select id="edit-dept-${s.id}" class="settings-input">${deptOpts}</select></td>
        <td><select id="edit-loc-${s.id}" class="settings-input">${locOpts}</select></td>
        <td style="color:var(--text-sub);">${retired?'退職':'在籍'}</td>
        <td><div style="display:flex;gap:6px;justify-content:flex-end;">
          <button class="icon-btn primary" onclick="saveEditStaff(${s.id})">保存</button>
          <button class="icon-btn" onclick="cancelEditStaff()">取消</button>
        </div></td></tr>`;
    }
    const locLabel = s.location ? s.location : '自動';
    return `<tr ${retired?'style="opacity:.5;"':''}>
      <td style="font-weight:500;">${escStaff(s.name)}</td>
      <td style="color:var(--text-sub);">${escStaff(s.dept)}</td>
      <td style="color:var(--text-sub);">${locLabel}</td>
      <td>${retired?'<span style="color:var(--red);font-weight:700;">退職</span>':'<span style="color:var(--green-fg);font-weight:700;">在籍</span>'}</td>
      <td><div style="display:flex;gap:6px;justify-content:flex-end;">
        <button class="icon-btn" onclick="editStaff(${s.id})">編集</button>
        <button class="icon-btn" onclick="toggleRetire(${s.id})">${retired?'復職':'退職'}</button>
      </div></td></tr>`;
  }).join('');
}

async function addStaff() {
  const name = document.getElementById('newStaffName').value.trim();
  const dept = document.getElementById('newStaffDept').value;
  const loc  = document.getElementById('newStaffLoc').value;
  if (!name) { showToast('氏名を入力してください'); return; }
  if (!dept) { showToast('部署を選択してください'); return; }
  if (ALL_STAFF.some(s => s.name===name && s.dept===dept && s.active!=='退職')) {
    if (!confirm('同じ氏名・部署の在籍者がいます。追加しますか？')) return;
  }
  const newId = (ALL_STAFF.length ? Math.max(...ALL_STAFF.map(s=>s.id)) : -1) + 1;
  const rec = { id:newId, name, dept, location:loc, active:'在籍' };
  try {
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveStaff', id:rec.id, name:rec.name, dept:rec.dept, location:rec.location, active:rec.active})});
    const json = await res.json();
    if (json.ok) {
      ALL_STAFF.push(rec);
      document.getElementById('newStaffName').value='';
      document.getElementById('newStaffLoc').value='';
      refreshActiveStaff(); renderStaffMaster();
      showToast(name+' さんを追加しました');
    } else showToast('追加に失敗しました');
  } catch(e){ showToast('追加に失敗しました'); }
}

function editStaff(id){ editingStaffId = id; renderStaffMaster(); }
function cancelEditStaff(){ editingStaffId = null; renderStaffMaster(); }

async function saveEditStaff(id) {
  const s = ALL_STAFF.find(x=>x.id===id); if(!s) return;
  const name = document.getElementById('edit-name-'+id).value.trim();
  const dept = document.getElementById('edit-dept-'+id).value;
  const loc  = document.getElementById('edit-loc-'+id).value;
  if (!name){ showToast('氏名を入力してください'); return; }
  const rec = { id, name, dept, location:loc, active:s.active||'在籍' };
  try {
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveStaff', id:rec.id, name:rec.name, dept:rec.dept, location:rec.location, active:rec.active})});
    const json = await res.json();
    if (json.ok) {
      Object.assign(s, rec);
      editingStaffId = null;
      refreshActiveStaff(); renderStaffMaster();
      showToast('保存しました');
    } else showToast('保存に失敗しました');
  } catch(e){ showToast('保存に失敗しました'); }
}

async function toggleRetire(id) {
  const s = ALL_STAFF.find(x=>x.id===id); if(!s) return;
  const newActive = (s.active==='退職') ? '在籍' : '退職';
  if (newActive==='退職' && !confirm(s.name+' さんを退職（非表示）にします。よろしいですか？\n※過去の注文記録は残ります。')) return;
  const rec = { id, name:s.name, dept:s.dept, location:s.location||'', active:newActive };
  try {
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'saveStaff', id:rec.id, name:rec.name, dept:rec.dept, location:rec.location, active:rec.active})});
    const json = await res.json();
    if (json.ok) {
      s.active = newActive;
      refreshActiveStaff(); renderStaffMaster();
      showToast(newActive==='退職'? s.name+' さんを退職にしました' : s.name+' さんを復職にしました');
    } else showToast('更新に失敗しました');
  } catch(e){ showToast('更新に失敗しました'); }
}

// ===== MENU =====
function onDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('dragover'); }
function onDragLeave(e) { document.getElementById('uploadArea').classList.remove('dragover'); }
function onDrop(e) { e.preventDefault(); document.getElementById('uploadArea').classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); }
function onFileSelect(e) { handleFile(e.target.files[0]); }

async function handleFile(file) {
  if (!file||file.type!=='application/pdf') { showToast('PDFを選択してください'); return; }
  const month = document.getElementById('menuMonth').value;
  if (!month) { showToast('対象月を選択してください'); return; }
  document.getElementById('uploadStatus').textContent='アップロード中...';
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    try {
      const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'uploadPDF',month,filename:file.name,base64})});
      const json = await res.json();
      if (json.ok) { document.getElementById('uploadStatus').textContent='✅ アップロード完了！'; showToast('メニューをアップロードしました'); await loadMenuAdmin(); }
      else { document.getElementById('uploadStatus').textContent='❌ 失敗しました'; }
    } catch(e) { document.getElementById('uploadStatus').textContent='❌ 失敗しました'; }
  };
  reader.readAsDataURL(file);
}

async function deleteMenu(month) {
  if (!confirm(`${month} のメニューを削除しますか？`)) return;
  try {
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'deleteMenu',month})});
    const json = await res.json();
    if (json.ok) { showToast('削除しました'); await loadMenuAdmin(); }
  } catch(e) { showToast('削除に失敗しました'); }
}

async function loadMenuAdmin() {
  try {
    const res = await fetch(GAS_URL+'?action=getMenu&t='+Date.now());
    const json = await res.json();
    const list = document.getElementById('menuListAdmin');
    if (!json.ok||json.menus.length===0) { list.innerHTML='<div style="color:var(--text-hint);font-size:13px;padding:12px 0;">登録済みメニューはありません</div>'; return; }
    list.innerHTML = json.menus.map(m=>
      `<div class="menu-list-item">
        <div><div style="font-weight:700;">${m.month}</div><div style="font-size:12px;color:var(--text-sub);">${m.filename}</div></div>
        <div style="display:flex;gap:8px;">
          <a href="${m.url}" target="_blank" class="icon-btn">PDFを開く</a>
          <button class="icon-btn" style="color:#E24B4A;border-color:#f5c0bf;" onclick="deleteMenu('${m.month}')">削除</button>
        </div>
      </div>`).join('');
  } catch(e) {}
}

function switchTab(tab) {
  ['orders','settings','menu','topics'].forEach(t => document.getElementById(t+'Tab').classList.toggle('hidden',t!==tab));
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active',['orders','settings','menu','topics'][i]===tab));
  if (tab==='topics') loadTopicAdmin();
}

async function loadTopicAdmin() {
  try {
    const res = await fetch(GAS_URL+'?action=getTopics&t='+Date.now());
    const json = await res.json();
    const topics = json.topics || [];
    const list = document.getElementById('topicsAdminList');
    let html = '';
    for (let i = 1; i <= 3; i++) {
      const t = topics.find(x => x.id === i) || { id: i, text: '', expiry: '' };
      html += `<div style="border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;">お知らせ ${i}</div>
        <textarea id="topicText${i}" rows="3" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;resize:vertical;margin-bottom:8px;"
          placeholder="お知らせ内容（空欄で非表示）">${t.text||''}</textarea>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="font-size:12px;color:var(--text-sub);white-space:nowrap;">掲載期限</label>
          <input type="date" id="topicExpiry${i}" style="padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;" value="${t.expiry||''}">
        </div>
      </div>`;
    }
    list.innerHTML = html;
  } catch(e) { console.log('お知らせ取得失敗:', e); }
}

async function saveTopicsAdmin() {
  const topics = [];
  for (let i = 1; i <= 3; i++) {
    topics.push({
      id: i,
      text: document.getElementById(`topicText${i}`).value.trim(),
      expiry: document.getElementById(`topicExpiry${i}`).value
    });
  }
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'saveTopics', topics })
    });
    const json = await res.json();
    if (json.ok) {
      document.getElementById('topicStatus').textContent = '✅ 保存しました';
      setTimeout(() => document.getElementById('topicStatus').textContent = '', 3000);
    }
  } catch(e) { showToast('保存に失敗しました'); }
}


async function saveTopic() {
  const text = document.getElementById('topicText').value.trim();
  const expiry = document.getElementById('topicExpiry').value;
  if (!text) { showToast('お知らせ内容を入力してください'); return; }
  if (!expiry) { showToast('掲載期限を設定してください'); return; }
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveTopic', text, expiry })
    });
    const json = await res.json();
    if (json.ok) {
      showToast('お知らせを公開しました');
      loadTopicAdmin();
    }
  } catch(e) { showToast('保存に失敗しました'); }
}

async function deleteTopic() {
  if (!confirm('お知らせを削除しますか？')) return;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveTopic', text: '', expiry: '' })
    });
    const json = await res.json();
    if (json.ok) {
      showToast('削除しました');
      document.getElementById('topicText').value = '';
      document.getElementById('topicExpiry').value = '';
      document.getElementById('topicPreview').style.display = 'none';
    }
  } catch(e) { showToast('削除に失敗しました'); }
}

init();
</script>
