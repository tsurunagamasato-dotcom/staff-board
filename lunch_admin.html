<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昼食注文 管理画面</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f4f2; --surface: #fff; --border: #e2e0db;
    --text: #1a1a1a; --text-sub: #6b6965; --text-hint: #a09d99;
    --green: #1D9E75; --green-bg: #e8f5f0; --green-fg: #0f6e56;
    --red: #E24B4A; --red-bg: #fdecea; --red-fg: #8b1a19;
    --blue: #185FA5; --blue-bg: #e6f1fb; --blue-fg: #0c447c;
    --orange: #BA7517; --orange-bg: #faeeda; --orange-fg: #633806;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    width: 32px; height: 32px; border-radius: 8px; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
  }
  .header-logo svg { width: 18px; height: 18px; fill: #fff; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .icon-btn {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text);
    font-family: inherit; transition: background .1s; white-space: nowrap;
  }
  .icon-btn:hover { background: var(--bg); }
  .icon-btn.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .icon-btn.primary:hover { background: #333; }

  .main { padding: 24px; max-width: 1000px; margin: 0 auto; }

  /* TABS */
  .tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 24px; width: fit-content; }
  .tab-btn { padding: 8px 20px; border-radius: 8px; border: none; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; background: transparent; color: var(--text-sub); transition: all .15s; }
  .tab-btn.active { background: var(--surface); color: var(--text); }

  /* DATE SELECTOR */
  .date-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .date-input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; background: var(--surface); outline: none; }

  /* SUMMARY CARDS */
  .summary-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; flex: 1; min-width: 120px;
  }
  .summary-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
  .summary-num { font-size: 28px; font-weight: 900; }
  .summary-card.s-futsuu .summary-num { color: var(--green); }
  .summary-card.s-oomori .summary-num { color: var(--blue); }
  .summary-card.s-nashi  .summary-num { color: var(--red); }
  .summary-card.s-total  .summary-num { color: var(--text); }
  .summary-card.s-pending .summary-num { color: var(--orange); }

  /* DEPT TABLE */
  .dept-section { margin-bottom: 24px; }
  .dept-label {
    font-size: 11px; font-weight: 700; color: var(--text-hint); letter-spacing: 0.8px;
    padding: 12px 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .dept-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .order-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 8px; }
  .order-table th { background: #f8f8f6; font-size: 12px; color: var(--text-sub); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  .order-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .order-table tr:last-child td { border-bottom: none; }
  .order-table tr:hover td { background: #fafaf8; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  }
  .badge-futsuu { background: var(--green-bg); color: var(--green-fg); }
  .badge-oomori  { background: var(--blue-bg);  color: var(--blue-fg); }
  .badge-nashi   { background: var(--red-bg);   color: var(--red-fg); }
  .badge-none    { background: var(--bg); color: var(--text-hint); }

  /* SETTINGS */
  .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .settings-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .settings-label { font-size: 13px; color: var(--text-sub); width: 120px; flex-shrink: 0; }
  .settings-input { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; background: var(--surface); }
  .settings-input:focus { border-color: #888; }

  /* NG TABLE */
  .ng-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .ng-table th { background: #f8f8f6; font-size: 12px; color: var(--text-sub); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-weight: 500; }
  .ng-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ng-table tr:last-child td { border-bottom: none; }

  .toggle-btn {
    padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--border);
    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .toggle-btn.ng-on { background: var(--red-bg); color: var(--red-fg); border-color: var(--red); }
  .toggle-btn.ng-off { background: var(--bg); color: var(--text-hint); }

  /* MENU UPLOAD */
  .upload-area {
    border: 2px dashed var(--border); border-radius: 12px; padding: 24px;
    text-align: center; cursor: pointer; transition: border-color .15s;
    background: var(--surface);
  }
  .upload-area:hover { border-color: #888; }
  .upload-area.dragover { border-color: var(--green); background: var(--green-bg); }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--text-sub); }
  .upload-sub { font-size: 12px; color: var(--text-hint); margin-top: 4px; }

  .menu-list-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 8px;
  }

  /* LOADING */
  .loading-overlay {
    position: fixed; inset: 0; z-index: 400; background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>

    <div class="settings-card">
      <div class="settings-title">📄 メニューPDF管理</div>
      <div class="settings-row" style="margin-bottom:16px;">
        <div class="settings-label">対象月</div>
        <input type="month" class="settings-input" id="menuMonth">
      </div>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('pdfInput').click()" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="upload-icon">📄</div>
        <div class="upload-text">PDFをここにドラッグ＆ドロップ</div>
        <div class="upload-sub">またはクリックしてファイルを選択</div>
      </div>
      <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="onFileSelect(event)">
      <div id="uploadStatus" style="margin-top:12px;font-size:13px;color:var(--text-sub);"></div>
    </div>
    <div class="settings-card">
      <div class="settings-title">登録済みメニュー</div>
      <div id="menuListAdmin"></div>
    </div>
  </div>
</div>

let permanentNG = {};
let ordersData = [];
let toastTimer;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ===== INIT =====
async function init() {
  const today = new Date();
  document.getElementById('targetDate').value = fmtDate(today);
  document.getElementById('menuMonth').value = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0');

  try {
    const res = await fetch(GAS_URL + '?action=getSettings&t=' + Date.now());
    const json = await res.json();
    if (json.ok) {
      document.getElementById('deadlineInput').value = json.settings.deadline || '08:30';
      Object.keys(json.settings).forEach(k => {
        if (k.startsWith('ng_')) permanentNG[k.replace('ng_','')] = json.settings[k];
      });
    }
  } catch(e) {}

  renderNGTable();
  await loadOrders();
  await loadMenuAdmin();
  document.getElementById('loadingOverlay').style.display = 'none';
}

// ===== ORDERS =====
async function loadOrders() {
  const date = document.getElementById('targetDate').value;
  if (!date) return;
  const d = new Date(date);
  const days = ['日','月','火','水','木','金','土'];
  document.getElementById('dateLabel').textContent =
    (d.getMonth()+1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
  try {
    const res = await fetch(GAS_URL + '?action=getOrders&date=' + date + '&t=' + Date.now());
    const json = await res.json();
    if (json.ok) {
      ordersData = json.orders;
      if (json.permanentNG) permanentNG = json.permanentNG;
      renderSummary();
      renderOrderTable();
    }
  } catch(e) { showToast('データの取得に失敗しました'); }
}

function getEffectiveOrder(staff) {
  const found = ordersData.find(o => String(o.id) === String(staff.id));
  if (found) return found.order;
  if (permanentNG[staff.id]) return 'nashi';
  return null;
}

function renderSummary() {
  let futsuu = 0, oomori = 0, nashi = 0, pending = 0;
  STAFF_MASTER.forEach(s => {
    const order = getEffectiveOrder(s);
    if (order === 'futsuu') futsuu++;
    else if (order === 'oomori') oomori++;
    else if (order === 'nashi') nashi++;
    else pending++;
  });
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-card s-total"><div class="summary-label">合計注文</div><div class="summary-num">${futsuu+oomori}</div></div>
    <div class="summary-card s-futsuu"><div class="summary-label">○ 普通</div><div class="summary-num">${futsuu}</div></div>
    <div class="summary-card s-oomori"><div class="summary-label">○ 大盛</div><div class="summary-num">${oomori}</div></div>
    <div class="summary-card s-nashi"><div class="summary-label">× 食べない</div><div class="summary-num">${nashi}</div></div>
    <div class="summary-card s-pending"><div class="summary-label">未回答</div><div class="summary-num">${pending}</div></div>
  `;
}

function renderOrderTable() {
  const container = document.getElementById('orderContent');
  const grouped = {};
  DEPT_ORDER.forEach(d => { grouped[d] = []; });
  STAFF_MASTER.forEach(s => { if (grouped[s.dept]) grouped[s.dept].push(s); });

  container.innerHTML = DEPT_ORDER.map(dept => {
    const members = grouped[dept];
    if (members.length === 0) return '';
    const rows = members.map(s => {
      const order = getEffectiveOrder(s);
      const badgeClass = order==='futsuu'?'badge-futsuu':order==='oomori'?'badge-oomori':order==='nashi'?'badge-nashi':'badge-none';
      const label = order==='futsuu'?'○ 普通':order==='oomori'?'○ 大盛':order==='nashi'?'× 食べない':'未回答';
      return `<tr>
        <td>${s.name}</td>
        <td><span class="badge ${badgeClass}">${label}</span></td>
      </tr>`;
    }).join('');
    const futsuu = members.filter(s => getEffectiveOrder(s)==='futsuu').length;
    const oomori = members.filter(s => getEffectiveOrder(s)==='oomori').length;
    return `<div class="dept-section">
      <div class="dept-label">${dept} <span style="font-weight:400;font-size:11px;color:var(--text-sub);">普通${futsuu} 大盛${oomori}</span></div>
      <table class="order-table">
        <thead><tr><th>氏名</th><th>注文</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

// ===== EXCEL EXPORT =====
function exportExcel() {
  const date = document.getElementById('targetDate').value;
  if (!date) return;

  // CSVとして出力（Excelで開ける）
  const rows = [['日付','部署','氏名','注文']];
  DEPT_ORDER.forEach(dept => {
    STAFF_MASTER.filter(s => s.dept === dept).forEach(s => {
      const order = getEffectiveOrder(s);
      const label = order==='futsuu'?'普通':order==='oomori'?'大盛':order==='nashi'?'食べない':'未回答';
      rows.push([date, dept, s.name, label]);
    });
  });

  const BOM = '\uFEFF';
  const csv = BOM + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `昼食注文_${date}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}

// ===== SETTINGS =====
async function saveDeadline() {
  const value = document.getElementById('deadlineInput').value;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'saveSettings', key: 'deadline', value })
    });
    const json = await res.json();
    if (json.ok) showToast('締切時刻を保存しました');
  } catch(e) { showToast('保存に失敗しました'); }
}

function renderNGTable() {
  const tbody = document.getElementById('ngTableBody');
  tbody.innerHTML = STAFF_MASTER.map(s => {
    const isNG = !!permanentNG[s.id];
    return `<tr>
      <td>${s.name}</td>
      <td style="color:var(--text-sub);">${s.dept}</td>
      <td><button class="toggle-btn ${isNG?'ng-on':'ng-off'}" onclick="toggleNG(${s.id})">${isNG?'ON（×固定）':'OFF'}</button></td>
    </tr>`;
  }).join('');
}

async function toggleNG(id) {
  const current = !!permanentNG[id];
  const newVal = !current;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'savePermanentNG', id, value: newVal })
    });
    const json = await res.json();
    if (json.ok) {
      permanentNG[id] = newVal;
      renderNGTable();
      showToast(newVal ? '永久×に設定しました' : '永久×を解除しました');
    }
  } catch(e) { showToast('保存に失敗しました'); }
}

// ===== MENU =====
function onDragOver(e) { e.preventDefault(); document.getElementById('uploadArea').classList.add('dragover'); }
function onDragLeave(e) { document.getElementById('uploadArea').classList.remove('dragover'); }
function onDrop(e) { e.preventDefault(); document.getElementById('uploadArea').classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); }
function onFileSelect(e) { handleFile(e.target.files[0]); }

async function handleFile(file) {
  if (!file || file.type !== 'application/pdf') { showToast('PDFファイルを選択してください'); return; }
  const month = document.getElementById('menuMonth').value;
  if (!month) { showToast('対象月を選択してください'); return; }

  document.getElementById('uploadStatus').textContent = 'アップロード中...';

  // Google DriveへアップロードするためにGASに送信（Base64）
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadPDF',
          month,
          filename: file.name,
          base64
        })
      });
      const json = await res.json();
      if (json.ok) {
        document.getElementById('uploadStatus').textContent = '✅ アップロード完了！';
        showToast('メニューをアップロードしました');
        await loadMenuAdmin();
      } else {
        document.getElementById('uploadStatus').textContent = '❌ アップロード失敗';
      }
    } catch(e) {
      document.getElementById('uploadStatus').textContent = '❌ アップロード失敗';
    }
  };
  reader.readAsDataURL(file);
}

async function loadMenuAdmin() {
  try {
    const res = await fetch(GAS_URL + '?action=getMenu&t=' + Date.now());
    const json = await res.json();
    const list = document.getElementById('menuListAdmin');
    if (!json.ok || json.menus.length === 0) {
      list.innerHTML = '<div style="color:var(--text-hint);font-size:13px;padding:16px 0;">登録済みメニューはありません</div>';
      return;
    }
    list.innerHTML = json.menus.map(m =>
      `<div class="menu-list-item">
        <div>
          <div style="font-weight:700;">${m.month}</div>
          <div style="font-size:12px;color:var(--text-sub);">${m.filename}</div>
        </div>
        <a href="${m.url}" target="_blank" class="icon-btn">PDFを開く</a>
      </div>`
    ).join('');
  } catch(e) {}
}

// ===== TAB =====
function switchTab(tab) {
  ['orders','settings','menu'].forEach(t => {
    document.getElementById(t+'Tab').classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['orders','settings','menu'][i] === tab);
  });
}

init();
</script>
