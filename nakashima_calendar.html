<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全社予定カレンダー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
    --text:#e2e4ef;--text-dim:#7880a4;--accent:#4f7fff;--success:#3ecf8e;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--accent);letter-spacing:.05em;}
  .nav-tabs{display:flex;gap:4px;}
  .nav-tab{padding:6px 18px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .2s;}
  .nav-tab.active{background:var(--accent);color:#fff;font-weight:500;}
  .nav-tab:not(.active):hover{border-color:var(--border);color:var(--text);}

  .view{display:none;padding:12px 16px;}
  .view.active{display:block;}

  .btn{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:#6b90ff;border-color:#6b90ff;color:#fff;}
  .btn-sm{padding:3px 10px;font-size:11px;}
  .del-btn{padding:2px 8px;font-size:11px;border-radius:4px;border:1px solid rgba(255,107,107,.3);background:transparent;color:#ff6b6b;cursor:pointer;}
  .del-btn:hover{background:rgba(255,107,107,.1);}

  .cal-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .cal-toolbar h2{font-size:17px;font-weight:500;flex:1;min-width:160px;}

  .gas-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
  .gas-status{font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .gas-status.ok{color:var(--success);}
  .gas-status.err{color:#ff6b6b;}
  .gas-status.loading{color:var(--text-dim);}

  /* カレンダー */
  .month-block{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--border);background:var(--surface2);}
  .dow-cell{text-align:left;padding:6px 8px;font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:.05em;}
  .dow-cell:first-child{color:#ff6b6b;}
  .dow-cell:last-child{color:var(--accent);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-cell{
    border-right:1px solid var(--border);border-bottom:1px solid var(--border);
    padding:4px 4px 6px;position:relative;min-height:104px;
    height:calc((100vh - 200px) / 6);overflow-y:auto;cursor:pointer;transition:background .1s;
  }
  .cal-cell:hover{background:rgba(79,127,255,.04);}
  .cal-cell:nth-child(7n){border-right:none;}
  .cal-cell.empty{background:rgba(0,0,0,.08);cursor:default;}
  .cal-cell.empty:hover{background:rgba(0,0,0,.08);}
  .cal-cell.today{background:rgba(79,127,255,.05);}
  .cal-cell.weekend{background:rgba(0,0,0,.04);}
  .date-num{font-size:14px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--text-dim);display:block;margin-bottom:3px;line-height:1;}
  .cal-cell.today .date-num{color:#fff;background:var(--accent);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .cal-cell:nth-child(7n+1) .date-num{color:#ff6b6b;}
  .cal-cell:nth-child(7n) .date-num{color:var(--accent);}
  .cal-cell.today:nth-child(7n+1) .date-num,.cal-cell.today:nth-child(7n) .date-num{color:#fff;}

  .event-pill{
    display:flex;align-items:center;gap:4px;border-radius:3px;border-left:3px solid;
    padding:2px 5px;margin-bottom:2px;font-size:10px;line-height:1.3;cursor:pointer;
    background:var(--surface2);transition:filter .1s;
  }
  .event-pill:hover{filter:brightness(1.15);}
  .event-type-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .event-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .event-proj{font-weight:600;}
  .event-type-label{opacity:.85;}

  /* フィルター */
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
  .type-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;border:1.5px solid var(--accent);font-size:11px;cursor:pointer;user-select:none;transition:all .15s;background:rgba(79,127,255,.08);}
  .type-chip.off{opacity:.4;border-color:var(--border);background:transparent;}
  .chip-dot{width:9px;height:9px;border-radius:50%;}

  /* マスタ */
  .master-grid{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;flex:1;min-width:300px;max-width:480px;}
  .card-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:6px;}
  .form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .form-input{flex:1;min-width:120px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;}
  .form-input:focus{outline:none;border-color:var(--accent);}
  .color-picker{display:flex;gap:6px;align-items:center;}
  .color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .1s;}
  .color-dot.selected{border-color:var(--text);transform:scale(1.15);}
  .data-table{width:100%;border-collapse:collapse;font-size:13px;}
  .data-table th{text-align:left;color:var(--text-dim);font-weight:500;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);}
  .data-table td{padding:7px 8px;border-bottom:1px solid var(--border);}

  /* モーダル */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;width:90%;max-width:420px;}
  .modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--accent);}
  .modal-field{margin-bottom:14px;}
  .modal-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .modal-input,.modal-select{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-family:'Noto Sans JP',sans-serif;}
  .modal-input:focus,.modal-select:focus{outline:none;border-color:var(--accent);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}

  /* ドロップダウンフィルター */
  .dd-filter-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .dd-wrap{position:relative;flex:1;min-width:180px;}
  .dd-btn{width:100%;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:border-color .15s;user-select:none;}
  .dd-btn:hover{border-color:var(--accent);}
  .dd-btn.open{border-color:var(--accent);}
  .dd-btn-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left;}
  .dd-btn-arrow{flex-shrink:0;font-size:10px;color:var(--text-dim);}
  .dd-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:6px;max-height:220px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .dd-panel.show{display:block;}
  .dd-option{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;transition:background .1s;}
  .dd-option:hover{background:rgba(79,127,255,.1);}
  .dd-option.selected{background:rgba(79,127,255,.15);}
  .dd-option input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
  .dd-clear{width:100%;margin-top:4px;padding:4px;border-radius:5px;border:1px dashed var(--border);background:transparent;color:var(--text-dim);font-size:11px;cursor:pointer;text-align:center;}
  .dd-clear:hover{border-color:var(--accent);color:var(--accent);}

  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<header>
  <div class="logo">◈ 全社予定カレンダー</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView(0)">📅 カレンダー</button>
    <button class="nav-tab" onclick="switchView(1)">⚙ マスタ管理</button>
  </div>
</header>

<!-- カレンダー -->
<div class="view active" id="view-calendar">
  <div class="gas-bar">
    <span class="gas-status" id="gas-status"></span>
  </div>
  <div class="cal-toolbar">
    <button class="btn" onclick="prevMonth()">◀ 前へ</button>
    <h2 id="cal-label"></h2>
    <button class="btn" onclick="nextMonth()">次へ ▶</button>
    <button class="btn" onclick="goToday()">今日</button>
    <button class="btn btn-primary" onclick="openEventModal()">＋ 予定を追加</button>
  </div>
  <div class="filter-row" id="filter-row" style="display:none;"></div>
  <div class="dd-filter-row" style="justify-content:flex-start;">
    <div class="dd-wrap" id="dd-proj-wrap" style="flex:none;width:200px;">
      <div class="dd-btn" id="dd-proj-btn" onclick="toggleDD('proj')">
        <span class="dd-btn-label" id="dd-proj-label">📁 案件を絞り込む</span>
        <span class="dd-btn-arrow">▼</span>
      </div>
      <div class="dd-panel" id="dd-proj-panel">
        <div id="dd-proj-options"></div>
        <button class="dd-clear" onclick="clearDD('proj')">すべて表示に戻す</button>
      </div>
    </div>
    <div class="dd-wrap" id="dd-type-wrap" style="flex:none;width:200px;">
      <div class="dd-btn" id="dd-type-btn" onclick="toggleDD('type')">
        <span class="dd-btn-label" id="dd-type-label">🏷 種類を絞り込む</span>
        <span class="dd-btn-arrow">▼</span>
      </div>
      <div class="dd-panel" id="dd-type-panel">
        <div id="dd-type-options"></div>
        <button class="dd-clear" onclick="clearDD('type')">すべて表示に戻す</button>
      </div>
    </div>
  </div>
  <div class="month-block">
    <div class="dow-row">
      <div class="dow-cell">日</div><div class="dow-cell">月</div><div class="dow-cell">火</div>
      <div class="dow-cell">水</div><div class="dow-cell">木</div><div class="dow-cell">金</div><div class="dow-cell">土</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<!-- マスタ管理 -->
<div class="view" id="view-master">
  <div class="master-grid">
    <!-- 案件マスタ -->
    <div class="card">
      <div class="card-title">📁 案件マスタ</div>
      <div class="form-row">
        <input class="form-input" id="proj-input" placeholder="案件名を入力" maxlength="40">
        <button class="btn btn-primary btn-sm" onclick="addProject()">追加</button>
      </div>
      <table class="data-table" id="proj-table">
        <thead><tr><th>案件名</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <!-- イベント種類マスタ -->
    <div class="card">
      <div class="card-title">🏷 イベント種類マスタ</div>
      <div class="form-row">
        <input class="form-input" id="type-input" placeholder="種類名を入力（例：搬入日）" maxlength="20">
        <div class="color-picker" id="type-color-picker"></div>
        <button class="btn btn-primary btn-sm" onclick="addType()">追加</button>
      </div>
      <table class="data-table" id="type-table">
        <thead><tr><th>色</th><th>種類名</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 予定追加・編集モーダル -->
<div class="modal-overlay" id="event-modal">
  <div class="modal">
    <div class="modal-title" id="event-modal-title">予定を追加</div>
    <div class="modal-field">
      <label>日付</label>
      <input class="modal-input" id="ev-date" type="date">
    </div>
    <div class="modal-field">
      <label>案件</label>
      <select class="modal-select" id="ev-proj"></select>
    </div>
    <div class="modal-field">
      <label>イベント種類</label>
      <select class="modal-select" id="ev-type"></select>
    </div>
    <div class="modal-field">
      <label>メモ（任意）</label>
      <input class="modal-input" id="ev-note" placeholder="例：10:00〜 客先立会い" maxlength="60">
    </div>
    <div class="modal-actions">
      <button class="del-btn" id="ev-delete" style="display:none;padding:8px 14px;" onclick="deleteEvent()">削除</button>
      <button class="btn" onclick="closeEventModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<script>
// =====================================================
//  設定
// =====================================================
// ※ 新しいスプレッドシート＋GASのURLに差し替えてください
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz3ilXJ2O1JHv5IbrRPBsZIGrlBk2J_JcdrOXDFAR-T0zepXh46ZdnD9RI7adJGYwI6oA/exec';

const COLORS = ['#4f7fff','#ff6b6b','#3ecf8e','#f7b731','#c678dd','#41c9e2','#fd79a8','#a0a0a0'];

// 初期イベント種類
const DEFAULT_TYPES = [
  {id:'t_hannyu', name:'搬入日',     color:'#4f7fff'},
  {id:'t_hanshutu',name:'搬出日',     color:'#ff6b6b'},
  {id:'t_tachiai', name:'立会い',     color:'#3ecf8e'},
  {id:'t_nonyu',   name:'ワーク納入', color:'#f7b731'},
  {id:'t_unten',   name:'運転調整',   color:'#c678dd'},
  {id:'t_genchi',  name:'現地工事',   color:'#41c9e2'},
  {id:'t_shukka',  name:'出荷',       color:'#fd79a8'},
  {id:'t_kenshu',  name:'検収',       color:'#a0a0a0'},
];

let state = {
  projects: [],      // {id, name}
  types: [],         // {id, name, color}
  events: [],        // {id, date(YYYY-MM-DD), projId, typeId, note}
  selectedTypes: [], // 表示する種類ID（空なら描画時に全選択）
  selectedProjs:  [], // 表示する案件ID（空なら全表示）
};
let baseMonth = null;  // {y, m}
let editingEventId = null;
let selectedTypeColor = COLORS[0];

// =====================================================
//  ユーティリティ
// =====================================================
function uid(){return Math.random().toString(36).slice(2,9);}
function projNameToId(name){return 'proj_'+name;}
function pad(n){return String(n).padStart(2,'0');}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
function getProject(id){return state.projects.find(p=>p.id===id);}
function getType(id){return state.types.find(t=>t.id===id);}

function saveState(){localStorage.setItem('nim_sched_v1', JSON.stringify({state,baseMonth}));}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem('nim_sched_v1'));
    if(d&&d.state){state=d.state; baseMonth=d.baseMonth;}
  }catch{}
}

function setGasStatus(msg,cls){
  const el=document.getElementById('gas-status');
  el.textContent=msg; el.className='gas-status '+(cls||'');
}

// =====================================================
//  ビュー切り替え
// =====================================================
function switchView(i){
  document.querySelectorAll('.nav-tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
  document.getElementById('view-calendar').classList.toggle('active',i===0);
  document.getElementById('view-master').classList.toggle('active',i===1);
  if(i===0) renderCalendar();
  if(i===1) renderMaster();
}

// =====================================================
//  カレンダー
// =====================================================
function prevMonth(){baseMonth.m--;if(baseMonth.m<1){baseMonth.m=12;baseMonth.y--;}saveState();renderCalendar();}
function nextMonth(){baseMonth.m++;if(baseMonth.m>12){baseMonth.m=1;baseMonth.y++;}saveState();renderCalendar();}
function goToday(){const n=new Date();baseMonth={y:n.getFullYear(),m:n.getMonth()+1};saveState();renderCalendar();}

function renderCalendar(){
  if(!baseMonth){const n=new Date();baseMonth={y:n.getFullYear(),m:n.getMonth()+1};}
  const {y,m}=baseMonth;
  document.getElementById('cal-label').textContent=`${y}年 ${m}月`;
  renderFilter();

  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const firstDow=new Date(y,m-1,1).getDay();
  const days=daysInMonth(y,m);
  const today=new Date();
  const todayKey=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  // 先頭の空セル
  for(let i=0;i<firstDow;i++){
    const c=document.createElement('div');c.className='cal-cell empty';grid.appendChild(c);
  }
  for(let d=1;d<=days;d++){
    const key=`${y}-${pad(m)}-${pad(d)}`;
    const dow=new Date(y,m-1,d).getDay();
    const isWeekend=dow===0||dow===6;
    const cell=document.createElement('div');
    cell.className='cal-cell'+(key===todayKey?' today':'')+(isWeekend?' weekend':'');
    cell.innerHTML=`<span class="date-num">${d}</span>`;
    cell.addEventListener('click',e=>{ if(e.target===cell||e.target.classList.contains('date-num')) openEventModal(key); });

    // その日のイベント（選択ゼロなら全表示、選択ありなら選んだ種類だけ）
    const sel=state.selectedTypes||[];
    const selP=state.selectedProjs||[];
    const dayEvents=state.events.filter(ev=>ev.date===key
      && (sel.length===0 || sel.includes(ev.typeId))
      && (selP.length===0 || selP.includes(ev.projId)));
    dayEvents.forEach(ev=>cell.appendChild(buildEventPill(ev)));
    grid.appendChild(cell);
  }
  saveState();
}

function buildEventPill(ev){
  const proj=getProject(ev.projId);
  const type=getType(ev.typeId);
  const color=type?type.color:'#a0a0a0';
  const el=document.createElement('div');
  el.className='event-pill';
  el.style.borderLeftColor=color;
  el.title=`${proj?proj.name:''}／${type?type.name:''}${ev.note?'／'+ev.note:''}`;
  el.innerHTML=`
    <span class="event-type-dot" style="background:${color}"></span>
    <span class="event-text">
      <span class="event-proj">${proj?proj.name:'(案件なし)'}</span>
      <span class="event-type-label">${type?type.name:''}</span>
    </span>`;
  el.addEventListener('click',e=>{e.stopPropagation();openEventModal(ev.date,ev.id);});
  return el;
}

// =====================================================
//  ドロップダウンフィルター（案件・種類の複数選択）
// =====================================================
function renderDDFilters(){
  renderOneDDFilter('proj', state.projects, state.selectedProjs||[],
    p=>({id:p.id, label:p.name, dot:null}), '📁 案件を絞り込む');
  renderOneDDFilter('type', state.types, state.selectedTypes||[],
    t=>({id:t.id, label:t.name, dot:t.color}), '🏷 種類を絞り込む');
}

function renderOneDDFilter(key, items, selected, mapper, placeholder){
  const optWrap=document.getElementById('dd-'+key+'-options');
  const lbl=document.getElementById('dd-'+key+'-label');
  if(!optWrap||!lbl) return;
  optWrap.innerHTML='';
  items.forEach(item=>{
    const{id,label:name,dot}=mapper(item);
    const on=selected.includes(id);
    const div=document.createElement('div');
    div.className='dd-option'+(on?' selected':'');
    div.innerHTML=`
      <input type="checkbox" ${on?'checked':''} onchange="toggleDDItem('${key}','${id}',this.checked)">
      ${dot?`<span style="width:10px;height:10px;border-radius:50%;background:${dot};flex-shrink:0;display:inline-block;"></span>`:''}
      <span>${name}</span>`;
    optWrap.appendChild(div);
  });
  const names=selected.map(id=>{const it=items.find(x=>x.id===id);return it?mapper(it).label:'';}).filter(Boolean);
  lbl.textContent=names.length ? names.join('・') : placeholder;
}

function toggleDD(key){
  const panel=document.getElementById('dd-'+key+'-panel');
  const btn=document.getElementById('dd-'+key+'-btn');
  const isOpen=panel.classList.contains('show');
  ['proj','type'].forEach(k=>{
    document.getElementById('dd-'+k+'-panel').classList.remove('show');
    document.getElementById('dd-'+k+'-btn').classList.remove('open');
  });
  if(!isOpen){panel.classList.add('show');btn.classList.add('open');}
}

function toggleDDItem(key, id, checked){
  if(key==='proj'){ if(!Array.isArray(state.selectedProjs)) state.selectedProjs=[]; if(checked){if(!state.selectedProjs.includes(id))state.selectedProjs.push(id);}else{const i=state.selectedProjs.indexOf(id);if(i>=0)state.selectedProjs.splice(i,1);} }
  else { if(!Array.isArray(state.selectedTypes)) state.selectedTypes=[]; if(checked){if(!state.selectedTypes.includes(id))state.selectedTypes.push(id);}else{const i=state.selectedTypes.indexOf(id);if(i>=0)state.selectedTypes.splice(i,1);} }
  saveState();renderCalendar();
}

function clearDD(key){
  if(key==='proj') state.selectedProjs=[];
  else state.selectedTypes=[];
  saveState();renderCalendar();
}

document.addEventListener('click', e=>{
  if(!e.target.closest('.dd-wrap')){
    document.querySelectorAll('.dd-panel').forEach(p=>p.classList.remove('show'));
    document.querySelectorAll('.dd-btn').forEach(b=>b.classList.remove('open'));
  }
});

function renderFilter(){
  if(!Array.isArray(state.selectedTypes)) state.selectedTypes=[];
  // 削除された種類IDは選択リストから除く
  state.selectedTypes = state.selectedTypes.filter(id=>state.types.some(t=>t.id===id));

  const noneSelected = state.selectedTypes.length===0;
  const wrap=document.getElementById('filter-row');
  wrap.innerHTML='<span style="font-size:11px;color:var(--text-dim);margin-right:4px;">表示：</span>';
  state.types.forEach(t=>{
    // 選択ゼロのときは全部がハイライト（＝全表示中）、選択ありのときは選んだものだけハイライト
    const on = noneSelected || state.selectedTypes.includes(t.id);
    const chip=document.createElement('div');
    chip.className='type-chip'+(on?'':' off');
    chip.innerHTML=`<span class="chip-dot" style="background:${t.color}"></span>${t.name}`;
    chip.addEventListener('click',()=>{
      const idx=state.selectedTypes.indexOf(t.id);
      if(idx>=0) state.selectedTypes.splice(idx,1); // 選択解除
      else state.selectedTypes.push(t.id);          // 選択
      saveState();renderCalendar();
    });
    wrap.appendChild(chip);
  });
}

// =====================================================
//  予定モーダル
// =====================================================
function openEventModal(date, eventId){
  editingEventId = eventId || null;
  // 案件・種類のセレクトを埋める
  const projSel=document.getElementById('ev-proj');
  projSel.innerHTML=state.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')
    || '<option value="">案件を登録してください</option>';
  const typeSel=document.getElementById('ev-type');
  typeSel.innerHTML=state.types.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

  if(eventId){
    const ev=state.events.find(e=>e.id===eventId);
    document.getElementById('event-modal-title').textContent='予定を編集';
    document.getElementById('ev-date').value=ev.date;
    document.getElementById('ev-proj').value=ev.projId;
    document.getElementById('ev-type').value=ev.typeId;
    document.getElementById('ev-note').value=ev.note||'';
    document.getElementById('ev-delete').style.display='';
  } else {
    document.getElementById('event-modal-title').textContent='予定を追加';
    document.getElementById('ev-date').value=date||'';
    document.getElementById('ev-note').value='';
    document.getElementById('ev-delete').style.display='none';
  }
  document.getElementById('event-modal').classList.add('show');
}
function closeEventModal(){document.getElementById('event-modal').classList.remove('show');editingEventId=null;}

async function saveEvent(){
  const date=document.getElementById('ev-date').value;
  const projId=document.getElementById('ev-proj').value;
  const typeId=document.getElementById('ev-type').value;
  const note=document.getElementById('ev-note').value.trim();
  if(!date){alert('日付を選択してください');return;}
  if(!projId){alert('案件を選択してください（マスタ管理で登録できます）');return;}
  if(!typeId){alert('イベント種類を選択してください');return;}

  if(editingEventId){
    const ev=state.events.find(e=>e.id===editingEventId);
    Object.assign(ev,{date,projId,typeId,note});
    saveState();closeEventModal();renderCalendar();
    await sendAction('updateEvent', ev);
  } else {
    const ev={id:uid(),date,projId,typeId,note};
    state.events.push(ev);
    saveState();closeEventModal();renderCalendar();
    await sendAction('addEvent', ev);
  }
}

async function deleteEvent(){
  if(!editingEventId)return;
  if(!confirm('この予定を削除しますか？'))return;
  const id=editingEventId;
  state.events=state.events.filter(e=>e.id!==id);
  saveState();closeEventModal();renderCalendar();
  await sendAction('deleteEvent', {id});
}

// =====================================================
//  マスタ管理
// =====================================================
function renderMaster(){
  renderProjTable();
  renderTypeTable();
  renderTypeColorPicker();
}

function renderProjTable(){
  const tbody=document.querySelector('#proj-table tbody');
  tbody.innerHTML='';
  if(!state.projects.length){
    tbody.innerHTML='<tr><td colspan="2" style="color:var(--text-dim);font-size:12px;">案件が未登録です</td></tr>';
    return;
  }
  state.projects.forEach(p=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${p.name}</td><td style="text-align:right;"><button class="del-btn" onclick="deleteProject('${p.id}')">削除</button></td>`;
    tbody.appendChild(tr);
  });
}
async function addProject(){
  const name=document.getElementById('proj-input').value.trim();
  if(!name){alert('案件名を入力してください');return;}
  if(state.projects.some(p=>p.name===name)){alert('同じ案件名が既にあります');return;}
  const p={id:projNameToId(name),name};
  state.projects.push(p);
  document.getElementById('proj-input').value='';
  saveState();renderMaster();
  await sendAction('addProject', p);
}
async function deleteProject(id){
  const used=state.events.filter(e=>e.projId===id).length;
  const msg=used?`この案件には${used}件の予定があります。案件と関連する予定をすべて削除しますか？`:'この案件を削除しますか？';
  if(!confirm(msg))return;
  state.projects=state.projects.filter(p=>p.id!==id);
  state.events=state.events.filter(e=>e.projId!==id);
  saveState();renderMaster();renderCalendar();
  await sendAction('deleteProject', {id});
}

function renderTypeColorPicker(){
  const wrap=document.getElementById('type-color-picker');
  wrap.innerHTML='';
  COLORS.forEach(c=>{
    const dot=document.createElement('div');
    dot.className='color-dot'+(c===selectedTypeColor?' selected':'');
    dot.style.background=c;
    dot.addEventListener('click',()=>{selectedTypeColor=c;renderTypeColorPicker();});
    wrap.appendChild(dot);
  });
}
function renderTypeTable(){
  const tbody=document.querySelector('#type-table tbody');
  tbody.innerHTML='';
  state.types.forEach(t=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td><span style="background:${t.color};width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:middle;"></span></td>
      <td>${t.name}</td>
      <td style="text-align:right;"><button class="del-btn" onclick="deleteType('${t.id}')">削除</button></td>`;
    tbody.appendChild(tr);
  });
}
async function addType(){
  const name=document.getElementById('type-input').value.trim();
  if(!name){alert('種類名を入力してください');return;}
  if(state.types.some(t=>t.name===name)){alert('同じ種類名が既にあります');return;}
  const t={id:'type_'+uid(),name,color:selectedTypeColor};
  state.types.push(t);
  document.getElementById('type-input').value='';
  saveState();renderMaster();renderCalendar();
  await sendAction('addType', t);
}
async function deleteType(id){
  const used=state.events.filter(e=>e.typeId===id).length;
  const msg=used?`この種類は${used}件の予定で使われています。種類と関連する予定をすべて削除しますか？`:'この種類を削除しますか？';
  if(!confirm(msg))return;
  state.types=state.types.filter(t=>t.id!==id);
  state.events=state.events.filter(e=>e.typeId!==id);
  state.selectedTypes=(state.selectedTypes||[]).filter(fid=>fid!==id);
  saveState();renderMaster();renderCalendar();
  await sendAction('deleteType', {id});
}

// =====================================================
//  GAS同期（行単位レコード方式・同時編集対応）
//  変更は1件ずつGASに送る。全体を丸ごと上書きしないので
//  他の人が同時に入れた予定を消してしまうことがない。
// =====================================================

// 1件だけGASに送る（add/update/delete）
async function sendAction(action, record){
  if(GAS_URL.startsWith('ここに')) return true; // 未設定ならローカルのみ
  setGasStatus('⟳ 保存中...','loading');
  try{
    const payload=encodeURIComponent(JSON.stringify(record));
    const url=GAS_URL+'?action='+action+'&payload='+payload;
    const res=await fetch(url,{redirect:'follow'});
    const json=JSON.parse(await res.text());
    if(json.status==='ok'){
      setGasStatus('✓ 同期済み '+new Date().toLocaleTimeString('ja-JP'),'ok');
      return true;
    }
    setGasStatus('✗ 保存失敗','err');
    return false;
  }catch(e){
    setGasStatus('✗ 通信エラー: '+e.message,'err');
    return false;
  }
}

// GASから来る日付を YYYY-MM-DD（日本時間）に正規化
function normalizeDate(v){
  if(v==null) return '';
  const s=String(v);
  // すでに YYYY-MM-DD ならそのまま
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // ISO形式（...T...Z）などはDateにしてJSTへ変換
  const d=new Date(s);
  if(isNaN(d.getTime())) return s;
  const jst=new Date(d.getTime()+9*60*60*1000);
  const y=jst.getUTCFullYear();
  const m=String(jst.getUTCMonth()+1).padStart(2,'0');
  const day=String(jst.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// GASから全データを読み直す（保存後・定期更新で呼ぶ）
async function autoLoadFromGAS(){
  if(GAS_URL.startsWith('ここに')){
    setGasStatus('✓ ローカル動作（GAS未設定）','ok');
    return;
  }
  setGasStatus('⟳ 読込中...','loading');
  try{
    const res=await fetch(GAS_URL+'?t='+Date.now(),{redirect:'follow'});
    const json=JSON.parse(await res.text());
    if(json.status==='ok' && json.data){
      const d=json.data;
      if(Array.isArray(d.projects)) state.projects=d.projects.map(p=>({id:String(p.id),name:String(p.name)}));
      if(Array.isArray(d.types) && d.types.length) state.types=d.types.map(t=>({id:String(t.id),name:String(t.name),color:String(t.color)}));
      if(Array.isArray(d.events)) state.events=d.events.map(e=>({
        id:String(e.id), date:normalizeDate(e.date), projId:String(e.projId),
        typeId:String(e.typeId), note:e.note==null?'':String(e.note)
      }));
      saveState();
      renderCalendar();renderMaster();
      setGasStatus('✓ 同期済み '+new Date().toLocaleTimeString('ja-JP'),'ok');
    } else {
      // データなし → 初期の種類だけGASに登録
      for(const t of state.types){ await sendAction('addType', t); }
      setGasStatus('✓ 初期データで開始','ok');
    }
  }catch(e){ setGasStatus('✗ 通信エラー: '+e.message,'err'); }
}

// 60秒ごとに他の人の更新を取り込む
function startAutoRefresh(){
  setInterval(()=>{
    if(document.getElementById('event-modal').classList.contains('show')) return;
    autoLoadFromGAS();
  }, 60000);
}
