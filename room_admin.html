<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議室予約 管理画面</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f2;--surface:#fff;--border:#e2e0db;
  --text:#1a1a1a;--text-sub:#6b6965;--text-hint:#b0ada8;
  --navy:#1a1a2e;--green:#1D9E75;--green-bg:#e8f5f0;
  --red:#e24b4a;--red-bg:#fdecea;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,#e24b4a,#a01a19);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-size:17px;font-weight:700}
.header-sub{font-size:11px;opacity:.6;margin-top:1px}
.header-right{margin-left:auto}
.back-link{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-size:12px;font-weight:600}
.container{max-width:900px;margin:0 auto;padding:16px}

/* フィルター */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-select{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--surface)}
.filter-date{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--surface)}

/* テーブル */
.table-wrap{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse}
thead tr{background:var(--navy);color:#fff}
th{padding:11px 14px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.3px}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9f9f7}
.cancel-btn{padding:5px 12px;border-radius:8px;border:1.5px solid #f5c6c6;background:var(--red-bg);color:var(--red);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.cancel-btn:hover{opacity:.8}

/* 統計 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--navy)}
.stat-label{font-size:12px;color:var(--text-sub);margin-top:4px}

.empty{text-align:center;padding:40px;color:var(--text-hint);font-size:14px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:999;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⚙️</div>
  <div>
    <div class="header-title">会議室予約 管理画面</div>
    <div class="header-sub">総務部専用</div>
  </div>
  <div class="header-right">
    <a class="back-link" href="room_calendar.html">← 予約画面</a>
  </div>
</div>

<div class="container">
  <!-- 統計 -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- フィルター -->
  <div class="filter-row">
    <input type="date" class="filter-date" id="filterDate" onchange="renderTable()">
    <select class="filter-select" id="filterRoom" onchange="renderTable()">
      <option value="">全会議室</option>
      <option>本社会議室</option>
      <option>本社3F食堂</option>
      <option>旧購買事務所</option>
      <option>旧組付詰所</option>
      <option>根崎2F食堂</option>
    </select>
    <select class="filter-select" id="filterDept" onchange="renderTable()">
      <option value="">全部署</option>
      <option>社長</option><option>役員</option><option>総務部</option>
      <option>営業部</option><option>設計課</option><option>電気課</option>
      <option>購買課</option><option>加工課</option><option>組付課</option>
      <option>第一製造部</option>
    </select>
  </div>

  <!-- テーブル -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>会議室</th>
          <th>時間</th>
          <th>部署</th>
          <th>氏名</th>
          <th>目的</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7"><div class="empty">読み込み中...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbysRCM8KbC7J8pg90BbZg8S0r3I5MfIfrl1_9xB2rw21qBSNH7UJOvdvErRsrxuEFb2/exec';

let reservations = [];

function fmtDateJP(str) {
  const [y,m,d] = str.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const days=['日','月','火','水','木','金','土'];
  return `${m}/${d}（${days[dt.getDay()]}）`;
}

async function loadAll() {
  try {
    const res = await fetch(GAS_URL + '?action=getReservations&t=' + Date.now());
    const json = await res.json();
    if (json.ok) {
      reservations = (json.reservations || []).sort((a,b) => {
        if (a.date !== b.date) return a.date > b.date ? 1 : -1;
        return a.start > b.start ? 1 : -1;
      });
      renderStats();
      renderTable();
    }
  } catch(e) { console.log('取得失敗:', e); }
}

function renderStats() {
  const today = new Date().toISOString().slice(0,10);
  const todayRsvs = reservations.filter(r => r.date === today);
  const upcomingRsvs = reservations.filter(r => r.date >= today);
  const rooms = ['本社会議室','本社3F食堂','旧購買事務所','旧組付詰所','根崎2F食堂'];
  const html = [
    { num: reservations.length, label: '総予約件数' },
    { num: todayRsvs.length, label: '本日の予約' },
    { num: upcomingRsvs.length, label: '今後の予約' },
    ...rooms.map(r => ({ num: reservations.filter(x=>x.room===r && x.date>=today).length, label: r }))
  ].map(s => `<div class="stat-card"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');
  document.getElementById('statsGrid').innerHTML = html;
}

function renderTable() {
  const dateFilter = document.getElementById('filterDate').value;
  const roomFilter = document.getElementById('filterRoom').value;
  const deptFilter = document.getElementById('filterDept').value;

  let filtered = reservations.filter(r => {
    if (dateFilter && r.date !== dateFilter) return false;
    if (roomFilter && r.room !== roomFilter) return false;
    if (deptFilter && r.dept !== deptFilter) return false;
    return true;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty">該当する予約はありません</div></td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => `
    <tr>
      <td>${fmtDateJP(r.date)}</td>
      <td>${r.room}</td>
      <td>${r.start}〜${r.end}</td>
      <td>${r.dept}</td>
      <td>${r.name}</td>
      <td>${r.purpose}</td>
      <td><button class="cancel-btn" onclick="cancelRsv('${r.id}','${r.name}')">取消</button></td>
    </tr>
  `).join('');
}

async function cancelRsv(id, name) {
  if (!confirm(`${name}さんの予約を取り消しますか？`)) return;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'cancelReservation', id })
    });
    const json = await res.json();
    if (json.ok) {
      reservations = reservations.filter(r => r.id !== id);
      renderStats();
      renderTable();
      showToast('予約を取り消しました', 'success');
    } else { showToast('取消に失敗しました', 'error'); }
  } catch(e) { showToast('通信エラーが発生しました', 'error'); }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

// 今日の日付をデフォルトに設定
document.getElementById('filterDate').value = new Date().toISOString().slice(0,10);

loadAll();
</script>
</body>
</html>
