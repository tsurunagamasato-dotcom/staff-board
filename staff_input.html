<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>所在地登録</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f4f4f2; --surface: #ffffff; --border: #e2e0db;
    --text: #1a1a1a; --text-sub: #6b6965; --text-hint: #a09d99; --accent: #1a1a1a;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }

  /* ===== ヘッダー ===== */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    width: 34px; height: 34px; border-radius: 9px; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-logo svg { width: 18px; height: 18px; fill: #fff; }
  .header-title { font-size: 16px; font-weight: 700; }
  .header-sub { font-size: 12px; color: var(--text-sub); margin-top: 1px; }

  /* ===== 2カラムレイアウト ===== */
  .layout { display: flex; min-height: calc(100vh - 66px); }

  /* --- 左サイドバー（出勤/退勤パネル） --- */
  .sidebar {
    width: 200px; flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--border);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .sidebar-label {
    font-size: 11px; font-weight: 700; color: var(--text-hint);
    letter-spacing: 0.5px;
  }
  .sidebar-user {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .sidebar-user-icon { font-size: 18px; }
  .sidebar-user-name { font-size: 15px; font-weight: 700; }
  .sidebar-user-suffix { font-size: 13px; color: var(--text-sub); }
  .change-btn {
    padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--border);
    background: var(--surface); font-size: 11px; font-weight: 700; color: var(--text-sub);
    cursor: pointer; font-family: inherit; transition: .15s;
  }
  .change-btn:hover { background: #eee; }

  .att-btns { display: flex; gap: 8px; }
  .att-btn {
    flex: 1; aspect-ratio: 1; border-radius: 16px; border: 2.5px solid;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; font-family: inherit; font-size: 16px; font-weight: 900;
    transition: transform .1s, opacity .15s; position: relative; overflow: hidden;
  }
  .att-btn:active { transform: scale(0.95); }
  .att-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .att-btn:disabled:active { transform: none; }

  .att-btn.btn-in {
    background: linear-gradient(145deg, #d4f0e4, #b8e6d0);
    border-color: #1D9E75; color: #0a5c3f;
  }
  .att-btn.btn-out {
    background: linear-gradient(145deg, #f5d4d4, #edb8b8);
    border-color: #d35050; color: #7a1a1a;
  }
  .att-btn .att-icon { font-size: 24px; }
  .att-btn .att-label { font-size: 14px; }
  .att-btn .att-time {
    font-size: 10px; font-weight: 500; opacity: 0.7;
    position: absolute; bottom: 6px;
  }

  .att-status-msg {
    font-size: 11px; color: var(--text-sub); line-height: 1.5;
    padding: 8px 10px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
  }

  /* サイドバー未選択時 */
  .sidebar-empty {
    font-size: 12px; color: var(--text-hint); line-height: 1.6;
    padding: 12px 0;
  }

  /* --- 右メインエリア --- */
  .main-area { flex: 1; min-width: 0; }
  .main { padding: 24px 20px 48px; max-width: 560px; margin: 0 auto; }

  /* ===== モバイル：サイドバー→上部パネル化 ===== */
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid var(--border);
      padding: 16px 20px; flex-direction: column; gap: 12px;
    }
    .att-btns { max-width: 280px; }
    .att-btn { aspect-ratio: auto; padding: 14px 8px; }
  }

  /* ===== ステップインジケーター ===== */
  .steps { display: flex; align-items: center; margin-bottom: 28px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-hint); flex: 1; }
  .step.active { color: var(--text); }
  .step.done { color: #1D9E75; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; flex-shrink: 0; background: var(--surface);
  }
  .step.active .step-num { border-color: var(--accent); background: var(--accent); color: #fff; }
  .step.done .step-num { border-color: #1D9E75; background: #1D9E75; color: #fff; }
  .step-line { flex: 1; height: 1px; background: var(--border); margin: 0 4px; }

  .section-label { font-size: 12px; font-weight: 700; color: var(--text-hint); letter-spacing: 0.6px; margin-bottom: 10px; }

  .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
  .btn-grid.col3 { grid-template-columns: repeat(3, 1fr); }

  .sel-btn {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 14px 10px; text-align: center; font-size: 14px; font-weight: 500;
    cursor: pointer; color: var(--text); font-family: inherit;
    transition: border-color .15s, background .15s, transform .1s; line-height: 1.3;
  }
  .sel-btn:active { transform: scale(0.97); }
  .sel-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }

  .sel-btn.status-btn.sel-honsha_office  { border-color: #1D9E75; background: #e8f5f0; color: #0f6e56; }
  .sel-btn.status-btn.sel-honsha_factory { border-color: #0e7fa8; background: #e0f4fa; color: #084f6a; }
  .sel-btn.status-btn.sel-nezaki         { border-color: #185FA5; background: #e6f1fb; color: #0c447c; }
  .sel-btn.status-btn.sel-nezaki2        { border-color: #534AB7; background: #eeedfe; color: #3c3489; }
  .sel-btn.status-btn.sel-gaishutsu      { border-color: #BA7517; background: #faeeda; color: #633806; }
  .sel-btn.status-btn.sel-zaitaku        { border-color: #639922; background: #eaf3de; color: #27500a; }
  .sel-btn.status-btn.sel-yasumi         { border-color: #888780; background: #f1efe8; color: #444441; }
  .sel-btn.status-btn.sel-gozen_kyuu     { border-color: #e0881e; background: #ffe9cc; color: #8a5000; }
  .sel-btn.status-btn.sel-gogo_kyuu      { border-color: #e0662a; background: #ffdfc7; color: #8a3d00; }
  .sel-btn.status-btn.sel-risseki        { border-color: #c0392b; background: #fdecea; color: #7b1a14; }

  .status-icon { font-size: 22px; margin-bottom: 4px; }

  .name-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
  .name-btn {
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
    padding: 14px 16px; text-align: left; font-size: 15px; font-weight: 500;
    cursor: pointer; color: var(--text); font-family: inherit;
    transition: border-color .15s, background .15s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .name-btn.selected { border-color: var(--accent); background: #f8f8f6; }
  .name-btn .check { color: #1D9E75; font-size: 18px; opacity: 0; }
  .name-btn.selected .check { opacity: 1; }

  .submit-btn {
    width: 100%; padding: 16px; background: var(--accent); color: #fff;
    border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: opacity .15s, transform .1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .submit-btn:not(:disabled):active { transform: scale(0.98); }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; font-size: 13px; color: var(--text-sub);
    cursor: pointer; font-family: inherit; padding: 0; margin-bottom: 20px;
  }

  .result-screen { display: none; text-align: center; padding: 40px 20px; }
  .result-icon {
    width: 72px; height: 72px; border-radius: 50%; background: #e8f5f0;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 32px;
  }
  .result-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { font-size: 14px; color: var(--text-sub); margin-bottom: 28px; line-height: 1.6; }
  .result-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 20px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 32px;
  }
  .result-dot { width: 10px; height: 10px; border-radius: 50%; }
  .again-btn {
    width: 100%; padding: 14px; background: var(--bg); color: var(--text);
    border: 1.5px solid var(--border); border-radius: 14px; font-size: 15px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }
  .hidden { display: none !important; }

  .saving-overlay {
    display: none; position: fixed; inset: 0; z-index: 300;
    background: rgba(255,255,255,0.85);
    align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  }
  .saving-overlay.show { display: flex; }
  .saving-spinner {
    width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: #1D9E75;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .saving-text { font-size: 14px; color: var(--text-sub); font-weight: 500; }
</style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
  </div>
  <div>
    <div class="header-title">所在地登録</div>
    <div class="header-sub">Nakashima Manufacturing</div>
  </div>
</header>

<div class="layout">
  <!-- ===== 左サイドバー：出勤/退勤パネル ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">出勤 / 退勤</div>

    <!-- 未選択時 -->
    <div id="sidebarEmpty" class="sidebar-empty">
      右側で氏名を選ぶと<br>ここに出勤/退勤ボタンが<br>表示されます
    </div>

    <!-- 選択済み時 -->
    <div id="sidebarActive" class="hidden">
      <div class="sidebar-user">
        <span class="sidebar-user-icon">🧑</span>
        <span class="sidebar-user-name" id="sidebarName"></span>
        <span class="sidebar-user-suffix">さん</span>
        <button class="change-btn" onclick="clearLastUser()">変更</button>
      </div>

      <div class="att-btns">
        <button class="att-btn btn-in" id="btnClockIn" onclick="quickClockIn()">
          <span class="att-icon" id="attInIcon">🟢</span>
          <span class="att-label">出勤</span>
          <span class="att-time" id="attInTime"></span>
        </button>
        <button class="att-btn btn-out" id="btnClockOut" onclick="quickClockOut()">
          <span class="att-icon">⏹</span>
          <span class="att-label">退勤</span>
          <span class="att-time" id="attOutTime"></span>
        </button>
      </div>

      <div class="att-status-msg" id="attStatusMsg"></div>
    </div>
  </aside>

  <!-- ===== 右メインエリア：所在地登録 ===== -->
  <div class="main-area">
    <div class="main">
      <div class="steps" id="stepIndicator">
        <div class="step active" id="stepEl1"><div class="step-num">1</div><span>部署</span></div>
        <div class="step-line"></div>
        <div class="step" id="stepEl2"><div class="step-num">2</div><span>氏名</span></div>
        <div class="step-line"></div>
        <div class="step" id="stepEl3"><div class="step-num">3</div><span>居場所</span></div>
      </div>

      <div id="step1">
        <div class="section-label">部署を選んでください</div>
        <div class="btn-grid" id="deptGrid"></div>
      </div>

      <div id="step2" class="hidden">
        <button class="back-btn" onclick="goStep(1)">← 部署を選び直す</button>
        <div class="section-label" id="step2Label">氏名を選んでください</div>
        <div class="name-list" id="nameList"></div>
      </div>

      <div id="step3" class="hidden">
        <button class="back-btn" onclick="goStep(2)">← 氏名を選び直す</button>
        <div class="section-label" id="step3Label">居場所を選んでください</div>
        <div class="btn-grid col3" id="statusGrid"></div>
        <button class="submit-btn" id="submitBtn" onclick="submit()" disabled>登録する</button>
      </div>

      <div class="result-screen" id="resultScreen">
        <div class="result-icon" id="resultIcon">✓</div>
        <div class="result-title" id="resultTitle">登録しました</div>
        <div class="result-sub" id="resultSub"></div>
        <div class="result-badge" id="resultBadge"></div>
        <button class="again-btn" onclick="reset()">別の人を登録する</button>
      </div>
    </div>
  </div>
</div>

<div class="saving-overlay" id="savingOverlay">
  <div class="saving-spinner"></div>
  <div class="saving-text">登録中...</div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwo73GwwjA1kVVOkq-XKIovxhTjaZSnM_GgMVpOUC_D-39NnvzjQENqABWL-7Tybk0RyQ/exec';
const LUNCH_GAS_URL = 'https://script.google.com/macros/s/AKfycbwADKRSZHd0Tpiv3X3v7PRNfRccM6H-y3L8mnJF3CulCB_T3zKK_faBccYx0ZI-LFGYGw/exec';

const LUNCH_NG_STATUSES = ['gaishutsu', 'yasumi', 'zaitaku'];

function fmtDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// GASの断続的な404/500/タイムアウトを吸収するため最大3回・1.5秒間隔で再試行
async function fetchWithRetry(url, opts) {
  for (let i = 1; i <= 3; i++) {
    try {
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res;
    } catch (e) {
      if (i === 3) throw e;
      await new Promise(r => setTimeout(r, 1500));
    }
  }
}

async function syncLunchNG(staff, status, leaveStart, leaveEnd) {
  if (status === 'gaishutsu') return;
  if (!LUNCH_NG_STATUSES.includes(status)) return;
  const today = new Date();
  const todayStr = fmtDateStr(today);
  const dates = [];
  if (status === 'yasumi' && !leaveStart) {
    const h = today.getHours(), m = today.getMinutes();
    if (h > 8 || (h === 8 && m >= 45)) return;
  }
  if (leaveStart && leaveEnd) {
    const start = new Date(leaveStart + 'T00:00:00');
    const end   = new Date(leaveEnd   + 'T00:00:00');
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const day = d.getDay();
      if (day !== 0 && day !== 6) dates.push(fmtDateStr(new Date(d)));
    }
  } else {
    if (leaveStart && leaveStart > todayStr) return;
    dates.push(todayStr);
  }
  if (dates.length === 0) return;
  const orders = dates.map(date => ({
    action:'saveOrder', date, id:staff.id, name:staff.name, dept:staff.dept, order:'nashi', place:'', proxy:false
  }));
  try {
    await fetchWithRetry(LUNCH_GAS_URL, { method:'POST', body:JSON.stringify({action:'saveOrders',orders}) });
  } catch(e) { console.log('昼食連携エラー:', e); }
}

const STATUSES = [
  { key:'honsha_office',  label:'本社事務所', bg:'#e8f5f0', fg:'#0f6e56', dot:'#1D9E75', icon:'🏢' },
  { key:'honsha_factory', label:'本社工場',   bg:'#e0f4fa', fg:'#084f6a', dot:'#0e7fa8', icon:'🏭' },
  { key:'nezaki',         label:'根崎',       bg:'#e6f1fb', fg:'#0c447c', dot:'#185FA5', icon:'🔧' },
  { key:'nezaki2',        label:'根崎第2',    bg:'#eeedfe', fg:'#3c3489', dot:'#534AB7', icon:'🏗' },
  { key:'gaishutsu',      label:'外出/出張',  bg:'#faeeda', fg:'#633806', dot:'#BA7517', icon:'🚗' },
  { key:'zaitaku',        label:'在宅',       bg:'#eaf3de', fg:'#27500a', dot:'#639922', icon:'🏠' },
  { key:'yasumi',         label:'休み',       bg:'#f1efe8', fg:'#444441', dot:'#888780', icon:'🌙' },
  { key:'gozen_kyuu',     label:'午前休',     bg:'#ffe9cc', fg:'#8a5000', dot:'#e0881e', icon:'🌅' },
  { key:'gogo_kyuu',      label:'午後休',     bg:'#ffdfc7', fg:'#8a3d00', dot:'#e0662a', icon:'🌇' },
  { key:'risseki',        label:'離席/会議等', bg:'#fdecea', fg:'#7b1a14', dot:'#c0392b', icon:'🚶' },
];
const STATUS_MAP = Object.fromEntries(STATUSES.map(s => [s.key, s]));
STATUS_MAP['taikin'] = { key:'taikin', label:'退勤済み', bg:'#f1efe8', fg:'#444441', dot:'#888780', icon:'⏹' };

const DEPT_ORDER = ['会長/社長','役員','総務部','営業部','購買課','第一製造部','設計課','電気課','加工課','組付課'];

let STAFF_MASTER = [];
let selDept = null, selStaff = null, selStatus = null;

const EMP_GAS_URL = 'https://script.google.com/macros/s/AKfycbwFE4wAC6cdFT8H2JmwW2XONgJz0j1rCI4xE2C9x1tKdMaib5aRgUKXE2N3hkQ034hu/exec';
const EMP_LS_KEY = 'employee_master_cache';
const LAST_USER_KEY = 'staff_input_last_user';
const ATTENDANCE_KEY = 'nakashima_attendance';

// ====== 従業員マスタ ======
async function loadStaffMaster() {
  try {
    const cached = localStorage.getItem(EMP_LS_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.length > 0) _applyEmployees(parsed);
    }
    const res = await fetchWithRetry(EMP_GAS_URL + '?action=getEmployees&t=' + Date.now());
    const json = await res.json();
    if (json.ok && json.employees && json.employees.length > 0) {
      const active = json.employees.filter(e => e.active !== '退職');
      localStorage.setItem(EMP_LS_KEY, JSON.stringify(active));
      _applyEmployees(active);
    }
  } catch(e) { console.log('従業員マスタ取得失敗:', e); }
}

function _applyEmployees(emps) {
  STAFF_MASTER = emps
    .filter(e => e.showLocation !== '0')
    .map(e => ({
      id: e.empNo || e.id, name: String(e.name), dept: String(e.dept),
      base: e.defaultPlace || 'honsha_office', slide: e.slide || 'honsha1',
      empNo: e.empNo || '', category: e.category || '社員', location: e.place || ''
    }));
}

// ====== 出退勤 localStorage ======
function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getAttendance(id) {
  try {
    const all = JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '{}');
    const rec = all[id];
    if (rec && rec.date !== getTodayStr()) return null;
    return rec || null;
  } catch(e) { return null; }
}

function setAttendance(id, data) {
  try {
    const all = JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '{}');
    all[id] = { ...data, date: getTodayStr() };
    localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(all));
  } catch(e) {}
}

function nowTimeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// ====== 記憶ユーザー ======
function getLastUser() {
  try { return JSON.parse(localStorage.getItem(LAST_USER_KEY)); } catch(e) { return null; }
}
function saveLastUser(staff) {
  try { localStorage.setItem(LAST_USER_KEY, JSON.stringify({id:staff.id, name:staff.name, dept:staff.dept})); } catch(e) {}
}
function clearLastUser() {
  localStorage.removeItem(LAST_USER_KEY);
  selDept = null; selStaff = null; selStatus = null;
  updateSidebar();
  renderDepts();
  goStep(1);
}

// ====== サイドバー表示更新 ======
function updateSidebar() {
  if (!selStaff) {
    document.getElementById('sidebarEmpty').classList.remove('hidden');
    document.getElementById('sidebarActive').classList.add('hidden');
    return;
  }
  document.getElementById('sidebarEmpty').classList.add('hidden');
  document.getElementById('sidebarActive').classList.remove('hidden');
  document.getElementById('sidebarName').textContent = selStaff.name;

  // 会長は出勤/退勤パネル非表示
  const isChairman = selStaff.dept === '会長';
  document.querySelector('.att-btns').style.display = isChairman ? 'none' : 'flex';
  document.getElementById('attStatusMsg').style.display = isChairman ? 'none' : 'block';

  const att = getAttendance(selStaff.id);
  const btnIn  = document.getElementById('btnClockIn');
  const btnOut = document.getElementById('btnClockOut');
  const msgEl  = document.getElementById('attStatusMsg');
  const inTime = document.getElementById('attInTime');
  const outTime = document.getElementById('attOutTime');
  const inIcon = document.getElementById('attInIcon');

  if (!att || !att.clockIn) {
    // 未打刻
    inTime.textContent = '';
    outTime.textContent = '';
    inIcon.textContent = '🟢';
    msgEl.innerHTML = '出勤ボタンを押すか、<br>右側で居場所を登録すると<br>出勤になります';
  } else if (!att.clockOut) {
    // 出勤中
    inTime.textContent = att.clockIn;
    outTime.textContent = '';
    inIcon.textContent = '✓';
    msgEl.innerHTML = `🟢 <strong>${att.clockIn}</strong> に出勤しました`;
  } else {
    // 退勤済み（再度押せば上書き可能）
    inTime.textContent = att.clockIn;
    outTime.textContent = att.clockOut;
    inIcon.textContent = '✓';
    msgEl.innerHTML = `⏹ <strong>${att.clockIn}</strong> → <strong>${att.clockOut}</strong> 退勤済み<br><span style="font-size:10px;opacity:0.6;">※再度押せば上書きできます</span>`;
  }
}

// ====== 出勤クイックアクション ======
async function quickClockIn() {
  if (!selStaff) return;
  // 常に上書き可能（出勤時刻リセット、退勤取消）
  setAttendance(selStaff.id, { clockIn: nowTimeStr(), clockOut: '' });
  selStatus = selStaff.base;
  saveLastUser(selStaff);
  await submitToGAS();
}

// ====== 退勤クイックアクション ======
async function quickClockOut() {
  if (!selStaff) return;
  const att = getAttendance(selStaff.id);
  // 出勤打刻がなければ現在時刻で補完
  const clockIn = (att && att.clockIn) ? att.clockIn : nowTimeStr();
  setAttendance(selStaff.id, { clockIn, clockOut: nowTimeStr() });
  selStatus = 'taikin';
  saveLastUser(selStaff);
  await submitToGAS();
}

// ====== GAS送信 ======
async function submitToGAS() {
  if (!selStaff || !selStatus) return;
  const now = new Date();
  const updatedStr = now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) + '更新';
  const memo = document.getElementById('memoInput') ? document.getElementById('memoInput').value.trim() : '';
  let leaveStart = document.getElementById('leaveStart') ? document.getElementById('leaveStart').value : '';
  let leaveEnd   = document.getElementById('leaveEnd')   ? document.getElementById('leaveEnd').value   : '';
  // 期間(leave)を使うステータス以外は必ずクリアする。
  // （本社などの居場所を登録し直したとき、前に選んだ午後休等のleaveStartが残って誤動作するのを防ぐ。
  //   これをしないと居場所登録でも当日leaveが付いてしまう）
  const LEAVE_STATUSES = ['yasumi','gaishutsu','zaitaku','gozen_kyuu','gogo_kyuu'];
  if (!LEAVE_STATUSES.includes(selStatus)) { leaveStart = ''; leaveEnd = ''; }
  // 午前休・午後休は単日指定：終了日を開始日に揃える
  if (selStatus === 'gozen_kyuu' || selStatus === 'gogo_kyuu') leaveEnd = leaveStart;

  // 送信データ。午後休(gogo_kyuu)は「居場所(status)は変えず、午後休フラグ(gogoHalf)だけ立てる」。
  // 左＝現在地はKOTや通常の居場所登録で入り、右＝午後休はフラグで維持される。
  const payload = { id:selStaff.id, name:selStaff.name, dept:selStaff.dept };
  if (selStatus === 'gogo_kyuu') {
    // 午後休：フラグ(gogoHalf)だけ立てる。居場所(status/updated/memo)は一切触らない＝左はKOT・手動で入る。
    payload.gogoHalf = leaveStart || fmtDateStr(new Date()); // 午後休にする日（単日）
  } else {
    payload.status     = selStatus;
    payload.updated    = updatedStr;
    payload.memo       = memo;
    payload.leaveStart = leaveStart;
    payload.leaveEnd   = leaveEnd;
    // gogoHalf は送らない＝GAS側で維持（居場所を移動しても午後休は消さない／退勤時はGASが自動解除）
  }

  document.getElementById('savingOverlay').classList.add('show');
  try {
    const res = await fetchWithRetry(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (!json.ok) throw new Error();

    if (selStatus !== 'taikin') {
      await syncLunchNG(selStaff, selStatus, leaveStart, leaveEnd);
    }

    const s = STATUS_MAP[selStatus];
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.add('hidden');
    document.getElementById('stepIndicator').classList.add('hidden');

    const isTaikin = selStatus === 'taikin';
    const lunchSynced = !isTaikin && LUNCH_NG_STATUSES.includes(selStatus);
    const lunchMsg = lunchSynced ? '\n🍱 昼食注文も自動で「×食べない」に登録しました' : '';

    document.getElementById('resultSub').textContent = isTaikin
      ? `${selStaff.name}さんの退勤を登録しました`
      : `${selStaff.name}さん（${selStaff.dept}）の居場所を登録しました${lunchMsg}`;
    document.getElementById('resultBadge').style.cssText = `background:${s.bg};color:${s.fg};`;
    document.getElementById('resultBadge').innerHTML = `<span class="result-dot" style="background:${s.dot}"></span>${s.label}`;
    document.getElementById('resultIcon').textContent = isTaikin ? '⏹' : '✓';
    document.getElementById('resultTitle').textContent = isTaikin ? '退勤しました' : '登録しました';
    document.getElementById('resultIcon').style.background = isTaikin ? '#f1efe8' : '#e8f5f0';
    document.getElementById('resultScreen').style.display = 'block';
    window.scrollTo(0,0);

    // サイドバー更新
    updateSidebar();
  } catch(e) {
    alert('登録に失敗しました。もう一度お試しください。');
  } finally {
    document.getElementById('savingOverlay').classList.remove('show');
  }
}

// ====== メイン初期化 ======
async function init() {
  try {
    const cached = localStorage.getItem(EMP_LS_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.length > 0) { _applyEmployees(parsed); renderDepts(); }
    }
  } catch(e) {}

  loadStaffMaster().then(() => {
    renderDepts();
    tryRestoreLastUser();
  });
}

function tryRestoreLastUser() {
  const last = getLastUser();
  if (!last || !last.id) { updateSidebar(); return; }
  const found = STAFF_MASTER.find(s => String(s.id) === String(last.id));
  if (!found) { updateSidebar(); return; }

  selStaff = found;
  selDept = found.dept;
  if (found.dept === '会長' || found.dept === '社長') selDept = '会長/社長';
  selStatus = null;
  updateSidebar();
  goStep(3);
}

function renderDepts() {
  const hasChaiman = STAFF_MASTER.some(s => s.dept === '会長' || s.dept === '社長');
  const otherDepts = DEPT_ORDER.filter(d => d !== '会長/社長' && STAFF_MASTER.some(s => s.dept === d));
  const depts = [...(hasChaiman ? ['会長/社長'] : []), ...otherDepts];
  document.getElementById('deptGrid').innerHTML = depts.map(d =>
    `<button class="sel-btn ${selDept===d?'selected':''}" onclick="selectDept('${d}')">${d}</button>`
  ).join('');
}

function selectDept(dept) { selDept = dept; selStaff = null; selStatus = null; updateSidebar(); goStep(2); }

function renderNames() {
  const members = selDept === '会長/社長'
    ? STAFF_MASTER.filter(s => s.dept === '会長' || s.dept === '社長')
    : STAFF_MASTER.filter(s => s.dept === selDept);
  document.getElementById('step2Label').textContent = `${selDept}の方を選んでください`;
  document.getElementById('nameList').innerHTML = members.map(s =>
    `<button class="name-btn ${selStaff&&String(selStaff.id)===String(s.id)?'selected':''}" onclick="selectName('${s.id}')">
      <span>${s.name}</span><span class="check">✓</span>
    </button>`
  ).join('');
}

function selectName(id) {
  selStaff = STAFF_MASTER.find(s => String(s.id) === String(id));
  selStatus = null;
  saveLastUser(selStaff);
  updateSidebar();
  goStep(3);
}

function renderStatus() {
  document.getElementById('step3Label').textContent = `${selStaff.name}さんの居場所を選んでください`;
  if (!selStatus) selStatus = selStaff.base;
  const isNonDefault = selStatus !== selStaff.base;
  const defaultLabel = STATUS_MAP[selStaff.base]?.label || '';

  let badge = document.getElementById('nonDefaultBadge');
  if (!badge) {
    badge = document.createElement('div');
    badge.id = 'nonDefaultBadge';
    badge.style.cssText = 'margin-bottom:12px;padding:8px 14px;border-radius:10px;background:#FFF3E0;border:1.5px solid #FFA028;color:#7A4000;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px;';
    document.getElementById('statusGrid').before(badge);
  }
  badge.style.display = isNonDefault ? 'flex' : 'none';
  badge.textContent = isNonDefault ? `⚠ 通常の居場所（${defaultLabel}）と異なります` : '';

  const isChairman = selStaff.dept === '会長';
  const displayStatuses = isChairman
    ? [{ key:'honsha_office', label:'出勤', icon:'🏢' }]
    : STATUSES;
  if (isChairman) selStatus = 'honsha_office';

  document.getElementById('statusGrid').innerHTML = displayStatuses.map(st => {
    const isDefault = st.key === selStaff.base;
    return `<button class="sel-btn status-btn ${selStatus===st.key?'sel-'+st.key:''}" onclick="selectStatus('${st.key}')">
      <div class="status-icon">${st.icon}</div>
      <div>${st.label}</div>
      ${isDefault ? '<div style="font-size:9px;opacity:0.5;margin-top:2px;">通常</div>' : ''}
    </button>`;
  }).join('');
  document.getElementById('submitBtn').disabled = !selStatus;

  // メモ欄
  let memoWrap = document.getElementById('memoWrap');
  if (!memoWrap) {
    memoWrap = document.createElement('div');
    memoWrap.id = 'memoWrap';
    memoWrap.style.cssText = 'margin-bottom:16px;';
    memoWrap.innerHTML = `
      <div class="section-label" style="margin-bottom:6px;">行先・メモ（任意）</div>
      <input id="memoInput" type="text" placeholder="例：豊田市役所、東京出張など"
        style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface);color:var(--text);">
    `;
    document.getElementById('submitBtn').before(memoWrap);
  }
  memoWrap.style.display = (selStatus === 'gaishutsu' || selStatus === 'risseki') ? 'block' : 'none';

  // 期間欄
  let leaveWrap = document.getElementById('leaveWrap');
  if (!leaveWrap) {
    leaveWrap = document.createElement('div');
    leaveWrap.id = 'leaveWrap';
    leaveWrap.style.cssText = 'margin-bottom:16px;';
    const today = fmtDateStr(new Date());
    leaveWrap.innerHTML = `
      <div class="section-label" style="margin-bottom:6px;">長期休暇の期間（任意）</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <input id="leaveStart" type="date" value="${today}"
          style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface);color:var(--text);">
        <span id="leaveDash" style="font-size:13px;color:var(--text-sub);">〜</span>
        <input id="leaveEnd" type="date" value="${today}"
          style="flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface);color:var(--text);">
      </div>
      <div id="leaveHint" style="font-size:11px;color:var(--text-hint);margin-top:6px;">期間を設定すると毎朝の自動リセットがスキップされます</div>
    `;
    document.getElementById('submitBtn').before(leaveWrap);
  }
  const isHankyu = (selStatus === 'gozen_kyuu' || selStatus === 'gogo_kyuu');
  leaveWrap.style.display = (selStatus === 'yasumi' || selStatus === 'gaishutsu' || selStatus === 'zaitaku' || isHankyu) ? 'block' : 'none';
  // 午前休・午後休は単日指定：終了日と「〜」を隠す
  const leaveEndEl = document.getElementById('leaveEnd');
  const leaveDashEl = document.getElementById('leaveDash');
  if (leaveEndEl)  leaveEndEl.style.display  = isHankyu ? 'none' : '';
  if (leaveDashEl) leaveDashEl.style.display = isHankyu ? 'none' : '';
  const leaveHint = document.getElementById('leaveHint');
  if (leaveHint) leaveHint.textContent = isHankyu ? '指定した1日だけ午前休／午後休になります' : '期間を設定すると毎朝の自動リセットがスキップされます';
  const leaveLabel = leaveWrap.querySelector('.section-label');
  if (leaveLabel) {
    leaveLabel.textContent = isHankyu ? (selStatus === 'gozen_kyuu' ? '午前休にする日' : '午後休にする日')
      : selStatus === 'gaishutsu' ? '外出/出張の期間（任意）' : selStatus === 'zaitaku' ? '在宅の期間（任意）' : '長期休暇の期間（任意）';
  }
}

function selectStatus(key) { selStatus = key; renderStatus(); }

function goStep(n) {
  document.getElementById('step1').classList.toggle('hidden', n!==1);
  document.getElementById('step2').classList.toggle('hidden', n!==2);
  document.getElementById('step3').classList.toggle('hidden', n!==3);
  [1,2,3].forEach(i => {
    const el = document.getElementById('stepEl'+i);
    el.className = 'step' + (i<n?' done':i===n?' active':'');
  });
  if (n===2) renderNames();
  if (n===3) renderStatus();
  window.scrollTo(0,0);
}

async function submit() {
  if (!selStaff || !selStatus) return;
  // 休み・午前休・午後休はローカルの出勤打刻を記録しない（モニタはstatusで判定）
  if (!['yasumi','gozen_kyuu','gogo_kyuu'].includes(selStatus)) {
    const att = getAttendance(selStaff.id);
    if (!att || !att.clockIn) {
      setAttendance(selStaff.id, { clockIn: nowTimeStr(), clockOut: '' });
    }
  }
  saveLastUser(selStaff);
  await submitToGAS();
}

function reset() {
  selDept=null; selStaff=null; selStatus=null;
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('stepIndicator').classList.remove('hidden');
  // 記憶ユーザーがあればサイドバーは維持、ステップ3に戻す
  const last = getLastUser();
  if (last && last.id) {
    const found = STAFF_MASTER.find(s => String(s.id) === String(last.id));
    if (found) {
      selStaff = found;
      selDept = found.dept;
      if (found.dept === '会長' || found.dept === '社長') selDept = '会長/社長';
      updateSidebar();
      renderDepts();
      goStep(3);
      return;
    }
  }
  updateSidebar();
  renderDepts();
  goStep(1);
}

init();
</script>
