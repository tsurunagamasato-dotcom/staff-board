<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議室予約</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
  --text:#e8e8f0;--text-sub:#9090b0;--text-hint:#5a5a7a;
  --navy:#1a1a2e;--green:#1D9E75;--red:#e24b4a;
  --accent:#e94560;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ヘッダー */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:34px;height:34px;background:linear-gradient(135deg,#1D9E75,#0d6e50);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;color:var(--text-sub);margin-top:1px}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.admin-link{padding:5px 12px;border-radius:7px;border:1px solid var(--border2);color:var(--text);text-decoration:none;font-size:12px;font-weight:600;transition:.15s}
.admin-link:hover{background:var(--border)}

/* 月ナビ */
.cal-nav{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
.nav-btn:hover{background:var(--border2)}
.month-label{font-size:20px;font-weight:800;flex:1}
.today-btn{padding:5px 14px;border-radius:7px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.today-btn:hover{background:var(--border2)}

/* 会議室フィルター */
.room-filter{display:flex;gap:6px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.room-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text-sub);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.room-chip.active{background:var(--green);color:#fff;border-color:var(--green)}

/* カレンダーグリッド */
.cal-wrap{padding:8px 16px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-bottom:4px;flex-shrink:0}
.cal-header-cell{text-align:center;font-size:12px;font-weight:700;color:var(--text-sub);padding:6px 0}
.cal-header-cell.sun{color:#e24b4a}
.cal-header-cell.sat{color:#4a8fe2}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);flex:1;overflow:hidden}
.cal-cell{background:var(--surface);padding:6px;cursor:pointer;transition:.1s;position:relative;overflow:hidden;min-height:0}
.cal-cell:hover{background:var(--surface2)}
.cal-cell.other-month{opacity:.35}
.cal-cell.today .day-num{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal-cell.weekend-sat .day-num{color:#4a8fe2}
.cal-cell.weekend-sun .day-num{color:#e24b4a}
.cal-cell.past{opacity:.5;cursor:default}
.day-num{font-size:13px;font-weight:700;margin-bottom:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}

/* 予約ブロック */
.rsv-item{border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;margin-bottom:3px;overflow:hidden;cursor:pointer;line-height:1.5;border-left:3px solid rgba(255,255,255,.5)}
.more-btn{font-size:10px;color:var(--text-sub);padding:1px 4px;cursor:pointer}

/* 会議室カラー */
.room-0{background:#1D9E75;color:#fff}
.room-1{background:#185FA5;color:#fff}
.room-2{background:#7B2D8B;color:#fff}
.room-3{background:#BA7517;color:#fff}
.room-4{background:#1a5e7a;color:#fff}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay.hidden{display:none}
.modal-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:420px;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,.4);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;margin-bottom:4px;color:var(--text)}
.modal-sub{font-size:12px;color:var(--text-sub);margin-bottom:18px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field select,.field input[type=text],.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:9px;font-size:13px;font-family:inherit;background:var(--surface2);color:var(--text)}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.field textarea{resize:vertical;min-height:60px}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.time-row span{text-align:center;font-size:12px;color:var(--text-sub)}
.modal-footer{display:flex;gap:8px;margin-top:18px}
.btn-cancel{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-submit{flex:2;padding:10px;border-radius:9px;border:none;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-submit:disabled{background:#444;cursor:not-allowed;color:#888}

/* 予約詳細モーダル */
.detail-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.detail-item:last-child{border-bottom:none}
.detail-label{font-size:12px;color:var(--text-sub)}
.detail-value{font-size:13px;font-weight:600}
.btn-delete{width:100%;padding:10px;border-radius:9px;border:none;background:rgba(226,75,74,.2);color:#e24b4a;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:10px 22px;border-radius:50px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏢</div>
  <div>
    <div class="header-title">会議室予約</div>
    <div class="header-sub">ナカシマ</div>
  </div>
  
</div>

<!-- 月ナビ -->
<div class="cal-nav">
  <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="monthLabel"></div>
  <button class="today-btn" onclick="goToday()">今月</button>
  <button class="nav-btn" onclick="changeMonth(1)">›</button>
</div>

<!-- 会議室フィルター -->
<div class="room-filter" id="roomFilter"></div>

<!-- カレンダー -->
<div class="cal-wrap">
  <div class="cal-header">
    <div class="cal-header-cell sun">日</div>
    <div class="cal-header-cell">月</div>
    <div class="cal-header-cell">火</div>
    <div class="cal-header-cell">水</div>
    <div class="cal-header-cell">木</div>
    <div class="cal-header-cell">金</div>
    <div class="cal-header-cell sat">土</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- 予約モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">予約する</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="field">
      <label>時間</label>
      <div class="time-row">
        <select id="fStart"></select>
        <span>〜</span>
        <select id="fEnd"></select>
      </div>
    </div>
    <div class="field">
      <label>部署</label>
      <select id="fDept" onchange="onRoomModalDeptChange()">
        <option value="">選択してください</option>
        <option>社長</option><option>役員</option><option>総務部</option>
        <option>営業部</option><option>設計課</option><option>電気課</option>
        <option>購買課</option><option>加工課</option><option>組付課</option>
        <option>第一製造部</option>
      </select>
    </div>
    <div class="field">
      <label>氏名</label>
      <select id="fName">
        <option value="">部署を先に選択してください</option>
      </select>
    </div>
    <div class="field">
      <label>目的・内容</label>
      <textarea id="fPurpose" placeholder="例：営業部定例会議"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-submit" id="modalSubmit" onclick="submitReservation()">予約する</button>
    </div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="modal-overlay hidden" id="detailOverlay">
  <div class="modal-box">
    <div class="modal-title">予約詳細</div>
    <div id="detailContent"></div>
    <button class="btn-delete" id="detailDeleteBtn">この予約を取り消す</button>
    <div class="modal-footer" style="margin-top:10px">
      <button class="btn-cancel" style="flex:1" onclick="closeDetail()">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx2eL3PXJGj3TTWwUdckqc1uOqE9izDZoV5QuaQj_iAyNsqPDPwatzjeZG33q-446IS/exec';
const STAFF_GAS_URL = 'https://script.google.com/macros/s/AKfycbwT7aSD1CmIOp_TlVa3yzUZr99b-yzMd5h_--kgweBABdyW8SnRMscd3cdWlTp6GsQzUQ/exec';

// 社員マスタ（所在地ボードGASから取得・キャッシュ）
const STAFF_LSKEY = 'staff_master_cache';
let STAFF_MASTER = [];

async function loadStaffMaster() {
  try {
    const cached = localStorage.getItem(STAFF_LSKEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed.length > 0) { STAFF_MASTER = parsed; return; }
    }
    const res = await fetch(STAFF_GAS_URL + '?action=getStaff&t=' + Date.now());
    const json = await res.json();
    if (json.ok && json.staff && json.staff.length > 0) {
      STAFF_MASTER = json.staff.map(s => ({ id: parseInt(s.id), name: s.name, dept: s.dept }));
      localStorage.setItem(STAFF_LSKEY, JSON.stringify(STAFF_MASTER));
    }
  } catch(e) { console.log('staffマスタ取得失敗:', e); }
}

function onRoomModalDeptChange() {
  const dept = document.getElementById('fDept').value;
  const sel = document.getElementById('fName');
  if (!dept) {
    sel.innerHTML = '<option value="">部署を先に選択してください</option>';
    return;
  }
  const members = STAFF_MASTER.filter(s => s.dept === dept);
  if (members.length > 0) {
    sel.innerHTML = '<option value="">氏名を選択してください</option>' +
      members.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
  } else {
    sel.innerHTML = '<option value="">氏名を選択してください</option>';
  }
}

const ROOMS = ['本社会議室','本社3F食堂','旧購買事務所','旧組付詰所','根崎2F食堂'];
const ROOM_COLORS = ['room-0','room-1','room-2','room-3','room-4'];

const START_HOUR = 7, END_HOUR = 20;
function getTimeSlots() {
  const s=[];
  for(let h=START_HOUR;h<END_HOUR;h++){s.push(`${String(h).padStart(2,'0')}:00`);s.push(`${String(h).padStart(2,'0')}:30`);}
  s.push(`${String(END_HOUR).padStart(2,'0')}:00`);
  return s;
}
const TIME_SLOTS = getTimeSlots();

let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth();
let reservations = [];
let activeRoom = ROOMS[0]; // デフォルトは本社会議室のみ
let modalDate = '';
let detailRsv = null;

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return fmtDate(new Date());}

// 月ナビ
function changeMonth(delta){
  viewMonth+=delta;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  if(viewMonth>11){viewMonth=0;viewYear++;}
  renderCalendar();
}
function goToday(){
  const n=new Date();
  viewYear=n.getFullYear(); viewMonth=n.getMonth();
  renderCalendar();
}

// 会議室フィルター
function renderRoomFilter(){
  document.getElementById('roomFilter').innerHTML = ROOMS.map((r,i)=>
    `<button class="room-chip ${r===activeRoom?'active':''}" onclick="selectRoom('${r}')">${r}</button>`
  ).join('');
}
function selectRoom(room){
  activeRoom = room;
  renderRoomFilter();
  renderCalendar();
}

// カレンダー描画
function renderCalendar(){
  document.getElementById('monthLabel').textContent = `${viewYear}年${viewMonth+1}月`;

  const today = todayStr();
  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay = new Date(viewYear, viewMonth+1, 0);
  const startDow = firstDay.getDay();

  const cells = [];
  // 前月の空白
  for(let i=0;i<startDow;i++){
    const d = new Date(viewYear, viewMonth, -(startDow-i-1));
    cells.push({date:fmtDate(d), day:d.getDate(), otherMonth:true, dow:d.getDay()});
  }
  // 当月
  for(let d=1;d<=lastDay.getDate();d++){
    const dt = new Date(viewYear, viewMonth, d);
    cells.push({date:fmtDate(dt), day:d, otherMonth:false, dow:dt.getDay()});
  }
  // 次月
  const remaining = 7 - (cells.length % 7);
  if(remaining<7){
    for(let i=1;i<=remaining;i++){
      const dt = new Date(viewYear, viewMonth+1, i);
      cells.push({date:fmtDate(dt), day:i, otherMonth:true, dow:dt.getDay()});
    }
  }

  const grid = document.getElementById('calGrid');
  grid.innerHTML = cells.map(cell => {
    const isPast = cell.date < today;
    const isToday = cell.date === today;
    const isSat = cell.dow===6, isSun = cell.dow===0;

    // この日の予約（フィルター適用）
    const dayRsvs = reservations.filter(r=>r.date===cell.date && r.room===activeRoom);
    const maxShow = 3;
    const shown = dayRsvs.slice(0, maxShow);
    const more = dayRsvs.length - maxShow;

    const rsvHtml = shown.map(r=>{
      const ci = ROOMS.indexOf(r.room);
      return `<div class="rsv-item ${ROOM_COLORS[ci]}" onclick="event.stopPropagation();showDetail('${r.id}')" title="${r.room} ${r.start}〜${r.end} ${r.name}"><div style="font-size:11px;opacity:.85;">${r.start}〜${r.end}</div><div style="font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.purpose}</div></div>`;
    }).join('') + (more>0?`<div class="more-btn">他${more}件</div>`:'');

    return `<div class="cal-cell ${cell.otherMonth?'other-month':''} ${isToday?'today':''} ${isSat?'weekend-sat':''} ${isSun?'weekend-sun':''} ${isPast&&!cell.otherMonth?'past':''}"
      ${!isPast&&!cell.otherMonth?`onclick="openModal('${cell.date}')"`:''}>
      <div class="day-num">${cell.day}</div>
      ${rsvHtml}
    </div>`;
  }).join('');

  renderRoomFilter();
}

// 予約モーダル
function openModal(dateStr){
  modalDate = dateStr;
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const days=['日','月','火','水','木','金','土'];
  document.getElementById('modalTitle').textContent = '予約する';
  document.getElementById('modalSub').textContent = `${activeRoom} / ${y}年${m}月${d}日（${days[dt.getDay()]}）`;

  // 時間セレクト
  document.getElementById('fStart').innerHTML = TIME_SLOTS.slice(0,-1).map(t=>`<option value="${t}">${t}</option>`).join('');
  document.getElementById('fEnd').innerHTML = TIME_SLOTS.slice(1).map(t=>`<option value="${t}">${t}</option>`).join('');
  // デフォルト9:00〜10:00
  document.getElementById('fStart').value = '09:00';
  document.getElementById('fEnd').value = '10:00';

  document.getElementById('fDept').value = '';
  document.getElementById('fName').innerHTML = '<option value="">部署を先に選択してください</option>';
  document.getElementById('fPurpose').value = '';
  document.getElementById('modalSubmit').disabled = false;
  document.getElementById('modalSubmit').textContent = '予約する';

  document.getElementById('modalOverlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');}

async function submitReservation(){
  const room = activeRoom;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const dept = document.getElementById('fDept').value;
  const name = document.getElementById('fName').value.trim();
  const purpose = document.getElementById('fPurpose').value.trim();

  if(!dept){showToast('部署を選択してください','error');return;}
  if(!name){showToast('氏名を入力してください','error');return;}
  if(!purpose){showToast('目的を入力してください','error');return;}
  if(start>=end){showToast('終了時刻は開始時刻より後にしてください','error');return;}

  // 同じ会議室・日付・時間の重複チェック（UI側）
  const conflict = reservations.find(r =>
    r.room === room && r.date === modalDate &&
    start < r.end && end > r.start
  );
  if(conflict){
    showToast(`${conflict.start}〜${conflict.end} はすでに「${conflict.purpose}」で予約されています`,'error');
    return;
  }

  const btn = document.getElementById('modalSubmit');
  btn.disabled=true; btn.textContent='予約中...';

  try{
    const res = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'addReservation',room,date:modalDate,start,end,dept,name,purpose})});
    const json = await res.json();
    if(json.ok){
      closeModal();
      await loadReservations();
      renderCalendar();
      showToast('✅ 予約しました！','success');
    } else {
      showToast(json.message||'予約に失敗しました（時間が重複している可能性があります）','error');
      btn.disabled=false; btn.textContent='予約する';
    }
  }catch(e){
    showToast('通信エラーが発生しました','error');
    btn.disabled=false; btn.textContent='予約する';
  }
}

// 詳細モーダル
function showDetail(id){
  detailRsv = reservations.find(r=>r.id===id);
  if(!detailRsv) return;
  const ci = ROOMS.indexOf(detailRsv.room);
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-item"><span class="detail-label">会議室</span><span class="detail-value" style="color:var(--green)">${detailRsv.room}</span></div>
    <div class="detail-item"><span class="detail-label">日付</span><span class="detail-value">${detailRsv.date}</span></div>
    <div class="detail-item"><span class="detail-label">時間</span><span class="detail-value">${detailRsv.start}〜${detailRsv.end}</span></div>
    <div class="detail-item"><span class="detail-label">部署</span><span class="detail-value">${detailRsv.dept}</span></div>
    <div class="detail-item"><span class="detail-label">氏名</span><span class="detail-value">${detailRsv.name}</span></div>
    <div class="detail-item"><span class="detail-label">目的</span><span class="detail-value">${detailRsv.purpose}</span></div>
  `;
  document.getElementById('detailDeleteBtn').onclick = ()=>cancelRsv(detailRsv.id, detailRsv.name);
  document.getElementById('detailOverlay').classList.remove('hidden');
}
function closeDetail(){document.getElementById('detailOverlay').classList.add('hidden');}

async function cancelRsv(id, name){
  if(!confirm(`${name}さんの予約を取り消しますか？`)) return;
  try{
    const res = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'cancelReservation',id})});
    const json = await res.json();
    if(json.ok){
      reservations = reservations.filter(r=>r.id!==id);
      closeDetail();
      renderCalendar();
      showToast('予約を取り消しました');
    } else { showToast('取消に失敗しました','error'); }
  }catch(e){ showToast('通信エラーが発生しました','error'); }
}

// モーダル外クリック
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});
document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('detailOverlay'))closeDetail();});

async function loadReservations(){
  try{
    const res = await fetch(GAS_URL+'?action=getReservations&t='+Date.now());
    const json = await res.json();
    if(json.ok) {
      reservations = (json.reservations||[]).map(r => ({
        ...r,
        date: normalizeDate(r.date),
        start: normalizeTime(r.start),
        end: normalizeTime(r.end)
      }));
    }
  }catch(e){console.log('取得失敗:',e);}
}

function normalizeDate(val) {
  if (!val) return '';
  const s = String(val);
  // すでにYYYY-MM-DD形式
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // Date文字列（Thu Jun 11 2026...）
  try {
    const d = new Date(s);
    if (!isNaN(d)) {
      return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    }
  } catch(e) {}
  return s;
}

function normalizeTime(val) {
  if (!val) return '';
  const s = String(val);
  // すでにHH:MM形式
  if (/^\d{1,2}:\d{2}$/.test(s)) return s.padStart(5,'0');
  // Date文字列（Sat Dec 30 1899 13:00:00...）
  try {
    const d = new Date(s);
    if (!isNaN(d)) {
      return String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
    }
  } catch(e) {}
  return s;
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>{t.className='toast';},2500);
}
