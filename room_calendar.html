<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議室予約</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f2;--surface:#fff;--border:#e2e0db;
  --text:#1a1a1a;--text-sub:#6b6965;--text-hint:#b0ada8;
  --navy:#1a1a2e;--green:#1D9E75;--green-bg:#e8f5f0;
  --red:#e24b4a;--red-bg:#fdecea;
  --orange:#BA7517;--orange-bg:#fff3e0;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ヘッダー */
.header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:36px;height:36px;background:linear-gradient(135deg,#4caf50,#1a7a45);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.header-title{font-size:17px;font-weight:700}
.header-sub{font-size:11px;opacity:.6;margin-top:1px}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.admin-link{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font-size:12px;font-weight:600}

/* コンテナ */
.container{max-width:900px;margin:0 auto;padding:16px}

/* 日付ナビ */
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.date-nav-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.15s}
.date-nav-btn:hover{background:var(--bg)}
.date-display{font-size:18px;font-weight:800;flex:1;min-width:200px}
.today-btn{padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.today-btn:hover{background:var(--bg)}

/* 週表示 */
.week-strip{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.week-day{flex-shrink:0;width:56px;padding:8px 4px;border-radius:12px;border:2px solid transparent;cursor:pointer;text-align:center;transition:.15s;background:var(--surface)}
.week-day:hover{border-color:var(--navy);opacity:.8}
.week-day.active{background:var(--navy);color:#fff}
.week-day.today{border-color:var(--green)}
.week-day .wd-day{font-size:11px;opacity:.6;margin-bottom:2px}
.week-day .wd-num{font-size:18px;font-weight:800}
.week-day.has-rsv .wd-num::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--orange);margin:2px auto 0}

/* 会議室タブ */
.room-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.room-tab{padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.room-tab.active{border-color:var(--navy);background:var(--navy);color:#fff}

/* タイムライン */
.timeline{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.tl-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.tl-room-name{font-size:15px;font-weight:700}
.tl-date{font-size:13px;color:var(--text-sub)}
.tl-body{padding:8px 0}
.tl-slot{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:44px;position:relative;cursor:pointer;transition:.1s}
.tl-slot:last-child{border-bottom:none}
.tl-slot:hover{background:#f9f9f7}
.tl-slot.half-hour{border-bottom:1px dashed #eee}
.tl-time{width:60px;padding:0 12px;font-size:12px;color:var(--text-hint);flex-shrink:0;font-weight:500}
.tl-content{flex:1;padding:4px 8px;min-height:44px;display:flex;align-items:center;position:relative}
.rsv-block{background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rsv-block.mine{background:var(--green)}
.rsv-block .rsv-info{flex:1;min-width:0}
.rsv-block .rsv-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsv-block .rsv-purpose{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsv-block .rsv-cancel{background:rgba(255,255,255,.2);border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;cursor:pointer;flex-shrink:0}
.rsv-block .rsv-cancel:hover{background:rgba(255,255,255,.35)}
.tl-slot.available:hover .tl-content::after{content:'＋ 予約する';font-size:12px;color:var(--green);font-weight:700}

/* 予約モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-overlay.hidden{display:none}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:440px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:800;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--text-sub);margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.field select,.field input[type=text],.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--navy)}
.field textarea{resize:vertical;min-height:70px}
.time-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.time-row span{text-align:center;font-size:13px;color:var(--text-sub)}
.modal-footer{display:flex;gap:8px;margin-top:20px}
.modal-cancel-btn{flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.modal-submit-btn{flex:2;padding:11px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.modal-submit-btn:disabled{background:#999;cursor:not-allowed}

/* トースト */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:700;opacity:0;transition:.3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}

/* ローディング */
.loading{text-align:center;padding:40px;color:var(--text-sub);font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏢</div>
  <div>
    <div class="header-title">会議室予約</div>
    <div class="header-sub">ナカシマ</div>
  </div>
  <div class="header-right">
    <a class="admin-link" href="room_admin.html">管理画面</a>
  </div>
</div>

<div class="container">
  <!-- 日付ナビ -->
  <div class="date-nav">
    <button class="date-nav-btn" onclick="changeDate(-1)">‹</button>
    <div class="date-display" id="dateDisplay"></div>
    <button class="today-btn" onclick="goToday()">今日</button>
    <button class="date-nav-btn" onclick="changeDate(1)">›</button>
  </div>

  <!-- 週表示 -->
  <div class="week-strip" id="weekStrip"></div>

  <!-- 会議室タブ -->
  <div class="room-tabs" id="roomTabs"></div>

  <!-- タイムライン -->
  <div class="timeline" id="timeline">
    <div class="loading">読み込み中...</div>
  </div>
</div>

<!-- 予約モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">予約する</div>
    <div class="modal-sub" id="modalSub"></div>

    <div class="field">
      <label>部署</label>
      <select id="fDept">
        <option value="">選択してください</option>
        <option>社長</option><option>役員</option><option>総務部</option>
        <option>営業部</option><option>設計課</option><option>電気課</option>
        <option>購買課</option><option>加工課</option><option>組付課</option>
        <option>第一製造部</option>
      </select>
    </div>
    <div class="field">
      <label>氏名</label>
      <input type="text" id="fName" placeholder="例：鶴永 将人">
    </div>
    <div class="field">
      <label>時間</label>
      <div class="time-row">
        <select id="fStart"></select>
        <span>〜</span>
        <select id="fEnd"></select>
      </div>
    </div>
    <div class="field">
      <label>目的・内容</label>
      <textarea id="fPurpose" placeholder="例：営業部定例会議"></textarea>
    </div>

    <div class="modal-footer">
      <button class="modal-cancel-btn" onclick="closeModal()">キャンセル</button>
      <button class="modal-submit-btn" id="modalSubmit" onclick="submitReservation()">予約する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbysRCM8KbC7J8pg90BbZg8S0r3I5MfIfrl1_9xB2rw21qBSNH7UJOvdvErRsrxuEFb2/exec';

const ROOMS = [
  '本社会議室',
  '本社3F食堂',
  '旧購買事務所',
  '旧組付詰所',
  '根崎2F食堂',
];

// 営業時間 7:00〜20:00 30分単位
const START_HOUR = 7, END_HOUR = 20;
function getTimeSlots() {
  const slots = [];
  for (let h = START_HOUR; h < END_HOUR; h++) {
    slots.push(`${String(h).padStart(2,'0')}:00`);
    slots.push(`${String(h).padStart(2,'0')}:30`);
  }
  slots.push(`${String(END_HOUR).padStart(2,'0')}:00`);
  return slots;
}
const TIME_SLOTS = getTimeSlots();

let currentDate = new Date();
currentDate.setHours(0,0,0,0);
let currentRoom = ROOMS[0];
let reservations = [];
let modalSlot = null;

function fmtDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDateJP(d) {
  const days=['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}
function isToday(d) { return fmtDate(d)===fmtDate(new Date()); }
function isWeekend(d) { return d.getDay()===0||d.getDay()===6; }

// 2ヶ月以内チェック
function isWithinRange(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const limit = new Date(today); limit.setMonth(limit.getMonth()+2);
  return d >= today && d <= limit;
}

// 日付ナビ
function renderDateNav() {
  document.getElementById('dateDisplay').textContent = fmtDateJP(currentDate);
}

function changeDate(delta) {
  const d = new Date(currentDate);
  d.setDate(d.getDate()+delta);
  if (isWithinRange(d)) { currentDate = d; render(); }
}

function goToday() {
  currentDate = new Date(); currentDate.setHours(0,0,0,0);
  render();
}

// 週表示
function renderWeekStrip() {
  const strip = document.getElementById('weekStrip');
  const days = ['日','月','火','水','木','金','土'];
  const today = new Date(); today.setHours(0,0,0,0);

  // 今週月曜から
  const mon = new Date(today);
  mon.setDate(today.getDate() - (today.getDay()===0?6:today.getDay()-1));

  const html = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    if (!isWithinRange(d)) continue;
    const isActive = fmtDate(d)===fmtDate(currentDate);
    const isTd = isToday(d);
    const hasRsv = reservations.some(r => r.date===fmtDate(d) && r.room===currentRoom);
    html.push(`<div class="week-day ${isActive?'active':''} ${isTd?'today':''} ${hasRsv?'has-rsv':''}" onclick="selectDate('${fmtDate(d)}')">
      <div class="wd-day">${days[d.getDay()]}</div>
      <div class="wd-num">${d.getDate()}</div>
    </div>`);
  }
  strip.innerHTML = html.join('');
}

function selectDate(dateStr) {
  const [y,m,d] = dateStr.split('-').map(Number);
  currentDate = new Date(y,m-1,d);
  render();
}

// 会議室タブ
function renderRoomTabs() {
  document.getElementById('roomTabs').innerHTML = ROOMS.map(r =>
    `<button class="room-tab ${r===currentRoom?'active':''}" onclick="selectRoom('${r}')">${r}</button>`
  ).join('');
}

function selectRoom(room) {
  currentRoom = room;
  renderRoomTabs();
  renderTimeline();
  renderWeekStrip();
}

// タイムライン
function renderTimeline() {
  const dateStr = fmtDate(currentDate);
  const todayRsvs = reservations.filter(r => r.room===currentRoom && r.date===dateStr);
  const isPast = currentDate < (() => { const t=new Date();t.setHours(0,0,0,0);return t; })();

  let html = `<div class="tl-header">
    <div class="tl-room-name">${currentRoom}</div>
    <div class="tl-date">${fmtDateJP(currentDate)}</div>
  </div><div class="tl-body">`;

  for (let i = 0; i < TIME_SLOTS.length - 1; i++) {
    const slot = TIME_SLOTS[i];
    const nextSlot = TIME_SLOTS[i+1];
    const rsv = todayRsvs.find(r => r.start <= slot && r.end > slot);
    const isSlotPast = isPast || (isToday(currentDate) && slot < (() => {
      const n=new Date();
      return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()<30?'00':'30');
    })());

    const isHalfHour = slot.endsWith(':30');
    html += `<div class="tl-slot ${rsv?'booked':'available'} ${isHalfHour?'half-hour':''}"
      ${!rsv && !isSlotPast ? `onclick="openModal('${slot}','${nextSlot}')"` : ''}>
      <div class="tl-time">${slot}</div>
      <div class="tl-content">`;

    if (rsv && rsv.start === slot) {
      // 予約ブロック（開始スロットのみ表示）
      html += `<div class="rsv-block">
        <div class="rsv-info">
          <div class="rsv-name">${rsv.dept} ${rsv.name}（${rsv.start}〜${rsv.end}）</div>
          <div class="rsv-purpose">${rsv.purpose}</div>
        </div>
        <button class="rsv-cancel" onclick="event.stopPropagation();confirmCancel('${rsv.id}','${rsv.name}')">取消</button>
      </div>`;
    }

    html += `</div></div>`;
  }

  html += '</div>';
  document.getElementById('timeline').innerHTML = html;
}

// データ取得
async function loadReservations() {
  try {
    const res = await fetch(GAS_URL + '?action=getReservations&t=' + Date.now());
    const json = await res.json();
    if (json.ok) reservations = json.reservations || [];
  } catch(e) { console.log('予約取得失敗:', e); }
}

// モーダル
function openModal(startSlot, endSlot) {
  if (!isWithinRange(currentDate)) { showToast('予約可能期間外です', 'error'); return; }
  modalSlot = { start: startSlot, end: endSlot };

  document.getElementById('modalTitle').textContent = '予約する';
  document.getElementById('modalSub').textContent = `${currentRoom} / ${fmtDateJP(currentDate)}`;

  // 時間セレクト
  const startIdx = TIME_SLOTS.indexOf(startSlot);
  const startSel = document.getElementById('fStart');
  const endSel = document.getElementById('fEnd');
  startSel.innerHTML = TIME_SLOTS.slice(0,-1).map((t,i) => `<option value="${t}" ${t===startSlot?'selected':''}>${t}</option>`).join('');
  endSel.innerHTML = TIME_SLOTS.slice(1).map(t => `<option value="${t}" ${t===endSlot?'selected':''}>${t}</option>`).join('');

  document.getElementById('fDept').value = '';
  document.getElementById('fName').value = '';
  document.getElementById('fPurpose').value = '';

  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  modalSlot = null;
}

async function submitReservation() {
  const dept = document.getElementById('fDept').value;
  const name = document.getElementById('fName').value.trim();
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const purpose = document.getElementById('fPurpose').value.trim();

  if (!dept) { showToast('部署を選択してください', 'error'); return; }
  if (!name) { showToast('氏名を入力してください', 'error'); return; }
  if (!purpose) { showToast('目的を入力してください', 'error'); return; }
  if (start >= end) { showToast('終了時刻は開始時刻より後にしてください', 'error'); return; }

  const btn = document.getElementById('modalSubmit');
  btn.disabled = true; btn.textContent = '予約中...';

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'addReservation',
        room: currentRoom,
        date: fmtDate(currentDate),
        start, end, dept, name, purpose
      })
    });
    const json = await res.json();
    if (json.ok) {
      closeModal();
      await loadReservations();
      renderTimeline();
      renderWeekStrip();
      showToast('✅ 予約しました！', 'success');
    } else {
      showToast(json.message || '予約に失敗しました', 'error');
    }
  } catch(e) {
    showToast('通信エラーが発生しました', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '予約する';
  }
}

// キャンセル
async function confirmCancel(id, name) {
  if (!confirm(`${name}さんの予約を取り消しますか？`)) return;
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'cancelReservation', id })
    });
    const json = await res.json();
    if (json.ok) {
      reservations = reservations.filter(r => r.id !== id);
      renderTimeline();
      renderWeekStrip();
      showToast('予約を取り消しました');
    } else { showToast('取消に失敗しました', 'error'); }
  } catch(e) { showToast('通信エラーが発生しました', 'error'); }
}

// モーダル外クリックで閉じる
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

async function render() {
  renderDateNav();
  renderRoomTabs();
  renderWeekStrip();
  renderTimeline();
}

async function init() {
  await loadReservations();
  render();
}

init();
</script>
</body>
</html>
