<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>従業員マスタ — ナカシマ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f2;--surface:#fff;--border:#e2e0db;
  --text:#1a1a1a;--text-sub:#6b6965;--text-hint:#b0ada8;
  --navy:#1a1a2e;--green:#1D9E75;--green-bg:#e8f5f0;--green-fg:#1D9E75;
  --red:#e24b4a;--red-bg:#fdecea;
  --blue:#185FA5;--orange:#BA7517;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ヘッダー */
.header{background:var(--navy);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.header-icon{width:34px;height:34px;background:linear-gradient(135deg,#1D9E75,#0d6e50);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.header-title{font-size:16px;font-weight:700}
.header-sub{font-size:11px;opacity:.6;margin-top:1px}
.header-links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.app-link{padding:5px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.25);color:#fff;text-decoration:none;font-size:11px;font-weight:600;transition:.15s;white-space:nowrap}
.app-link:hover{background:rgba(255,255,255,.15)}

/* コンテナ */
.container{max-width:1100px;margin:0 auto;padding:16px}

/* 統計 */
.stats{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{background:var(--surface);border-radius:12px;padding:12px 18px;box-shadow:0 1px 4px rgba(0,0,0,.06);flex:1;min-width:120px;text-align:center}
.stat-num{font-size:26px;font-weight:800;color:var(--navy)}
.stat-label{font-size:11px;color:var(--text-sub);margin-top:2px}

/* ツールバー */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--navy)}
.filter-select{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;background:var(--surface);outline:none}
.btn{padding:9px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--text)}
.btn-secondary:hover{background:var(--bg)}
.btn-green{background:var(--green);color:#fff}
.count-badge{font-size:13px;color:var(--text-sub);margin-left:auto;white-space:nowrap}

/* テーブル */
.table-wrap{background:var(--surface);border-radius:14px;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;min-width:900px}
thead tr{background:var(--navy);color:#fff}
th{padding:10px 12px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f9f9f7}
tr.retired td{opacity:.45}
.dept-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.cat-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#e8e8f0;color:var(--navy)}
.cat-badge.役員{background:#fff3e0;color:#BA7517}
.cat-badge.パート{background:#fce4ec;color:#c2185b}
.status-badge{font-size:12px;font-weight:700}
.status-active{color:var(--green-fg)}
.status-retired{color:var(--red)}
.action-btns{display:flex;gap:5px;justify-content:flex-end}
.edit-btn{padding:4px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.edit-btn:hover{background:var(--bg)}
.retire-btn{padding:4px 10px;border-radius:7px;border:1.5px solid #f5c6c6;background:var(--red-bg);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.retire-btn:hover{opacity:.8}
.restore-btn{padding:4px 10px;border-radius:7px;border:1.5px solid #b8e0c8;background:var(--green-bg);color:var(--green-fg);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay.hidden{display:none}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:520px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:800;margin-bottom:18px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:0}
.field.full{grid-column:1/-1}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text-sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:var(--navy)}
.modal-footer{display:flex;gap:8px;margin-top:20px}
.modal-cancel{flex:1;padding:10px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.modal-save{flex:2;padding:10px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

/* CSV */
.csv-area{display:flex;gap:8px;align-items:center}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 22px;border-radius:50px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:999;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">👥</div>
  <div>
    <div class="header-title">従業員マスタ</div>
    <div class="header-sub">ナカシマ — 統合管理</div>
  </div>
  <div class="header-links">
    <button class="app-link" onclick="publishToApps()" id="publishBtn"
      style="background:var(--green);border-color:var(--green);font-weight:800;cursor:pointer;">
      📡 各アプリに反映
    </button>
    <a class="app-link" href="staff_monitor.html">📍 所在地</a>
    <a class="app-link" href="lunch_admin.html">🍱 昼食注文</a>
    <a class="app-link" href="https://tsurunagamasato-dotcom.github.io/nakashima-birthday/birthday-app-gas.html" target="_blank">🎂 誕生日</a>
  </div>
</div>

<div class="container">
  <!-- 統計 -->
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTotal">-</div><div class="stat-label">総従業員数</div></div>
    <div class="stat-card"><div class="stat-num" id="statActive">-</div><div class="stat-label">在籍</div></div>
    <div class="stat-card"><div class="stat-num" id="statRetired">-</div><div class="stat-label">退職</div></div>
    <div class="stat-card"><div class="stat-num" id="statKaiin">-</div><div class="stat-label">役員</div></div>
    <div class="stat-card"><div class="stat-num" id="statPart">-</div><div class="stat-label">パート</div></div>
  </div>

  <!-- ツールバー -->
  <div class="toolbar">
    <button class="btn btn-primary" onclick="openModal()">＋ 従業員を追加</button>
    <input class="search-input" id="searchInput" placeholder="🔍 氏名・社員番号で検索" oninput="renderTable()">
    <select class="filter-select" id="filterDept" onchange="renderTable()">
      <option value="">全部署</option>
      <option>会長</option><option>社長</option><option>役員</option>
      <option>総務部</option><option>営業部</option><option>設計課</option>
      <option>電気課</option><option>購買課</option><option>加工課</option>
      <option>組付課</option><option>第一製造部</option>
      <option>NIM</option><option>NVM</option>
    </select>
    <select class="filter-select" id="filterCategory" onchange="renderTable()">
      <option value="">全区分</option>
      <option>役員</option><option>社員</option><option>パート</option>
    </select>
    <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-sub);cursor:pointer;">
      <input type="checkbox" id="showRetired" onchange="renderTable()"> 退職者も表示
    </label>
    <span class="count-badge" id="countBadge"></span>
  </div>

  <!-- CSV -->
  <div class="csv-area" style="margin-bottom:14px;">
    <button class="btn btn-secondary" onclick="exportCSV()">📥 CSV出力</button>
    <button class="btn btn-secondary" onclick="document.getElementById('csvInput').click()">📤 CSVインポート</button>
    <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="importCSV(event)">
  </div>

  <!-- テーブル -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('empNo')" style="cursor:pointer;user-select:none;">社員番号 <span id="sort-empNo">▲</span></th>
          <th>氏名</th>
          <th onclick="sortBy('dept')" style="cursor:pointer;user-select:none;">部署 <span id="sort-dept">⇅</span></th>
          <th onclick="sortBy('category')" style="cursor:pointer;user-select:none;">区分 <span id="sort-category">⇅</span></th>
          <th>居場所(デフォルト)</th>
          <th>スライド</th>
          <th>拠点</th>
          <th>誕生日</th>
          <th>表示アプリ</th>
          <th>状況</th>
          <th style="text-align:right;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="10" style="text-align:center;padding:30px;color:var(--text-hint);">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- モーダル -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">従業員を追加</div>
    <div class="field-grid">
      <div class="field">
        <label>社員番号</label>
        <input type="text" id="fEmpNo" placeholder="例：178">
      </div>
      <div class="field">
        <label>区分</label>
        <select id="fCategory">
          <option value="社員">社員</option>
          <option value="役員">役員</option>
          <option value="パート">パート</option>
        </select>
      </div>
      <div class="field full">
        <label>氏名</label>
        <input type="text" id="fName" placeholder="例：鶴永 将人">
      </div>
      <div class="field full">
        <label>部署</label>
        <select id="fDept" onchange="onDeptChange()">
          <option value="">選択してください</option>
          <option>会長</option><option>社長</option><option>役員</option>
          <option>総務部</option><option>営業部</option><option>設計課</option>
          <option>電気課</option><option>購買課</option><option>加工課</option>
          <option>組付課</option><option>第一製造部</option>
          <option>NIM</option><option>NVM</option>
        </select>
      </div>
      <div class="field">
        <label>デフォルト居場所</label>
        <select id="fPlace">
          <option value="">なし</option>
          <option value="honsha_office">本社事務所</option>
          <option value="honsha_factory">本社工場</option>
          <option value="nezaki">根崎</option>
          <option value="nezaki2">根崎第2</option>
        </select>
      </div>
      <div class="field">
        <label>スライド</label>
        <select id="fSlide">
          <option value="">なし</option>
          <option value="honsha1">本社①</option>
          <option value="honsha2">本社②</option>
          <option value="honsha3">本社③</option>
          <option value="nezaki">根崎</option>
          <option value="nezaki2">根崎第2</option>
        </select>
      </div>
      <div class="field">
        <label>拠点（昼食用）</label>
        <select id="fPlaceLunch">
          <option value="">なし</option>
          <option value="本社">本社</option>
          <option value="根崎">根崎</option>
        </select>
      </div>
      <div class="field">
        <label>誕生日</label>
        <input type="date" id="fBirthday">
      </div>
      <div class="field full" style="margin-top:4px;">
        <label>アプリ表示設定</label>
        <div style="display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;">
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="checkbox" id="fShowLocation" checked> 📍 所在地ボード
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="checkbox" id="fShowLunch" checked> 🍱 昼食注文
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;">
            <input type="checkbox" id="fShowBirthday" checked> 🎂 誕生日
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-save" onclick="saveEmployee()">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwFE4wAC6cdFT8H2JmwW2XONgJz0j1rCI4xE2C9x1tKdMaib5aRgUKXE2N3hkQ034hu/exec';
const LS_KEY = 'employee_master_data';       // マスタ専用キャッシュ
const PUBLISH_KEY = 'employee_master_cache'; // 各アプリが参照するキャッシュ（手動反映）

const DEPT_COLORS = {
  '会長':'#7B2D8B','社長':'#1a1a2e','役員':'#534AB7',
  '総務部':'#1D9E75','営業部':'#185FA5','設計課':'#0e7fa8',
  '電気課':'#BA7517','購買課':'#639922','加工課':'#e24b4a','組付課':'#c2185b',
  '第一製造部':'#5d4037'
};
const PLACE_LABELS = {
  'honsha_office':'本社事務所','honsha_factory':'本社工場',
  'nezaki':'根崎','nezaki2':'根崎第2'
};
const SLIDE_LABELS = {
  'honsha1':'本社①','honsha2':'本社②','honsha3':'本社③',
  'nezaki':'根崎','nezaki2':'根崎第2'
};

let employees = [];
let editId = null;
let sortCol = 'empNo';  // デフォルトは社員番号順
let sortDir = 1;        // 1=昇順 -1=降順

// 各アプリに反映
async function publishToApps() {
  const btn = document.getElementById('publishBtn');
  btn.textContent = '⏳ 反映中...';
  btn.disabled = true;

  try {
    // 最新データをGASから取得
    const res = await fetch(GAS_URL + '?action=getEmployees&t=' + Date.now());
    const json = await res.json();
    if (json.ok) {
      // 各アプリが参照するキャッシュを更新
      const active = json.employees.filter(e => e.active !== '退職');
      localStorage.setItem(PUBLISH_KEY, JSON.stringify(active));
      btn.textContent = '✅ 反映しました！';
      btn.style.background = '#1D9E75';
      setTimeout(() => {
        btn.textContent = '📡 各アプリに反映';
        btn.disabled = false;
      }, 3000);
      showToast(`✅ ${active.length}名のデータを各アプリに反映しました`, 'success');
    }
  } catch(e) {
    btn.textContent = '❌ 失敗しました';
    btn.disabled = false;
    showToast('反映に失敗しました', 'error');
  }
}

// ソート
function sortBy(col) {
  if (sortCol === col) {
    sortDir *= -1;
  } else {
    sortCol = col;
    sortDir = 1;
  }
  // インジケーター更新
  ['empNo','dept','category'].forEach(c => {
    const el = document.getElementById('sort-' + c);
    if (!el) return;
    if (c === sortCol) el.textContent = sortDir === 1 ? '▲' : '▼';
    else el.textContent = '⇅';
  });
  renderTable();
}

// データ取得
let isSaving = false; // 保存中フラグ

async function loadEmployees() {
  try {
    const cached = localStorage.getItem(LS_KEY);
    if (cached) {
      employees = JSON.parse(cached);
      renderTable();
      renderStats();
    }
  } catch(e) {}
  try {
    const res = await fetch(GAS_URL + '?action=getEmployees&t=' + Date.now());
    const json = await res.json();
    if (json.ok && !isSaving) {
      // 保存中でない場合のみGASデータで上書き
      employees = json.employees;
      localStorage.setItem(LS_KEY, JSON.stringify(employees)); // マスタ専用キャッシュを更新
      // ※ PUBLISH_KEY（各アプリ共有）は「各アプリに反映」ボタンで手動更新
      renderTable();
      renderStats();
    }
  } catch(e) { showToast('通信エラーが発生しました', 'error'); }
}

// 統計
function renderStats() {
  const active = employees.filter(e => e.active !== '退職');
  document.getElementById('statTotal').textContent = employees.length;
  document.getElementById('statActive').textContent = active.length;
  document.getElementById('statRetired').textContent = employees.length - active.length;
  document.getElementById('statKaiin').textContent = active.filter(e => e.category === '役員').length;
  document.getElementById('statPart').textContent = active.filter(e => e.category === 'パート').length;
}

// テーブル描画
function renderTable() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const dept = document.getElementById('filterDept').value;
  const cat = document.getElementById('filterCategory').value;
  const showRetired = document.getElementById('showRetired').checked;

  let filtered = employees.filter(e => {
    if (!showRetired && e.active === '退職') return false;
    if (dept && e.dept !== dept) return false;
    if (cat && e.category !== cat) return false;
    if (q && !((e.name||'').toLowerCase().includes(q) || String(e.empNo||'').includes(q))) return false;
    return true;
  });

  // ソート処理
  filtered.sort((a, b) => {
    let av, bv;
    if (sortCol === 'empNo') {
      av = parseInt(a.empNo) || 9999;
      bv = parseInt(b.empNo) || 9999;
      return (av - bv) * sortDir;
    } else if (sortCol === 'dept') {
      const DEPT_ORDER = ['会長','社長','役員','総務部','営業部','設計課','電気課','購買課','加工課','組付課','第一製造部','NIM','NVM'];
      av = DEPT_ORDER.indexOf(a.dept); if(av<0) av=99;
      bv = DEPT_ORDER.indexOf(b.dept); if(bv<0) bv=99;
      return (av - bv) * sortDir;
    } else if (sortCol === 'category') {
      const CAT_ORDER = ['役員','社員','パート'];
      av = CAT_ORDER.indexOf(a.category); if(av<0) av=99;
      bv = CAT_ORDER.indexOf(b.category); if(bv<0) bv=99;
      return (av - bv) * sortDir;
    }
    return 0;
  });

  document.getElementById('countBadge').textContent = `${filtered.length}名 / 全${employees.length}名`;

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:30px;color:var(--text-hint);">該当する従業員がいません</td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const color = DEPT_COLORS[e.dept] || '#888';
    const placeLabel = PLACE_LABELS[e.defaultPlace] || e.defaultPlace || '-';
    const slideLabel = SLIDE_LABELS[e.slide] || e.slide || '-';
    const retired = e.active === '退職';
    const bday = e.birthday ? String(e.birthday).slice(0, 10) : '-';
    return `<tr class="${retired?'retired':''}">
      <td style="font-weight:600;color:var(--text-sub);">${e.empNo||'-'}</td>
      <td><strong>${e.name}</strong></td>
      <td><span class="dept-badge" style="background:${color}20;color:${color};">${e.dept||'-'}</span></td>
      <td><span class="cat-badge ${e.category||''}">${e.category||'社員'}</span></td>
      <td style="color:var(--text-sub);font-size:12px;">${placeLabel}</td>
      <td style="color:var(--text-sub);font-size:12px;">${slideLabel}</td>
      <td style="color:var(--text-sub);font-size:12px;">${e.place||'自動'}</td>
      <td style="color:var(--text-sub);font-size:12px;">${bday}</td>
      <td style="font-size:12px;">
        ${e.showLocation!=='0'?'<span style="opacity:.9;">📍</span>':'<span style="opacity:.2;">📍</span>'}
        ${e.showLunch!=='0'?'<span style="opacity:.9;">🍱</span>':'<span style="opacity:.2;">🍱</span>'}
        ${e.showBirthday!=='0'?'<span style="opacity:.9;">🎂</span>':'<span style="opacity:.2;">🎂</span>'}
      </td>
      <td><span class="status-badge ${retired?'status-retired':'status-active'}">${retired?'退職':'在籍'}</span></td>
      <td>
        <div class="action-btns">
          <button class="edit-btn" onclick="openModal('${e.id}')">編集</button>
          <button class="${retired?'restore-btn':'retire-btn'}" onclick="toggleRetire('${e.id}')">${retired?'復職':'退職'}</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// 部署変更時の処理
function onDeptChange() {
  const dept = document.getElementById('fDept').value;
  if (dept === 'NIM' || dept === 'NVM') {
    document.getElementById('fPlace').value = '';
    document.getElementById('fSlide').value = '';
    document.getElementById('fPlaceLunch').value = '';
    document.getElementById('fShowLocation').checked = false;
    document.getElementById('fShowLunch').checked = false;
  }
}

// モーダル
function openModal(id) {
  editId = id || null;
  document.getElementById('modalTitle').textContent = id ? '従業員を編集' : '従業員を追加';
  if (id) {
    const e = employees.find(x => String(x.id) === String(id));
    if (e) {
      document.getElementById('fEmpNo').value = e.empNo || '';
      document.getElementById('fName').value = e.name || '';
      document.getElementById('fCategory').value = e.category || '社員';
      document.getElementById('fDept').value = e.dept || '';
      document.getElementById('fPlace').value = e.defaultPlace || 'honsha_office';
      document.getElementById('fSlide').value = e.slide || 'honsha1';
      document.getElementById('fPlaceLunch').value = e.place || '';
      document.getElementById('fBirthday').value = e.birthday ? String(e.birthday).slice(0,10) : '';
      document.getElementById('fShowLocation').checked = e.showLocation !== '0';
      document.getElementById('fShowLunch').checked = e.showLunch !== '0';
      document.getElementById('fShowBirthday').checked = e.showBirthday !== '0';
    }
  } else {
    document.getElementById('fEmpNo').value = '';
    document.getElementById('fName').value = '';
    document.getElementById('fCategory').value = '社員';
    document.getElementById('fDept').value = '';
    document.getElementById('fPlace').value = '';
    document.getElementById('fSlide').value = '';
    document.getElementById('fPlaceLunch').value = '';
    document.getElementById('fBirthday').value = '';
    document.getElementById('fShowLocation').checked = true;
    document.getElementById('fShowLunch').checked = true;
    document.getElementById('fShowBirthday').checked = true;
  }
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('fName').focus();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
  editId = null;
}

async function saveEmployee() {
  const empNo = document.getElementById('fEmpNo').value.trim();
  const name = document.getElementById('fName').value.trim();
  const category = document.getElementById('fCategory').value;
  const dept = document.getElementById('fDept').value;
  const defaultPlace = document.getElementById('fPlace').value;
  const slide = document.getElementById('fSlide').value;
  const place = document.getElementById('fPlaceLunch').value;
  const birthday = document.getElementById('fBirthday').value;
  const showLocation = document.getElementById('fShowLocation').checked ? '1' : '0';
  const showLunch = document.getElementById('fShowLunch').checked ? '1' : '0';
  const showBirthday = document.getElementById('fShowBirthday').checked ? '1' : '0';

  if (!name || !dept) { showToast('氏名と部署を入力してください', 'error'); return; }

  const id = editId || 'E-' + Date.now();
  const payload = { action:'saveEmployee', id, empNo, name, category, dept, defaultPlace, slide, place, birthday, showLocation, showLunch, showBirthday, active: editId ? (employees.find(e=>String(e.id)===String(editId))?.active||'在籍') : '在籍' };

  // オプティミスティック更新
  if (editId) {
    const idx = employees.findIndex(e => String(e.id) === String(editId));
    if (idx >= 0) employees[idx] = { ...employees[idx], ...payload };
  } else {
    employees.push(payload);
  }
  localStorage.setItem(LS_KEY, JSON.stringify(employees));
  closeModal();
  renderTable();
  renderStats();
  showToast(editId ? '✅ 更新しました' : '✅ 追加しました', 'success');

  isSaving = true;
  try {
    await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload) });
  } catch(e) { showToast('通信エラー。ローカルに保存済みです', 'error'); }
  finally { isSaving = false; }
}

async function toggleRetire(id) {
  const e = employees.find(x => String(x.id) === String(id));
  if (!e) return;
  const newActive = e.active === '退職' ? '在籍' : '退職';
  if (newActive === '退職' && !confirm(`「${e.name}」を退職にしますか？`)) return;
  e.active = newActive;
  localStorage.setItem(LS_KEY, JSON.stringify(employees));
  renderTable();
  renderStats();
  showToast(newActive === '退職' ? '退職にしました' : '復職しました');
  isSaving = true;
  try {
    await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({ action:'saveEmployee', ...e }) });
  } catch(err) {}
  finally { isSaving = false; }
}

// CSV出力
function exportCSV() {
  const BOM = '\uFEFF';
  const headers = ['id','empNo','name','category','dept','defaultPlace','slide','place','birthday','showLocation','showLunch','showBirthday','active'];
  const rows = [headers];
  employees.forEach(e => rows.push(headers.map(h => e[h]||'')));
  const csv = BOM + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = `従業員マスタ_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSVをダウンロードしました', 'success');
}

// CSVインポート
function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const text = ev.target.result.replace(/^\uFEFF/,'');
    const lines = text.split('\n').filter(l=>l.trim());
    const headers = lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
    const imported = lines.slice(1).map(line => {
      const vals = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g)||[];
      const obj = {};
      headers.forEach((h,i) => obj[h] = (vals[i]||'').replace(/^"|"$/g,''));
      return obj;
    }).filter(o=>o.name);

    if (!confirm(`${imported.length}名をインポートします。よろしいですか？`)) return;

    employees = imported;
    localStorage.setItem(LS_KEY, JSON.stringify(employees));
    renderTable();
    renderStats();
    showToast(`${imported.length}名をインポートしました`, 'success');

    // GASに一括保存（saveEmployeesで一括）
    try {
      await fetch(GAS_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({ action:'saveEmployees', employees: imported })
      });
      showToast(`✅ ${imported.length}名をGASに保存しました`, 'success');
    } catch(err) {
      showToast('ローカルには保存済み。GAS保存に失敗しました', 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

// モーダル外クリック
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type?' '+type:'');
  setTimeout(() => t.className='toast', 2500);
}

loadEmployees();
</script>
